<body class="ow-embed ow-social">
  <div id="app" style="display:block">
    <div class="content" id="content"></div>
  </div>

  <div id="editor">
    <div class="ed-top">
      <button class="back" onclick="owLeaveEditor()" title="Back">←</button>
      <div class="ttl">Layout editor</div>
      <div class="ed-pick">
        <select id="edTpl" onchange="switchEditorTpl()"></select>
        <select id="edFmt" class="mini" onchange="loadEditor()"></select>
        <select id="edBg" onchange="edSetBg()" title="Background source"></select>
        <div class="seg" id="edTheme"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button></div>
      </div>
      <div class="sp"></div>
      <div class="acts">
        <button class="btn alt sm" id="edUndo" onclick="edUndo()" disabled>↶ Undo</button>
        <button class="btn alt sm" id="edRedo" onclick="edRedoFn()" disabled>↷ Redo</button>
        <button class="btn ghost sm" onclick="edReset()">Reset</button>
        <button class="btn ghost sm" onclick="edSave()">💾 Save</button>
        <button class="btn sm" onclick="edDownload()">⬇ Download PNG</button>
      </div>
    </div>
    <div class="ed-body">
      <div class="ed-canvas" id="edCanvas">
        <div class="ed-stagewrap" id="edStageWrap">
          <div class="edstage" id="edStage"><img class="bg" id="edBase" alt=""><div class="edguide v" id="edGuideV"></div><div class="edguide h" id="edGuideH"></div><div class="edgroup" id="edGroup"><div class="edrot" id="edGroupRot"></div><div class="edhandle br" id="edGroupRes"></div></div></div>
        </div>
        <div class="ed-zoom">
          <button onclick="edZoomStep(-1)" title="Zoom out">−</button>
          <span class="z" id="edZoomPct">Fit</span>
          <button onclick="edZoomStep(1)" title="Zoom in">+</button>
          <button class="fit" onclick="edZoomFit()">Fit</button>
        </div>
      </div>
      <div class="ed-side" id="edSide"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- In-app dialogs: raw browser prompt()/confirm() look nothing like the app and
       jar a first-timer. This one modal serves Save-name, Rename, Delete and the AI
       confirmations. Built by uiModal(); a Promise resolves on OK/Cancel. -->
  <div class="ui-modal" id="uiModal" aria-hidden="true">
    <div class="ui-card" role="dialog" aria-modal="true">
      <h4 id="uiModalTitle"></h4>
      <div id="uiModalBody" class="ui-body"></div>
      <input id="uiModalInput" style="display:none" autocomplete="off">
      <div class="ui-acts">
        <button class="btn ghost sm" id="uiModalCancel"></button>
        <button class="btn sm" id="uiModalOk"></button>
      </div>
    </div>
