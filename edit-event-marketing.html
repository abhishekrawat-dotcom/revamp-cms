<!-- ET Oneworld - Revamp CMS : standalone workbench for the MARKETING section.
     Open this file directly to work on edit-event-marketing.js on its own.
     Same JS, same tabs, same styles as the console renders. -->
<title>Marketing workbench &mdash; Revamp CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="edit-event.css">
<link rel="stylesheet" href="motion.css">
<style>
  .wb-bar{
    position: sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
    padding:10px 16px; background: var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .wb-bar .tag{
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
    background: var(--review-soft); color: var(--review); padding:3px 9px; border-radius:999px;
  }
  .wb-bar b{ font-size:14px; }
  .wb-bar .sp{ flex:1; }
  .wb-main{ padding:22px 26px 60px; max-width:1400px; }
  .wb-shell{ display:flex; min-height:calc(100vh - 54px); }
  .wb-shell > .rail{ flex:0 0 92px; max-height:none; position:relative; top:auto; }
  @media (max-width:760px){ .wb-main{ padding:16px 14px 50px; } }
</style>

<div class="wb-bar">
  <span class="tag">Workbench</span>
  <b>Marketing</b>
  <span style="font-size:12px;color:var(--text-muted)">edit-event-marketing.js</span>
  <span class="sp"></span>
  <label style="font-size:12px;color:var(--text-muted)" for="wb-ev">Event</label>
  <select class="inp" id="wb-ev" style="width:auto"></select>
  <a class="btn btn-secondary btn-sm" href="edit-event.html#marketing/studio">Open in console</a>
</div>

<div class="wb-shell"><nav class="rail" id="global-rail" aria-label="Sections"><!-- shared rail --></nav><main class="wb-main">
  <div class="subtabs" id="wb-tabs"></div>
  <div id="view"></div>
</main></div>
<div class="toast-host" id="toast-host"></div>

<script src="edit-event-core.js"></script>
<script src="edit-event-marketing.js"></script>
<script src="app-shell.js"></script>
<script>
(function(){
  'use strict';
  var C = window.RevampCore;
  var MKT = window.EditEventMarketing;
  var wbEvent = new URLSearchParams(location.search).get('event') || '1';
  /* the workbench keeps its own bar, but the rail is the shared one so it
     cannot drift from what the console shows */
  window.RevampShell.mount({ section: 'marketing', eventId: wbEvent, rail: 'global-rail' });
  var tab = (location.hash.slice(1) || 'studio');

  var sel = document.getElementById('wb-ev');
  sel.innerHTML = C.EVENTS.map(function(e){
    return '<option value="' + e.id + '">' + C.esc(e.name) + '</option>';
  }).join('');

  function draw(){
    var EV = C.eventById(sel.value) || C.EVENTS[0];
    var KEY = 'revamp-edit-event-' + EV.id;
    var S = C.loadState(KEY);

    document.getElementById('wb-tabs').innerHTML = MKT.TABS.map(function(t){
      return '<button type="button" data-tab="' + t.id + '" aria-pressed="' + (tab === t.id) + '">' +
        C.esc(t.label) + '</button>';
    }).join('');

    var ctx = C.makeCtx({
      EV: EV, S: S, PEOPLE: C.makePeople(EV),
      vhead: function(t, sub, right){
        return '<h2 class="sr-only">' + C.esc(t) + (sub ? '. ' + C.esc(sub) : '') + '</h2>' +
          (right ? '<div class="page-acts">' + right + '</div>' : '');
      },
      go: function(r){ C.toast('Would navigate to: ' + r); },
      render: draw,
      save: function(){ C.saveState(KEY, S); }
    });

    document.getElementById('view').innerHTML = MKT.view(tab, ctx);
    MKT.wire(tab, ctx);

    document.querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){
        tab = b.getAttribute('data-tab');
        location.hash = tab;
        draw();
      });
    });
    document.querySelectorAll('[data-goto]').forEach(function(b){
      b.addEventListener('click', function(){ ctx.go(b.getAttribute('data-goto')); });
    });
    document.querySelectorAll('[data-save]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); C.toast(b.getAttribute('data-save')); });
    });
  }

  sel.onchange = draw;
  window.addEventListener('hashchange', function(){
    var h = location.hash.slice(1);
    if (h && h !== tab){ tab = h; draw(); }
  });
  draw();
})();
</script>
