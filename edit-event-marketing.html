<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promotions &mdash; EventSphere</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
<noscript><p>This page has moved. <a href="/Event_Listing.html">Go to your events</a>.</p></noscript>
<script>
/* Promotions is marketing.html now. This address (the old Marketing workbench) is kept only so old links and
   bookmarks still arrive there: the event and anything else in the address go with them, on the Social posts tab
   unless the address names another. With no event there is nothing to open, so it goes to the events listing. */
(function(){
  var q = new URLSearchParams(location.search);
  var id = String(q.get('event') || '').trim();
  if (!id) { location.replace('/Event_Listing.html'); return; }
  q.set('event', id);
  if (!q.get('tab')) q.set('tab', 'posts');
  location.replace('/marketing.html?' + q.toString());
})();
</script>
</body>
</html>
