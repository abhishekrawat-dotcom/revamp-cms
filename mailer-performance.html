<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Oneworld 2.0 — Mailer performance across all events: opens and clicks of every mailer downloaded or copied from
     the mailer studio. The dashboard itself is the studio's own page in a frame (promo-mailer-studio.html?scope=all;
     the team scope lives in promo-studio/oneworld.js), which reads GET /api/promo/analytics/all (lib/promo-track.js).
     This page is only the bar above it, so the team view and each event's Promotions → Mailers dashboard stay one
     piece of code. Linked from the events listing (Event_Listing.html, beside "Activity log"). -->
<title>Mailer performance — EventSphere</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script>try{var t=localStorage.getItem("revamp-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme:dark)").matches))document.documentElement.setAttribute("data-theme","dark");else document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
<!-- This page is every event's mailers. An address naming one event (?event=) is that event's Mailers in Promotions,
     which also says "Event not found" for one that does not exist, as every event page does (UX-008), instead of this
     page quietly showing all events. -->
<script>(function(){try{var id=new URLSearchParams(location.search).get("event");if(id)location.replace("marketing.html?event="+encodeURIComponent(id)+"&tab=mailers");}catch(e){}})();</script>
<!-- the app's logo: the red ET square and the word EventSphere, one unit on every page that shows it (app-logo.css) -->
<link rel="stylesheet" href="app-logo.css">
<style>
  :root{
    --bg:#FAF7F6; --surface:#FFFFFF; --surface-2:#F3EEED; --surface-3:#E9E2E0;
    --border:#E0D7D5; --border-strong:#CFC3C0; --text:#241B1A; --text-muted:#655855; --text-faint:#6E605D;
    --accent:#D3141B; --accent-strong:#B3151B; --accent-soft:#FBDBDC; --accent-contrast:#FFFFFF;
    --ok:#16794F; --ok-soft:#E4F5EC; --warn:#845B10; --warn-soft:#FBF0DA; --crit:#C13333; --crit-soft:#FBE8E7;
    --tag-blue:#1D5FA3; --tag-blue-soft:#E3EEFB; --tag-teal:#0B6E5F; --tag-teal-soft:#E0F5F0;
    --tag-violet:#7A3FA0; --tag-violet-soft:#F1E7F8; --tag-cyan:#0E7490; --tag-cyan-soft:#DFF4F8;
    --tag-amber:#7F5709; --tag-amber-soft:#F7EEDA; --tag-rose:#B23A6B; --tag-rose-soft:#FBE7EF;
    --r-sm:8px; --r-md:12px;
    --font-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171514; --surface:#201C1B; --surface-2:#2A2422; --surface-3:#352D2B;
      --border:#3F3532; --border-strong:#4D413D; --text:#EDE6E4; --text-muted:#B0A4A1; --text-faint:#A69A97;
      --accent:#FF6B70; --accent-strong:#FF8A8E; --accent-soft:#3A1518; --accent-contrast:#2B0A0B;
      --ok:#4CB484; --ok-soft:#173225; --warn:#D8A64A; --warn-soft:#332711; --crit:#E27A7A; --crit-soft:#3A1E1D;
      --tag-blue:#7EB6E8; --tag-blue-soft:#132A3D; --tag-teal:#5FCDB8; --tag-teal-soft:#0F2B24;
      --tag-violet:#C79FE8; --tag-violet-soft:#2B1E38; --tag-cyan:#6FD3E8; --tag-cyan-soft:#0F2A30;
      --tag-amber:#E8C069; --tag-amber-soft:#332711; --tag-rose:#F08FB5; --tag-rose-soft:#3A1826;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171514; --surface:#201C1B; --surface-2:#2A2422; --surface-3:#352D2B;
    --border:#3F3532; --border-strong:#4D413D; --text:#EDE6E4; --text-muted:#B0A4A1; --text-faint:#A69A97;
    --accent:#FF6B70; --accent-strong:#FF8A8E; --accent-soft:#3A1518; --accent-contrast:#2B0A0B;
    --ok:#4CB484; --ok-soft:#173225; --warn:#D8A64A; --warn-soft:#332711; --crit:#E27A7A; --crit-soft:#3A1E1D;
    --tag-blue:#7EB6E8; --tag-blue-soft:#132A3D; --tag-teal:#5FCDB8; --tag-teal-soft:#0F2B24;
    --tag-violet:#C79FE8; --tag-violet-soft:#2B1E38; --tag-cyan:#6FD3E8; --tag-cyan-soft:#0F2A30;
    --tag-amber:#E8C069; --tag-amber-soft:#332711; --tag-rose:#F08FB5; --tag-rose-soft:#3A1826;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .nav{ background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
  .nav-inner{ max-width:1240px; margin:0 auto; height:60px; display:flex; align-items:center; gap:14px; padding:0 24px; }
  /* the logo unit (app-logo.css) is sized by --app-logo-h, the height its picture used to have here */
  .nav-brand{ flex-shrink:0; --app-logo-h:28px; text-decoration:none; }
  /* the console's Back to events button: the same look and words on every page (UX-007) */
  .nav-back{ display:flex; align-items:center; gap:7px; padding:7px 13px 7px 10px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); font-size:13px; font-weight:700; color:var(--text); text-decoration:none; white-space:nowrap; }
  .nav-back:hover{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
  .nav-back svg{ flex-shrink:0; }
  .nav-back-short{ display:none; }
  .nav-right{ margin-left:auto; display:flex; align-items:center; gap:10px; flex-shrink:0; }

  /* The dashboard fills the window below the bar (60px and its 1px border), so the frame scrolls and this page
     never does. Phones: 100vh is the height with the browser's toolbar hidden, which would leave the bottom of the
     frame under that toolbar and let the page scroll as well; dvh is the height actually showing. */
  .mp-main{ display:block; }
  .mp-frame{display:block;width:100%;height:calc(100vh - 61px);border:0;background:var(--bg)}
  @supports (height:100dvh){ .mp-frame{ height:calc(100dvh - 61px); } }

  /* phones, as the activity log's bar (the logo is the same size on both themes: there is no chip round it now) */
  @media (max-width: 700px){
    .nav-inner{ padding:0 16px; gap:8px; }
    .nav-brand{ --app-logo-h:22px; }
  }
  /* on a phone "Back to events" and the brand, theme switch and account menu do not fit one 60px row: the link
     names its destination in one word there (as the activity log's does), so the account menu is never pushed
     off the screen and the bar never wraps */
  @media (max-width: 480px){
    .nav-back-long{ display:none; }
    .nav-back-short{ display:inline; }
  }
  @media (max-width: 374px){
    .nav-inner{ padding:0 12px; gap:6px; }
    .nav-brand{ --app-logo-h:18px; }
    .nav-back{ padding:8px; }
  }
  /* Tap targets on a phone (UX-002 screen-size sweep): below 720px every control here is at least 40px tall, an
     icon-only one 40px wide; a link that is a line of words keeps its place and only the area that takes the tap grows.
     Layout only. */
  @media (max-width: 720px){
    .nav-brand{ display:flex; align-items:center; }
    .nav-brand, .nav-back, .btn{ min-height:40px; }
  }
</style>
<!-- ETB2B AI's launcher and panel (etb2b-chat.js): the same look on every page, bottom-right -->
<link rel="stylesheet" href="etb2b-chat.css">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="Event_Listing.html"><span class="app-logo" role="img" aria-label="ETB2B EventSphere"><img class="app-logo-mark" src="assets/favicon.svg" width="37" height="36" alt=""><span class="app-logo-word">EventSphere</span></span></a>
    <a class="nav-back" href="Event_Listing.html" aria-label="Back to events">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="nav-back-long">Back to events</span><span class="nav-back-short">Events</span>
    </a>
    <div class="nav-right">
      <span data-theme-toggle-target style="display:inline-flex;align-items:center;"></span>
      <span data-rv-account></span>
    </div>
  </div>
</header>

<main class="mp-main">
  <iframe id="mp-frame" class="mp-frame" title="Mailer performance" src="promo-mailer-studio.html?scope=all"></iframe>
</main>

<script src="theme-toggle.js"></script>
<script src="auth.js"></script>
<!-- ETB2B AI, bottom-right as on every page: etb2b-assistant.js mounts it here and tells it this page.
     The mailer dashboard in the frame never carries it. -->
<div id="rv-assistant" data-rv-assistant="mailer-performance"></div>
<script src="etb2b-chat.js"></script>
<script src="dash-bot-client.js"></script>
<script src="etb2b-assistant.js"></script>
</body>
</html>
