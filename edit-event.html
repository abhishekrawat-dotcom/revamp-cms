<script>
(function(){
  'use strict';

  /* Everything shared lives in edit-event-core.js so the section files can
     use it too. The shell just borrows the names it needs. */
  var C = window.RevampCore;
  var $ = C.$, esc = C.esc, svg = C.svg, IC = C.IC, AV = C.AV;
  var comma = C.comma;
  var fmtDate = C.fmtDate, fmtDT = C.fmtDT;
  var panel = C.panel, panelFlush = C.panelFlush, emptyState = C.emptyState;
  var PORTALS = C.PORTALS, TYPES = C.TYPES;

  /* ============================================================
     MESSAGES

     Two kinds, and they must never look alike. notify() confirms something that has
     happened and goes away by itself. notifyError() says something did not happen: it
     stays until it is dismissed and is announced to a screen reader at once.
     ============================================================ */
  var IC_ALERT = '<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.6h.01"/>';
  var IC_CLOSE = '<path d="M18 6L6 18M6 6l12 12"/>';

  function dismissToast(el){
    if (!el.parentNode) return;
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0'; el.style.transform = 'translateY(8px)';
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 260);
  }

  function notify(msg){
    var el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = svg(IC.check, 15) + '<span>' + esc(msg) + '</span>';
    $('toast-host').appendChild(el);
    setTimeout(function(){ dismissToast(el); }, 2600);
  }

  /* What to tell the user about a failed request. RevampCore rejects with an Error whose status is
     the HTTP status (0 when no answer came back) and whose message is the server's own sentence;
     a server fault's wording is of no use to the user, so that case gets ours. */
  function errText(err){
    if (typeof err === 'string') return err;
    var status = err && typeof err.status === 'number' ? err.status : 0;
    if (status === 401 || (!status && /not signed in/i.test((err && err.message) || ''))){
      return 'Your sign-in has expired. Sign in again, then try once more.';
    }
    if (!status) return 'We couldn’t reach the server. Check your connection and try again.';
    if (status >= 500) return 'Something went wrong on our side. Please try again.';
    return (err && err.message) || 'That could not be done. Please try again.';
  }

  /* opts.what — a sentence saying what did not happen, put in front of the reason.
     opts.retry — a function; adds a "Try again" button that runs it. */
  function notifyError(errOrMsg, opts){
    opts = opts || {};
    if (errOrMsg && typeof errOrMsg !== 'string') console.error(opts.what || 'Request failed:', errOrMsg);
    var msg = (opts.what ? opts.what + ' ' : '') + errText(errOrMsg);
    var host = $('toast-host');

    /* several requests failing for one reason are one message, not a stack of them */
    var open = host.querySelectorAll('.toast-error');
    for (var i = 0; i < open.length; i++) if (open[i].getAttribute('data-msg') === msg) return;

    var el = document.createElement('div');
    el.className = 'toast toast-error';
    el.setAttribute('role', 'alert');
    el.setAttribute('data-msg', msg);
    el.innerHTML = svg(IC_ALERT, 16) + '<span class="tt">' + esc(msg) + '</span>' +
      (opts.retry ? '<button class="toast-act" type="button">Try again</button>' : '') +
      '<button class="toast-x" type="button" aria-label="Dismiss this message">' + svg(IC_CLOSE, 14) + '</button>';
    el.querySelector('.toast-x').onclick = function(){ dismissToast(el); };
    if (opts.retry) el.querySelector('.toast-act').onclick = function(){ dismissToast(el); opts.retry(); };
    host.appendChild(el);
  }

  /* ============================================================
     SAFE OUTPUT

     Image addresses and colours come back from the server as whatever was stored, so
     they are checked before they are written into markup (and escaped where they are).
     ============================================================ */
  /* for an image source only: https, a path on this site, or an image this page read from a file */
  function safeUrl(u){
    u = String(u == null ? '' : u).trim();
    if (/^https:\/\//i.test(u)) return u;
    if (/^\/(?!\/)/.test(u) || u.indexOf(location.origin + '/') === 0) return u;
    if (/^blob:/i.test(u)) return u;
    if (/^data:image\/[a-z0-9.+-]+;base64,[a-z0-9+\/=\s]*$/i.test(u)) return u;
    return '';
  }
  function safeColour(c, fallback){
    return /^#[0-9a-fA-F]{3,8}$/.test(String(c || '')) ? c : (fallback || AV[0]);
  }
  function imgTag(url, attrs){
    var u = safeUrl(url);
    return u ? '<img src="' + esc(u) + '" alt=""' + (attrs ? ' ' + attrs : '') + '>' : '';
  }

  /* ============================================================
     WHAT A FIELD MAY HOLD

     Checked when a dialog is saved, never when a record is loaded, so a record stored
     before a rule existed still opens. A stored value is only turned into a link when it
     passes the same check.
     ============================================================ */
  function isEmail(v){
    return /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(String(v || '').trim());
  }
  /* 7 to 15 digits, written with any of the usual spaces, dashes, brackets and a leading + */
  function isPhone(v){
    return /^\+?\d{7,15}$/.test(String(v || '').replace(/[\s\-()]/g, ''));
  }
  /* A web address as it is stored: host and path, no scheme, no trailing slash. Returns null for
     anything that is not a plain http(s) address (another scheme, spaces, no domain). */
  function cleanWebUrl(v){
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';
    s = s.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
    return /^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(:\d{1,5})?([\/?#]\S*)?$/i.test(s) ? s : null;
  }

  /* An error belongs to its field: a red border, the reason right under it, and both announced
     with the field. openModal() clears it as soon as the field is typed in again. */
  function clearFieldError(input){
    if (!input || !input.classList || !input.classList.contains('invalid')) return;
    input.classList.remove('invalid');
    input.removeAttribute('aria-invalid');
    input.removeAttribute('aria-describedby');
    var wrap = input.closest('.inp-grp');
    if (wrap) wrap.classList.remove('invalid');
    var msg = document.getElementById(input.id + '-err');
    if (msg) msg.parentNode.removeChild(msg);
  }
  function setFieldError(input, message){
    if (!input) return;
    clearFieldError(input);
    input.classList.add('invalid');
    input.setAttribute('aria-invalid', 'true');
    var wrap = input.closest('.inp-grp');
    if (wrap) wrap.classList.add('invalid');
    var msg = document.createElement('p');
    msg.className = 'field-err';
    msg.id = input.id + '-err';
    msg.textContent = message;
    var after = wrap || input;
    after.parentNode.insertBefore(msg, after.nextSibling);
    input.setAttribute('aria-describedby', msg.id);
  }
  /* errs: [[field id, message], …] — marks each one and puts focus on the first. A field inside a
     folded "more" block is unfolded first, or its error could not be seen. */
  function showFieldErrors(errs){
    errs.forEach(function(pair, i){
      var input = $(pair[0]);
      if (!input) return;
      var acc = input.closest('.acc');
      if (acc && acc.getAttribute('data-open') !== 'true') acc.querySelector('.acc-head').click();
      setFieldError(input, pair[1]);
      if (i === 0) input.focus();
    });
  }

  /* ============================================================
     DIALOGS

     Every dialog on the console opens through openModal(), so they all behave the same
     way: focus moves in and comes back, Tab stays inside, the page behind cannot be
     reached, and Escape / X / Cancel ask before throwing away something that was typed
     (a click outside closes only a dialog with nothing typed in it).

     html     the inside of the dialog (head, body, foot)
     opts     cls, style    extra class / inline style for the .modal box
              initialFocus  selector of the element to focus (default: the first field)
              isDirty       function -> true when closing would lose typed content
              onSubmit      function, called when the dialog's <form> is submitted
              onClose       function, called once the dialog has closed, whichever way
     returns  { close, requestClose, focus(selector),
                busy(on, button, label)   while the dialog waits for the server: nothing in it can
                                          be used and it cannot be closed; the button says so
                ask(question, keep, go, onGo)   a question asked in the footer's place }
     ============================================================ */
  var MODAL = null;
  /* where focus should return, kept for the moment between one dialog closing and the confirmation
     it hands over to opening */
  var MODAL_HANDOFF = '';
  /* the control focus should land on once the view behind a closed dialog can take it again */
  var FOCUS_BACK = '';

  /* Puts focus back where the last dialog was opened from. Right after a save the tab's rows are
     held, and a held control cannot take focus — paintWriting() calls this again when they are
     released. Never moves focus the user has since put somewhere themselves. */
  function focusBack(){
    if (!FOCUS_BACK || MODAL) return;
    if (document.activeElement && document.activeElement !== document.body){ FOCUS_BACK = ''; return; }
    var el = document.querySelector(FOCUS_BACK);
    if (!el || !el.focus){ FOCUS_BACK = ''; return; }
    el.focus();
    if (document.activeElement === el) FOCUS_BACK = '';
  }
  var FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), ' +
    'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function modalFocusables(box){
    return Array.prototype.filter.call(box.querySelectorAll(FOCUSABLE), function(el){
      return el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement;
    });
  }

  function setPageInert(on){
    ['.topbar', '.shell'].forEach(function(sel){
      var el = document.querySelector(sel);
      if (!el) return;
      if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert');
    });
  }

  /* How to find the control a dialog was opened from once the view behind it has been redrawn:
     the views rebuild their markup on every change, so the element itself is usually gone. */
  function focusPath(el){
    if (!el || el === document.body || !el.getAttribute) return '';
    if (el.id) return '#' + CSS.escape(el.id);
    for (var i = 0; i < el.attributes.length; i++){
      var a = el.attributes[i];
      if (a.name.indexOf('data-') === 0 && a.value) return '[' + a.name + '="' + CSS.escape(a.value) + '"]';
    }
    return '';
  }

  function openModal(html, opts){
    opts = opts || {};
    var host = $('modal-host');
    /* a dialog that opens from another one (a confirmation) takes its place and inherits where
       focus goes back to */
    var returnTo = MODAL ? MODAL.returnTo : (MODAL_HANDOFF || focusPath(document.activeElement));
    if (MODAL) MODAL.teardown();

    host.innerHTML = '<div class="modal-bg"><div class="modal' + (opts.cls ? ' ' + opts.cls : '') + '"' +
      (opts.style ? ' style="' + opts.style + '"' : '') +
      ' role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">' + html + '</div></div>';
    var bg = host.firstChild, box = bg.firstChild;
    var title = box.querySelector('.modal-head h3');
    if (title) title.id = 'modal-title';
    var foot = box.querySelector('.modal-foot');
    var ask = null, askedFrom = null, open = true, busy = false;

    function teardown(){
      open = false;
      document.removeEventListener('keydown', onKey, true);
      host.innerHTML = '';
    }
    function close(){
      if (!open) return;
      teardown();
      setPageInert(false);
      MODAL = null;
      MODAL_HANDOFF = returnTo;
      if (opts.onClose) opts.onClose();
      /* after the caller has finished: it usually redraws the view and starts its save next */
      setTimeout(function(){
        MODAL_HANDOFF = '';
        if (MODAL) return;
        FOCUS_BACK = returnTo;
        focusBack();
        flushReloads();
      }, 0);
    }
    function keepEditing(){
      if (!ask) return;
      ask.parentNode.removeChild(ask);
      ask = null;
      foot.hidden = false;
      var back = askedFrom && box.contains(askedFrom) ? askedFrom : modalFocusables(box)[0];
      if (back) back.focus();
    }
    /* asked inside the dialog itself: a second dialog would have to replace this one, and with
       it the very content the question is about */
    function showAsk(question, keepLabel, goLabel, onGo){
      if (ask) keepEditing();
      askedFrom = document.activeElement;
      ask = document.createElement('div');
      ask.className = 'modal-foot modal-ask';
      ask.setAttribute('role', 'alert');
      ask.innerHTML = '<span class="mq">' + esc(question) + '</span>' +
        '<button class="btn btn-secondary" type="button" data-keep>' + esc(keepLabel) + '</button>' +
        '<button class="btn btn-danger" type="button" data-go>' + esc(goLabel) + '</button>';
      foot.hidden = true;
      foot.parentNode.insertBefore(ask, foot.nextSibling);
      ask.querySelector('[data-keep]').onclick = keepEditing;
      ask.querySelector('[data-go]').onclick = onGo;
      ask.querySelector('[data-keep]').focus();
    }
    function requestClose(){
      if (!open || busy) return;
      if (ask){ keepEditing(); return; }
      if (!opts.isDirty || !foot || !opts.isDirty()){ close(); return; }
      showAsk('Discard what you typed?', 'Keep editing', 'Discard', close);
    }
    function setBusy(on, btn, label){
      if (!open) return;
      busy = !!on;
      box.classList.toggle('is-busy', busy);
      Array.prototype.forEach.call(box.children, function(el){
        if (busy) el.setAttribute('inert', ''); else el.removeAttribute('inert');
      });
      if (btn && busy){
        btn.setAttribute('data-idle', btn.textContent);
        btn.innerHTML = '<span class="spin"></span>' + esc(label || 'Saving…');
      } else if (btn && btn.hasAttribute('data-idle')){
        btn.textContent = btn.getAttribute('data-idle');
        btn.removeAttribute('data-idle');
      }
      /* focus stays in the dialog while its controls cannot take it, and comes back to them after */
      if (busy) box.focus();
      else if (btn && box.contains(btn)) btn.focus();
    }
    function onKey(e){
      if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); requestClose(); return; }
      if (e.key !== 'Tab') return;
      if (busy){ e.preventDefault(); return; }
      /* a message that stays on screen can be dismissed from the keyboard while a dialog is open */
      var f = modalFocusables(box).concat(modalFocusables($('toast-host')));
      if (!f.length){ e.preventDefault(); box.focus(); return; }
      var at = f.indexOf(document.activeElement);
      if (e.shiftKey && at <= 0){ e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (at === -1 || at === f.length - 1)){ e.preventDefault(); f[0].focus(); }
    }
    document.addEventListener('keydown', onKey, true);

    /* only a press that both starts and ends on the backdrop counts as a click outside — selecting
       text in a field and letting go beyond the edge must not */
    var downOnBg = false;
    bg.addEventListener('mousedown', function(e){ downOnBg = e.target === bg; });
    bg.addEventListener('click', function(e){
      if (e.target !== bg || !downOnBg || ask || busy) return;
      if (opts.isDirty && opts.isDirty()) return;
      close();
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-close]'), function(b){ b.onclick = requestClose; });

    var form = box.querySelector('form');
    if (form) form.addEventListener('submit', function(e){
      e.preventDefault();
      if (!ask && !busy && opts.onSubmit) opts.onSubmit();
    });
    /* an error is about what the field held; once that changes it no longer applies */
    function onEdit(e){
      clearFieldError(e.target);
      var err = box.querySelector('.modal-err');
      if (err) err.textContent = '';
    }
    box.addEventListener('input', onEdit);
    box.addEventListener('change', onEdit);

    setPageInert(true);
    MODAL = { close: close, requestClose: requestClose, teardown: teardown, returnTo: returnTo,
      isDirty: function(){ return !!(opts.isDirty && opts.isDirty()); } };

    var target = opts.initialFocus ? box.querySelector(opts.initialFocus) : null;
    if (!target) target = box.querySelector('.modal-body input, .modal-body textarea, .modal-body select, .sp-form input');
    (target || box).focus();

    return { close: close, requestClose: requestClose, busy: setBusy,
      ask: function(question, keepLabel, goLabel, onGo){
        showAsk(question, keepLabel, goLabel, function(){ keepEditing(); onGo(); });
      },
      /* for a dialog that paints its fields after opening */
      focus: function(sel){ var el = box.querySelector(sel); if (el) el.focus(); } };
  }

  function closeBtn(){
    return '<button class="btn btn-ghost btn-icon" type="button" data-close aria-label="Close">' + svg(IC_CLOSE, 17) + '</button>';
  }

  var qs = new URLSearchParams(location.search);
  /* The real Firestore slug, e.g. "ethrworld-nextsummit" — there is no more numeric id scheme and
     nothing here special-cases one. Known synchronously from the URL, before the event itself has
     loaded, so anything that only needs the id (not the rest of the record) can use it right away. */
  var eventSlug = String(qs.get('event') || '').trim();

  /* EV starts out unset and is filled in by init() below once C.fetchEvent() resolves — everything
     that reads EV is either inside a function (never called until after the first real view renders,
     post-load) or guarded explicitly. There is no more synchronous fallback to a fake event: a load
     failure is a real "couldn't load this event" state, never silent fake data. */
  var EV = null;

  /* ============================================================
     FORMATTERS
     ============================================================ */
  /* ============================================================
     PERSISTED PROTOTYPE STATE

     A per-browser copy of the few things that are not on the server yet (published, checklist). The
     six content tabs also keep their loaded records on S, in memory, for the life of the page.
     ============================================================ */
  var KEY = 'revamp-edit-event-' + eventSlug;
  var S = { checklist: null, published: false };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); for (var k in p) if (p.hasOwnProperty(k)) S[k] = p[k]; }
  } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

  /* ============================================================
     SUBCOLLECTION LOADING  (Speakers, Agenda, Sponsors, Gallery, FAQ, Contact)

     These six tabs' content lives in real per-event Firestore subcollections now
     (RevampCore.fetchSub/createSub/updateSub/deleteSub — see edit-event-core.js),
     not in this file's own S/save()/localStorage. Each one is fetched lazily, the
     first time its tab is actually opened — render() below gates on SUB[key] and
     shows the same loading-spinner treatment init() uses for the event itself
     while the fetch is in flight, then re-renders once the flag flips true. A
     real failure gets the same "couldn't load" emptyState with a retry button —
     never a silent fallback to seed/fake data, because there is no more seed data
     for any of these six tabs. Once loaded, a flag stays true for the rest of
     this page's life, and the page does not re-fetch to reflect its own writes.
     A change to a record that exists (an edit made on the row, a reorder) is
     shown at once and sent through subWrite(), which re-fetches the tab if the
     write fails, so the screen goes back to exactly what the server holds. A
     record that is being added or removed changes this local mirror only after
     the server has answered (subTrack()). */
  var SUB = { speakers:false, agenda:false, sponsors:false, gallery:false, faq:false, contact:false };
  var SUB_LOADING = {};

  var SUB_ROUTE_KEY = {
    'content/speakers': 'speakers', 'content/agenda': 'agenda', 'content/sponsors': 'sponsors',
    'content/gallery': 'gallery', 'content/faq': 'faq', 'content/contact': 'contact'
  };
  /* keyed by name, not referenced directly, so these can be declared (as plain
     `function loadX(){}`) anywhere else in this file — function declarations in
     one scope all hoist before any of them run. */
  /* Agenda rows name their speakers and the Speakers tab cleans a removed speaker out of the
     sessions, so each of the two loads the other's records when they are not there yet. */
  var SUB_FETCHERS = {
    speakers: function(){ return loadSpeakers(); },
    agenda:   function(){ return loadAgenda(); },
    sponsors: function(){ return loadSponsors(); },
    gallery:  function(){ return loadGallery(); },
    faq:      function(){ return loadFaq(); },
    contact:  function(){ return loadContact(); }
  };
  /* One fetch of a tab at a time, whoever asks: the tab being opened, the tab that needs it
     beside its own, or the count on the tab strip. SUB[key] is set only when it succeeded. */
  var SUB_FETCH = {};
  function fetchTab(key){
    if (SUB[key]) return Promise.resolve();
    if (!SUB_FETCH[key]){
      SUB_FETCH[key] = SUB_FETCHERS[key]().then(function(){
        delete SUB_FETCH[key];
        SUB[key] = true;
      }, function(err){
        delete SUB_FETCH[key];
        throw err;
      });
    }
    return SUB_FETCH[key];
  }
  var SUB_LOADERS = {
    speakers: function(){ return Promise.all([fetchTab('speakers'), fetchTab('agenda')]); },
    agenda:   function(){ return Promise.all([fetchTab('agenda'), fetchTab('speakers')]); },
    sponsors: function(){ return fetchTab('sponsors'); },
    gallery:  function(){ return fetchTab('gallery'); },
    faq:      function(){ return fetchTab('faq'); },
    contact:  function(){ return fetchTab('contact'); }
  };

  /* The numbers on the tab strip need every tab's records. They are fetched once the first view
     is on screen, so opening the console never waits for them; a fetch that fails here is simply
     tried again when its tab is opened, where the failure is shown. */
  function loadTabCounts(){
    Object.keys(SUB_FETCHERS).forEach(function(key){
      fetchTab(key).then(function(){
        keepSaved();
        paintTabCounts();
      }, function(err){
        console.error('Could not load the ' + key + ' count:', err);
      });
    });
  }

  /* Two records can hold the same order (older events have them); the one created first then
     comes first, so the sequence is the same on every load and on the site. */
  function orderOf(x){ return typeof x.order === 'number' && isFinite(x.order) ? x.order : 0; }
  function byOrder(a, b){
    return (orderOf(a) - orderOf(b)) ||
      String(a.createdAt || '').localeCompare(String(b.createdAt || '')) ||
      String(a.id || '').localeCompare(String(b.id || ''));
  }
  /* the order for a record added after everything in list */
  function nextOrder(list){
    var max = -1;
    (list || []).forEach(function(x){
      if (typeof x.order === 'number' && isFinite(x.order) && x.order > max) max = x.order;
    });
    return max + 1;
  }

  /* A record that only exists in an open dialog has a key, not an id: it gets its id from the
     server when it is created and enters the page only then. These two are the one way a record is
     changed or removed, and they refuse anything that is not a stored record's id — a change sent
     to an id the server never issued would create a second, stray record there. */
  var DRAFT = 'draft:';
  function draftKey(){ return DRAFT + Math.random().toString(36).slice(2, 9); }
  function storedId(resource, id){
    if (id && typeof id === 'string' && id.indexOf(DRAFT) !== 0) return null;
    var err = new Error('This item has not been saved yet. Reload the page and try again.');
    err.status = 400;
    console.error('Refused a write to an unsaved ' + resource + ' record:', id);
    return Promise.reject(err);
  }
  function updateSub(resource, id, patch){
    return storedId(resource, id) || C.updateSub(resource, EV.id, id, patch);
  }
  function deleteSub(resource, id){
    return storedId(resource, id) || C.deleteSub(resource, EV.id, id);
  }

  function renderSubLoading(){
    $('view').innerHTML = tabsHTML() +
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;' +
        'gap:14px;padding:120px 20px;text-align:center;color:var(--text-muted)">' +
        '<span class="spin" style="width:24px;height:24px;border-width:3px"></span>' +
        '<span style="font-size:13.5px;font-weight:600">Loading…</span>' +
      '</div>';
  }
  function renderSubLoadError(err, retry){
    console.error('Tab load failed:', err);
    var raw = (err && err.message) ? err.message : '';
    $('view').innerHTML = tabsHTML() + '<div style="padding:60px 20px">' + emptyState(
      IC.info, 'Couldn’t load this', errText(err),
      '<button class="btn btn-primary btn-sm" type="button" id="sub-retry">Try again</button>' +
      (raw && raw !== errText(err)
        ? '<details class="err-details"><summary>Details</summary>' + esc(raw) + '</details>' : '')
    ) + '</div>';
    var b = $('sub-retry');
    if (b) b.onclick = retry;
  }

  /* ---- writes made from a tab (a pill, an arrow, a drag, a rename, a dialog's save) ----
     The screen shows the new value at once; this is what makes that honest.
     work    a promise, or an array of them (a reorder is several PATCHes and one outcome)
     okText  shown once, and only when everything was stored; leave it out for a silent edit
     what    a sentence saying what was not saved, put in front of the reason on failure
     free    true for an edit committed by leaving a field (a rename, a caption): the tab's
             controls are then not held, because holding them would swallow the very click
             that took the user out of the field
     On any failure the tab is fetched again, so nothing stays on screen that was not stored; if
     even that cannot be done (the connection is gone) the tab goes back to the last state the
     server confirmed to this page.
     Resolves true or false; never rejects. */
  var SUB_BUSY = {};     /* tab -> writes still out */
  var SUB_HELD = {};     /* tab -> of those, the ones that hold the tab's controls */
  var SUB_STALE = {};    /* tab -> must be fetched again as soon as that is safe */
  var SUB_SAVED = {};    /* tab -> its records as the server last confirmed them */
  var SUB_LISTS = {
    speakers: ['spkGroups', 'speakers'], agenda: ['agGroups', 'sessions'], sponsors: ['spTiers', 'partners'],
    gallery: ['gallery'], faq: ['faqs'], contact: ['contacts']
  };

  function copyRecords(list){
    return (list || []).map(function(rec){
      var c = {};
      for (var k in rec) if (rec.hasOwnProperty(k)) c[k] = Array.isArray(rec[k]) ? rec[k].slice() : rec[k];
      return c;
    });
  }
  /* Remembers every loaded tab that has nothing unconfirmed in it. Called whenever the server has
     just answered: after a load, and after a write that went through. */
  function keepSaved(){
    Object.keys(SUB_LISTS).forEach(function(tab){
      if (!SUB[tab] || SUB_BUSY[tab] || SUB_STALE[tab]) return;
      var kept = {};
      SUB_LISTS[tab].forEach(function(k){ kept[k] = copyRecords(S[k]); });
      SUB_SAVED[tab] = kept;
    });
  }
  function restoreSaved(tab){
    var kept = SUB_SAVED[tab];
    if (!kept) return false;
    SUB_LISTS[tab].forEach(function(k){ S[k] = copyRecords(kept[k]); });
    return true;
  }

  /* While a write is out, the tab's rows cannot be worked on: a second change made on top of one
     the server has not answered yet could be sent in the wrong order, or to a record that is about
     to be reloaded. Called after every render too, because a render replaces the rows. */
  function paintWriting(){
    var view = $('view');
    var held = (SUB_HELD[SUB_ROUTE_KEY[routeId()]] || 0) > 0;
    view.classList.toggle('is-saving', held);
    Array.prototype.forEach.call(view.children, function(el){
      if (el.classList.contains('subtabs')) return;
      if (held) el.setAttribute('inert', ''); else el.removeAttribute('inert');
    });
    if (!held) focusBack();
  }

  function reloadSub(tabKey){
    SUB_STALE[tabKey] = true;
    flushReloads();
  }

  /* A tab is fetched again only when nothing can be lost or raced by doing so: no dialog is open
     (it may hold typed content about these records), none of the tab's writes are still out (the
     answer could arrive before they land) and no earlier fetch of it is still on its way. */
  function flushReloads(){
    if (MODAL) return;
    Object.keys(SUB_STALE).forEach(function(k){
      if (SUB_BUSY[k] || SUB_LOADING[k]) return;
      delete SUB_STALE[k];
      SUB[k] = false;
      if (SUB_ROUTE_KEY[routeId()] === k) render();
    });
  }

  /* resolves when every promise has settled; rejects with the first failure, if there was one */
  function settleAll(list){
    return new Promise(function(resolve, reject){
      var left = list.length, failed = false, firstErr = null;
      if (!left){ resolve(); return; }
      list.forEach(function(p){
        Promise.resolve(p).then(null, function(err){
          if (!failed){ failed = true; firstErr = err; }
        }).then(function(){
          if (--left === 0){ if (failed) reject(firstErr); else resolve(); }
        });
      });
    });
  }

  /* A write whose outcome the caller reports itself — a dialog that stays open until the server
     has answered. `work` puts the confirmed result into S before it resolves, so the page never
     holds anything the server did not store and nothing has to be fetched again when it fails.
     Resolves or rejects exactly as `work` does. */
  function subTrack(tabKey, work){
    SUB_BUSY[tabKey] = (SUB_BUSY[tabKey] || 0) + 1;
    SUB_HELD[tabKey] = (SUB_HELD[tabKey] || 0) + 1;
    paintWriting();
    function done(){
      SUB_BUSY[tabKey]--;
      SUB_HELD[tabKey]--;
      paintWriting();
      keepSaved();
      flushReloads();
    }
    return Promise.resolve(work).then(function(v){ done(); return v; }, function(err){ done(); throw err; });
  }

  function subWrite(tabKey, work, okText, what, free){
    var all = Array.isArray(work) ? work : [work];
    if (!all.length) return Promise.resolve(true);
    SUB_BUSY[tabKey] = (SUB_BUSY[tabKey] || 0) + 1;
    if (!free) SUB_HELD[tabKey] = (SUB_HELD[tabKey] || 0) + 1;
    paintWriting();
    function done(){
      SUB_BUSY[tabKey]--;
      if (!free) SUB_HELD[tabKey]--;
      paintWriting();
    }
    return settleAll(all).then(function(){
      done();
      keepSaved();
      if (okText) notify(okText);
      flushReloads();
      return true;
    }, function(err){
      done();
      notifyError(err, { what: what || 'That change was not saved.' });
      reloadSub(tabKey);
      return false;
    });
  }

  /* ============================================================
     NAVIGATION MODEL
     ============================================================ */
  var SECTIONS = [
    { id:'dashboard', label:'Dashboard', icon:IC.chart, tabs:[] },

    { id:'content', label:'Content', icon:IC.layers, tabs:[
        { id:'basics',   label:'Basics' },
        { id:'speakers', label:'Speakers' },
        { id:'agenda',   label:'Agenda' },
        { id:'sponsors', label:'Sponsors' },
        { id:'gallery',  label:'Gallery' },
        { id:'faq',      label:'FAQ' },
        { id:'contact',  label:'Contact' }
    ]},

    { id:'settings', label:'Settings', icon:IC.gear, tabs:[
        { id:'form',       label:'Registration forms' },
        { id:'seo',        label:'URL & SEO' },
        { id:'links',      label:'Social links' },
        { id:'visibility', label:'Visibility' },
        { id:'advanced',   label:'Advanced' },
        { id:'history',    label:'History' }
    ]}
  ];

  var cur = { sec:'content', tab:'basics' };

  function secById(id){
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return SECTIONS[i];
    return null;
  }
  function routeId(){ return cur.tab ? cur.sec + '/' + cur.tab : cur.sec; }

  /* counts shown on the tabs, worked out at render time */
  function tabCount(sec, tab){
    if (sec === 'content'){
      /* known once that tab's records are in: straight away for the tab that is open, a moment
         later for the others (loadTabCounts()) */
      if (tab === 'speakers') return SUB.speakers ? spkAll().length : null;
      if (tab === 'agenda')   return SUB.agenda   ? agAll().length  : null;
      if (tab === 'sponsors') return SUB.sponsors ? ptAll().length  : null;
      if (tab === 'gallery')  return SUB.gallery  ? galAll().length : null;
      if (tab === 'faq')      return SUB.faq      ? faqAll().length : null;
      if (tab === 'contact')  return SUB.contact  ? ctAll().length  : null;
    }
    return null;
  }

  function renderRail(){
    renderEventRail('rail', { activeSection: cur.sec, eventId: EV.id });
  }

  function tabsHTML(){
    var s = secById(cur.sec);
    if (!s || !s.tabs.length) return '';
    return '<div class="subtabs" role="tablist" aria-label="' + esc(s.label) + '">' + s.tabs.map(function(t){
      var n = tabCount(s.id, t.id);
      var inner = esc(t.label) + '<span class="cnt"' + (n != null ? '>' + comma(n) : ' hidden>') + '</span>';
      return '<button type="button" role="tab" data-tab="' + esc(t.id) + '" aria-selected="' + (cur.tab === t.id) + '"' +
        (cur.tab === t.id ? '' : ' tabindex="-1"') + '>' + inner + '</button>';
    }).join('') + '</div>';
  }

  /* puts the counts that have arrived since on the tab strip that is on screen, without redrawing
     it (a tab may hold the keyboard focus) */
  function paintTabCounts(){
    Array.prototype.forEach.call(document.querySelectorAll('#view .subtabs [data-tab]'), function(b){
      var n = tabCount(cur.sec, b.getAttribute('data-tab')), cnt = b.querySelector('.cnt');
      if (!cnt) return;
      cnt.hidden = n == null;
      cnt.textContent = n == null ? '' : comma(n);
    });
  }

  /* The site editor only loads the event's real site when it is told the template; without it the
     editor opens its built-in sample page. */
  function editorUrl(){
    return '/custom_editor.html?event=' + encodeURIComponent(EV.id) +
      (EV.templateId ? '&template=' + encodeURIComponent(EV.templateId) : '');
  }

  /* Where a route leads: { url } for a screen that lives on another page, otherwise { sec, tab }.
     A route the console does not know resolves to Basics, never to a view under the wrong address. */
  function resolveRoute(route){
    var parts = String(route || '').split('/');
    var sec = parts[0], tab = parts[1] || '';
    if (sec === 'design') return { url: editorUrl() };
    if (sec === 'marketing'){
      return { url: RevampRail.href('marketing', EV.id) + (tab ? '&tab=' + encodeURIComponent(tab) : '') };
    }
    if (sec === 'payment' || (sec === 'audience' && tab === 'payments')){
      return { url: RevampRail.href('payment', EV.id) };
    }
    if (sec === 'audience'){
      if (tab === 'insights') return { sec: 'dashboard', tab: null };
      return { url: RevampRail.href('audience', EV.id) };
    }
    var s = secById(sec);
    if (!s) return { sec: 'content', tab: 'basics' };
    if (!s.tabs.length) return tab ? { sec: 'content', tab: 'basics' } : { sec: s.id, tab: null };
    if (!tab) return { sec: s.id, tab: s.tabs[0].id };
    var known = s.tabs.filter(function(t){ return t.id === tab; }).length;
    return known ? { sec: s.id, tab: tab } : { sec: 'content', tab: 'basics' };
  }

  /* Accepts "section" or "section/tab". byUser is true for a click inside the console: that is the only
     case that adds a history entry. A route read from the address bar (first load, Back / Forward, a
     link from another page) has its entry already, so a correction or a redirect replaces that entry —
     otherwise Back would land on the redirecting address and bounce forward again. */
  function go(route, byUser){
    leaveThen(function(){ goNow(route, byUser); });
  }

  function goNow(route, byUser){
    var dest = resolveRoute(route);
    if (dest.url){
      if (byUser) location.assign(dest.url); else location.replace(dest.url);
      return;
    }
    cur.sec = dest.sec;
    cur.tab = dest.tab;
    var r = routeId();
    if (location.hash.slice(1) !== r){
      if (byUser) location.hash = r; else history.replaceState(null, '', '#' + r);
    }
    renderRail();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ============================================================
     LEAVING A FORM WITH UNSAVED CHANGES

     A view whose fields are saved with an explicit Save registers itself here. Every way
     out of that view — a tab, the rail, Back to events, Back / Forward, Sign out — asks
     first while dirty() is true; a reload or closing the window gets the browser's own
     prompt (boot() adds the beforeunload listener).

       dirty()    true while something typed has not been saved
       save()     a promise that resolves only once the changes are stored; it rejects with
                  { fields: [[id, message], …] } when a field must be corrected first, or
                  with the request's error after the view has shown that failure itself
       discard()  puts the fields back to what is stored
       label      the name of the view, for the question
     ============================================================ */
  var NOT_DIRTY = { dirty: function(){ return false; }, save: null, discard: null, label: '' };
  var LEAVE = NOT_DIRTY;
  /* the latest place the user asked to go while the question is on screen */
  var LEAVE_NEXT = null;

  function writesOut(){
    return Object.keys(SUB_BUSY).some(function(k){ return SUB_BUSY[k] > 0; });
  }

  function leaveThen(proceed){
    if (!LEAVE.dirty()){ proceed(); return; }
    if (LEAVE_NEXT){ LEAVE_NEXT = proceed; return; }
    LEAVE_NEXT = proceed;

    function onward(){
      var next = LEAVE_NEXT;
      m.close();
      next();
    }
    var m = openModal(
      '<div class="modal-head"><h3>Save your changes to ' + esc(LEAVE.label) + '?</h3></div>' +
      '<div class="modal-body"><div class="confirm-msg">You have changes on this page that are not saved yet. ' +
        'If you leave without saving, they are lost.</div></div>' +
      '<div class="modal-foot">' +
        '<button class="btn btn-secondary" type="button" id="lv-stay">Keep editing</button>' +
        '<span style="flex:1"></span>' +
        '<button class="btn btn-danger" type="button" id="lv-drop">Discard changes</button>' +
        '<button class="btn btn-primary" type="button" id="lv-save">Save and continue</button>' +
      '</div>',
      /* Escape and a click outside mean the same as Keep editing */
      { style: 'width:min(500px,100%)', initialFocus: '#lv-stay', onClose: function(){ LEAVE_NEXT = null; } });

    $('lv-drop').onclick = function(){
      LEAVE.discard();
      onward();
    };
    $('lv-save').onclick = function(){
      m.busy(true, $('lv-save'), 'Saving…');
      LEAVE.save().then(onward, function(err){
        /* the form shows what went wrong; the user is back on it to put it right */
        m.close();
        if (err && err.fields) showFieldErrors(err.fields);
      });
    };
  }

        '<div class="bx-main">' + form +

          panel('Danger zone', 'Reversible, but not from here',

              '<span>The site goes offline and the event moves out of active listings. ' +
              'Registrations, payments and reports are kept.</span></div>' +

            '</div>') +

      '</div>' +

      '<div class="savebar" id="b-savebar">' +
        '<span class="sb-txt" id="b-sbtxt"><b id="b-sbhead">Unsaved changes</b><span id="b-sbwhat"></span></span>' +
        '<button class="sb-ghost" type="button" id="b-discard">Discard</button>' +

  /* The banner video's settings. An upload keeps going when the owner moves to another tab (the component it
     started in saves it and says so); the settings shown when they come back are then brought up to date. */
