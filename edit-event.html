<!-- ET Oneworld - Revamp CMS : per-event admin console ("Edit event") -->
<title>Edit Event &mdash; Revamp CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #FAF7F6;
    --surface: #FFFFFF;
    --surface-2: #F3EEED;
    --surface-3: #E9E2E0;
    --border: #E0D7D5;
    --text: #241B1A;
    --text-muted: #756865;
    --text-faint: #A0908C;

    --accent: #ED1C24;
    --accent-strong: #B3151B;
    --accent-soft: #FBDBDC;
    --accent-contrast: #FFFFFF;

    --ok: #2F8F5B;
    --ok-soft: #DFEEE1;
    --warn: #9C6B14;
    --warn-soft: #F3E7C8;
    --info: #2F6FB0;
    --info-soft: #DCE9F5;
    --review: #8A5A9E;
    --review-soft: #EBE0F0;

    --shadow-sm: 0 1px 2px rgba(30,26,10,0.08);
    --shadow-md: 0 12px 28px -10px rgba(30,26,10,0.28);
    --shadow-lg: 0 28px 60px -24px rgba(30,26,10,0.38);

    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

    --topbar-h: 60px;
    --side-w: 244px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #171514; --surface: #201C1B; --surface-2: #2A2422; --surface-3: #352D2B;
      --border: #3F3532; --text: #EDE6E4; --text-muted: #A89C99; --text-faint: #7C716E;
      --accent: #FF6B70; --accent-strong: #FF8A8E; --accent-soft: #3A1518; --accent-contrast: #2B0A0B;
      --ok: #6FD39B; --ok-soft: #1E3328; --warn: #E0B457; --warn-soft: #362B14;
      --info: #7FB4E8; --info-soft: #16283A; --review: #C89BDA; --review-soft: #2C1E33;
    }
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4{ margin:0; font-family: var(--font-display); font-weight:600; letter-spacing:-0.015em; }
  button, input, select, textarea{ font-family: inherit; font-size: inherit; color: inherit; }
  a{ color: var(--accent-strong); }

  /* ============ TOP BAR ============ */
  .topbar{
    position: sticky; top:0; z-index: 40; height: var(--topbar-h);
    background: var(--surface); border-bottom: 1px solid var(--border);
    display:flex; align-items:center; gap:14px; padding: 0 16px;
  }
  .back-btn{
    display:inline-flex; align-items:center; gap:7px; background: var(--surface-2);
    border:1px solid var(--border); border-radius:9px; padding:7px 13px 7px 10px;
    font-size:13px; font-weight:700; cursor:pointer; text-decoration:none; color: var(--text);
    white-space:nowrap; transition: background .14s, border-color .14s;
  }
  .back-btn:hover{ background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
  .ev-title{ min-width:0; flex:1; }
  .ev-title h1{ font-size:16.5px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev-title .meta{
    font-size:11.5px; color: var(--text-muted); font-family: var(--font-mono);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;
  }
  .topbar-acts{ display:flex; align-items:center; gap:9px; flex-shrink:0; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:9px; padding:8px 15px; font-size:13px; font-weight:700;
    cursor:pointer; border:1.5px solid transparent; white-space:nowrap;
    transition: background .14s, border-color .14s, color .14s, transform .1s;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .btn-primary:hover{ background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-secondary{ background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover{ border-color: var(--accent); color: var(--accent-strong); }
  .btn-ghost{ background: transparent; color: var(--text-muted); border-color: transparent; }
  .btn-ghost:hover{ background: var(--surface-2); color: var(--text); }
  .btn-sm{ padding:5px 11px; font-size:12px; border-radius:7px; }
  .btn-icon{ padding:7px; border-radius:8px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ============ SHELL ============ */
  .shell{ display:flex; align-items:flex-start; min-height: calc(100vh - var(--topbar-h)); }

  .sidebar{
    width: var(--side-w); flex-shrink:0; background: var(--surface);
    border-right:1px solid var(--border); padding: 10px 10px 30px;
    position: sticky; top: var(--topbar-h); max-height: calc(100vh - var(--topbar-h));
    overflow-y: auto; transition: width .16s ease;
  }
  .sidebar.collapsed{ width: 60px; padding-left:8px; padding-right:8px; }
  .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-caret, .sidebar.collapsed .subnav{ display:none; }
  .sidebar.collapsed .nav-item{ justify-content:center; padding-left:0; padding-right:0; }

  .side-toggle{
    width:100%; display:flex; align-items:center; gap:10px; background:transparent; border:0;
    padding:8px 10px; border-radius:8px; cursor:pointer; color: var(--text-muted); margin-bottom:6px;
  }
  .side-toggle:hover{ background: var(--surface-2); color: var(--text); }

  .nav-item{
    width:100%; display:flex; align-items:center; gap:11px; background:transparent; border:0;
    padding:9px 11px; border-radius:9px; cursor:pointer; color: var(--text); text-align:left;
    font-size:13.5px; font-weight:600; transition: background .13s, color .13s;
  }
  .nav-item:hover{ background: var(--surface-2); }
  .nav-item .nav-ico{ flex-shrink:0; display:grid; place-items:center; color: var(--text-muted); }
  .nav-item.active{ background: var(--accent-soft); color: var(--accent-strong); }
  .nav-item.active .nav-ico{ color: var(--accent); }
  .nav-item.open .nav-caret{ transform: rotate(90deg); }
  .nav-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-caret{ color: var(--text-faint); transition: transform .16s ease; flex-shrink:0; }

  .subnav{ padding: 2px 0 6px 32px; display:flex; flex-direction:column; gap:1px; }
  .sub-item{
    background:transparent; border:0; text-align:left; padding:6px 10px; border-radius:7px;
    font-size:12.5px; font-weight:600; color: var(--text-muted); cursor:pointer;
  }
  .sub-item:hover{ background: var(--surface-2); color: var(--text); }
  .sub-item.active{ color: var(--accent-strong); background: var(--accent-soft); }

  .nav-sep{ height:1px; background: var(--border); margin: 9px 6px; }

  .main{ flex:1; min-width:0; padding: 22px 26px 60px; }
  @media (max-width: 720px){ .main{ padding: 16px 14px 50px; } }

  /* ============ VIEW HEADER ============ */
  .vhead{ margin-bottom: 18px; }
  .crumb{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
    color: var(--text-faint); margin-bottom:5px;
  }
  .vhead h2{ font-size:24px; }
  .vhead .sub{ font-size:13px; color: var(--text-muted); margin-top:3px; }
  .vhead-row{ display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .vhead-row .grow{ flex:1; min-width:200px; }

  /* ============ CARDS / PANELS ============ */
  .panel{
    background: var(--surface); border:1px solid var(--border); border-radius:13px;
    overflow:hidden; margin-bottom:18px;
  }
  .panel-head{
    display:flex; align-items:center; gap:12px; padding:13px 16px;
    border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .panel-head h3{ font-size:15px; flex:1; min-width:120px; }
  .panel-head .sub{ font-size:12px; color: var(--text-muted); font-weight:500; font-family: var(--font-body); }
  .panel-body{ padding:16px; }
  .panel-body.tight{ padding:0; }

  .eyebrow{
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    color: var(--text-faint);
  }

  /* ============ STAT TILES ============ */
  .stat-grid{ display:grid; grid-template-columns: repeat(6, 1fr); gap:12px; margin-bottom:18px; }
  @media (max-width:1400px){ .stat-grid{ grid-template-columns: repeat(4,1fr); } }
  @media (max-width:900px){ .stat-grid{ grid-template-columns: repeat(2,1fr); } }
  @media (max-width:520px){ .stat-grid{ grid-template-columns: 1fr; } }
  .stat{
    background: var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:13px 14px; display:flex; flex-direction:column; gap:3px; position:relative;
    transition: border-color .14s, transform .14s, box-shadow .14s;
  }
  .stat.clickable{ cursor:pointer; }
  .stat.clickable:hover{ border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat .st-top{ display:flex; align-items:center; gap:8px; }
  .stat .st-ico{
    width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
    background: var(--accent-soft); color: var(--accent-strong); flex-shrink:0;
  }
  .stat .st-lb{ font-size:11.5px; font-weight:700; color: var(--text-muted); line-height:1.3; }
  .stat .st-v{ font-size:23px; font-weight:800; letter-spacing:-0.02em; font-family: var(--font-display); }
  .stat .st-d{ font-size:11px; font-weight:700; display:flex; align-items:center; gap:4px; }
  .stat .st-d.up{ color: var(--ok); }
  .stat .st-d.down{ color: var(--accent-strong); }
  .stat .st-d.flat{ color: var(--text-faint); }

  /* ============ FUNNEL ============ */
  .funnel{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; }
  .fstage{
    width:100%; color:#fff; text-align:center; padding:14px 10px;
    display:flex; flex-direction:column; gap:1px; position:relative;
  }
  .fstage b{ font-size:14.5px; font-weight:800; letter-spacing:.01em; }
  .fstage span{ font-size:18px; font-weight:800; font-family: var(--font-display); }
  .fstage .pct{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    font-size:11px; font-weight:700; opacity:.9; font-family: var(--font-mono);
  }

  /* ============ ACTIVITY FEED ============ */
  .feed{ display:flex; flex-direction:column; max-height:420px; overflow-y:auto; }
  .feed-item{ display:flex; gap:11px; padding:11px 16px; border-bottom:1px solid var(--border); }
  .feed-item:last-child{ border-bottom:0; }
  .feed-dot{
    width:9px; height:9px; border-radius:50%; background: var(--accent);
    margin-top:6px; flex-shrink:0;
  }
  .feed-body{ min-width:0; flex:1; }
  .feed-when{ font-size:11px; color: var(--text-faint); font-family: var(--font-mono); }
  .feed-what{ font-size:12.5px; font-weight:700; margin-top:2px; }
  .feed-what .sep{ color: var(--text-faint); margin:0 4px; font-weight:500; }
  .feed-who{ font-size:11.5px; color: var(--text-muted); margin-top:1px; }

  /* ============ TABLES ============ */
  .tbl-wrap{ overflow-x:auto; }
  table.tbl{ width:100%; border-collapse: collapse; font-size:13px; }
  table.tbl th{
    text-align:left; padding:10px 13px; background: var(--surface-2);
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.055em;
    color: var(--text-muted); white-space:nowrap; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:2;
  }
  table.tbl th.sortable{ cursor:pointer; user-select:none; }
  table.tbl th.sortable:hover{ color: var(--accent-strong); }
  table.tbl th .arr{ opacity:.35; margin-left:3px; }
  table.tbl th.sorted .arr{ opacity:1; color: var(--accent); }
  table.tbl td{ padding:11px 13px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.tbl tbody tr:hover{ background: var(--surface-2); }
  table.tbl tbody tr:last-child td{ border-bottom:0; }
  .td-strong{ font-weight:700; }
  .num{ font-family: var(--font-mono); font-size:12.5px; }

  .avat{
    width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    font-size:11px; font-weight:800; color:#fff; flex-shrink:0; letter-spacing:.02em;
  }
  .person{ display:flex; align-items:center; gap:9px; min-width:0; }
  .person .pn{ min-width:0; }
  .person .pn b{ font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .person .pn span{ font-size:11px; color: var(--text-muted); }

  /* ============ BADGES / PILLS ============ */
  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
  }
  .b-ok{ background: var(--ok-soft); color: var(--ok); }
  .b-warn{ background: var(--warn-soft); color: var(--warn); }
  .b-info{ background: var(--info-soft); color: var(--info); }
  .b-accent{ background: var(--accent-soft); color: var(--accent-strong); }
  .b-mute{ background: var(--surface-3); color: var(--text-muted); }
  .b-review{ background: var(--review-soft); color: var(--review); }

  /* ============ TOOLBAR ============ */
  .toolbar{
    display:flex; align-items:center; gap:9px; padding:11px 14px;
    border-bottom:1px solid var(--border); flex-wrap:wrap; background: var(--surface);
  }
  .search{
    display:flex; align-items:center; gap:8px; background: var(--surface-2);
    border:1px solid var(--border); border-radius:9px; padding:0 11px; flex:1; min-width:180px; max-width:380px;
  }
  .search input{ border:0; background:transparent; outline:none; padding:8px 0; width:100%; font-size:13px; }
  .search svg{ color: var(--text-faint); flex-shrink:0; }

  .inp{
    width:100%; background: var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:0 11px; height:38px; outline:none; font-size:13.5px; transition: border-color .14s, box-shadow .14s;
  }
  select.inp{ cursor:pointer; }
  textarea.inp{ height:auto; padding:9px 11px; resize:vertical; min-height:76px; line-height:1.55; }
  .inp:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .inp::placeholder{ color: var(--text-faint); }

  .field{ display:flex; flex-direction:column; min-width:0; }
  .field > label, .field > .flabel{
    font-size:12.5px; font-weight:700; margin-bottom:6px; display:flex;
    align-items:center; min-height:19px; gap:7px;
  }
  .field .hint{ font-size:11.5px; color: var(--text-muted); margin:6px 0 0; }
  .frow{ display:grid; grid-template-columns: repeat(12,1fr); gap:14px 16px; align-items:start; }
  .c3{ grid-column: span 3; } .c4{ grid-column: span 4; } .c5{ grid-column: span 5; }
  .c6{ grid-column: span 6; } .c8{ grid-column: span 8; } .c12{ grid-column: span 12; }
  @media (max-width:1080px){ .c3,.c4,.c5{ grid-column: span 6; } .c8{ grid-column: span 12; } }
  @media (max-width:680px){ .frow > *{ grid-column: span 12; } }

  .pill-req{ background: var(--accent-soft); color: var(--accent-strong); font-size:9.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.05em; padding:2px 6px; border-radius:4px; }
  .pill-opt{ background: var(--surface-2); color: var(--text-faint); font-size:9.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.05em; padding:2px 6px; border-radius:4px; }

  /* ============ TOGGLE ============ */
  .tgl{
    display:inline-flex; align-items:center; gap:8px; background:transparent; border:0;
    cursor:pointer; padding:0; font-size:12.5px; font-weight:600; color: var(--text-muted);
  }
  .tgl .track{
    width:34px; height:19px; border-radius:999px; background: var(--surface-3);
    position:relative; transition: background .16s; flex-shrink:0;
  }
  .tgl .track i{
    position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%;
    background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .16s;
  }
  .tgl[aria-pressed="true"] .track{ background: var(--accent); }
  .tgl[aria-pressed="true"] .track i{ transform: translateX(15px); }
  .tgl[aria-pressed="true"]{ color: var(--accent-strong); }

  /* ============ TABS ============ */
  .tabs{ display:flex; gap:3px; background: var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:3px; flex-wrap:wrap; }
  .tabs button{
    border:0; background:transparent; padding:7px 15px; border-radius:7px;
    font-size:12.5px; font-weight:700; color: var(--text-muted); cursor:pointer;
  }
  .tabs button:hover{ color: var(--text); }
  .tabs button[aria-pressed="true"]{ background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

  /* ============ PROGRESS ============ */
  .prog{ height:7px; border-radius:999px; background: var(--surface-3); overflow:hidden; }
  .prog i{ display:block; height:100%; background: var(--accent); border-radius:999px; transition: width .4s ease; }
  .prog.ok i{ background: var(--ok); }

  .check-list{ display:flex; flex-direction:column; gap:2px; }
  .check-row{
    display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px;
    cursor:pointer; border:1px solid transparent; background:transparent; text-align:left; width:100%;
  }
  .check-row:hover{ background: var(--surface-2); border-color: var(--border); }
  .check-row .cb{
    width:19px; height:19px; border-radius:6px; border:1.5px solid var(--border);
    display:grid; place-items:center; flex-shrink:0; color: transparent; background: var(--surface);
  }
  .check-row.done .cb{ background: var(--ok); border-color: var(--ok); color:#fff; }
  .check-row .ct{ flex:1; min-width:0; font-size:13px; font-weight:600; }
  .check-row.done .ct{ color: var(--text-muted); text-decoration: line-through; }

  /* ============ SECTION LIST (page sections) ============ */
  .sec-row{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border-bottom:1px solid var(--border);
  }
  .sec-row:last-child{ border-bottom:0; }
  .sec-row .grip{ color: var(--text-faint); cursor:grab; flex-shrink:0; }
  .sec-row .sn{ flex:1; min-width:0; }
  .sec-row .sn b{ font-size:13.5px; display:block; }
  .sec-row .sn span{ font-size:11.5px; color: var(--text-muted); }
  .sec-row.off{ opacity:.5; }

  /* ============ EMPTY / CTA ============ */
  .empty{
    text-align:center; padding:44px 20px; display:flex; flex-direction:column;
    align-items:center; gap:9px;
  }
  .empty .ico{
    width:52px; height:52px; border-radius:14px; display:grid; place-items:center;
    background: var(--surface-2); color: var(--text-faint); margin-bottom:2px;
  }
  .empty h4{ font-size:16px; }
  .empty p{ font-size:13px; color: var(--text-muted); margin:0; max-width:420px; }

  .callout{
    display:flex; gap:11px; padding:13px 15px; border-radius:11px;
    background: var(--accent-soft); color: var(--accent-strong); align-items:flex-start;
  }
  .callout svg{ flex-shrink:0; margin-top:2px; }
  .callout strong{ display:block; font-size:13px; margin-bottom:2px; }
  .callout span{ font-size:12.5px; line-height:1.55; }
  .callout.info{ background: var(--info-soft); color: var(--info); }

  /* ============ PAGINATION ============ */
  .pager{
    display:flex; align-items:center; gap:9px; padding:11px 14px; flex-wrap:wrap;
    border-top:1px solid var(--border);
  }
  .pager .cnt{ font-size:12px; color: var(--text-muted); flex:1; min-width:140px; }
  .pg-btn{
    min-width:31px; height:31px; padding:0 8px; border-radius:7px; border:1px solid var(--border);
    background: var(--surface); font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .pg-btn:hover:not(:disabled){ border-color: var(--accent); color: var(--accent-strong); }
  .pg-btn[aria-current="true"]{ background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .pg-btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* ============ BULK BAR ============ */
  .bulk{
    display:flex; align-items:center; gap:10px; padding:9px 14px;
    background: var(--accent-soft); border-bottom:1px solid var(--accent); flex-wrap:wrap;
  }
  .bulk b{ font-size:12.5px; color: var(--accent-strong); }

  /* ============ TOAST ============ */
  .toast-host{ position:fixed; right:18px; bottom:18px; z-index:99; display:flex; flex-direction:column; gap:9px; }
  .toast{
    background: var(--text); color: var(--bg); padding:11px 15px; border-radius:10px;
    font-size:13px; font-weight:600; box-shadow: var(--shadow-lg); max-width:340px;
    animation: tin .22s ease; display:flex; align-items:center; gap:9px;
  }
  @keyframes tin{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform:none; } }

  /* ============ MODAL ============ */
  .modal-bg{
    position:fixed; inset:0; background: rgba(20,14,13,.55); z-index:80;
    display:grid; place-items:center; padding:20px; animation: tin .15s ease;
  }
  .modal{
    background: var(--surface); border-radius:15px; box-shadow: var(--shadow-lg);
    width:min(620px, 100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-head{ display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--border); }

  /* ============ MEDIA GRID ============ */

  .media-card{
    border:1px solid var(--border); border-radius:11px; overflow:hidden; background: var(--surface-2);

  /* ============================================================
     EVENT DATA  (mirrors the Event_Listing model)

  };

  var EVENTS = [

    { id:3,  name:'RACEx360', venue:'Taj West End, Bengaluru', eventNo:4652, type:'client', portal:'auto', status:'upcoming', start:'2026-09-25T09:30:00', end:null, registrations:136, regTarget:113, visitors:1130, visits:860, payment:{ type:'free' } },

  ];

  /* deterministic pseudo-random so every reload shows the same numbers */
  function rnd(seed){ var x = Math.sin(seed) * 10000; return x - Math.floor(x); }

  EVENTS.forEach(function(e, i){
    var s = e.eventNo;
    e.mailers    = Math.round(e.visitors * (1.8 + rnd(s) * 1.2));
    e.opens      = Math.round(e.mailers * (0.11 + rnd(s + 1) * 0.06));
    e.clicks     = Math.round(e.opens * (0.4 + rnd(s + 2) * 0.25));
    e.unsub      = Math.round(e.mailers * (0.014 + rnd(s + 3) * 0.006));
    e.dials      = Math.round(e.registrations * (0.4 + rnd(s + 4) * 0.5));
    e.leads      = Math.round(e.registrations * (0.5 + rnd(s + 5) * 0.7));
    e.whatsapp   = Math.round(e.visitors * (0.4 + rnd(s + 6) * 0.3));
    e.sms        = Math.round(e.visitors * (0.2 + rnd(s + 7) * 0.3));
    e.attendees  = e.status === 'completed' ? Math.round(e.registrations * 0.62) : 0;
    e.shortlist  = Math.round(e.registrations * (0.12 + rnd(s + 8) * 0.1));

  function eventById(id){

  /* ============================================================
     FORMATTERS
     ============================================================ */
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function compact(n){
    if (n == null) return '—';
    if (n >= 10000000) return (n / 10000000).toFixed(2).replace(/\.00$/,'') + ' Cr';
    if (n >= 100000)   return (n / 100000).toFixed(2).replace(/\.00$/,'') + ' Lacs';
    if (n >= 1000)     return (n / 1000).toFixed(2).replace(/\.00$/,'') + ' K';
    return String(n);
  }
  function comma(n){
    if (n == null) return '—';
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function fmtDT(iso){
    if (!iso) return 'Date to be announced';
    var d = new Date(iso);
    if (isNaN(d)) return 'Date to be announced';
    var hh = d.getHours(), mm = d.getMinutes();
    var ap = hh >= 12 ? 'PM' : 'AM', h12 = hh % 12 || 12;
    return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() +
           ' (' + (h12 < 10 ? '0' : '') + h12 + ':' + (mm < 10 ? '0' : '') + mm + ' ' + ap + ')';
  }
  function fmtDate(iso){
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
  }
  function money(n){
    if (n == null) return '—';
    return '₹ ' + comma(n);
  }

  function toast(msg){
    var host = $('toast-host');
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = svg(IC.check, 15) + '<span>' + esc(msg) + '</span>';
    host.appendChild(el);
    setTimeout(function(){
      el.style.transition = 'opacity .25s, transform .25s';
      el.style.opacity = '0'; el.style.transform = 'translateY(8px)';
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 260);
    }, 2600);
  }

  /* ============================================================
     PERSISTED PROTOTYPE STATE
     ============================================================ */
  var KEY = 'revamp-edit-event-' + EV.id;

    sections: null, nav: null, checklist: null, published: false, theme: 'ET Red'
  };

    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); for (var k in p) if (p.hasOwnProperty(k)) S[k] = p[k]; }
  } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

  /* ============================================================
     NAVIGATION MODEL
     ============================================================ */
  var NAV = [
    { id:'dashboard', label:'Dashboard', icon:IC.grid },
    { id:'setup', label:'Event Setup', icon:IC.sliders, kids:[
        { id:'setup-basics',   label:'Basic details' },

        { id:'reg',       label:'Registrations' },
        { id:'attendees', label:'Attendees' },
        { id:'shortlist', label:'Shortlisted users' },
        { id:'visitors',  label:'Unique visitors' }
    ]},
    { id:'payment', label:'Payment', icon:IC.card, kids:[
        { id:'pay-pages',   label:'Payment pages' },

    { sep:true },

    { id:'media', label:'Media Center', icon:IC.image },
    { id:'seo', label:'SEO', icon:IC.search },
    { id:'history', label:'Event History', icon:IC.clock }
  ];

  /* view id -> [section label, page label] for the breadcrumb */
  var CRUMB = {};
  NAV.forEach(function(g){
    if (g.sep) return;
    if (g.kids) g.kids.forEach(function(k){ CRUMB[k.id] = [g.label, k.label]; });

  var openGroups = {};
  var currentView = 'dashboard';

  function parentOf(vid){
    for (var i = 0; i < NAV.length; i++){
      var g = NAV[i];
      if (g.sep || !g.kids) continue;

    return null;
  }

  function renderNav(){
    var host = $('nav');
    host.innerHTML = NAV.map(function(g){
      if (g.sep) return '<div class="nav-sep"></div>';
      var isParent = !!g.kids;
      var pid = parentOf(currentView);
      var active = isParent ? (pid === g.id) : (currentView === g.id);
      var open = isParent && (openGroups[g.id] || pid === g.id);
      var h = '<button class="nav-item' + (active && !isParent ? ' active' : '') +
                (active && isParent ? ' active' : '') + (open ? ' open' : '') +
                '" type="button" data-nav="' + g.id + '" title="' + esc(g.label) + '">' +
          '<span class="nav-ico">' + svg(g.icon, 17) + '</span>' +
          '<span class="nav-label">' + esc(g.label) + '</span>' +
          (isParent ? '<span class="nav-caret">' + svg(IC.caret, 13) + '</span>' : '') +
        '</button>';
      if (isParent && open){
        h += '<div class="subnav">' + g.kids.map(function(k){
          return '<button class="sub-item' + (currentView === k.id ? ' active' : '') +
                 '" type="button" data-nav="' + k.id + '">' + esc(k.label) + '</button>';
        }).join('') + '</div>';
      }
      return h;
    }).join('');

    host.querySelectorAll('[data-nav]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-nav');
        var grp = null;
        for (var i = 0; i < NAV.length; i++) if (NAV[i].id === id && NAV[i].kids) grp = NAV[i];
        if (grp){
          /* a parent with children toggles open, and lands on its first child */
          if (openGroups[id] && parentOf(currentView) === id){
            openGroups[id] = false; renderNav(); return;
          }
          openGroups[id] = true;
          go(grp.kids[0].id);
          return;
        }
        go(id);
      });
    });
  }

  function go(vid){
    currentView = vid;
    var p = parentOf(vid);
    if (p) openGroups[p] = true;
    if (location.hash.slice(1) !== vid) location.hash = vid;
    renderNav();
    render();
    document.querySelector('.main').scrollIntoView({ block:'start' });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function statTile(ico, label, value, delta, viewLink){

        ' class="stat' + (viewLink ? ' clickable' : '') + '">' +
        '<span class="st-top"><span class="st-ico">' + svg(ico, 15) + '</span>' +
        '<span class="st-lb">' + esc(label) + '</span></span>' +
        '<span class="st-v">' + esc(value) + '</span>' + d +
      '</' + (viewLink ? 'button' : 'div') + '>';
  }

  /* ============================================================

  var tState = { q:'', page:1, per:25, sort:'name', dir:1, sel:{} };

  function peopleFor(kind){
    if (kind === 'attendees') return PEOPLE.filter(function(p){ return p.attended; });
    if (kind === 'shortlist') return PEOPLE.slice(0, EV.shortlist);
    if (kind === 'visitors')  return PEOPLE;
    return PEOPLE;
  }

  function viewPeople(kind){
    var titleMap = {
      reg:       ['Registrations', 'Everyone who filled the registration form for this event.'],
      attendees: ['Attendees', 'Registrations that were actually checked in on the day.'],
      shortlist: ['Shortlisted users', 'People your team flagged for follow-up or VIP handling.'],
      visitors:  ['Unique visitors', 'Distinct people who opened the microsite, registered or not.']
    };
    var t = titleMap[kind] || titleMap.reg;
    var all = peopleFor(kind);

    var q = tState.q.toLowerCase();
    var rows = all.filter(function(p){
      if (!q) return true;
      return (p.name + ' ' + p.email + ' ' + p.comp + ' ' + p.desig + ' ' + p.city).toLowerCase().indexOf(q) >= 0;
    });
    rows.sort(function(a, b){
      var A = a[tState.sort], B = b[tState.sort];
      return (A > B ? 1 : A < B ? -1 : 0) * tState.dir;
    });

    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / tState.per));
    if (tState.page > pages) tState.page = pages;
    var from = (tState.page - 1) * tState.per;
    var page = rows.slice(from, from + tState.per);
    var selN = Object.keys(tState.sel).filter(function(k){ return tState.sel[k]; }).length;

    function th(key, label){
      var on = tState.sort === key;
      return '<th class="sortable' + (on ? ' sorted' : '') + '" data-sort="' + key + '">' + esc(label) +
        '<span class="arr">' + (on ? (tState.dir > 0 ? '↑' : '↓') : '↕') + '</span></th>';
    }

    var body = page.map(function(p){
      return '<tr>' +
        '<td style="width:34px"><input type="checkbox" data-sel="' + p.id + '"' + (tState.sel[p.id] ? ' checked' : '') + '></td>' +
        '<td><span class="person"><span class="avat" style="background:' + p.colour + '">' + esc(p.initials) + '</span>' +
          '<span class="pn"><b>' + esc(p.name) + '</b><span>' + esc(p.email) + '</span></span></span></td>' +
        '<td>' + esc(p.desig) + '</td>' +
        '<td>' + esc(p.comp) + '</td>' +
        '<td>' + esc(p.city) + '</td>' +
        '<td><span class="badge b-mute">' + esc(p.src) + '</span></td>' +
        '<td class="num">' + fmtDate(p.when) + '</td>' +
        (kind === 'reg' ? '<td>' + (p.paid ? '<span class="badge b-ok">Paid</span>' : '<span class="badge b-mute">Free</span>') + '</td>' : '') +
        '</tr>';
    }).join('');

    if (!page.length){
      body = '<tr><td colspan="9">' + emptyState(IC.search, 'Nothing matches that search',
        'Try a different name, company or city — or clear the search to see all ' + comma(all.length) + ' records.') + '</td></tr>';
    }

    var pagerBtns = '';
    var show = [];
    for (var i = 1; i <= pages; i++){
      if (i === 1 || i === pages || Math.abs(i - tState.page) <= 1) show.push(i);
      else if (show[show.length - 1] !== '…') show.push('…');
    }
    pagerBtns = show.map(function(n){
      if (n === '…') return '<span style="color:var(--text-faint);padding:0 3px">…</span>';
      return '<button class="pg-btn" type="button" data-page="' + n + '"' +
        (n === tState.page ? ' aria-current="true"' : '') + '>' + n + '</button>';
    }).join('');

    var tabs = '<div class="tabs">' +
      [['reg','Registrations',EV.registrations],['attendees','Attendees',PEOPLE.filter(function(p){return p.attended;}).length],
       ['shortlist','Shortlisted',EV.shortlist],['visitors','Unique visitors',PEOPLE.length]].map(function(x){
        return '<button type="button" data-goto="' + x[0] + '" aria-pressed="' + (kind === x[0]) + '">' +
          esc(x[1]) + ' (' + comma(x[2]) + ')</button>';
      }).join('') + '</div>';

    var toolbar =
      '<div class="toolbar">' +
        '<span class="search">' + svg(IC.search, 15) +
          '<input id="tbl-q" placeholder="Search name, email, company, designation…" value="' + esc(tState.q) + '"></span>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-save="Filters panel opened">Filters</button>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-save="Report queued">' + svg(IC.down, 13) + ' Export</button>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-save="Column picker opened">Columns</button>' +
      '</div>';

    var bulk = selN
      ? '<div class="bulk"><b>' + selN + ' selected</b>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-save="Mailer queued for ' + selN + '">' + svg(IC.mail, 13) + ' Email</button>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-save="WhatsApp queued for ' + selN + '">' + svg(IC.wa, 13) + ' WhatsApp</button>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-save="Shortlisted ' + selN + '">Shortlist</button>' +
          '<button class="btn btn-ghost btn-sm" type="button" id="clear-sel">Clear</button>' +
        '</div>'
      : '';

    return vhead(t[0], t[1]) +
      '<div style="margin-bottom:16px">' + tabs + '</div>' +
      '<div class="panel">' + toolbar + bulk +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th style="width:34px"><input type="checkbox" id="sel-all"></th>' +
          th('name','Name') + th('desig','Designation') + th('comp','Company') +
          th('city','Location') + th('src','Source') + th('when','Registered') +
          (kind === 'reg' ? th('paid','Payment') : '') +
        '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        '<div class="pager"><span class="cnt">Showing ' + (total ? from + 1 : 0) + ' to ' +
          Math.min(from + tState.per, total) + ' of ' + comma(total) + ' entries</span>' +
          '<button class="pg-btn" type="button" data-page="' + (tState.page - 1) + '"' + (tState.page <= 1 ? ' disabled' : '') + '>‹</button>' +
          pagerBtns +
          '<button class="pg-btn" type="button" data-page="' + (tState.page + 1) + '"' + (tState.page >= pages ? ' disabled' : '') + '>›</button>' +
        '</div>' +
      '</div>';
  }

  function wirePeople(){
    var q = $('tbl-q');
    if (q){
      q.oninput = function(){ tState.q = q.value; tState.page = 1; render();
        var n = $('tbl-q'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
    }
    document.querySelectorAll('[data-sort]').forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-sort');
        if (tState.sort === k) tState.dir = -tState.dir; else { tState.sort = k; tState.dir = 1; }
        render();
      });
    });
    document.querySelectorAll('[data-page]').forEach(function(b){
      b.addEventListener('click', function(){
        var n = parseInt(b.getAttribute('data-page'), 10);
        if (!isNaN(n) && n > 0){ tState.page = n; render(); }
      });
    });
    document.querySelectorAll('[data-sel]').forEach(function(cb){
      cb.addEventListener('change', function(){
        tState.sel[cb.getAttribute('data-sel')] = cb.checked; render();
      });
    });
    var all = $('sel-all');
    if (all) all.onchange = function(){
      document.querySelectorAll('[data-sel]').forEach(function(cb){
        tState.sel[cb.getAttribute('data-sel')] = all.checked;
      });
      render();
    };
    var clr = $('clear-sel');
    if (clr) clr.onclick = function(){ tState.sel = {}; render(); };
  }

  };

  function render(){
    var fn = VIEWS[currentView] || VIEWS.dashboard;
    $('view').innerHTML = fn();

    /* generic wiring available on every view */
    document.querySelectorAll('[data-goto]').forEach(function(b){
      b.addEventListener('click', function(){ go(b.getAttribute('data-goto')); });
    });
    document.querySelectorAll('[data-save]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        toast(b.getAttribute('data-save'));
      });
    });

    /* per-view wiring */
    if (currentView === 'dashboard') wireDashboard();
    if (currentView === 'setup-sections') wireSections();
    if (currentView === 'design-theme') wireTheme();
    if (currentView === 'reminders' || currentView === 'set-form' || currentView === 'set-adv') wireReminders();
    if (currentView === 'set-nav') wireSetNav();
    if (['reg','attendees','shortlist','visitors'].indexOf(currentView) >= 0) wirePeople();

    var p2 = $('btn-preview-2');
    if (p2) p2.onclick = openPreview;
  }

  /* ============================================================
     PREVIEW + PUBLISH
     ============================================================ */
  function openPreview(){
    var host = $('modal-host');
    host.innerHTML =
      '<div class="modal-bg" id="mbg"><div class="modal" style="width:min(1000px,100%)">' +
        '<div class="modal-head">' +
          '<h3>Preview — ' + esc(EV.name) + '</h3>' +
          '<div class="tabs" id="pv-tabs">' +
            '<button type="button" data-pv="desktop" aria-pressed="true">Desktop</button>' +
            '<button type="button" data-pv="mobile" aria-pressed="false">Mobile</button>' +
          '</div>' +
          '<button class="btn btn-ghost btn-icon" type="button" id="mclose">' +
            svg('<path d="M18 6L6 18M6 6l12 12"/>', 17) + '</button>' +
        '</div>' +
        '<div class="modal-body" style="background:var(--surface-2)">' +
          '<div id="pv-frame" style="margin:0 auto;max-width:100%;transition:max-width .2s">' +
            '<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden">' +
              '<div style="background:var(--accent);color:#fff;padding:28px 22px;text-align:center">' +
                '<div style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85">' +
                  esc(PORTALS[EV.portal] || '') + ' presents</div>' +
                '<div style="font-family:var(--font-display);font-size:26px;font-weight:700;margin:6px 0 4px">' + esc(EV.name) + '</div>' +
                '<div style="font-size:12.5px;opacity:.9">' + esc(fmtDT(EV.start)) + ' · ' + esc(EV.venue) + '</div>' +
                '<div style="margin-top:14px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">' +
                  '<span style="background:#fff;color:var(--accent-strong);padding:8px 18px;border-radius:8px;font-size:12.5px;font-weight:800">Register now</span>' +
                  '<span style="border:1.5px solid #fff;padding:8px 18px;border-radius:8px;font-size:12.5px;font-weight:800">Become a partner</span>' +
                '</div>' +
              '</div>' +
              '<div style="padding:18px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;border-bottom:1px solid var(--border)">' +
                [['Delegates', comma(EV.registrations)], ['Speakers', String(SPEAKERS.length)], ['Sessions','7'], ['Partners','10']].map(function(s){
                  return '<div><div style="font-family:var(--font-display);font-size:19px;font-weight:700">' + esc(s[1]) + '</div>' +
                    '<div style="font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700">' + esc(s[0]) + '</div></div>';
                }).join('') +
              '</div>' +
              '<div style="padding:20px">' +
                '<div class="eyebrow" style="margin-bottom:7px">About the event</div>' +
                '<p style="font-size:13px;color:var(--text-muted);margin:0 0 16px;line-height:1.6">India’s decision-makers gather to set the agenda for the year ahead. Two days of keynotes, closed-door roundtables and the conversations that do not happen anywhere else.</p>' +
                '<div class="eyebrow" style="margin-bottom:9px">Speakers</div>' +
                '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">' +
                  SPEAKERS.slice(0,3).map(function(s, i){
                    return '<div style="border:1px solid var(--border);border-radius:10px;padding:11px;text-align:center">' +
                      '<div class="avat" style="background:' + AV[i] + ';width:40px;height:40px;margin:0 auto 7px;font-size:14px">' +
                        esc(s[0].split(' ')[0][0] + s[0].split(' ')[1][0]) + '</div>' +
                      '<div style="font-size:12.5px;font-weight:700">' + esc(s[0]) + '</div>' +
                      '<div style="font-size:10.5px;color:var(--text-muted)">' + esc(s[2]) + '</div></div>';
                  }).join('') +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="modal-foot">' +
          '<span style="flex:1;font-size:12px;color:var(--text-muted);align-self:center">This is a rendering of the current draft. Publish to make it live.</span>' +
          '<a class="btn btn-secondary" href="custom_editor.html?event=' + EV.id + '">' + svg(IC.brush, 14) + ' Edit in editor</a>' +
          '<button class="btn btn-primary" type="button" id="pv-publish">Publish</button>' +
        '</div>' +
      '</div></div>';

    function close(){ host.innerHTML = ''; }
    $('mclose').onclick = close;
    $('mbg').addEventListener('click', function(e){ if (e.target.id === 'mbg') close(); });
    $('pv-publish').onclick = function(){ close(); doPublish(); };
    host.querySelectorAll('[data-pv]').forEach(function(b){
      b.addEventListener('click', function(){
        host.querySelectorAll('[data-pv]').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
        $('pv-frame').style.maxWidth = b.getAttribute('data-pv') === 'mobile' ? '380px' : '100%';
      });
    });
  }

  function doPublish(){
    S.published = true; save();
    toast('Published. The microsite is live at etoneworld.com');
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function boot(){
    $('ev-name').textContent = EV.name + ' | ' + (PORTALS[EV.portal] || '');
    $('ev-meta').textContent = fmtDT(EV.start) + '  |  ' + EV.eventNo + '  |  ' + (TYPES[EV.type] || EV.type);
    document.title = 'Edit — ' + EV.name + ' — Revamp CMS';

    $('side-toggle').onclick = function(){ $('sidebar').classList.toggle('collapsed'); };
    $('btn-preview').onclick = openPreview;
    $('btn-publish').onclick = doPublish;

    window.addEventListener('hashchange', function(){
      var h = location.hash.slice(1);
      if (h && VIEWS[h] && h !== currentView){ currentView = h; var p = parentOf(h); if (p) openGroups[p] = true; renderNav(); render(); }
    });

    var h0 = location.hash.slice(1);
    currentView = (h0 && VIEWS[h0]) ? h0 : 'dashboard';
    var p0 = parentOf(currentView);
    if (p0) openGroups[p0] = true;

    renderNav();
    render();
  }

  boot();
})();
</script>
