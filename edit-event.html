  /* ---------------- page wiring ---------------- */
  function wireSpeakers(){
    var G = GROUPED.speakers;
    var add = $('spk-add');
    if (add) add.onclick = function(){ spkDialog(null); };

    var addg = $('spk-addgroup');
    if (addg) addg.onclick = function(){ addGroupDialog(G); };

    document.querySelectorAll('[data-gadd]').forEach(function(b){
      b.onclick = function(){ spkDialog(null, b.getAttribute('data-gadd')); };
    });
    document.querySelectorAll('[data-edit]').forEach(function(b){
      b.onclick = function(){ spkDialog(b.getAttribute('data-edit')); };
    });

    wireGroupNames(G);

    document.querySelectorAll('[data-weight]').forEach(function(b){
      b.onclick = function(){
        var p = spkById(b.getAttribute('data-weight'));
        if (!p) return;
        pillMenu(b, {
          label: 'Weight', options: WEIGHTS, current: weightId(p.weight), foot: WEIGHT_FOOT.speakers,
          pick: function(w){
            p.weight = w;
            spkCommit();
            subWrite('speakers', updateSub('speakers', p.id, { weight: w }),
              p.name + ' is now ' + wLabel(w).toLowerCase(), 'The new weight was not saved.');
          }
        });
      };
    });
    document.querySelectorAll('[data-spkst]').forEach(function(b){
      b.onclick = function(){
        var p = spkById(b.getAttribute('data-spkst'));
        if (!p) return;
        pillMenu(b, {
          label: 'Status', options: STATUSES, current: stMeta(p.status).id,
          pick: function(st){
            p.status = st;
            spkCommit();
            subWrite('speakers', updateSub('speakers', p.id, { status: st }),
              p.name + ' is now ' + stMeta(st).label.toLowerCase(), 'The new status was not saved.');
          }
        });
      };
    });

    document.querySelectorAll('[data-up]').forEach(function(b){
      b.onclick = function(){ spkMove(b.getAttribute('data-up'), -1); };
    });
    document.querySelectorAll('[data-down]').forEach(function(b){
      b.onclick = function(){ spkMove(b.getAttribute('data-down'), 1); };
    });

    document.querySelectorAll('[data-gup]').forEach(function(b){
      b.onclick = function(){ grpMove(b.getAttribute('data-gup'), -1); };
    });
    document.querySelectorAll('[data-gdown]').forEach(function(b){
      b.onclick = function(){ grpMove(b.getAttribute('data-gdown'), 1); };
    });
    document.querySelectorAll('[data-gsort]').forEach(function(b){
      b.onclick = function(){
        var gid = b.getAttribute('data-gsort');
        var rank = {}; WEIGHTS.forEach(function(w, i){ rank[w.id] = i; });
        /* keynote is rank 0, so "no rank" has to be told apart from it */
        function rk(w){ return Object.prototype.hasOwnProperty.call(rank, w) ? rank[w] : 9; }
        var rest = spkAll().filter(function(p){ return p.gid !== gid; });
        var was = spkIn(gid);
        var mine = was.slice().sort(function(a, c){
          return (rk(a.weight) - rk(c.weight)) || (was.indexOf(a) - was.indexOf(c));
        });
        S.speakers = spkSplice(rest, mine, gid);
        spkCommit();
        persistSpeakerOrder(null, 'Ordered by weight');
      };
    });
    document.querySelectorAll('[data-gdel]').forEach(function(b){
      b.onclick = function(){ deleteGroupDialog(G, b.getAttribute('data-gdel')); };
    });

    spkDragDrop();
  }

  /* put a group's people back in the flat list at that group's position */
  function spkSplice(rest, mine, gid){
    var out = [], done = false;
    spkAll().forEach(function(p){
      if (p.gid === gid){ if (!done){ out = out.concat(mine); done = true; } return; }
      out.push(p);
    });
    if (!done) out = out.concat(mine);
    return out;
  }

  function spkMove(id, dir){
    var p = spkById(id);
    if (!p) return;
    var mine = spkIn(p.gid);
    var i = mine.map(function(x){ return x.id; }).indexOf(id);
    var j = i + dir;
    if (j < 0 || j >= mine.length) return;
    mine.splice(j, 0, mine.splice(i, 1)[0]);
    S.speakers = spkSplice(spkAll().filter(function(x){ return x.gid !== p.gid; }), mine, p.gid);
    spkCommit();
    persistSpeakerOrder();
  }

  function grpMove(gid, dir){
    var gs = spkGroups();
    var i = gs.map(function(g){ return g.id; }).indexOf(gid);
    var j = i + dir;
    if (j < 0 || j >= gs.length) return;
    gs.splice(j, 0, gs.splice(i, 1)[0]);
    spkCommit();
    persistGroupOrder();
  }

  /* drag a row anywhere — including into another group */
  function spkDragDrop(){
    var dragId = null;
    document.querySelectorAll('.spk-row').forEach(function(row){
      row.addEventListener('dragstart', function(e){
        dragId = row.getAttribute('data-sid');
        row.classList.add('drag');
        try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
      });
      row.addEventListener('dragend', function(){
        dragId = null;
        document.querySelectorAll('.spk-row').forEach(function(r){
          r.classList.remove('drag', 'over-top', 'over-bot');
        });
      });
      row.addEventListener('dragover', function(e){
        if (!dragId || row.getAttribute('data-sid') === dragId) return;
        e.preventDefault();
        var r = row.getBoundingClientRect();
        var after = (e.clientY - r.top) > r.height / 2;
        row.classList.toggle('over-bot', after);
        row.classList.toggle('over-top', !after);
      });
      row.addEventListener('dragleave', function(){ row.classList.remove('over-top', 'over-bot'); });
      row.addEventListener('drop', function(e){
        if (!dragId || row.getAttribute('data-sid') === dragId) return;
        e.preventDefault();
        var r = row.getBoundingClientRect();
        var after = (e.clientY - r.top) > r.height / 2;
        spkDropAt(dragId, row.getAttribute('data-sid'), after);
      });
    });

    /* dropping on a group's card (not on a row) moves the speaker to the end of that group */
    document.querySelectorAll('[data-grp]').forEach(function(g){
      g.addEventListener('dragover', function(e){ if (dragId) e.preventDefault(); });
      g.addEventListener('drop', function(e){
        if (!dragId) return;
        if (e.target.closest && e.target.closest('.spk-row')) return;
        e.preventDefault();
        var p = spkById(dragId), gid = g.getAttribute('data-grp');
        if (!p || p.gid === gid) return;
        regroup(GROUPED.speakers, [p], gid);
        spkCommit();
        persistSpeakerOrder([updateSub('speakers', p.id, { groupId: gid })]);
      });
    });
  }

  function spkDropAt(id, targetId, after){
    var p = spkById(id), t = spkById(targetId);
    if (!p || !t) return;
    /* a speaker can be dragged out of "Not in a group", never into it */
    if (!t.gid && p.gid) return;
    var gidChanged = p.gid !== t.gid;
    p.gid = t.gid;
    var list = spkAll().slice();
    list.splice(list.indexOf(p), 1);
    var at = list.indexOf(t) + (after ? 1 : 0);
    list.splice(at, 0, p);
    S.speakers = list;
    spkCommit();
    persistSpeakerOrder(gidChanged ? [updateSub('speakers', p.id, { groupId: p.gid })] : null);
  }

  /* ---------------- a small confirm, so nothing destructive is one click ----------------
     The record leaves the page only once the server has removed it: `work` returns that removal
     (see removeRecord), the dialog waits for it, and a failure is shown in the dialog, which
     stays open so the user can try again.
     msgHtml   markup — the caller escapes what it puts in
     done()    after the dialog has closed */
  function confirmDialog(title, msgHtml, okLabel, tab, work, failText, done){
    var m = openModal(
      '<div class="modal-head"><h3>' + esc(title) + '</h3></div>' +
      '<div class="modal-body"><div class="confirm-msg">' + msgHtml + '</div></div>' +
      '<div class="modal-foot">' +
        '<span class="modal-err" id="c-err" role="alert"></span>' +
        '<button class="btn btn-secondary" type="button" id="cno" data-close>Cancel</button>' +
        '<button class="btn btn-danger" type="button" id="cyes">' + esc(okLabel) + '</button>' +
      '</div>',
      /* focus starts on Cancel, so a stray Enter never destroys anything */
      { style: 'width:min(440px,100%)', initialFocus: '#cno' });
    $('cyes').onclick = function(){
      $('c-err').textContent = '';
      m.busy(true, $('cyes'), okLabel.indexOf('Delete') === 0 ? 'Deleting…' : 'Removing…');
      subTrack(tab, work()).then(function(){
        m.close();
        done();
      }, function(err){
        console.error(failText, err);
        m.busy(false, $('cyes'));
        $('c-err').textContent = failText + ' ' + errText(err);
      });
    };
  }

  /* ============================================================
     THE ADD / EDIT DIALOG

     One dialog does both jobs. In add mode it holds a queue, so a
     whole panel goes in on one save instead of six round trips.
     ============================================================ */
  function spkDialog(editId, defaultGid){
    var G = GROUPED.speakers;
    var editing = !!editId;
    var gid = defaultGid || (spkGroups()[0] || {}).id || '';

    /* key: what the dialog knows an entry by; it has no id until the server stores it.
       newGroup: the name of a group to create on save (an event's first speakers need one). */
    function blank(){
      return {
        key: draftKey(), gid: gid, newGroup: spkGroups().length ? null : 'Speakers',
        name:'', desig:'', comp:'', photo:null, logo:null,
        colour: AV[Math.floor(Math.random() * AV.length)],
        weight:'featured', status:'confirmed', email:'', phone:'', li:'', bio:'',
        img:null, tx:0, ty:0, zoom:1
      };
    }

    var Q, qi = 0;
    if (editing){
      var src = spkById(editId);
      if (!src) return;
      Q = [JSON.parse(JSON.stringify(src))];
      Q[0].key = src.id; Q[0].newGroup = null;
      Q[0].img = null; Q[0].tx = 0; Q[0].ty = 0; Q[0].zoom = 1;
    } else {
      Q = [blank()];
    }

    /* what closing would throw away: the queue as it stood once the form was first painted */
    var pristine = '';
    function isDirty(){ readForm(); return JSON.stringify(Q) !== pristine; }
    /* whether "Additional information" is open, per queue entry, so a repaint keeps it as it was */
    var accOpen = {};

    var modal = openModal(
        '<div class="modal-head">' +
          '<h3>' + (editing ? 'Edit speaker' : 'Add speakers') + '</h3>' +
          '<span class="sub" style="font-size:12px;color:var(--text-muted)">' +
            (editing ? 'Changes apply when you save.'
                     : 'Add as many as you like, then save the whole set in one go.') + '</span>' +
          closeBtn() +
        '</div>' +
        '<form class="modal-form" novalidate>' +
        '<div class="sp-wrap' + (editing ? ' solo' : '') + '">' +
          (editing ? '' :
            '<div class="sp-queue">' +
              '<div class="qh">Adding <span id="q-n"></span></div>' +
              '<div class="qlist" id="q-list"></div>' +
              '<div class="qfoot"><button class="btn btn-secondary btn-sm" type="button" id="q-add" ' +
                'style="width:100%">' + svg(IC.plus, 13) + ' Add another</button></div>' +
            '</div>') +
          '<div class="sp-form" id="sp-form"></div>' +
        '</div>' +
        '<div class="modal-foot">' +
          (editing ? '<button class="btn btn-danger" type="button" id="sdel">Remove speaker</button>' : '') +
          '<span class="modal-err" id="sp-err" role="alert"></span>' +
          '<button class="btn btn-secondary" type="button" id="scancel" data-close>Cancel</button>' +
          '<button class="btn btn-primary" type="submit" id="ssave"></button>' +
        '</div>' +
        '</form>',
      { cls: 'wide', isDirty: isDirty, onSubmit: saveAll });

    if (editing) $('sdel').onclick = function(){
      removeInDialog(modal, {
        btn: 'sdel', errEl: 'sp-err', tab: 'speakers',
        question: 'Remove ' + src.name + ' from the line-up? ' + (isConfirmed(src) ? 'They will no longer appear on your site. ' : '') + 'This cannot be undone.',
        work: function(){ return removeRecord('speakers', 'speakers', editId); },
        failed: src.name + ' was not removed.',
        done: function(){
          notify(src.name + ' removed');
          renumberGrouped(G);
          agDropSpeakers([editId]);
        }
      });
    };

    /* ---- queue ---- */
    function paintQueue(){
      if (editing) return;
      $('q-n').textContent = Q.length + (Q.length === 1 ? ' speaker' : ' speakers');
      $('q-list').innerHTML = Q.map(function(e, i){
        var ph = imgTag(e.photo) ? '<span class="qph">' + imgTag(e.photo) + '</span>'
                         : '<span class="qph" style="background:' + safeColour(e.colour) + ';color:#fff">' +
                           esc(e.name ? initials(e.name) : '') + '</span>';
        return '<button class="qi' + (e.err ? ' failed' : '') + '" type="button" data-q="' + i + '" aria-current="' + (i === qi) + '"' +
            (e.err ? ' title="Not saved yet"' : '') + '>' +
            ph + '<span class="qn">' + (e.name ? esc(e.name) : '<em>Speaker ' + (i + 1) + '</em>') + '</span>' +
            (Q.length > 1 ? '<span class="qx" data-qx="' + i + '" role="button" aria-label="Remove">' +
              svg('<path d="M18 6L6 18M6 6l12 12"/>', 13) + '</span>' : '') +
          '</button>';
      }).join('');

      $('q-list').querySelectorAll('[data-q]').forEach(function(b){
        b.onclick = function(e){
          if (e.target.closest('[data-qx]')) return;
          readForm(); qi = +b.getAttribute('data-q'); paintForm(); paintQueue();
        };
      });
      $('q-list').querySelectorAll('[data-qx]').forEach(function(x){
        x.onclick = function(e){
          e.stopPropagation();
          var i = +x.getAttribute('data-qx');
          readForm();
          Q.splice(i, 1);
          if (qi >= Q.length) qi = Q.length - 1;
          paintForm(); paintQueue(); paintSave();
        };
      });
    }
    function paintSave(){
      $('ssave').textContent = editing ? 'Save changes'
        : (Q.length === 1 ? 'Add speaker' : 'Add all ' + Q.length + ' speakers');
    }

    /* ---- form ---- */
    function field(id, label, val, ph, req, type){
      return '<div class="field c6"><div class="flabel-row"><label for="' + id + '">' + label +
        (req ? ' <span class="pill-req">Required</span>' : '') + '</label></div>' +
        '<input class="inp" id="' + id + '"' + (type ? ' type="' + type + '"' : '') +
          ' value="' + esc(val || '') + '" placeholder="' + esc(ph) + '"></div>';
    }

    function paintForm(){
      var e = Q[qi];
      var open = accOpen[e.key] != null ? accOpen[e.key] : !!(e.email || e.phone || e.li || e.bio);
      $('sp-form').innerHTML =
        '<div class="ph-grid">' +
          '<div id="sp-phbox"></div>' +
          '<div class="ph-help">' +
            '<b>Photo</b>Speaker photos are stored square. Drop any picture in and ' +
            'move it inside the frame until the face sits where you want it — what you see in the ' +
            'frame is the photo that is saved.' +
            '<div class="logo-box">' +
              '<span class="lprev" id="sp-lprev">' +
                (imgTag(e.logo) || svg(IC.image, 16)) + '</span>' +
              '<span class="lt">Company logo <span style="color:var(--text-faint)">— optional, any shape</span></span>' +
              '<button class="btn btn-secondary btn-sm" type="button" id="sp-logobtn">' +
                (e.logo ? 'Replace' : 'Upload') + '</button>' +
              (e.logo ? '<button class="btn btn-ghost btn-icon" type="button" id="sp-logodel" ' +
                'title="Remove logo">' + svg(IC.trash, 14) + '</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="frow" style="margin-top:18px">' +
          field('sp-name', 'Full name', e.name, 'e.g. Rajesh Uppal', true) +
          field('sp-desig', 'Designation', e.desig, 'e.g. Chief Information Officer') +
          field('sp-comp', 'Company', e.comp, 'e.g. Maruti Suzuki') +

          '<div class="field c6"><label for="' + groupPickId(e, 'sp-gid') + '">Group</label>' +
            groupPickHTML(G, e, 'sp-gid', true) +
            (e.newGroup == null ? '<p class="hint">' + esc(G.groupHint) + '</p>' : '') + '</div>' +

          '<div class="field c6"><label for="sp-weight">Weight</label>' +
            '<select class="inp" id="sp-weight">' + WEIGHTS.map(function(w){
              return '<option value="' + esc(w.id) + '"' + (w.id === e.weight ? ' selected' : '') + '>' +
                esc(w.label) + '</option>';
            }).join('') + '</select>' +
            '<p class="hint" id="sp-wnote"></p></div>' +

          '<div class="field c6"><label for="sp-status">Status</label>' +
            '<select class="inp" id="sp-status">' + STATUSES.map(function(s){
              return '<option value="' + esc(s.id) + '"' + (s.id === e.status ? ' selected' : '') + '>' +
                esc(s.label) + '</option>';
            }).join('') + '</select>' +
            '<p class="hint">Only confirmed speakers are shown on the site.</p></div>' +
        '</div>' +

        '<div class="acc" data-open="' + open + '" id="sp-acc">' +
          '<button class="acc-head" type="button" id="sp-acch" aria-expanded="' + open + '">' + svg(IC.caret, 14) +
            'Additional information' +
            '<span class="ah-sub">Email, mobile, LinkedIn and a short bio — all optional</span></button>' +
          '<div class="acc-body"><div class="frow">' +
            field('sp-email', 'Email', e.email, 'name@company.com', false, 'email') +
            field('sp-phone', 'Mobile', e.phone, '+91 98200 00000', false, 'tel') +
            field('sp-li', 'LinkedIn profile', e.li, 'linkedin.com/in/username') +
            '<div class="field c12"><label for="sp-bio">Short bio</label>' +
              '<textarea class="inp" id="sp-bio" style="min-height:70px" ' +
                'placeholder="A line or two for the speaker card.">' + esc(e.bio || '') + '</textarea></div>' +
          '</div></div>' +
        '</div>';

      paintPhoto();
      wireForm();
    }

    function wnote(){
      var v = $('sp-weight').value, n = '';
      WEIGHTS.forEach(function(w){ if (w.id === v) n = w.note; });
      $('sp-wnote').textContent = n + '. Weight does not change how a speaker looks on the site.';
    }

    function wireForm(){
      wnote();
      $('sp-weight').onchange = wnote;

      $('sp-acch').onclick = function(){
        var a = $('sp-acc');
        var now = a.getAttribute('data-open') !== 'true';
        a.setAttribute('data-open', String(now));
        this.setAttribute('aria-expanded', String(now));
        accOpen[Q[qi].key] = now;
      };

      wireGroupPick('sp-gid', function(toNew){
        readForm();
        var e = Q[qi];
        e.newGroup = toNew ? '' : null;
        if (!toNew && !e.gid && !editing) e.gid = spkGroups()[0].id;
        paintForm();
        modal.focus('#' + groupPickId(e, 'sp-gid'));
      });

      ['sp-name','sp-desig','sp-comp'].forEach(function(id){
        $(id).addEventListener('input', function(){ readForm(); paintQueue(); });
      });

      /* paintForm() rebuilds every field from the queue entry, so the form is read into it first */
      $('sp-logobtn').onclick = function(){ pickFile(function(file){
        readImage(file, function(img, err){
          if (err){ notifyError(err); return; }
          readForm();
          Q[qi].logo = shrinkLogo(img, 240, 120);
          paintForm();
          modal.focus('#sp-logobtn');
        });
      }); };
      var ld = $('sp-logodel');
      if (ld) ld.onclick = function(){ readForm(); Q[qi].logo = null; paintForm(); modal.focus('#sp-logobtn'); };
    }

    function pickFile(cb){
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = function(){ if (inp.files && inp.files[0]) cb(inp.files[0]); };
      inp.click();
    }

    /* ---- the square cropper ---- */
    var VIEW = 176, OUT = 320;

    function paintPhoto(){
      var e = Q[qi], box = $('sp-phbox');
      if (!e.img && !e.photo){
        box.innerHTML =
          '<div class="drop" id="sp-drop" tabindex="0" role="button">' +
            svg(IC.image, 26) +
            '<b>Add a photo</b><span>Drop a file here, or click to choose</span>' +
          '</div>';
        wireDrop();
        return;
      }
      if (!e.img){
        /* an already-saved photo: show it, offer to replace or start again */
        box.innerHTML =
          '<div class="crop"><div class="crop-view">' +
            imgTag(e.photo, 'style="width:' + VIEW + 'px;height:' + VIEW + 'px"') + '</div>' +
            '<div class="crop-acts">' +
              '<button class="btn btn-secondary btn-sm" type="button" id="sp-replace" style="flex:1">Replace photo</button>' +
              '<button class="btn btn-ghost btn-icon" type="button" id="sp-phdel" title="Remove">' +
                svg(IC.trash, 14) + '</button>' +
            '</div></div>';
        $('sp-replace').onclick = function(){ pickFile(loadPhoto); };
        $('sp-phdel').onclick = function(){ e.photo = null; paintPhoto(); paintQueue(); };
        return;
      }
      box.innerHTML =
        '<div class="crop">' +
          '<div class="crop-view" id="sp-cv">' + imgTag(e.img, 'id="sp-cimg"') + '</div>' +
          '<div class="crop-zoom">' + svg(IC.search, 13) +
            '<input type="range" id="sp-zoom" min="1" max="3" step="0.01" value="' + e.zoom + '">' +
          '</div>' +
          '<div class="crop-acts">' +
            '<button class="btn btn-secondary btn-sm" type="button" id="sp-replace" style="flex:1">Replace</button>' +
            '<button class="btn btn-ghost btn-icon" type="button" id="sp-phdel" title="Remove">' +
              svg(IC.trash, 14) + '</button>' +
          '</div>' +
        '</div>';

      var img = $('sp-cimg'), view = $('sp-cv');
      var nat = { w: e.natW, h: e.natH };

      function apply(){
        var cover = Math.max(VIEW / nat.w, VIEW / nat.h);
        var s = cover * e.zoom;
        var w = nat.w * s, h = nat.h * s;
        e.tx = Math.min(0, Math.max(VIEW - w, e.tx));
        e.ty = Math.min(0, Math.max(VIEW - h, e.ty));
        img.style.width = w + 'px';
        img.style.height = h + 'px';
        img.style.left = e.tx + 'px';
        img.style.top = e.ty + 'px';
      }
      function commitCrop(){
        var probe = new Image();
        probe.onload = function(){
          e.photo = cropToSquare(probe, e.tx, e.ty, e.zoom, VIEW, OUT);
          paintQueue();
        };
        probe.src = e.img;
      }
      apply();

      var down = null;
      view.addEventListener('pointerdown', function(ev){
        down = { x: ev.clientX, y: ev.clientY, tx: e.tx, ty: e.ty };
        view.setPointerCapture(ev.pointerId);
      });
      view.addEventListener('pointermove', function(ev){
        if (!down) return;
        e.tx = down.tx + (ev.clientX - down.x);
        e.ty = down.ty + (ev.clientY - down.y);
        apply();
      });
      view.addEventListener('pointerup', function(){ if (down){ down = null; commitCrop(); } });
      view.addEventListener('pointercancel', function(){ down = null; });

      $('sp-zoom').addEventListener('input', function(){ e.zoom = +this.value; apply(); });
      $('sp-zoom').addEventListener('change', commitCrop);

      $('sp-replace').onclick = function(){ pickFile(loadPhoto); };
      $('sp-phdel').onclick = function(){
        e.img = null; e.photo = null; e.zoom = 1; e.tx = 0; e.ty = 0;
        paintPhoto(); paintQueue();
      };
      commitCrop();
    }

    function loadPhoto(file){
      readImage(file, function(img, err){
        if (err){ notifyError(err); return; }
        var e = Q[qi];
        e.img = img.src; e.natW = img.naturalWidth; e.natH = img.naturalHeight;
        e.zoom = 1;
        /* centre the image in the frame to begin with */
        var cover = Math.max(VIEW / e.natW, VIEW / e.natH);
        e.tx = (VIEW - e.natW * cover) / 2;
        e.ty = (VIEW - e.natH * cover) / 2;
        paintPhoto();
      });
    }

    function wireDrop(){
      var d = $('sp-drop');
      if (!d) return;
      d.onclick = function(){ pickFile(loadPhoto); };
      d.onkeydown = function(ev){ if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); pickFile(loadPhoto); } };
      d.addEventListener('dragover', function(ev){ ev.preventDefault(); d.classList.add('over'); });
      d.addEventListener('dragleave', function(){ d.classList.remove('over'); });
      d.addEventListener('drop', function(ev){
        ev.preventDefault(); d.classList.remove('over');
        if (ev.dataTransfer.files && ev.dataTransfer.files[0]) loadPhoto(ev.dataTransfer.files[0]);
      });
    }

    /* ---- read the form back into the queue entry ---- */
    function readForm(){
      if (!$('sp-name')) return;
      var e = Q[qi];
      e.name = $('sp-name').value.trim();
      e.desig = $('sp-desig').value.trim();
      e.comp = $('sp-comp').value.trim();
      readGroupPick(G, e, 'sp-gid');
      e.weight = $('sp-weight').value;
      e.status = $('sp-status').value;
      e.li = $('sp-li').value.trim();
      e.email = $('sp-email').value.trim();
      e.phone = $('sp-phone').value.trim();
      e.bio = $('sp-bio').value.trim();
    }

    $('q-add') && ($('q-add').onclick = function(){
      readForm();
      Q.push(blank());
      qi = Q.length - 1;
      paintForm(); paintQueue(); paintSave();
    });

    /* what stops this entry from being saved: [[field id, message], …] */
    function problems(e){
      var errs = [], g = groupPickProblem(G, e, 'sp-gid');
      if (!e.name) errs.push(['sp-name', 'Enter the speaker’s name.']);
      if (g) errs.push(g);
      if (e.email && !isEmail(e.email)) errs.push(['sp-email', 'This is not an email address. Check it, or leave it empty.']);
      if (e.li && (cleanWebUrl(e.li) == null || !/(^|\.)linkedin\.com\//i.test(cleanWebUrl(e.li) + '/'))){
        errs.push(['sp-li', 'Paste the link to a LinkedIn profile (linkedin.com/in/…), or leave it empty.']);
      }
      return errs;
    }

    /* the page's record for a queue entry, and what the API stores for it */
    function record(e){
      return {
        gid: e.gid, name: e.name, desig: e.desig, comp: e.comp,
        photo: e.photo || null, logo: e.logo || null, colour: e.colour || AV[0],
        weight: e.weight, status: e.status, email: e.email, phone: e.phone, li: e.li, bio: e.bio
      };
    }
    function body(r){
      return {
        groupId: r.gid, name: r.name, desig: r.desig, comp: r.comp,
        photoUrl: r.photo, logoUrl: r.logo, colour: r.colour,
        weight: r.weight, status: r.status, email: r.email, phone: r.phone, li: r.li, bio: r.bio
      };
    }

    function saveAll(){
      readForm();
      for (var i = 0; i < Q.length; i++){
        var errs = problems(Q[i]);
        if (!errs.length) continue;
        /* the first entry that cannot be saved comes to the front, with its fields marked */
        if (i !== qi){ qi = i; paintForm(); paintQueue(); }
        showFieldErrors(errs);
        if (Q.length > 1) $('sp-err').textContent = 'Speaker ' + (i + 1) + ' needs a correction. Nothing has been saved yet.';
        return;
      }
      saveQueue({
        G: G, Q: Q, modal: modal, editing: editing ? src : null, saveBtn: 'ssave', errEl: 'sp-err',
        record: record, body: body,
        repaint: function(){ if (qi >= Q.length) qi = 0; paintQueue(); paintForm(); paintSave(); }
      });
    }

    paintQueue();
    paintForm();
    paintSave();
    readForm();
    pristine = JSON.stringify(Q);
    modal.focus('#sp-name');
  }

  /* ============================================================
     VIEW : AGENDA

     Same three levers as the line-up — group, order, weight — so
     whoever learned one page already knows this one. A group is a
     day or a stream; a row is a session; the clock runs down the
     left because that is how anyone reads a day.

     Sessions borrow their speakers from the line-up rather than
     retyping names, so a speaker renamed once is renamed everywhere.
     ============================================================ */
  /* the kind sets the tone; quiet kinds are the gaps between the programme */
  var KINDS = [
    { id:'session',    label:'Session' },
    { id:'keynote',    label:'Keynote' },
    { id:'panel',      label:'Panel' },
    { id:'fireside',   label:'Fireside chat' },
    { id:'workshop',   label:'Workshop' },
    { id:'awards',     label:'Awards' },
    { id:'break',      label:'Break',      quiet:true },
    { id:'networking', label:'Networking', quiet:true },
    { id:'lunch',      label:'Lunch',      quiet:true }
  ];
  function kMeta(id){
    for (var i = 0; i < KINDS.length; i++) if (KINDS[i].id === id) return KINDS[i];
    return KINDS[0];
  }

  /* ---------------- time helpers ---------------- */
  function mins(hhmm){
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
    return m ? (+m[1]) * 60 + (+m[2]) : null;
  }
  function durText(a, b){
    var x = mins(a), y = mins(b);
    if (x == null || y == null || y <= x) return '';
    var d = y - x;
    if (d < 60) return d + ' min';
    var h = Math.floor(d / 60), r = d % 60;
    return h + (r ? ' hr ' + r + ' min' : (h === 1 ? ' hour' : ' hours'));
  }
  function addMins(hhmm, n){
    var x = mins(hhmm);
    if (x == null) return '';
    var t = (x + n) % 1440;
    return (t / 60 < 10 ? '0' : '') + Math.floor(t / 60) + ':' + (t % 60 < 10 ? '0' : '') + (t % 60);
  }
  function fmtDay(iso){
    if (!iso) return 'Date not set';
    var d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? 'Date not set' : fmtDate(iso + 'T00:00:00');
  }

  /* ---------------- model ----------------
     Internal shape keeps gid/speakers (as in the UI code below); the backend's
     `sessions` resource names them groupId/speakerIds — mapped at the edges only,
     same as Speakers' gid/groupId. */
  function agAll(){ return S.sessions || []; }
  function agGroups(){ return S.agGroups || []; }
  function agIn(gid){ return agAll().filter(function(s){ return s.gid === gid; }); }
  function agById(id){
    var a = agAll();
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }
  function agSplice(mine, gid){
    var out = [], done = false;
    agAll().forEach(function(s){
      if (s.gid === gid){ if (!done){ out = out.concat(mine); done = true; } return; }
      out.push(s);
    });
    if (!done) out = out.concat(mine);
    return out;
  }
  function agCommit(){ render(); }

  /* Who is on stage for a session: only people still in the line-up. A session can hold the id of
     a speaker who has since been removed (from another browser, say); such an id is never shown,
     never counted and never saved back. */
  function agSpeakers(s){
    return (s.speakers || []).filter(function(id){ return !!spkById(id); });
  }

  /* Once speakers' removal is confirmed, no session may go on naming them. One write per session,
     however many of its speakers went. */
  function agDropSpeakers(ids){
    var writes = [];
    agAll().forEach(function(s){
      var left = (s.speakers || []).filter(function(x){ return ids.indexOf(x) === -1; });
      if (left.length === (s.speakers || []).length) return;
      s.speakers = left;
      writes.push(updateSub('sessions', s.id, { speakerIds: left }));
    });
    return subWrite('agenda', writes, null, 'A removed speaker is still listed on some sessions.');
  }

  function loadAgenda(){
    return Promise.all([
      C.fetchSub('agenda-groups', EV.id),
      C.fetchSub('sessions', EV.id)
    ]).then(function(res){
      S.agGroups = (res[0] || []).slice().sort(byOrder).map(function(g){
        return { id: g.id, name: g.name, date: g.date, order: g.order };
      });
      S.sessions = (res[1] || []).slice().sort(byOrder).map(function(s){
        return {
          id: s.id, gid: s.groupId, title: s.title, start: s.start, end: s.end,
          kind: s.kind, speakers: s.speakerIds || [], desc: s.desc, room: s.room,
          weight: s.weight, order: s.order
        };
      });
      markLoose(GROUPED.agenda);
    });
  }

  function persistSessionOrder(also, okText){
    return subWrite('agenda', orderWrites('sessions', agAll()).concat(also || []), okText,
      'The new order was not saved.');
  }
  function persistAgGroupOrder(){
    return subWrite('agenda', orderWrites('agenda-groups', agGroups()), null,
      'The new order of the days was not saved.');
  }

  /* ---------------- the page ---------------- */
  function viewAgenda(){
    var groups = agGroups(), all = agAll();

    /* loose: the card for sessions that are in no day (see the same card on Speakers) */
    function card(g, gi, loose){
      var list = agIn(g.id);
      var rows = list.map(function(s, i){
        var k = kMeta(s.kind);
        var prev = i > 0 ? list[i - 1] : null;
        var clash = '';
        if (prev && mins(prev.end) != null && mins(s.start) != null && mins(s.start) < mins(prev.end)){
          clash = '<div class="clash">' + svg(IC.info, 13) +
            '<span>Starts at ' + esc(s.start) + ', but “' + esc(prev.title) +
            '” runs until ' + esc(prev.end) + '.</span></div>';
        }
        var people = agSpeakers(s).map(spkById);
        var faces = people.length
          ? '<span class="faces">' + people.slice(0, 3).map(function(p){
              return spkPhotoHTML(p, 'f');
            }).join('') + (people.length > 3
              ? '<span class="f more">+' + (people.length - 3) + '</span>' : '') + '</span>'
          : (k.quiet ? '' : '<span class="faces-none">—</span>');

        return clash +
          '<div class="ses-row' + (k.quiet ? ' quiet' : '') + '" draggable="true" ' +
              'data-ses="' + esc(s.id) + '" data-gid="' + esc(g.id) + '">' +
            '<span class="spk-grip" title="Drag to reorder">' + svg(IC.grip, 15) + '</span>' +
            '<span class="ses-time">' + (s.start
              ? '<b>' + esc(s.start) + ' – ' + esc(s.end || '…') + '</b>' +
                '<span>' + esc(durText(s.start, s.end) || 'no end time') + '</span>'
              : '<b>Time not set</b><span>open it to add one</span>') + '</span>' +
            '<span class="ses-title"><b>' + esc(s.title) + '</b>' +
              '<span class="sd">' + esc(people.map(function(p){ return p.name; }).join(', ') ||
                s.desc || (s.room ? s.room : k.label)) + '</span></span>' +
            faces +
            '<span class="ses-meta">' +
              '<span class="kind-pill">' + esc(k.label) + '</span>' +
              pillBtn('wpill w-' + weightId(s.weight), 'data-agw', s.id, 'Weight: ' + rankLabel(s.weight), 'Weight — click to change') +
              '<button class="btn btn-ghost btn-icon" type="button" data-agup="' + esc(s.id) + '" title="Move up"' +
                (i === 0 ? ' disabled' : '') + '>' + svg(IC.up, 14) + '</button>' +
              '<button class="btn btn-ghost btn-icon" type="button" data-agdown="' + esc(s.id) + '" title="Move down"' +
                (i === list.length - 1 ? ' disabled' : '') + '>' + svg(IC.down, 14) + '</button>' +
              '<button class="btn btn-ghost btn-icon" type="button" data-agedit="' + esc(s.id) + '" title="Edit">' +
                svg(IC.edit, 14) + '</button>' +
            '</span>' +
          '</div>';
      }).join('');

      var span = '';
      if (list.length){
        var first = list.slice().sort(function(a, b){ return (mins(a.start) || 0) - (mins(b.start) || 0); })[0];
        var lastEnd = list.reduce(function(acc, s){
          var e = mins(s.end);
          return e != null && e > acc ? e : acc;
        }, -1);
        if (lastEnd >= 0) span = first.start + ' – ' +
          ((lastEnd / 60 < 10 ? '0' : '') + Math.floor(lastEnd / 60) + ':' + (lastEnd % 60 < 10 ? '0' : '') + (lastEnd % 60));
      }

      if (loose) return '<div class="grp grp-loose">' +
          '<div class="grp-head"><span class="gtitle">Not in a day</span>' +
            '<span class="gcount">' + list.length + (list.length === 1 ? ' session' : ' sessions') + '</span></div>' +
          '<div class="grp-note">' + (groups.length
            ? 'The day these sessions were in no longer exists. Drag each one into a day, or open it and choose one.'
            : 'These sessions are not in a day yet. Add a day, then drag them in.') + '</div>' +
          rows + '</div>';

      return '<div class="grp" data-aggrp="' + esc(g.id) + '">' +
          '<div class="grp-head">' +
            '<input class="gname" value="' + esc(g.name) + '" title="' + esc(g.name) + '" data-agname="' + esc(g.id) + '" ' +
              'aria-label="Day name — click to rename" spellcheck="false">' +
            '<input class="gdate" type="date" value="' + esc(g.date || '') + '" data-agdate="' + esc(g.id) + '" ' +
              'aria-label="Date of this day">' +
            '<span class="gcount">' + list.length + (list.length === 1 ? ' session' : ' sessions') +
              (span ? ' · ' + esc(span) : '') + '</span>' +
            '<span class="grp-acts">' +
              '<button class="btn btn-ghost btn-sm" type="button" data-agsort="' + esc(g.id) + '" ' +
                'title="Put this day in start-time order">' + svg(IC.clock, 13) + ' Sort by time</button>' +
              '<button class="btn btn-ghost btn-icon" type="button" data-aggup="' + esc(g.id) + '" title="Move day up"' +
                (gi === 0 ? ' disabled' : '') + '>' + svg(IC.up, 14) + '</button>' +
              '<button class="btn btn-ghost btn-icon" type="button" data-aggdown="' + esc(g.id) + '" title="Move day down"' +
                (gi === groups.length - 1 ? ' disabled' : '') + '>' + svg(IC.down, 14) + '</button>' +
              (groups.length > 1 ? '<button class="btn btn-ghost btn-icon" type="button" data-aggdel="' + esc(g.id) + '" ' +
                'title="Delete day">' + svg(IC.trash, 14) + '</button>' : '') +
            '</span>' +
          '</div>' +
          (rows || '<div class="grp-empty">Nothing scheduled here yet. ' +
            'Add a session, or drag one in from another day.</div>') +
          '<div class="grp-foot">' +
            '<button class="btn btn-ghost btn-sm" type="button" data-agadd="' + esc(g.id) + '">' +
              svg(IC.plus, 13) + ' Add to ' + esc(g.name) + '</button>' +
          '</div>' +
        '</div>';
    }
    var body = groups.map(function(g, gi){ return card(g, gi, false); }).join('') +
      (agIn('').length ? card({ id: '' }, 0, true) : '');

    if (!all.length && !groups.length){
      return vhead('Agenda', 'The programme of this event, day by day.') +
        emptyState(IC.clock, 'No sessions yet', 'Add the sessions of the day.',
          '<button class="btn btn-primary btn-sm" type="button" id="ag-add">' + svg(IC.plus, 13) + ' Add sessions</button>');
    }

    var sub = all.length + (all.length === 1 ? ' session' : ' sessions') +
      ' across ' + groups.length + (groups.length === 1 ? ' day' : ' days') + '. ' +
      'The site lists them day by day, in the order set here.';

    return vhead('Agenda', sub,
        '<button class="btn btn-secondary btn-sm" type="button" id="ag-addgroup">' +
          svg(IC.plus, 13) + ' Add day</button>' +
        '<button class="btn btn-primary btn-sm" type="button" id="ag-add">' +
          svg(IC.plus, 13) + ' Add sessions</button>') +

      '<div class="ag' + (all.length ? '' : ' one') + '">' +
        '<div class="ag-main">' + body +
          (all.length ? '<div class="callout info">' + svg(IC.info, 17) +
            '<span><strong>Speakers come from the line-up</strong>' +
            'Pick them from the list you already built on the Speakers tab rather than typing names again — ' +
            'rename someone there and every session follows. Use <b>Sort by time</b> if the order drifts, ' +
            'and watch for the amber line that appears when two sessions overlap.</span></div>' : '') +
        '</div>' +
        (all.length ? '<aside class="spk-side">' +
          '<div class="pvc">' +
            '<div class="pvc-head"><span class="eyebrow">Day at a glance</span></div>' +
            agGlance() +
          '</div>' +
          glanceCard('agv', agPreview(), all.length + ' on site', 'Sessions day by day, in the order the site lists them.') +
        '</aside>' : '') +
      '</div>';
  }

  function agPreview(){
    if (!agAll().length) return '<div class="oag-empty">No sessions yet. The Agenda section is hidden on the site.</div>';
    return agGroups().concat(agIn('').length ? [{ id: '', name: '' }] : []).map(function(g){
      var list = agIn(g.id);
      if (!list.length) return '';
      var head = g.id ? g.name + (g.date ? ' · ' + fmtDay(g.date) : '') : '';
      return '<div class="oag-g">' + (head ? '<div class="oag-h" title="' + esc(head) + '">' + esc(head) + '</div>' : '') +
        list.map(function(s){
          return '<div class="oag-r' + (kMeta(s.kind).quiet ? ' quiet' : '') + '">' +
            '<span class="t">' + esc(s.start || '—') + '</span>' +
            '<span class="n" title="' + esc(s.title) + '">' + esc(s.title) + '</span>' +
            weightDot(s.weight, rankLabel(s.weight)) + '</div>';
        }).join('') + '</div>';
    }).join('');
  }

  function agGlance(){
    var all = agAll();
    var prog = 0, quiet = 0, unnamed = 0, minutes = 0;
    all.forEach(function(s){
      var k = kMeta(s.kind);
      if (k.quiet) quiet++; else prog++;
      if (!k.quiet && !agSpeakers(s).length) unnamed++;
      var a = mins(s.start), b = mins(s.end);
      if (a != null && b != null && b > a) minutes += b - a;
    });
    var rows = [
      ['Programme sessions', prog, prog > 0],
      ['Breaks and meals', quiet, quiet > 0],
      ['Sessions with no speaker', unnamed, prog > 0 && unnamed === 0],
      ['Scheduled time', (minutes >= 60 ? Math.floor(minutes / 60) + 'h ' : '') + (minutes % 60) + 'm', minutes > 0]
    ];
    return rows.map(function(r){
      return '<div class="rdy-item' + (r[2] ? ' on' : '') + '">' +
          '<span class="tick">' + svg(r[2] ? IC.check : IC.info, 11) + '</span>' +
          '<span class="lb">' + esc(r[0]) + '</span>' +
          '<span class="num">' + esc(String(r[1])) + '</span></div>';
    }).join('');
  }

  /* ---------------- page wiring ---------------- */
  /* the date a new day most likely runs on: the day after the last one, or the event's first day */
  function agNextDate(){
    var gs = agGroups(), last = gs[gs.length - 1];
    if (!last) return EV.start ? EV.start.slice(0, 10) : '';
    if (!last.date) return '';
    var nd = new Date(last.date + 'T00:00:00');
    if (isNaN(nd)) return '';
    nd.setDate(nd.getDate() + 1);
    return nd.getFullYear() + '-' + ('0' + (nd.getMonth() + 1)).slice(-2) + '-' + ('0' + nd.getDate()).slice(-2);
  }

  function wireAgenda(){
    var G = GROUPED.agenda;
    var add = $('ag-add');
    if (add) add.onclick = function(){ agDialog(null); };

    var addg = $('ag-addgroup');
    if (addg) addg.onclick = function(){ addGroupDialog(G); };

    document.querySelectorAll('[data-agadd]').forEach(function(b){
      b.onclick = function(){ agDialog(null, b.getAttribute('data-agadd')); };
    });
    document.querySelectorAll('[data-agedit]').forEach(function(b){
      b.onclick = function(){ agDialog(b.getAttribute('data-agedit')); };
    });

    wireGroupNames(G);
    document.querySelectorAll('[data-agdate]').forEach(function(inp){
      var id = inp.getAttribute('data-agdate');
      inp.onchange = function(){
        agGroups().forEach(function(g){ if (g.id === id) g.date = inp.value; });
        agCommit();
        subWrite('agenda', updateSub('agenda-groups', id, { date: inp.value }), null,
          'The date was not saved.', true);
      };
    });

    document.querySelectorAll('[data-agw]').forEach(function(b){
      b.onclick = function(){
        var s = agById(b.getAttribute('data-agw'));
        if (!s) return;
        pillMenu(b, {
          label: 'Weight', options: RANKS, current: weightId(s.weight), foot: WEIGHT_FOOT.agenda,
          pick: function(w){
            s.weight = w;
            agCommit();
            subWrite('agenda', updateSub('sessions', s.id, { weight: w }),
              '“' + s.title + '” is now ' + rankLabel(w).toLowerCase() + ' weight', 'The new weight was not saved.');
          }
        });
      };
    });

    document.querySelectorAll('[data-agup]').forEach(function(b){
      b.onclick = function(){ agMove(b.getAttribute('data-agup'), -1); };
    });
    document.querySelectorAll('[data-agdown]').forEach(function(b){
      b.onclick = function(){ agMove(b.getAttribute('data-agdown'), 1); };
    });
    document.querySelectorAll('[data-aggup]').forEach(function(b){
      b.onclick = function(){ agGrpMove(b.getAttribute('data-aggup'), -1); };
    });
    document.querySelectorAll('[data-aggdown]').forEach(function(b){
      b.onclick = function(){ agGrpMove(b.getAttribute('data-aggdown'), 1); };
    });

    document.querySelectorAll('[data-agsort]').forEach(function(b){
      b.onclick = function(){
        var gid = b.getAttribute('data-agsort');
        var mine = agIn(gid).slice().sort(function(a, c){
          return (mins(a.start) == null ? 9999 : mins(a.start)) - (mins(c.start) == null ? 9999 : mins(c.start));
        });
        S.sessions = agSplice(mine, gid);
        agCommit();
        persistSessionOrder(null, 'Put in start-time order');
      };
    });

    document.querySelectorAll('[data-aggdel]').forEach(function(b){
      b.onclick = function(){ deleteGroupDialog(G, b.getAttribute('data-aggdel')); };
    });

    agDragDrop();
  }

  function agMove(id, dir){
    var s = agById(id);
    if (!s) return;
    var mine = agIn(s.gid);
    var i = mine.map(function(x){ return x.id; }).indexOf(id);
    var j = i + dir;
    if (j < 0 || j >= mine.length) return;
    mine.splice(j, 0, mine.splice(i, 1)[0]);
    S.sessions = agSplice(mine, s.gid);
    agCommit();
    persistSessionOrder();
  }
  function agGrpMove(gid, dir){
    var gs = agGroups();
    var i = gs.map(function(g){ return g.id; }).indexOf(gid);
    var j = i + dir;
    if (j < 0 || j >= gs.length) return;
    gs.splice(j, 0, gs.splice(i, 1)[0]);
    agCommit();
    persistAgGroupOrder();
  }

  function agDragDrop(){
    var dragId = null;
    document.querySelectorAll('.ses-row').forEach(function(row){
      row.addEventListener('dragstart', function(e){
        dragId = row.getAttribute('data-ses');
        row.classList.add('drag');
        try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
      });
      row.addEventListener('dragend', function(){
        dragId = null;
        document.querySelectorAll('.ses-row').forEach(function(r){
          r.classList.remove('drag', 'over-top', 'over-bot');
        });
      });
      row.addEventListener('dragover', function(e){
        if (!dragId || row.getAttribute('data-ses') === dragId) return;
        e.preventDefault();
        var r = row.getBoundingClientRect();
        var after = (e.clientY - r.top) > r.height / 2;
        row.classList.toggle('over-bot', after);
        row.classList.toggle('over-top', !after);
      });
      row.addEventListener('dragleave', function(){ row.classList.remove('over-top', 'over-bot'); });
      row.addEventListener('drop', function(e){
        if (!dragId || row.getAttribute('data-ses') === dragId) return;
        e.preventDefault();
        var r = row.getBoundingClientRect();
        var after = (e.clientY - r.top) > r.height / 2;
        var p = agById(dragId), t = agById(row.getAttribute('data-ses'));
        if (!p || !t) return;
        if (!t.gid && p.gid) return;
        var gidChanged = p.gid !== t.gid;
        p.gid = t.gid;
        var list = agAll().slice();
        list.splice(list.indexOf(p), 1);
        list.splice(list.indexOf(t) + (after ? 1 : 0), 0, p);
        S.sessions = list;
        agCommit();
        persistSessionOrder(gidChanged ? [updateSub('sessions', p.id, { groupId: p.gid })] : null);
      });
    });

    document.querySelectorAll('[data-aggrp]').forEach(function(g){
      g.addEventListener('dragover', function(e){ if (dragId) e.preventDefault(); });
      g.addEventListener('drop', function(e){
        if (!dragId) return;
        if (e.target.closest && e.target.closest('.ses-row')) return;
        e.preventDefault();
        var s = agById(dragId), gid = g.getAttribute('data-aggrp');
        if (!s || s.gid === gid) return;
        regroup(GROUPED.agenda, [s], gid);
        agCommit();
        persistSessionOrder([updateSub('sessions', s.id, { groupId: gid })]);
      });
    });
  }

  /* ============================================================
     THE SESSION DIALOG

     Same queue as the speaker dialog. Adding another session starts
     it where the last one ended, because that is almost always the
     answer and nobody should type a clock twice.
     ============================================================ */
  function agDialog(editId, defaultGid){
    var G = GROUPED.agenda;
    var editing = !!editId;
    var gid = defaultGid || (agGroups()[0] || {}).id || '';

    /* an event's first sessions need a day: it is named here and created when the dialog is saved */
    function blank(prev){
      var start = prev && prev.end ? prev.end : '09:00';
      return {
        key: draftKey(), gid: prev ? prev.gid : gid,
        newGroup: prev ? prev.newGroup : (agGroups().length ? null : 'Day 1'),
        title:'', start: start,
        end: addMins(start, 45), kind:'session', speakers:[], desc:'', room:'', weight:'featured'
      };
    }

    var Q, qi = 0;
    if (editing){
      var src = agById(editId);
      if (!src) return;
      Q = [JSON.parse(JSON.stringify(src))];
      Q[0].key = src.id; Q[0].newGroup = null;
      /* starts from the people still in the line-up, so saving drops an id nobody has any more */
      Q[0].speakers = agSpeakers(src);
    } else {
      var last = agIn(gid).slice(-1)[0];
      Q = [blank(last ? { end:last.end, gid:gid, newGroup:null } : null)];
    }
    /* the date a day created by this dialog gets */
    var firstDate = agNextDate();

    var pristine = '';
    function isDirty(){ readForm(); return JSON.stringify(Q) !== pristine; }
    var accOpen = {};

    var modal = openModal(
        '<div class="modal-head">' +
          '<h3>' + (editing ? 'Edit session' : 'Add sessions') + '</h3>' +
          '<span class="sub" style="font-size:12px;color:var(--text-muted)">' +
            (editing ? 'Changes apply when you save.'
                     : 'Each one you add starts where the last ended — change it if that is wrong.') + '</span>' +
          closeBtn() +
        '</div>' +
        '<form class="modal-form" novalidate>' +
        '<div class="sp-wrap' + (editing ? ' solo' : '') + '">' +
          (editing ? '' :
            '<div class="sp-queue">' +
              '<div class="qh">Adding <span id="aq-n"></span></div>' +
              '<div class="qlist" id="aq-list"></div>' +
              '<div class="qfoot"><button class="btn btn-secondary btn-sm" type="button" id="aq-add" ' +
                'style="width:100%">' + svg(IC.plus, 13) + ' Add another</button></div>' +
            '</div>') +
          '<div class="sp-form" id="ag-form"></div>' +
        '</div>' +
        '<div class="modal-foot">' +
          (editing ? '<button class="btn btn-danger" type="button" id="adel">Remove session</button>' : '') +
          '<span class="modal-err" id="ag-err" role="alert"></span>' +
          '<button class="btn btn-secondary" type="button" id="acancel" data-close>Cancel</button>' +
          '<button class="btn btn-primary" type="submit" id="asave"></button>' +
        '</div>' +
        '</form>',
      { cls: 'wide', isDirty: isDirty, onSubmit: saveAll });

    if (editing) $('adel').onclick = function(){
      removeInDialog(modal, {
        btn: 'adel', errEl: 'ag-err', tab: 'agenda',
        question: 'Remove “' + src.title + '” from the agenda? It will no longer appear on your site. This cannot be undone.',
        work: function(){ return removeRecord('sessions', 'sessions', editId); },
        failed: '“' + src.title + '” was not removed.',
        done: function(){
          notify('“' + src.title + '” removed');
          renumberGrouped(G);
        }
      });
    };

    function paintQueue(){
      if (editing) return;
      $('aq-n').textContent = Q.length + (Q.length === 1 ? ' session' : ' sessions');
      $('aq-list').innerHTML = Q.map(function(e, i){
        return '<button class="qi' + (e.err ? ' failed' : '') + '" type="button" data-q="' + i + '" aria-current="' + (i === qi) + '"' +
            (e.err ? ' title="Not saved yet"' : '') + '>' +
            '<span class="qph" style="font-family:var(--font-mono);font-size:9.5px">' + esc(e.start) + '</span>' +
            '<span class="qn">' + (e.title ? esc(e.title) : '<em>Session ' + (i + 1) + '</em>') + '</span>' +
            (Q.length > 1 ? '<span class="qx" data-qx="' + i + '" role="button" aria-label="Remove">' +
              svg('<path d="M18 6L6 18M6 6l12 12"/>', 13) + '</span>' : '') +
          '</button>';
      }).join('');
      $('aq-list').querySelectorAll('[data-q]').forEach(function(b){
        b.onclick = function(e){
          if (e.target.closest('[data-qx]')) return;
          readForm(); qi = +b.getAttribute('data-q'); paintForm(); paintQueue();
        };
      });
      $('aq-list').querySelectorAll('[data-qx]').forEach(function(x){
        x.onclick = function(e){
          e.stopPropagation();
          var i = +x.getAttribute('data-qx');
          readForm();
          Q.splice(i, 1);
          if (qi >= Q.length) qi = Q.length - 1;
          paintForm(); paintQueue(); paintSave();
        };
      });
    }
    function paintSave(){
      $('asave').textContent = editing ? 'Save changes'
        : (Q.length === 1 ? 'Add session' : 'Add all ' + Q.length + ' sessions');
    }

    var search = '';

    function paintForm(){
      var e = Q[qi];
      var open = accOpen[e.key] != null ? accOpen[e.key] : !!(e.desc || e.room);
      $('ag-form').innerHTML =
        '<div class="frow">' +
          '<div class="field c12"><div class="flabel-row">' +
            '<label for="ag-title">Session title <span class="pill-req">Required</span></label></div>' +
            '<input class="inp" id="ag-title" value="' + esc(e.title) + '" ' +
              'placeholder="e.g. Keynote: The year ahead"></div>' +

          '<div class="field c4"><div class="flabel-row">' +
            '<label for="ag-start">Starts <span class="pill-req">Required</span></label></div>' +
            '<input class="inp" id="ag-start" type="time" value="' + esc(e.start) + '"></div>' +

          '<div class="field c4"><label for="ag-end">Ends</label>' +
            '<input class="inp" id="ag-end" type="time" value="' + esc(e.end || '') + '"></div>' +

          '<div class="field c4"><label class="flabel">Runs for</label>' +
            '<div class="readout" id="ag-dur" style="height:38px"></div></div>' +

          '<div class="field c4"><label for="ag-kind">Kind</label>' +
            '<select class="inp" id="ag-kind">' + KINDS.map(function(k){
              return '<option value="' + esc(k.id) + '"' + (k.id === e.kind ? ' selected' : '') + '>' +
                esc(k.label) + '</option>';
            }).join('') + '</select>' +
            '<p class="hint">Breaks and meals do not need a speaker.</p></div>' +

          '<div class="field c4"><label for="' + groupPickId(e, 'ag-gid') + '">Day</label>' +
            groupPickHTML(G, e, 'ag-gid', false) + '</div>' +

          '<div class="field c4"><label for="ag-weight">Weight</label>' +
            '<select class="inp" id="ag-weight">' + RANKS.map(function(w){
              return '<option value="' + esc(w.id) + '"' + (w.id === e.weight ? ' selected' : '') + '>' +
                esc(w.label) + '</option>';
            }).join('') + '</select>' +
            '<p class="hint" id="ag-wnote"></p></div>' +

          '<div class="field c12"><div class="flabel-row"><label class="flabel">On stage</label>' +
            '<span class="hint" id="ag-spkn" style="margin:0"></span></div>' +
            '<div class="picker">' +
              '<div class="picker-search">' + svg(IC.search, 14) +
                '<input id="ag-spksearch" placeholder="Search the line-up…" value="' + esc(search) + '">' +
              '</div>' +
              '<div class="picker-list" id="ag-spklist"></div>' +
            '</div>' +
            '<p class="hint">Straight from the Speakers tab — rename someone there and every session follows.</p>' +
          '</div>' +
        '</div>' +

        '<div class="acc" data-open="' + open + '" id="ag-acc">' +
          '<button class="acc-head" type="button" id="ag-acch" aria-expanded="' + open + '">' + svg(IC.caret, 14) +
            'Description and room' +
            '<span class="ah-sub">Both optional — leave them out if you do not have them</span></button>' +
          '<div class="acc-body"><div class="frow">' +
            '<div class="field c12"><label for="ag-desc">Short description</label>' +
              '<textarea class="inp" id="ag-desc" style="min-height:66px" ' +
                'placeholder="A line about what this session covers.">' + esc(e.desc || '') + '</textarea></div>' +
            '<div class="field c6"><label for="ag-room">Room or stage</label>' +
              '<input class="inp" id="ag-room" value="' + esc(e.room || '') + '" ' +
                'placeholder="e.g. Main hall"></div>' +
          '</div></div>' +
        '</div>';

      paintPicker();
      wireForm();
    }

    function paintPicker(){
      var e = Q[qi];
      var q = search.toLowerCase();
      var list = spkAll().filter(function(p){
        if (!q) return true;
        return (p.name + ' ' + p.desig + ' ' + p.comp).toLowerCase().indexOf(q) >= 0;
      });
      /* chosen people float to the top, so a long line-up stays usable */
      list.sort(function(a, b){
        return (e.speakers.indexOf(b.id) >= 0 ? 1 : 0) - (e.speakers.indexOf(a.id) >= 0 ? 1 : 0);
      });

      var host2 = $('ag-spklist');
      if (!spkAll().length){
        host2.innerHTML = '<div class="picker-empty">No speakers in the line-up yet. ' +
          'Add them on the Speakers tab and they will appear here.</div>';
      } else if (!list.length){
        host2.innerHTML = '<div class="picker-empty">Nobody matches “' + esc(search) + '”.</div>';
      } else {
        host2.innerHTML = list.map(function(p){
          var on = e.speakers.indexOf(p.id) >= 0;
          return '<button class="pchip" type="button" data-pick="' + esc(p.id) + '" aria-pressed="' + on + '">' +
              spkPhotoHTML(p, 'pf') +
              '<span class="pn">' + esc(p.name) +
                (p.comp ? ' <span class="pt">· ' + esc(p.comp) + '</span>' : '') + '</span>' +
            '</button>';
        }).join('');
        host2.querySelectorAll('[data-pick]').forEach(function(b){
          b.onclick = function(){
            var id = b.getAttribute('data-pick');
            var at = e.speakers.indexOf(id);
            if (at >= 0) e.speakers.splice(at, 1); else e.speakers.push(id);
            paintPicker();
          };
        });
      }
      $('ag-spkn').textContent = e.speakers.length
        ? e.speakers.length + (e.speakers.length === 1 ? ' chosen' : ' chosen')
        : 'Nobody chosen yet';
    }

    function paintDur(){
      var a = $('ag-start').value, b = $('ag-end').value;
      var d = durText(a, b);
      var box = $('ag-dur');
      if (d){
        box.className = 'readout';
        box.innerHTML = svg(IC.clock, 13) + '<b>' + esc(d) + '</b>';
      } else if (b && mins(b) != null && mins(a) != null && mins(b) <= mins(a)){
        box.className = 'readout bad';
        box.innerHTML = svg(IC.info, 13) + '<span>Ends before it starts</span>';
      } else {
        box.className = 'readout';
        box.innerHTML = svg(IC.clock, 13) + '<span>Add an end time</span>';
      }
    }

    function wnote(){ $('ag-wnote').textContent = WEIGHT_FOOT.agenda; }

    function wireForm(){
      paintDur(); wnote();
      $('ag-start').oninput = function(){ paintDur(); readForm(); paintQueue(); };
      $('ag-end').oninput = paintDur;
      $('ag-title').addEventListener('input', function(){ readForm(); paintQueue(); });

      /* choosing a quiet kind drops it down the order of importance */
      $('ag-kind').onchange = function(){
        if (kMeta(this.value).quiet && $('ag-weight').value !== 'standard'){
          $('ag-weight').value = 'standard';
        }
      };

      $('ag-acch').onclick = function(){
        var a = $('ag-acc');
        var now = a.getAttribute('data-open') !== 'true';
        a.setAttribute('data-open', String(now));
        this.setAttribute('aria-expanded', String(now));
        accOpen[Q[qi].key] = now;
      };

      var s = $('ag-spksearch');
      s.oninput = function(){ search = s.value; paintPicker(); };
      /* Enter in the search box is a search, not "save the dialog" */
      s.onkeydown = function(ev){ if (ev.key === 'Enter') ev.preventDefault(); };
    }

    function readForm(){
      if (!$('ag-title')) return;
      var e = Q[qi];
      e.title = $('ag-title').value.trim();
      e.start = $('ag-start').value;
      e.end = $('ag-end').value;
      e.kind = $('ag-kind').value;
      readGroupPick(G, e, 'ag-gid');
      e.weight = $('ag-weight').value;
      e.desc = $('ag-desc').value.trim();
      e.room = $('ag-room').value.trim();
    }

    $('aq-add') && ($('aq-add').onclick = function(){
      readForm();
      Q.push(blank(Q[qi]));
      qi = Q.length - 1;
      search = '';
      paintForm(); paintQueue(); paintSave();
    });

    function problems(e){
      var errs = [], g = groupPickProblem(G, e, 'ag-gid');
      if (!e.title) errs.push(['ag-title', 'Enter a title for the session.']);
      if (mins(e.start) == null) errs.push(['ag-start', 'Enter the time the session starts.']);
      else if (e.end && mins(e.end) != null && mins(e.end) <= mins(e.start)){
        errs.push(['ag-end', 'The end time has to be after ' + e.start + ' — or leave it empty.']);
      }
      if (g) errs.push(g);
      return errs;
    }

    function record(e){
      return {
        gid: e.gid, title: e.title, start: e.start, end: e.end,
        kind: e.kind, speakers: e.speakers.slice(), desc: e.desc, room: e.room, weight: e.weight
      };
    }
    function body(r){
      return {
        groupId: r.gid, title: r.title, start: r.start, end: r.end,
        kind: r.kind, speakerIds: r.speakers, desc: r.desc, room: r.room, weight: r.weight
      };
    }

    function saveAll(){
      readForm();
      for (var i = 0; i < Q.length; i++){
        var errs = problems(Q[i]);
        if (!errs.length) continue;
        if (i !== qi){ qi = i; paintForm(); paintQueue(); }
        showFieldErrors(errs);
        if (Q.length > 1) $('ag-err').textContent = 'Session ' + (i + 1) + ' needs a correction. Nothing has been saved yet.';
        return;
      }
      saveQueue({
        G: G, Q: Q, modal: modal, editing: editing ? src : null, saveBtn: 'asave', errEl: 'ag-err',
        record: record, body: body, groupDate: firstDate,
        repaint: function(){ if (qi >= Q.length) qi = 0; paintQueue(); paintForm(); paintSave(); }
      });
    }

    paintQueue();
    paintForm();
    paintSave();
    readForm();
    pristine = JSON.stringify(Q);
    modal.focus('#ag-title');
  }

  /* ============================================================
     VIEW : SPONSORS

     Third page built on the same three levers — group, order,
     weight — so there is nothing new to learn. A tier is the group
     and a sponsor is the row (the records are called partners in
     the API). The site shows the confirmed ones, tier by tier.
     ============================================================ */
  /* ---------------- model ----------------
     Internal shape keeps tid/logo (as in the UI code below); the backend's
     `partners` resource names them tierId/logoUrl — mapped at the edges only. */
  function ptAll(){ return S.partners || []; }
  function ptTiers(){ return S.spTiers || []; }
  function ptIn(tid){ return ptAll().filter(function(p){ return p.tid === tid; }); }
  function ptById(id){
    var a = ptAll();
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }
  function ptSplice(mine, tid){
    var out = [], done = false;
    ptAll().forEach(function(p){
      if (p.tid === tid){ if (!done){ out = out.concat(mine); done = true; } return; }
      out.push(p);
    });
    if (!done) out = out.concat(mine);
    return out;
  }
  function ptCommit(){ render(); }

  function loadSponsors(){
    return Promise.all([
      C.fetchSub('partner-tiers', EV.id),
      C.fetchSub('partners', EV.id)
    ]).then(function(res){
      S.spTiers = (res[0] || []).slice().sort(byOrder).map(function(t){
        return { id: t.id, name: t.name, weight: t.weight, order: t.order };
      });
      S.partners = (res[1] || []).slice().sort(byOrder).map(function(p){
        return {
          id: p.id, tid: p.tierId, name: p.name, url: p.url, logo: p.logoUrl || null,
          weight: p.weight, status: p.status, email: p.email, phone: p.phone,
          contact: p.contact, note: p.note, order: p.order
        };
      });
      markLoose(GROUPED.sponsors);
    });
  }

  function persistPartnerOrder(also){
    return subWrite('sponsors', orderWrites('partners', ptAll()).concat(also || []), null,
      'The new order was not saved.');
  }
  function persistTierOrder(){
    return subWrite('sponsors', orderWrites('partner-tiers', ptTiers()), null,
      'The new order of the tiers was not saved.');
  }

  /* a stored website becomes a link only when it is a plain web address */
  function webLink(v){
    var u = cleanWebUrl(v);
    return u ? '<a href="https://' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + '</a>' : '';

  /* ---------------- page wiring ---------------- */
  function wireSponsors(){
    var G = GROUPED.sponsors;
    var add = $('pt-add');

    var addt = $('pt-addtier');
    if (addt) addt.onclick = function(){ addGroupDialog(G); };

    document.querySelectorAll('[data-ptedit]').forEach(function(b){

    });

    wireGroupNames(G);

    document.querySelectorAll('[data-ptw]').forEach(function(b){
      b.onclick = function(){
        var p = ptById(b.getAttribute('data-ptw'));
        if (!p) return;
        pillMenu(b, {

          pick: function(w){
            p.weight = w;
            ptCommit();
            subWrite('sponsors', updateSub('partners', p.id, { weight: w }),
              p.name + ' is now ' + rankLabel(w).toLowerCase() + ' weight', 'The new weight was not saved.');
          }
        });
      };
    });
    document.querySelectorAll('[data-ptst]').forEach(function(b){
      b.onclick = function(){
        var p = ptById(b.getAttribute('data-ptst'));
        if (!p) return;
        pillMenu(b, {
          label: 'Status', options: STATUSES, current: stMeta(p.status).id,
          pick: function(st){
            p.status = st;
            ptCommit();
            subWrite('sponsors', updateSub('partners', p.id, { status: st }),
              p.name + ' is now ' + stMeta(st).label.toLowerCase(), 'The new status was not saved.');
          }
        });
      };
    });

    document.querySelectorAll('[data-ptup]').forEach(function(b){
      b.onclick = function(){ ptMove(b.getAttribute('data-ptup'), -1); };
    });
    document.querySelectorAll('[data-ptdown]').forEach(function(b){
      b.onclick = function(){ ptMove(b.getAttribute('data-ptdown'), 1); };
    });
    document.querySelectorAll('[data-pttup]').forEach(function(b){
      b.onclick = function(){ ptTierMove(b.getAttribute('data-pttup'), -1); };
    });
    document.querySelectorAll('[data-pttdown]').forEach(function(b){
      b.onclick = function(){ ptTierMove(b.getAttribute('data-pttdown'), 1); };
    });

    /* one click to make a tier look like a tier */
    document.querySelectorAll('[data-ptsize]').forEach(function(b){
      b.onclick = function(){
        var tid = b.getAttribute('data-ptsize');
        var t = ptTiers().filter(function(x){ return x.id === tid; })[0];
        var list = ptIn(tid);
        if (!list.length){ notify('Nothing in this tier yet'); return; }
        /* the commonest weight in the tier wins, so one stray row is the one that moves */
        var tally = {};
        list.forEach(function(p){ tally[p.weight] = (tally[p.weight] || 0) + 1; });
        var best = list[0].weight, n = 0;
        Object.keys(tally).forEach(function(k){ if (tally[k] > n){ n = tally[k]; best = k; } });
        /* only what actually changes is sent */
        var writes = [];
        list.forEach(function(p){
          if (p.weight === best) return;
          p.weight = best;
          writes.push(updateSub('partners', p.id, { weight: best }));
        });
        if (t && t.weight !== best){
          t.weight = best;
          writes.push(updateSub('partner-tiers', t.id, { weight: best }));
        }
        var said = 'Every sponsor in ' + (t ? t.name : 'this tier') + ' is now ' + rankLabel(best).toLowerCase() + ' weight';
        if (!writes.length){ notify(said); return; }
        ptCommit();
        subWrite('sponsors', writes, said, 'The weights were not saved.');
      };
    });

    document.querySelectorAll('[data-pttdel]').forEach(function(b){
      b.onclick = function(){ deleteGroupDialog(G, b.getAttribute('data-pttdel')); };
    });

    ptDragDrop();
  }

  function ptMove(id, dir){
    var p = ptById(id);
    if (!p) return;
    var mine = ptIn(p.tid);
    var i = mine.map(function(x){ return x.id; }).indexOf(id);
    var j = i + dir;
    if (j < 0 || j >= mine.length) return;
    mine.splice(j, 0, mine.splice(i, 1)[0]);
    S.partners = ptSplice(mine, p.tid);
    ptCommit();
    persistPartnerOrder();
  }
  function ptTierMove(tid, dir){
    var ts = ptTiers();
    var i = ts.map(function(t){ return t.id; }).indexOf(tid);
    var j = i + dir;
    if (j < 0 || j >= ts.length) return;
    ts.splice(j, 0, ts.splice(i, 1)[0]);
    ptCommit();
    persistTierOrder();
  }

  function ptDragDrop(){
    var dragId = null;
    document.querySelectorAll('.pt-row').forEach(function(row){
      row.addEventListener('dragstart', function(e){
        dragId = row.getAttribute('data-pt');
        row.classList.add('drag');
        try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
      });
      row.addEventListener('dragend', function(){
        dragId = null;
        document.querySelectorAll('.pt-row').forEach(function(r){
          r.classList.remove('drag', 'over-top', 'over-bot');
        });
      });
      row.addEventListener('dragover', function(e){
        if (!dragId || row.getAttribute('data-pt') === dragId) return;
        e.preventDefault();
        var r = row.getBoundingClientRect();
        var after = (e.clientY - r.top) > r.height / 2;
        row.classList.toggle('over-bot', after);
        row.classList.toggle('over-top', !after);
      });
      row.addEventListener('dragleave', function(){ row.classList.remove('over-top', 'over-bot'); });
      row.addEventListener('drop', function(e){
        if (!dragId || row.getAttribute('data-pt') === dragId) return;
        e.preventDefault();
        var r = row.getBoundingClientRect();
        var after = (e.clientY - r.top) > r.height / 2;
        var p = ptById(dragId), t = ptById(row.getAttribute('data-pt'));
        if (!p || !t) return;
        if (!t.tid && p.tid) return;
        var tidChanged = p.tid !== t.tid;
        p.tid = t.tid;
        var list = ptAll().slice();
        list.splice(list.indexOf(p), 1);
        list.splice(list.indexOf(t) + (after ? 1 : 0), 0, p);
        S.partners = list;
        ptCommit();
        persistPartnerOrder(tidChanged ? [updateSub('partners', p.id, { tierId: p.tid })] : null);
      });
    });

    document.querySelectorAll('[data-pttier]').forEach(function(g){
      g.addEventListener('dragover', function(e){ if (dragId) e.preventDefault(); });
      g.addEventListener('drop', function(e){
        if (!dragId) return;
        if (e.target.closest && e.target.closest('.pt-row')) return;
        e.preventDefault();
        var p = ptById(dragId), tid = g.getAttribute('data-pttier');
        if (!p || p.tid === tid) return;
        regroup(GROUPED.sponsors, [p], tid);
        ptCommit();
        persistPartnerOrder([updateSub('partners', p.id, { tierId: tid })]);
      });
    });
  }

  /* ============================================================

    var Q, qi = 0;

      Q[0].key = src.id; Q[0].newGroup = null;

    var pristine = '';

    var accOpen = {};

    var modal = openModal(

                'style="width:100%">' + svg(IC.plus, 13) + ' Add another</button></div>' +
            '</div>') +

        '</div>' +
        '<div class="modal-foot">' +
          (editing ? '<button class="btn btn-danger" type="button" id="pdel">Remove sponsor</button>' : '') +
          '<span class="modal-err" id="pt-err" role="alert"></span>' +

    function problems(e){
      var errs = [], g = groupPickProblem(G, e, 'pt-tid');
      if (!e.name) errs.push(['pt-name', 'Enter the company’s name.']);
      if (cleanWebUrl(e.url) == null) errs.push(['pt-url', 'This is not a web address. Use one like company.com, or leave it empty.']);
      if (g) errs.push(g);

      if (e.phone && !isPhone(e.phone)) errs.push(['pt-phone', 'A phone number has 7 to 15 digits. Check it, or leave it empty.']);
      return errs;
    }

    function record(e){
      return {
        tid: e.tid, name: e.name, url: cleanWebUrl(e.url) || '', logo: e.logo || null,
        weight: e.weight, status: e.status, contact: e.contact,
        email: e.email, phone: e.phone, note: e.note
      };
    }
    function body(r){
      return {
        tierId: r.tid, name: r.name, url: r.url, logoUrl: r.logo, weight: r.weight,
        status: r.status, contact: r.contact, email: r.email, phone: r.phone, note: r.note

    }

    function saveAll(){
      readForm();
      for (var i = 0; i < Q.length; i++){

        return;

        record: record, body: body,
        repaint: function(){ if (qi >= Q.length) qi = 0; paintQueue(); paintForm(); paintSave(); }
      });
    }

    paintQueue();
    paintForm();
    paintSave();
    readForm();
    pristine = JSON.stringify(Q);
    modal.focus('#pt-name');
  }
