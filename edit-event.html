  /* ---------- the live parts of the basics form ---------- */
  function wireBasics(){
    var f = {
      name:  $('b-name'),  cat:   $('b-cat'),   start: $('b-start'),
      end:   $('b-end'),   venue: $('b-venue'), city:  $('b-city'), desc: $('b-desc')
    };
    if (!f.name) return;

    /* form field -> the event field it is stored in */
    var STORED = { name:'name', cat:'category', start:'start', end:'end', venue:'venue', city:'city', desc:'description' };
    var KEYS = Object.keys(STORED);
    var initial = {};
    KEYS.forEach(function(k){ initial[k] = f[k].value; });

    var mode = 'list';
    var saving = false;
    /* the reason the last save did not go through, shown in the save bar until the form changes */
    var failed = '';

    function v(k){ return f[k].value; }
    function trimmed(k){ return v(k).trim(); }
    function changedKeys(){ return KEYS.filter(function(k){ return f[k].value !== initial[k]; }); }
    function place(){ return [trimmed('venue'), trimmed('city')].filter(Boolean).join(', '); }

    /* ---- date maths, kept honest about half-filled forms ---- */
    function span(){
      var a = v('start') ? new Date(v('start')) : null;
      var b = v('end')   ? new Date(v('end'))   : null;
      if (a && isNaN(a)) a = null;
      if (b && isNaN(b)) b = null;
      return { a:a, b:b };
    }
    function dayCount(a, b){
      var x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
      var y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
      return Math.round((y - x) / 86400000) + 1;
    }
    function countdown(a){
      var now = new Date();
      var days = Math.ceil((a - now) / 86400000);
      if (days > 1)  return { cls:'', txt:'Opens in <b>' + days + ' days</b>' };
      if (days === 1) return { cls:'', txt:'Opens <b>tomorrow</b>' };
      if (days === 0) return { cls:'good', txt:'Happening <b>today</b>' };
      return { cls:'', txt:'Ran <b>' + Math.abs(days) + ' days</b> ago' };
    }

    function paintWhen(){
      var host = $('b-when');
      if (!host) return;
      var s = span(), out = [];

      if (!s.a){
        out.push({ cls:'bad', ico:IC.clock, txt:'No start date yet' });
      } else {
        if (s.b && s.b > s.a){
          var d = dayCount(s.a, s.b);
          var hrs = Math.round((s.b - s.a) / 3600000);
          out.push({ cls:'', ico:IC.clock,
            txt: d > 1 ? '<b>' + d + ' days</b> · ' + fmtDate(localIso(s.a)) + ' to ' + fmtDate(localIso(s.b))
                       : 'Single day · <b>' + hrs + ' hours</b>' });
        } else if (s.b && s.b <= s.a){
          out.push({ cls:'bad', ico:IC.info, txt:'The end is <b>before the start</b>' });
        } else {
          out.push({ cls:'', ico:IC.clock, txt:'Single day · <b>no end time set</b>' });
        }
        var c = countdown(s.a);
        out.push({ cls:c.cls, ico:IC.bell, txt:c.txt });
      }

      out.push({ cls: place() ? '' : 'bad', ico:IC.globe,
        txt: place() ? esc(place()) : 'No venue or city yet' });

      host.innerHTML = out.map(function(r){
        return '<span class="readout ' + r.cls + '">' + svg(r.ico, 13) + '<span>' + r.txt + '</span></span>';
      }).join('');
    }

    /* ---- description counter as a meter, not a number to decode ---- */
    function paintCount(){
      var box = $('b-count');
      if (!box) return;
      var n = v('desc').length;
      var pct = Math.min(100, Math.round(n / DESC_IDEAL * 100));
      box.className = 'ctr' + (n > DESC_IDEAL ? ' over' : (n > DESC_IDEAL * 0.9 ? ' warn' : ''));
      box.querySelector('i').style.width = pct + '%';
      box.querySelector('.t').textContent = n + ' / ' + DESC_IDEAL;
    }

    /* ---- the three surfaces in the rail ---- */
    function previewBits(){
      var s = span();
      var title = trimmed('name') || 'Untitled event';
      var d = trimmed('desc') || 'Add a short description and it will appear here.';
      var venue = place() || 'Venue to be confirmed';
      var when = s.a ? fmtDT(localIso(s.a)) : 'Date to be announced';
      var path = $('b-slug').value || 'your-event';
      return { title:title, d:d, venue:venue, when:when, path:path, portal: PORTALS[EV.portal] || 'ET Oneworld' };
    }

    function paintPreview(){
      var host = $('b-preview'), note = $('b-pvnote');
      if (!host) return;
      var b = previewBits(), html, n;

      if (mode === 'serp'){
        html = '<div class="mock mock-serp">' +
            '<div class="u">etoneworld.com &rsaquo; ' + esc(b.path) + '</div>' +
            '<div class="t">' + esc(b.title) + ' | ' + esc(b.portal) + '</div>' +
            '<div class="d">' + esc(b.when) + ' · ' + esc(b.venue) + '. ' + esc(b.d) + '</div>' +
          '</div>';
        n = 'Google shows roughly the first 155 characters of the description.';
      } else if (mode === 'og'){
        html = '<div class="mock mock-og">' +
            '<div class="img"><span class="mp">' + esc(b.portal) + '</span>' +
              '<span class="mt">' + esc(b.title) + '</span>' +
              '<span class="md">' + esc(b.when) + ' · ' + esc(b.venue) + '</span></div>' +
            '<div class="cap"><span class="dom">etoneworld.com</span>' +
              '<b>' + esc(b.title) + '</b><span>' + esc(b.d) + '</span></div>' +
          '</div>';
        n = 'What a WhatsApp, LinkedIn or X share unfurls into.';
      } else {
        html = '<div class="mock">' +
            '<div class="mock-hero"><span class="mp">' + esc(b.portal) + ' presents</span>' +
              '<div class="mt">' + esc(b.title) + '</div></div>' +
            '<div class="mock-meta">' + svg(IC.clock, 12) + '<span>' + esc(b.when) + '</span></div>' +
            '<div class="mock-meta">' + svg(IC.globe, 12) + '<span>' + esc(b.venue) + '</span></div>' +
            '<div class="mock-body"><p>' + esc(b.d) + '</p><span class="cta">Register now</span></div>' +
          '</div>';
        n = 'The card on the events listing and the top of the site.';
      }
      host.innerHTML = html;
      if (note) note.textContent = n;
    }

    /* ---- which of the basics are filled in; an open row says what it still needs and
            takes the user to the field ---- */
    function paintReady(){
      var host = $('b-rdy');
      if (!host) return;
      var s = span(), n = trimmed('desc').length;
      var endBad = !!(s.a && s.b && s.b <= s.a);
      var items = [
        { label:'Event name', field:'b-name', why: trimmed('name') ? '' : 'Add the event name' },
        { label:'Date', field: endBad ? 'b-end' : 'b-start',
          why: !s.a ? 'Add a start date and time' : (endBad ? 'The end is before the start' : '') },
        { label:'Venue or city', field:'b-venue', why: place() ? '' : 'Add a venue or a city' },
        { label:'Short description', field:'b-desc',
          why: n < DESC_MIN ? 'Add at least ' + DESC_MIN + ' characters (now ' + n + ')'
             : (n > DESC_IDEAL ? 'Shorten to ' + DESC_IDEAL + ' characters (now ' + n + ')' : '') },
        { label:'Category', field:'b-cat', why: v('cat') ? '' : 'Choose a category' }
      ];
      var done = items.filter(function(i){ return !i.why; }).length;

      host.innerHTML = items.map(function(i){
        return '<button type="button" class="rdy-item' + (i.why ? '' : ' on') + '" data-field="' + i.field + '">' +
            '<span class="tick">' + svg(i.why ? IC.plus : IC.check, 11) + '</span>' +
            '<span class="lb">' + esc(i.label) +
              (i.why ? '<span class="why">' + esc(i.why) + '</span>' : '') + '</span></button>';
      }).join('');

      var bar = $('b-rdybar');
      if (bar) bar.style.width = Math.round(done / items.length * 100) + '%';
      var num = $('b-rdyn');
      if (num) num.textContent = done + ' / ' + items.length;
    }

    /* ---- the sticky bar: shown once something changed; it also carries a failed save,
            so the reason stays next to the button that tries again ---- */
    function paintDirty(){
      var bar = $('b-savebar');
      if (!bar) return;
      var n = changedKeys().length;
      bar.classList.toggle('on', n > 0);
      bar.classList.toggle('failed', n > 0 && !!failed);
      $('b-sbtxt').setAttribute('role', failed ? 'alert' : 'status');
      $('b-sbhead').textContent = failed ? 'Not saved' : 'Unsaved changes';
      $('b-sbwhat').textContent = failed ? failed : (n === 1 ? '1 field edited' : n + ' fields edited');
      var save = $('b-save');
      save.disabled = saving;
      if (saving) save.innerHTML = '<span class="spin"></span> Saving';
      else save.textContent = failed ? 'Try again' : 'Save changes';
      $('b-discard').disabled = saving;
    }

    function paint(){
      paintWhen(); paintCount(); paintPreview(); paintReady(); paintDirty();
    }

    function onEdit(e){
      clearFieldError(e.target);
      failed = '';
      paint();
    }
    KEYS.forEach(function(k){
      f[k].addEventListener('input', onEdit);
      f[k].addEventListener('change', onEdit);
    });

    $('b-rdy').addEventListener('click', function(e){
      var row = e.target.closest('[data-field]');
      var field = row && $(row.getAttribute('data-field'));
      if (!field) return;
      field.scrollIntoView({ block: 'center' });
      field.focus();
    });

    var seg = $('b-seg');
    if (seg) seg.querySelectorAll('[data-pv]').forEach(function(b){
      b.addEventListener('click', function(){
        mode = b.getAttribute('data-pv');
        seg.querySelectorAll('[data-pv]').forEach(function(x){
          x.setAttribute('aria-pressed', String(x === b));
        });
        paintPreview();
      });
    });

    var copy = $('b-copy');
    if (copy) copy.addEventListener('click', function(){
      var full = 'etoneworld.com/' + $('b-slug').value;
      var done = function(){
        copy.classList.add('done');
        copy.querySelector('span').textContent = 'Copied';
        setTimeout(function(){
          copy.classList.remove('done');
          copy.querySelector('span').textContent = 'Copy';
        }, 1600);
        notify('Address copied — ' + full);
      };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText('https://' + full).then(done, done);
      } else { done(); }
    });

    /* What must be put right before anything is sent. The name is always needed; a date or a
       description that was stored before these rules existed only has to be corrected once the
       user changes it. */
    function problems(changed){
      var errs = [], s = span();
      if (!trimmed('name')) errs.push(['b-name', 'Enter the event name.']);
      if ((changed.indexOf('start') >= 0 || changed.indexOf('end') >= 0) && s.a && s.b && s.b <= s.a){
        errs.push(['b-end', 'The end must be after the start.']);
      }
      if (changed.indexOf('desc') >= 0 && v('desc').length > DESC_MAX){
        errs.push(['b-desc', 'Shorten the description to ' + DESC_MAX + ' characters (now ' + v('desc').length + ').']);
      }
      return errs;
    }

    /* Sends the fields that differ from what is stored, and nothing else: a field this form did not
       change may have been changed by someone else since the page was opened. Resolves once the
       server has stored them; see LEAVE for what a rejection carries. */
    function saveBasics(){
      if (saving) return Promise.reject(new Error('A save is already under way.'));
      var changed = changedKeys();
      if (!changed.length) return Promise.resolve();
      var errs = problems(changed);
      if (errs.length) return Promise.reject({ fields: errs });

      var sent = {}, patch = {};
      changed.forEach(function(k){
        sent[k] = f[k].value;
        var val = (k === 'cat' || k === 'desc') ? sent[k] : sent[k].trim();
        /* a cleared date is no date, never an empty string */
        patch[STORED[k]] = ((k === 'start' || k === 'end') && !val) ? null : val;
      });

      saving = true;
      failed = '';
      paintDirty();

      return C.updateEvent(EV.id, patch).then(function(){
        saving = false;
        changed.forEach(function(k){
          var stored = patch[STORED[k]] == null ? '' : patch[STORED[k]];
          EV[STORED[k]] = patch[STORED[k]];
          /* what was typed while the request was out stays typed, and still counts as unsaved */
          if (f[k].value === sent[k]) f[k].value = stored;
          initial[k] = stored;
        });
        paint();
        paintHeader();
        notify('Basics saved');
      }, function(err){
        saving = false;
        console.error('Basics save failed:', err);
        failed = errText(err);
        paintDirty();
        throw err;
      });
    }

    function discardBasics(){
      KEYS.forEach(function(k){
        f[k].value = initial[k];
        clearFieldError(f[k]);
      });
      failed = '';
      paint();
    }

    $('b-save').addEventListener('click', function(){
      saveBasics().catch(function(err){
        if (err && err.fields) showFieldErrors(err.fields);
        else $('b-save').focus();
      });
    });

    $('b-discard').addEventListener('click', function(){
      discardBasics();
      notify('Changes discarded');
    });

    LEAVE = {
      label: 'Basics',
      dirty: function(){ return changedKeys().length > 0; },
      save: saveBasics,
      discard: discardBasics
    };

    paint();
  }

  /* ============================================================
     VIEW : SPEAKERS

     The line-up is groups of people, in an order, each carrying a
     status and a weight. The site shows the confirmed ones, group by
     group, in that order.

     Photos are always square: the crop happens in the dialog, so a
     badly shaped upload can never reach the site.
     ============================================================ */
  /* Weight is a rank the organiser gives a record. It is not part of what the site reads, so
     nothing here may say it changes how large anything is drawn: on Speakers it is what "Sort by
     weight" orders a group by, elsewhere it is the organiser's own mark. The four ids are stored;
     sessions and sponsors show them under plainer names, because "Keynote" is also a kind of session. */
  var WEIGHTS = [
    { id:'keynote',  label:'Keynote',  note:'First when a group is sorted by weight' },
    { id:'headline', label:'Headline', note:'After the keynotes' },
    { id:'featured', label:'Featured', note:'After the headline speakers' },
    { id:'standard', label:'Standard', note:'Last' }
  ];
  var RANKS = [
    { id:'keynote',  label:'Top' },
    { id:'headline', label:'High' },
    { id:'featured', label:'Normal' },
    { id:'standard', label:'Low' }
  ];
  var WEIGHT_FOOT = {
    speakers: 'Sort by weight puts a group in this order. Weight does not change how a speaker looks on the site.',
    agenda:   'Your own mark of how important a session is. It does not change how the session looks on the site.',
    sponsors: 'Your own mark of how prominent a sponsor is. It does not change the size of the logo on the site.'
  };
  var STATUSES = [
    { id:'confirmed', label:'Confirmed', cls:'b-ok',   note:'Shown on the site' },
    { id:'invited',   label:'Invited',   cls:'b-warn', note:'Not on the site' },
    { id:'tentative', label:'Tentative', cls:'b-mute', note:'Not on the site' }
  ];

  function wLabel(id){
    for (var i = 0; i < WEIGHTS.length; i++) if (WEIGHTS[i].id === id) return WEIGHTS[i].label;
    return 'Featured';
  }
  function rankLabel(id){
    for (var i = 0; i < RANKS.length; i++) if (RANKS[i].id === id) return RANKS[i].label;
    return 'Normal';
  }
  /* the weight a record counts as having: an unknown or missing one reads as the middle rank */
  function weightId(w){
    for (var i = 0; i < WEIGHTS.length; i++) if (WEIGHTS[i].id === w) return w;
    return 'featured';
  }
  function stMeta(id){
    for (var i = 0; i < STATUSES.length; i++) if (STATUSES[i].id === id) return STATUSES[i];
    return STATUSES[0];
  }
  /* The site lists a speaker or a sponsor only when it is confirmed; a record that has no status
     at all (made before the field existed) counts as confirmed, as it does on the site. */
  function isConfirmed(r){ return !r.status || r.status === 'confirmed'; }
  var OFF_SITE = '<span class="offsite" title="Only confirmed ones are shown on the site">Not on the site</span>';

  /* ---- a pill that opens a short menu (weight, status) ----
     Nothing changes until an option is chosen. The menu is drawn on <body>, outside the row, so
     the row's drag-and-drop never sees its clicks; it takes the arrow keys, Home / End, Escape. */
  var IC_CHEV = '<path d="M6 9l6 6 6-6"/>';
  var PILL_MENU = null;

  function pillBtn(cls, attr, id, text, title){
    return '<button class="' + cls + '" type="button" ' + attr + '="' + esc(id) + '" aria-haspopup="menu" ' +
      'aria-expanded="false" title="' + esc(title) + '">' + esc(text) + svg(IC_CHEV, 10) + '</button>';
  }
  function statusBtn(attr, r){
    var st = stMeta(r.status);
    return pillBtn('badge spill ' + st.cls, attr, r.id, st.label, 'Status — click to change');
  }

  function closePillMenu(refocus){
    var m = PILL_MENU;
    if (!m) return;
    PILL_MENU = null;
    m.el.remove();
    document.removeEventListener('mousedown', m.onDown, true);
    document.removeEventListener('keydown', m.onKey, true);
    window.removeEventListener('resize', m.onMove);
    window.removeEventListener('scroll', m.onMove, true);
    m.btn.setAttribute('aria-expanded', 'false');
    if (refocus && document.contains(m.btn)) m.btn.focus();
  }

  /* o  label     what is being chosen
        options   [{ id, label, note }]
        current   the id that carries the tick
        foot      a sentence under the options
        pick(id)  called when a different option is chosen */
  function pillMenu(btn, o){
    var again = PILL_MENU && PILL_MENU.btn === btn;
    closePillMenu(again);
    if (again) return;

    var el = document.createElement('div');
    el.className = 'pmenu';
    el.setAttribute('role', 'menu');
    el.setAttribute('aria-label', o.label);
    el.innerHTML = '<div class="pmenu-h">' + esc(o.label) + '</div>' +
      o.options.map(function(x){
        var on = x.id === o.current;
        return '<button class="pmenu-i" type="button" role="menuitemradio" aria-checked="' + on + '" data-v="' + esc(x.id) + '">' +
            '<span class="tk">' + (on ? svg(IC.check, 12) : '') + '</span>' +
            '<span class="tx"><b>' + esc(x.label) + '</b>' + (x.note ? '<span>' + esc(x.note) + '</span>' : '') + '</span>' +
          '</button>';
      }).join('') +
      (o.foot ? '<div class="pmenu-f">' + esc(o.foot) + '</div>' : '');
    document.body.appendChild(el);

    var r = btn.getBoundingClientRect();
    var top = r.bottom + 6;
    if (top + el.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - el.offsetHeight - 6);
    el.style.top = top + 'px';
    el.style.left = Math.max(8, Math.min(r.left, window.innerWidth - el.offsetWidth - 8)) + 'px';

    var items = Array.prototype.slice.call(el.querySelectorAll('.pmenu-i'));
    var m = PILL_MENU = {
      el: el, btn: btn,
      onDown: function(e){ if (!el.contains(e.target) && !btn.contains(e.target)) closePillMenu(false); },
      onMove: function(){ closePillMenu(false); },
      onKey: function(e){
        var at = items.indexOf(document.activeElement), to = -1;
        if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); closePillMenu(true); return; }
        if (e.key === 'Tab'){ closePillMenu(true); return; }
        if (e.key === 'ArrowDown') to = (at + 1) % items.length;
        else if (e.key === 'ArrowUp') to = (at - 1 + items.length) % items.length;
        else if (e.key === 'Home') to = 0;
        else if (e.key === 'End') to = items.length - 1;
        if (to < 0) return;
        e.preventDefault();
        items[to].focus();
      }
    };
    document.addEventListener('mousedown', m.onDown, true);
    document.addEventListener('keydown', m.onKey, true);
    window.addEventListener('resize', m.onMove);
    window.addEventListener('scroll', m.onMove, true);
    btn.setAttribute('aria-expanded', 'true');

    items.forEach(function(it){
      it.onclick = function(){
        var v = it.getAttribute('data-v');
        if (v === o.current){ closePillMenu(true); return; }
        var back = focusPath(btn);
        closePillMenu(false);
        o.pick(v);
        /* the change redraws the rows and holds them while it is saved; focus goes back to this
           pill as soon as it can take it */
        FOCUS_BACK = back;
        focusBack();
      };
    });
    (items.filter(function(it){ return it.getAttribute('aria-checked') === 'true'; })[0] || items[0]).focus();
  }

  /* the side panel of the three grouped tabs: one line per record, in the order the site lists them */
  function glanceCard(cls, inner, count, foot){
    return '<div class="pvc oag">' +
        '<div class="pvc-head"><span class="eyebrow">Order at a glance</span>' +
          '<span class="ctr">' + esc(count) + '</span></div>' +
        '<div class="' + cls + ' oag-list">' + inner + '</div>' +
        '<div class="pvc-foot">' + esc(foot) + '</div>' +
      '</div>';
  }
  function weightDot(w, label){
    return '<i class="wdot w-' + weightId(w) + '" title="Weight: ' + esc(label) + '"></i>';
  }
  var HONORIFICS = /^(dr|mr|mrs|ms|miss|prof|professor|sir|shri|smt|adv|capt|col|gen|rev)\.?$/i;
  function initials(name){
    var p = String(name || '').trim().split(/\s+/).filter(Boolean)
      .filter(function(w){ return !HONORIFICS.test(w); });
    if (!p.length) return '?';
    var a = p[0][0], b = p.length > 1 ? p[p.length - 1][0] : '';
    return (a + b).toUpperCase();
  }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  /* ============================================================
     WHAT THE GROUPED TABS SHARE

     Speakers sit in groups, sessions in days, partners in tiers. Adding, renaming and
     deleting a group, saving a dialog's queue and removing a record work the same way on
     all three, so they are written once here and each tab only supplies its own words.

     One rule runs through all of it: a record is drawn on the page only after the server
     has stored it, under the id the server gave it.
     ============================================================ */
  var GROUPED = {
    speakers: {
      tab:'speakers', groups:'spkGroups', items:'speakers', groupRes:'speaker-groups', itemRes:'speakers',
      gid:'gid', apiGid:'groupId', group:'group', one:'speaker', many:'speakers', untitled:'Untitled group',
      nameAttr:'data-gname', addAttr:'data-gadd', sideSel:'.spv', side: function(){ return spkPreview(); },
      label: function(r){ return r.name; }, optLabel: function(g){ return g.name; },
      groupHint:'Shown on the site as a heading above its speakers.'
    },
    agenda: {
      tab:'agenda', groups:'agGroups', items:'sessions', groupRes:'agenda-groups', itemRes:'sessions',
      gid:'gid', apiGid:'groupId', group:'day', one:'session', many:'sessions', untitled:'Untitled day',
      nameAttr:'data-agname', addAttr:'data-agadd', sideSel:'.agv', side: function(){ return agPreview(); },
      label: function(r){ return '“' + r.title + '”'; },
      optLabel: function(g){ return g.name + (g.date ? ' — ' + fmtDay(g.date) : ''); },
      groupHint:'Shown on the site as a heading above its sessions.'
    },
    sponsors: {
      tab:'sponsors', groups:'spTiers', items:'partners', groupRes:'partner-tiers', itemRes:'partners',
      gid:'tid', apiGid:'tierId', group:'tier', one:'sponsor', many:'sponsors', untitled:'Untitled tier',
      nameAttr:'data-ptname', addAttr:'data-ptadd', sideSel:'.ptv', side: function(){ return ptPreview(); },
      label: function(r){ return r.name; }, optLabel: function(g){ return g.name; },
      groupHint:'Shown on the site as a heading above its logos.'
    }
  };

  function groupsOf(G){ return S[G.groups] || []; }
  function itemsOf(G){ return S[G.items] || []; }
  function inGroup(G, gid){ return itemsOf(G).filter(function(r){ return r[G.gid] === gid; }); }
  function countOf(G, n){ return n + ' ' + (n === 1 ? G.one : G.many); }

  /* A record can name a group that is not there any more (it was deleted from another browser, or
     the event's content was created without groups). Such records are kept together under an empty
     group id and listed as "Not in a group", so they are never on the site yet missing here. */
  function markLoose(G){
    var known = {};
    groupsOf(G).forEach(function(g){ known[g.id] = true; });
    itemsOf(G).forEach(function(r){ if (!known[r[G.gid]]) r[G.gid] = ''; });
  }

  /* moves records to the end of a group, in the page's list (the caller stores the change) */
  function regroup(G, recs, gid){
    var list = itemsOf(G).filter(function(r){ return recs.indexOf(r) === -1; });
    var at = -1;
    list.forEach(function(r, i){ if (r[G.gid] === gid) at = i; });
    recs.forEach(function(r){ r[G.gid] = gid; });
    S[G.items] = at === -1 ? list.concat(recs) : list.slice(0, at + 1).concat(recs, list.slice(at + 1));
  }

  /* after a removal the positions are closed up, so the next record added cannot share one */
  function renumber(tab, resource, list, more){
    return subWrite(tab, orderWrites(resource, list).concat(more || []), null, 'The new order was not saved.');
  }
  function renumberGrouped(G){
    return renumber(G.tab, G.itemRes, itemsOf(G), orderWrites(G.groupRes, groupsOf(G)));
  }

  /* resolves once the server has removed the record and it is off the page's list */
  function removeRecord(resource, listKey, id){
    return deleteSub(resource, id).then(function(){
      S[listKey] = (S[listKey] || []).filter(function(x){ return x.id !== id; });
    });
  }

  function createGroup(G, name, extra, offset){
    var body = { name: name, order: nextOrder(groupsOf(G)) + (offset || 0) };
    for (var k in (extra || {})) if (extra.hasOwnProperty(k)) body[k] = extra[k];
    return C.createSub(G.groupRes, EV.id, body).then(function(res){
      body.id = res.id;
      S[G.groups] = groupsOf(G).concat([body]).sort(byOrder);
      return body;
    });
  }
  /* what a new group holds besides its name */
  function groupExtra(G, date){
    if (G.tab === 'agenda') return { date: date || '' };
    if (G.tab === 'sponsors') return { weight: 'standard' };
    return null;
  }

  /* ---- Add group / day / tier: one field, stored once, drawn when the server has answered ---- */
  function addGroupDialog(G){
    var isDay = G.tab === 'agenda';
    var name0 = isDay ? 'Day ' + (groupsOf(G).length + 1) : '';
    var date0 = isDay ? agNextDate() : '';
    function typed(){ return JSON.stringify([$('gn-name').value, isDay ? $('gn-date').value : '']); }
    var pristine = '';

    var m = openModal(
        '<div class="modal-head"><h3>Add ' + G.group + '</h3>' + closeBtn() + '</div>' +
        '<form class="modal-form" novalidate>' +
        '<div class="modal-body"><div class="frow">' +
          '<div class="field ' + (isDay ? 'c7' : 'c12') + '"><div class="flabel-row"><label for="gn-name">Name ' +
            '<span class="pill-req">Required</span></label></div>' +
            '<input class="inp" id="gn-name" value="' + esc(name0) + '" maxlength="80" ' +
              'placeholder="' + (isDay ? 'e.g. Day 2' : G.tab === 'sponsors' ? 'e.g. Gold sponsors' : 'e.g. Keynote speakers') + '">' +
            '<p class="hint">' + esc(G.groupHint) + '</p></div>' +
          (isDay ? '<div class="field c5"><label for="gn-date">Date</label>' +
            '<input class="inp" id="gn-date" type="date" value="' + esc(date0) + '"></div>' : '') +
        '</div></div>' +
        '<div class="modal-foot">' +
          '<span class="modal-err" id="gn-err" role="alert"></span>' +
          '<button class="btn btn-secondary" type="button" data-close>Cancel</button>' +
          '<button class="btn btn-primary" type="submit" id="gn-save">Add ' + G.group + '</button>' +
        '</div>' +
        '</form>',
      { style: 'width:min(480px,100%)', initialFocus: '#gn-name',
        isDirty: function(){ return typed() !== pristine; }, onSubmit: saveGroup });
    pristine = typed();
    $('gn-name').select();

    function saveGroup(){
      var name = $('gn-name').value.trim();
      if (!name){ showFieldErrors([['gn-name', 'Give the ' + G.group + ' a name.']]); return; }
      m.busy(true, $('gn-save'));
      subTrack(G.tab, createGroup(G, name, groupExtra(G, isDay ? $('gn-date').value : ''))).then(function(g){
        m.close();
        render();
        notify(g.name + ' added');
      }, function(err){
        console.error('Group create failed:', err);
        m.busy(false, $('gn-save'));
        $('gn-err').textContent = 'The ' + G.group + ' was not added. ' + errText(err);
      });
    }
  }

  /* ---- Delete group / day / tier ----
     Whoever deletes a group that has records in it has to say what happens to them; nothing is
     chosen for them. The group itself goes last, and only if every record was dealt with. */
  function deleteGroupDialog(G, gid){
    var g = groupsOf(G).filter(function(x){ return x.id === gid; })[0];
    if (!g) return;
    var members = inGroup(G, gid), n = members.length;
    var others = groupsOf(G).filter(function(x){ return x.id !== gid; });
    function deleted(){
      render();
      notify(cap(G.group) + ' deleted');
      renumberGrouped(G);
    }

    if (!n){
      confirmDialog('Delete ' + g.name + '?',
        '<p>This ' + G.group + ' is empty, so nothing else changes.</p>', 'Delete ' + G.group, G.tab,
        function(){ return removeRecord(G.groupRes, G.groups, gid); },
        'The ' + G.group + ' was not deleted.', deleted);
      return;
    }

    var them = n === 1 ? 'the ' + G.one : 'the ' + n + ' ' + G.many;
    var m = openModal(
        '<div class="modal-head"><h3>Delete ' + esc(g.name) + '?</h3></div>' +
        '<form class="modal-form" novalidate>' +
        '<div class="modal-body">' +
          '<p class="gd-lead">' + esc(g.name) + ' has ' + countOf(G, n) + '. Choose what happens to ' +
            (n === 1 ? 'it' : 'them') + ' before the ' + G.group + ' is deleted.</p>' +
          '<div class="gd-choices" role="radiogroup" aria-label="What happens to ' + esc(them) + '">' +
            (others.length
              ? '<label class="gd-choice"><input type="radio" name="gd" value="move">' +
                  '<span>Move ' + esc(them) + ' to</span>' +
                  '<select class="inp" id="gd-dest" aria-label="Move to">' + others.map(function(o){
                    return '<option value="' + esc(o.id) + '">' + esc(o.name) + '</option>';
                  }).join('') + '</select></label>'
              : '') +
            '<label class="gd-choice"><input type="radio" name="gd" value="delete">' +
              '<span>Delete ' + esc(them) + ' too <em>' + (n === 1 ? 'It' : 'They') + ' will no longer appear on your site. This cannot be undone.</em></span></label>' +
          '</div>' +
        '</div>' +
        '<div class="modal-foot">' +
          '<span class="modal-err" id="gd-err" role="alert"></span>' +
          '<button class="btn btn-secondary" type="button" id="gd-no" data-close>Cancel</button>' +
          '<button class="btn btn-danger" type="submit" id="gd-go" disabled>Delete ' + G.group + '</button>' +
        '</div>' +
        '</form>',
      { style: 'width:min(540px,100%)', initialFocus: '#gd-no', onSubmit: go });

    function choice(){
      var on = document.querySelector('input[name="gd"]:checked');
      return on ? on.value : '';
    }
    function destName(){
      var d = $('gd-dest'), name = '';
      others.forEach(function(o){ if (d && o.id === d.value) name = o.name; });
      return name;
    }
    function paintGo(){
      var c = choice(), b = $('gd-go');
      b.disabled = !c;
      b.textContent = c === 'move' ? 'Delete ' + G.group + ' and move ' + n + ' to ' + destName()
        : c === 'delete' ? 'Delete ' + G.group + ' and ' + (n === 1 ? 'its ' + G.one : 'its ' + n + ' ' + G.many)
        : 'Delete ' + G.group;
    }
    Array.prototype.forEach.call(document.querySelectorAll('input[name="gd"]'), function(r){ r.onchange = paintGo; });
    if ($('gd-dest')) $('gd-dest').onchange = function(){
      document.querySelector('input[name="gd"][value="move"]').checked = true;
      paintGo();
    };

    function go(){
      var c = choice(), dest = $('gd-dest') ? $('gd-dest').value : '';
      if (!c) return;
      var ids = members.map(function(r){ return r.id; });
      m.busy(true, $('gd-go'), 'Deleting…');
      subTrack(G.tab, settleAll(members.map(function(r){
        if (c === 'delete') return deleteSub(G.itemRes, r.id);
        var patch = {}; patch[G.apiGid] = dest;
        return updateSub(G.itemRes, r.id, patch);
      })).then(function(){
        return deleteSub(G.groupRes, gid);
      }).then(function(){
        if (c === 'move') regroup(G, members, dest);
        else S[G.items] = itemsOf(G).filter(function(r){ return ids.indexOf(r.id) === -1; });
        S[G.groups] = groupsOf(G).filter(function(x){ return x.id !== gid; });
      })).then(function(){
        m.close();
        deleted();
        if (c === 'delete' && G.tab === 'speakers') agDropSpeakers(ids);
      }, function(err){
        /* some of the records may have been moved or removed before the failure: show what the
           server holds now */
        m.close();
        notifyError(err, { what: 'The ' + G.group + ' was not deleted.' });
        reloadSub(G.tab);
      });
    }
  }

  /* ---- rename a group by typing in its title — no dialog for one field ----
     Committed when the field is left, which is usually a click on something else: the page is
     patched in place rather than redrawn, because a redraw would swallow that click. */
  function wireGroupNames(G){
    document.querySelectorAll('[' + G.nameAttr + ']').forEach(function(inp){
      var id = inp.getAttribute(G.nameAttr);
      inp.onchange = function(){
        var g = groupsOf(G).filter(function(x){ return x.id === id; })[0];
        var v = inp.value.trim() || G.untitled;
        inp.value = v;
        inp.title = v;
        if (!g || g.name === v) return;
        g.name = v;
        var add = document.querySelector('[' + G.addAttr + '="' + CSS.escape(id) + '"]');
        if (add) add.innerHTML = svg(IC.plus, 13) + ' Add to ' + esc(v);
        var side = document.querySelector(G.sideSel);
        if (side) side.innerHTML = G.side();
        subWrite(G.tab, updateSub(G.groupRes, id, { name: v }), null,
          'The new name of the ' + G.group + ' was not saved.', true);
      };
      inp.onkeydown = function(e){ if (e.key === 'Enter') inp.blur(); };
    });
  }

  /* ---- the group field of an add / edit dialog ----
     Either one of the groups that exist, or the name of a new one. A new one is only a name in
     the dialog until the dialog is saved; cancelling leaves nothing behind. */
  function groupPickId(e, id){ return e.newGroup != null ? id + '-new' : id; }
  function groupPickHTML(G, e, id, canAdd){
    var groups = groupsOf(G);
    if (e.newGroup != null){
      return '<div class="inp-grp">' +
          '<input class="inp" id="' + id + '-new" value="' + esc(e.newGroup) + '" maxlength="80" ' +
            'placeholder="Name of the new ' + G.group + '">' +
          (groups.length ? '<button class="gbtn" type="button" id="' + id + '-old">Use existing</button>' : '') +
        '</div>' +
        '<p class="hint">The ' + G.group + ' is created when you save.</p>';
    }
    var select = '<select class="inp" id="' + id + '">' +
      (e[G.gid] ? '' : '<option value="" selected>Not in a ' + G.group + '</option>') +
      groups.map(function(g){
        return '<option value="' + esc(g.id) + '"' + (g.id === e[G.gid] ? ' selected' : '') + '>' +
          esc(G.optLabel(g)) + '</option>';
      }).join('') + '</select>';
    if (!canAdd) return select;
    return '<div class="inp-grp">' + select +
      '<button class="gbtn" type="button" id="' + id + '-add">' + svg(IC.plus, 12) + ' New</button></div>';
  }
  function readGroupPick(G, e, id){
    var neu = $(id + '-new');
    if (neu) e.newGroup = neu.value.trim();
    else if ($(id)) e[G.gid] = $(id).value;
  }
  /* flip(true) switches the entry on screen to "a new group", flip(false) back to the list */
  function wireGroupPick(id, flip){
    var add = $(id + '-add'), old = $(id + '-old');
    if (add) add.onclick = function(){ flip(true); };
    if (old) old.onclick = function(){ flip(false); };
  }
  function groupPickProblem(G, e, id){
    return e.newGroup != null && !e.newGroup
      ? [id + '-new', 'Name the new ' + G.group + (groupsOf(G).length ? ', or use an existing one.' : '.')] : null;
  }

  /* Creates the groups that queue entries name and that do not exist yet — one per name — and
     points the entries at them. An entry whose group could not be created carries the reason. */
  function makeDraftGroups(G, Q, date){
    var wanted = {}, keys = [];
    Q.forEach(function(e){
      if (e.newGroup == null) return;
      var k = e.newGroup.toLowerCase();
      var have = groupsOf(G).filter(function(g){ return String(g.name || '').toLowerCase() === k; })[0];
      if (have){ e[G.gid] = have.id; e.newGroup = null; return; }
      if (!wanted[k]){ wanted[k] = { name: e.newGroup, entries: [] }; keys.push(k); }
      wanted[k].entries.push(e);
    });
    return Promise.all(keys.map(function(k, i){
      var w = wanted[k];
      return createGroup(G, w.name, groupExtra(G, date), i).then(function(g){
        w.entries.forEach(function(e){ e[G.gid] = g.id; e.newGroup = null; });
      }, function(err){
        console.error('Group create failed:', err);
        w.entries.forEach(function(e){ e.err = err; });
      });
    }));
  }

  /* ---- saving an add / edit dialog ----
     The dialog stays open, busy, until the server has answered. Each record of an add is sent
     and settled by itself: the ones that were stored go onto the page with their real ids and
     leave the dialog; the ones that were not stay in it, exactly as typed, with the reason.
     cfg  G, Q, modal
          editing      the stored record being edited, or null for an add
          saveBtn, errEl   ids of the dialog's save button and footer message
          record(e)    the page's record for a queue entry (no id, no order)
          body(rec)    what the API stores for that record (no order)
          groupDate    date for a day created along the way
          repaint()    redraws the dialog's queue, form and save button */
  function saveQueue(cfg){
    var G = cfg.G, Q = cfg.Q, modal = cfg.modal, btn = $(cfg.saveBtn);
    var added = [];
    Q.forEach(function(e){ e.err = null; });
    modal.busy(true, btn);

    subTrack(G.tab, makeDraftGroups(G, Q, cfg.groupDate).then(function(){
      if (cfg.editing){
        if (Q[0].err) throw Q[0].err;
        var rec = cfg.record(Q[0]);
        return updateSub(G.itemRes, cfg.editing.id, cfg.body(rec)).then(function(){
          rec.id = cfg.editing.id;
          rec.order = cfg.editing.order;
          S[G.items] = itemsOf(G).map(function(x){ return x.id === rec.id ? rec : x; });
        });
      }
      var order0 = nextOrder(itemsOf(G)), slots = [];
      return Promise.all(Q.map(function(e, i){
        if (e.err) return null;
        var rec = cfg.record(e), body = cfg.body(rec);
        body.order = order0 + i;
        return C.createSub(G.itemRes, EV.id, body).then(function(res){
          rec.id = res.id;
          rec.order = body.order;
          slots[i] = rec;
          e.saved = true;
        }, function(err){
          console.error('Create failed:', err);
          e.err = err;
        });
      })).then(function(){
        added = slots.filter(Boolean);
        S[G.items] = itemsOf(G).concat(added);
      });
    })).then(function(){
      if (cfg.editing){
        modal.close();
        render();
        notify(cap(G.one) + ' updated');
        return;
      }
      var failed = Q.filter(function(e){ return !e.saved; });
      if (added.length) notify(added.length === 1 ? G.label(added[0]) + ' added' : added.length + ' ' + G.many + ' added');
      if (!failed.length){ modal.close(); render(); return; }
      render();
      Q.length = 0;
      failed.forEach(function(e){ Q.push(e); });
      modal.busy(false, btn);
      cfg.repaint();
      $(cfg.errEl).textContent = (failed.length === 1 ? G.label(failed[0]) + ' was not saved. '
        : failed.length + ' ' + G.many + ' were not saved. ') + errText(failed[0].err) +
        (added.length ? ' The rest ' + (added.length === 1 ? 'is' : 'are') + ' saved.' : '');
    }, function(err){
      console.error('Save failed:', err);
      /* a group created on the way is real even though the record's own save failed */
      render();
      modal.busy(false, btn);
      cfg.repaint();
      $(cfg.errEl).textContent = 'Your changes were not saved. ' + errText(err);
    });
  }

  /* "Remove" inside an edit dialog: asked in the dialog itself, so what was typed is still there
     when the answer is no, and the record leaves the page only once the server has removed it.
     o  btn, errEl   ids of the dialog's Remove button and footer message
        question     what is asked
        tab, work()  the tab, and a function returning the removal (see removeRecord)
        failed       a sentence saying it was not removed
        done()       after the dialog has closed */
  function removeInDialog(modal, o){
    modal.ask(o.question, 'Keep', 'Remove', function(){
      var btn = $(o.btn);
      modal.busy(true, btn, 'Removing…');
      subTrack(o.tab, o.work()).then(function(){
        modal.close();
        render();
        o.done();
      }, function(err){
        console.error(o.failed, err);
        modal.busy(false, btn);
        $(o.errEl).textContent = o.failed + ' ' + errText(err);
      });
    });
  }

  /* ---------------- model ----------------
     S.speakers/S.spkGroups are real `speakers`/`speaker-groups` subcollection records
     now (see loadSpeakers() below, and SUB/render() for when it's fetched) — this file's
     own id/field names (gid, photo, logo) are kept as the internal shape so none of the
     render/wire code below has to change; the backend's groupId/photoUrl/logoUrl names
     are only ever touched at the edges, mapping in on load and back out on every write. */
  function spkAll(){ return S.speakers || []; }
  function spkGroups(){ return S.spkGroups || []; }
  function spkIn(gid){ return spkAll().filter(function(p){ return p.gid === gid; }); }
  function spkById(id){
    var a = spkAll();
    for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
    return null;
  }
  function spkCommit(){ render(); }

  function loadSpeakers(){
    return Promise.all([
      C.fetchSub('speaker-groups', EV.id),
      C.fetchSub('speakers', EV.id)
    ]).then(function(res){
      S.spkGroups = (res[0] || []).slice().sort(byOrder).map(function(g){
        return { id: g.id, name: g.name, order: g.order };
      });
      S.speakers = (res[1] || []).slice().sort(byOrder).map(function(p){
        return {
          id: p.id, gid: p.groupId, name: p.name, desig: p.desig, comp: p.comp,
          photo: p.photoUrl || null, logo: p.logoUrl || null, colour: p.colour,
          weight: p.weight, status: p.status, email: p.email, phone: p.phone,
          li: p.li, bio: p.bio, order: p.order
        };
      });
      markLoose(GROUPED.speakers);
    });
  }

  /* One PATCH for every record in `list` whose position is no longer its stored `order`. */
  function orderWrites(resource, list){
    var writes = [];
    list.forEach(function(x, i){
      if (x.order !== i){
        x.order = i;
        writes.push(updateSub(resource, x.id, { order: i }));
      }
    });
    return writes;
  }

  /* called after any reorder (move, drag-drop, sort-by-weight) — only the rows whose position
     actually moved are sent. `also` is any other write that belongs to the same action (a row
     dragged into another group changes its group as well): one action, one outcome. */
  function persistSpeakerOrder(also, okText){
    return subWrite('speakers', orderWrites('speakers', spkAll()).concat(also || []), okText,
      'The new order was not saved.');
  }
  function persistGroupOrder(){
    return subWrite('speakers', orderWrites('speaker-groups', spkGroups()), null,
      'The new group order was not saved.');
  }

  /* ---------------- photo helpers ---------------- */
  /* Everything that leaves the dialog is already square and already
     small — the console never hands a 6 MB camera file to the page. */
  function cropToSquare(img, tx, ty, zoom, view, out){
    var cover = Math.max(view / img.naturalWidth, view / img.naturalHeight);
    var s = cover * zoom;
    var cv = document.createElement('canvas');
    cv.width = out; cv.height = out;
    var cx = cv.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, out, out);
    cx.drawImage(img, (-tx) / s, (-ty) / s, view / s, view / s, 0, 0, out, out);
    return cv.toDataURL('image/jpeg', 0.86);
  }
  function shrinkLogo(img, maxW, maxH){
    var r = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.naturalWidth * r));
    cv.height = Math.max(1, Math.round(img.naturalHeight * r));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/png');
  }
  function readImage(file, cb){
    if (!file || !/^image\//.test(file.type)){ cb(null, 'That file is not an image.'); return; }
    if (file.size > 12 * 1024 * 1024){ cb(null, 'That image is over 12 MB. Try a smaller one.'); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){ cb(im, null); };
      im.onerror = function(){ cb(null, 'That image could not be read.'); };
      im.src = fr.result;
    };
    fr.onerror = function(){ cb(null, 'That file could not be read.'); };
    fr.readAsDataURL(file);
  }
