  /* The event's real history (GET /api/event/history): every recorded action, newest first, with who did it
     and when; for a save or an approval request the changes section by section, before and after; for a
     Content record or a detail of the event the fields that changed; and who approved what went live. */
  var HIST = { items: null, usage: null, at: 0, loading: false, error: null };
  var HIST_AREA = {
    'created':'Event', 'updated':'Basic details', 'status-changed':'Status', 'settings-changed':'Settings', 'site-saved':'Site · saved to staging',
    'approval-requested':'Site · sent for approval', 'approved':'Site · approved', 'rejected':'Site · rejected', 'published':'Site · live',
    'unpublished':'Site · taken down', 'deleted':'Event', 'restored':'Event', 'cloned':'Event', 'content-seeded':'Content',
    'content-added':'Content · added', 'content-changed':'Content · changed', 'content-removed':'Content · removed',
    'registration-updated':'Registrations', 'registration-deleted':'Registrations', 'leads-imported':'Leads', 'leads-deleted':'Leads',
    'registration-approved':'Registrations · approved', 'registration-declined':'Registrations · declined',
    'form-created':'Form created', 'form-updated':'Form edited', 'form-deleted':'Form deleted', 'form-default':'Default form changed'
  };
  var HIST_KIND = { text:'Text', look:'Look', pictures:'Pictures', added:'Section added', removed:'Section removed', moved:'Section moved', hidden:'Section hidden', shown:'Section shown again', design:'Site design' };
  function histWhen(iso){
    var d = new Date(iso || '');
    if (isNaN(d)) return '—';
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  /* [{ what, before, after }] — the before/after lines of one history entry */
  function histLines(h){
    var out = [];
    (h.changes || []).forEach(function(c){
      out.push({ what: (c.name || c.section || 'Page') + ' — ' + (HIST_KIND[c.type] || c.type), before: c.before || '', after: c.after || (c.note || '') });
    });
    (h.fields || []).forEach(function(f){ out.push({ what: f.field, before: f.before, after: f.after }); });
    return out;
  }
  function histApprovedBy(h){
    var a = h.approval;
    if (!a) return '';
    if (a.status === 'approved') return a.decidedBy;
    if (a.status === 'rejected') return 'rejected by ' + a.decidedBy;
    return 'waiting';
  }
  function loadHistory(){
    if (HIST.loading) return;
    HIST.loading = true;
    /* a browser may still hold the previous edit-event-core.js for a few minutes after a release */
    var asked;
    try {
      asked = C.fetchHistoryAndUsage ? C.fetchHistoryAndUsage(EV.id)
        : C.fetchHistory(EV.id).then(function(items){ return { items: items, aiUsage: null }; });
    } catch (e) { asked = Promise.reject(e); }
    asked.then(function(got){ HIST.items = got.items; HIST.usage = got.aiUsage; HIST.error = null; }, function(err){ HIST.error = (err && err.message) || 'The history could not be loaded.'; })
      .then(function(){ HIST.loading = false; HIST.at = Date.now(); if (routeId() === 'settings/history') render(); });
  }
  function exportHistory(){
    function cell(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var rows = [['When', 'Who', 'Area', 'What', 'Item', 'Before', 'After', 'Version', 'Requested by', 'Approved by', 'Approved at']];
    (HIST.items || []).forEach(function(h){
      var a = h.approval || {}, lines = histLines(h);
      var tail = [h.version || '', a.requestedBy || '', a.status === 'approved' ? a.decidedBy : '', a.status === 'approved' ? histWhen(a.decidedAt) : ''];
      var head = [histWhen(h.at), h.by, HIST_AREA[h.action] || h.action, h.detail];
      if (!lines.length) rows.push(head.concat(['', '', ''], tail));
      lines.forEach(function(l){ rows.push(head.concat([l.what, l.before, l.after], tail)); });
    });
    var blob = new Blob(['﻿' + rows.map(function(r){ return r.map(cell).join(','); }).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = EV.id + '-history.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
  }
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest && e.target.closest('[data-hist]');
    if (!t) return;
    if (t.getAttribute('data-hist') === 'export') exportHistory();
    else { HIST.items = null; render(); }
  });

  /* What the AI has cost this event, step by step (events/<id>.aiUsage, written by the server as each model
     call is made). Claude's calls are priced from Anthropic's list prices; Gemini's are counted in calls and
     tokens only, so the dollar figure is what Claude cost. */
  var USAGE_STEPS = {
    'extract-brief': 'Reading the brief', 'ingest-source': 'Reading reference pages', 'plan-structure': 'Designing the site',
    'generate-content': 'Writing the sections', 'pictures': 'Pictures', 'logo-unit': 'Reading the logo unit',
    'redesign-section': 'Redesign with AI', 'chat-edit': 'ETB2B AI chat', 'suggest-design': 'Design suggestions',
    'promo-write': 'Promotions copy'
  };
  function money(v){ v = +v || 0; return '$' + (v >= 1 ? v.toFixed(2) : v.toFixed(3)); }
  function usagePanel(){
    var u = HIST.usage;
    if (!u || !u.calls) return '';
    var steps = Object.keys(u.byRoute || {}).map(function(k){ return [k, u.byRoute[k] || {}]; })
      .sort(function(a, b){ return (+b[1].usd || 0) - (+a[1].usd || 0) || (+b[1].calls || 0) - (+a[1].calls || 0); });
    var rows = steps.map(function(s){
      var v = s[1], tokens = (+v.inputTokens || 0) + (+v.outputTokens || 0);
      return '<tr><td class="td-strong">' + esc(USAGE_STEPS[s[0]] || s[0]) + '</td>' +
        '<td class="num">' + esc(String(+v.calls || 0)) + (v.pictures ? ' <span style="color:var(--text-muted)">(' + esc(String(v.pictures)) + ' pictures)</span>' : '') + '</td>' +
        '<td class="num">' + (tokens ? esc(Math.round((+v.inputTokens || 0) / 1000) + 'k in · ' + Math.round((+v.outputTokens || 0) / 1000) + 'k out') : '—') + '</td>' +
        '<td class="num">' + (v.usd ? esc(money(v.usd)) : (v.geminiCalls && !v.claudeCalls ? '<span style="color:var(--text-muted)">Gemini</span>' : '—')) + '</td></tr>';
    }).join('');
    return panelFlush('AI usage', money(u.usd) + ' on Claude · ' + u.calls + ' AI calls',
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Step</th><th>Calls</th><th>Tokens</th><th>Claude cost</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p style="padding:10px 16px 14px;margin:0;font-size:12px;color:var(--text-muted)">Claude at Anthropic\'s list prices. Gemini (pictures, and any step Claude could not answer) is counted in calls and tokens, not priced here.</p>');
  }

  function viewHistory(){
    if (!HIST.loading && (!HIST.items && !HIST.error || Date.now() - HIST.at > 20000)) loadHistory();
    var head = function(count){
      return vhead('Event History', 'Every change made to this event, newest first: who made it, when, what it was before and after, and who approved what went live.',
        '<button class="btn btn-secondary btn-sm" type="button" data-hist="refresh">Refresh</button> ' +
        '<button class="btn btn-secondary btn-sm" type="button" data-hist="export"' + (count ? '' : ' disabled') + '>' + svg(IC.down, 13) + ' Export log</button>');
    };
    if (!HIST.items){
      return head(0) + panelFlush('Audit trail', '', '<p style="padding:22px;color:var(--text-muted)">' + esc(HIST.error || 'Loading the history…') + '</p>');
    }
    var rows = HIST.items.map(function(h){
      var lines = histLines(h), a = h.approval;
      var more = lines.length ? '<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--text-muted);font-size:12px">Before and after (' + lines.length + ')</summary>' +
        '<table style="width:100%;margin-top:6px;font-size:12px;border-collapse:collapse">' + lines.map(function(l){
          return '<tr><td style="padding:4px 8px 4px 0;vertical-align:top;font-weight:600;width:28%">' + esc(l.what) + '</td>' +
            '<td style="padding:4px 8px;vertical-align:top;background:var(--danger-soft, rgba(179,38,30,.08));width:36%;white-space:pre-wrap;word-break:break-word">' + esc(l.before || '—') + '</td>' +

  function wireGallery(){
    var fileInput = $('gal-file');

    if (fileInput) fileInput.onchange = function(){
      var files = Array.prototype.slice.call(fileInput.files || []);

      if (!files.length) return;
      var order0 = nextOrder(galAll());
      files.forEach(function(file, idx){
        /* readImage() (defined under Speakers' photo helpers) is the same FileReader-based
           dataURL reader cropToSquare/shrinkLogo build on — reused as-is, no cropping needed here */
        readImage(file, function(img, err){
          if (err){ notifyError((file.name ? '“' + file.name + '”: ' : '') + err); return; }
          /* STOPGAP: no Storage upload endpoint for gallery images yet, so the dataURL itself is
             stored directly in imageUrl — see the same note on Speakers' photo/logo fields above.
             Should move to a real upload (functions/lib/api.js's buildHeroImage() pattern) once
             one exists. */
          var item = { imageUrl: img.src, caption: '', order: order0 + idx };
          /* the photo is drawn once it is stored; several chosen together arrive in any order */
          subWrite('gallery',
            C.createSub('gallery', EV.id, item).then(function(res){
              item.id = res.id;
              S.gallery = galAll().concat([item]).sort(byOrder);
            }),
            null, (file.name ? '“' + file.name + '”' : 'The photo') + ' was not saved.'
          ).then(function(ok){ if (ok) render(); });
        });

    document.querySelectorAll('[data-galcap]').forEach(function(inp){
      var id = inp.getAttribute('data-galcap');
      inp.onchange = function(){
        var v = inp.value.trim();
        var g = galById(id); if (g) g.caption = v;
        subWrite('gallery', updateSub('gallery', id, { caption: v }), null,
          'The caption was not saved.', true);

    });

    document.querySelectorAll('[data-galup]').forEach(function(b){

    document.querySelectorAll('[data-galdown]').forEach(function(b){

          'The photo was not removed.',
          function(){
            render();
            notify('Photo removed');
            persistGalleryOrder();
          });
      };
    });

    galDragDrop();

  /* drag a photo onto another to put it in that place */
  function galDragDrop(){
    var dragId = null;
    document.querySelectorAll('.media-card[data-gal]').forEach(function(card){
      card.addEventListener('dragstart', function(e){
        /* dragging from inside the caption field is selecting text, not moving the photo */
        if (e.target.closest && e.target.closest('input')){ e.preventDefault(); return; }
        dragId = card.getAttribute('data-gal');
        card.classList.add('drag');
        try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
      });
      card.addEventListener('dragend', function(){
        dragId = null;
        document.querySelectorAll('.media-card').forEach(function(c){
          c.classList.remove('drag', 'over-before', 'over-after');
        });
      });
      function after(e){
        var r = card.getBoundingClientRect();
        return (e.clientX - r.left) > r.width / 2;
      }
      card.addEventListener('dragover', function(e){
        if (!dragId || card.getAttribute('data-gal') === dragId) return;
        e.preventDefault();
        card.classList.toggle('over-after', after(e));
        card.classList.toggle('over-before', !after(e));
      });
      card.addEventListener('dragleave', function(){ card.classList.remove('over-before', 'over-after'); });
      card.addEventListener('drop', function(e){
        if (!dragId || card.getAttribute('data-gal') === dragId) return;
        e.preventDefault();
        var list = galAll();
        var from = list.indexOf(galById(dragId)), to = list.indexOf(galById(card.getAttribute('data-gal')));
        if (from < 0 || to < 0) return;
        /* the place it lands in once it has been taken out of where it was */
        var at = to + (after(e) ? 1 : 0);
        galMove(dragId, from < at ? at - 1 : at);
      });
    });
  }

  /* ============================================================
     VIEW : SETTINGS › REGISTRATION FORMS

     The event's master switch, capacity and target (settings.registration, saved with the event), and its
     forms: the one builder (forms-builder.js) the site editor's Forms panel uses too, on the same forms
     (events/<id>/forms). The builder and this panel are built once per page and put back into the view
     each time it is drawn, so a form being edited survives anything else on the page redrawing.
     ============================================================ */
  var REGF = null;      // { node, builder, ... } once built

  function regSettings(){
    var r = (EV && EV.settings && EV.settings.registration) || {};
    return { open: r.open !== false, capacity: r.capacity == null ? '' : String(r.capacity), target: r.target == null ? '' : String(r.target) };
  }

  function buildRegForms(){
    var node = document.createElement('div');
    node.className = 'regforms';
    node.innerHTML =
      '<div class="panel"><div class="panel-head"><h3>Registration</h3><span class="sub">For the whole event, every form included</span></div>' +
      '<div class="panel-body">' +
        '<div class="frow">' +
          '<div class="field c12"><label class="fb-switch" for="rg-open">' +
            '<input type="checkbox" role="switch" id="rg-open" aria-describedby="rg-open-hint">' +
            '<span class="fb-track" aria-hidden="true"></span><span class="fb-switch-l">Registration open</span></label>' +
            '<span class="hint" id="rg-open-hint">Turn off to close every form.</span></div>' +
          '<div class="field c6"><label for="rg-capacity">Capacity</label><input class="inp" id="rg-capacity" type="text" inputmode="numeric" autocomplete="off" placeholder="No limit" aria-describedby="rg-capacity-hint">' +
            '<span class="hint" id="rg-capacity-hint">When this many registrations are confirmed, new ones join the waitlist. Only forms that count as registrations use it.</span></div>' +
          '<div class="field c6"><label for="rg-target">Target</label><input class="inp" id="rg-target" type="text" inputmode="numeric" autocomplete="off" placeholder="None" aria-describedby="rg-target-hint">' +
            '<span class="hint" id="rg-target-hint">The number of registrations you are aiming for. Optional.</span></div>' +
        '</div>' +
        '<p class="rg-err" id="rg-err" role="alert" hidden></p>' +
        '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px">' +
          '<button class="btn btn-primary btn-sm" type="button" id="rg-save" disabled>Save</button>' +
          '<button class="btn btn-secondary btn-sm" type="button" id="rg-discard" disabled>Discard changes</button>' +
          '<span id="rg-state" style="font-size:12px;color:var(--text-muted)" role="status"></span>' +
        '</div>' +
      '</div></div>' +
      /* not in a .panel: its overflow would stop the builder's bar and preview staying in view */
      '<div class="rg-builder" id="rg-builder"></div>' +
      '<p class="rg-honest">Confirmation emails, WhatsApp messages and paid registration are not available yet.</p>';

    var stored = regSettings();
    var token = (EV && typeof EV.detailsUpdatedAt === 'string' && EV.detailsUpdatedAt) || (EV && typeof EV.updatedAt === 'string' && EV.updatedAt) || '';
    var saving = false;
    function q(id){ return node.querySelector('#' + id); }
    function current(){ return { open: q('rg-open').checked, capacity: q('rg-capacity').value.trim(), target: q('rg-target').value.trim() }; }
    function regDirty(){ var c = current(); return c.open !== stored.open || c.capacity !== stored.capacity || c.target !== stored.target; }
    function paint(){
      var d = regDirty();
      q('rg-save').disabled = !d || saving;
      q('rg-discard').disabled = !d || saving;
      q('rg-save').textContent = saving ? 'Saving…' : 'Save';
      q('rg-state').textContent = d ? 'Unsaved changes' : '';
    }
    function fill(){
      q('rg-open').checked = stored.open; q('rg-capacity').value = stored.capacity; q('rg-target').value = stored.target;
      showErr('');
      paint();
    }
    function showErr(msg, field){
      var box = q('rg-err');
      box.textContent = msg || ''; box.hidden = !msg;
      ['rg-capacity', 'rg-target'].forEach(function(id){ q(id).removeAttribute('aria-invalid'); });
      if (field) { q(field).setAttribute('aria-invalid', 'true'); q(field).focus(); }
    }
    function num(v, label, id){
      if (v === '') return { value: null };
      if (!/^\d+$/.test(v) || +v < 1 || +v > 10000000) return { error: label + ' must be a whole number of 1 or more, or left empty.', field: id };
      return { value: +v };
    }
    function saveReg(){
      if (!regDirty()) return Promise.resolve();
      var c = current();
      var cap = num(c.capacity, 'Capacity', 'rg-capacity'), tgt = num(c.target, 'Target', 'rg-target');
      var bad = cap.error ? cap : tgt.error ? tgt : null;
      if (bad){ showErr(bad.error, bad.field); return Promise.reject({ invalid: true }); }
      saving = true; showErr(''); paint();
      var reg = { open: c.open, capacity: cap.value, target: tgt.value };
      return C.updateEvent(EV.id, { settings: { registration: reg } }, { ifUpdatedAt: token }).then(function(res){
        saving = false;
        token = (res && res.updatedAt) || token;
        EV.settings = EV.settings || {};
        EV.settings.registration = Object.assign({}, EV.settings.registration || {}, reg);
        if (res && res.updatedAt){ EV.updatedAt = res.updatedAt; EV.detailsUpdatedAt = res.updatedAt; }
        stored = { open: reg.open, capacity: reg.capacity == null ? '' : String(reg.capacity), target: reg.target == null ? '' : String(reg.target) };
        paint();
        notify(reg.open ? 'Registration settings saved' : 'Registration settings saved. Every form is now closed.');
        if (REGF && REGF.builder) REGF.builder.reload();
      }, function(err){
        saving = false; paint();
        if (err && err.status === 409 && err.code === 'stale'){
          showErr('Someone else changed this event’s settings since this page was opened. Reload the page to see their changes, then make yours again.');
        } else {
          showErr(errText(err));
        }
        throw err;
      });
    }
    function discardReg(){ fill(); }
    q('rg-open').addEventListener('change', paint);
    q('rg-capacity').addEventListener('input', function(){ q('rg-capacity').removeAttribute('aria-invalid'); paint(); });
    q('rg-target').addEventListener('input', function(){ q('rg-target').removeAttribute('aria-invalid'); paint(); });
    q('rg-save').addEventListener('click', function(){ saveReg().then(null, function(){ /* shown above */ }); });
    q('rg-discard').addEventListener('click', function(){ discardReg(); notify('Changes discarded'); });
    fill();

    var builder = null;
    if (window.RevampFormsBuilder){
      builder = RevampFormsBuilder.mount(q('rg-builder'), { eventId: EV.id, core: C, layout: 'wide', usage: null, toast: notify });
    } else {
      q('rg-builder').innerHTML = '<p style="color:var(--text-muted)">The forms builder could not be loaded. Reload the page to try again.</p>';
    }
    return {
      node: node, builder: builder, eventId: EV.id,
      dirty: function(){ return regDirty() || !!(builder && builder.isDirty()); },
      save: function(){
        return saveReg().then(function(){ return builder && builder.isDirty() ? builder.save() : null; });
      },
      discard: function(){ discardReg(); if (builder) builder.discard(); }
    };
  }

  /* ------------------------------------------------------------------
     Everything the dashboard file is allowed to touch. Keeping it to an
     explicit bundle means edit-event-dashboard.js can be edited on its own
     without guessing what is in scope here.
     ------------------------------------------------------------------ */
  var DASH = window.EditEventDashboard || { view: function(){ return ''; }, wire: function(){} };

  /* Built by core, so the console and the standalone workbenches hand each
     section file exactly the same object. */
  var CTX = C.makeCtx({
    EV: EV, S: S,
    vhead:  function(t, sub, right){ return vhead(t, sub, right); },
    go:     function(r){ return go(r, true); },
    render: function(){ return render(); },

  });
  /* the section files report through the console's own two kinds of message */

  CTX.toastError = notifyError;

  var VIEWS = {
    'dashboard':            function(){ return DASH.view(CTX); },

    'content/basics':       viewBasics,
    'content/speakers':     viewSpeakers,
    'content/agenda':       viewAgenda,

    'settings/links':       viewSocialLinks,
    'settings/visibility':  viewVisibility,
    'settings/advanced':    viewSetAdv,
    'settings/history':     viewHistory
  };

  function render(){
    var r = routeId();
    /* a menu belongs to a row that is about to be redrawn */
    closePillMenu(false);

    var subKey = SUB_ROUTE_KEY[r];
    if (subKey && !SUB[subKey]){
      renderSubLoading();
      paintWriting();
      /* The answer may arrive after the user has moved on: it then only fills the cache, and never
         pulls the view back to the tab that asked for it. */
      if (!SUB_LOADING[subKey]){
        SUB_LOADING[subKey] = true;
        SUB_LOADERS[subKey]().then(function(){
          SUB_LOADING[subKey] = false;
          SUB[subKey] = true;
          keepSaved();
          if (routeId() === r) render();
          flushReloads();
        }).catch(function(err){
          SUB_LOADING[subKey] = false;
          /* a failed fetch leaves nothing newer to wait for; the retry fetches afresh */
          delete SUB_STALE[subKey];
          /* A tab that was on screen is being fetched again because a change to it failed, and the
             user has been told so. If the fetch fails too, they get back what was last saved
             rather than losing the whole list to an error screen. */
          if (restoreSaved(subKey)){
            console.error('Tab reload failed; showing the last saved state:', err);
            SUB[subKey] = true;
            if (routeId() === r) render();
            return;
          }
          if (routeId() === r) renderSubLoadError(err, function(){ render(); });
        });
      }
      return;
    }

    var fn = VIEWS[r];
    if (!fn){ go('content/basics'); return; }
    /* the view that is about to be replaced has been left; the new one registers itself if it
       has a form to guard */
    LEAVE = NOT_DIRTY;
    $('view').innerHTML = tabsHTML() + fn();

    /* generic wiring available on every view ([data-tab] and [data-goto] are handled by the one
       listener boot() puts on #view, so they also work on the loading and error states) */
    document.querySelectorAll('[data-save]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        notify(b.getAttribute('data-save'));
      });
    });

    /* per-view wiring */
    if (r === 'dashboard') DASH.wire(CTX);
    if (r === 'content/basics'){ wireBasics(); mountHeroVideo(); }
    if (r === 'content/speakers') wireSpeakers();
    if (r === 'content/agenda') wireAgenda();
    if (r === 'content/sponsors') wireSponsors();
    if (r === 'content/gallery') wireGallery();
    if (r === 'content/faq') wireFaq();
    if (r === 'content/contact') wireContact();
    if (r === 'settings/visibility') wireVisibility();
    if (r === 'settings/form') wireSetForm();
    if (['settings/advanced','settings/links'].indexOf(r) >= 0) wireReminders();

    paintWriting();
  }

     from the editor, or the site as last saved when that is newer (functions/lib/api.js ownDraftOrSaved). */
  function openPreview(){

  }

  /* Publishes the site as it was last saved in the site editor. Where changes need approval (the default)
     that means asking for it: the request and its review page are the same ones the editor's
     "Publish changes" makes. */
  function doPublish(){
    C.publishEvent(EV.id).then(function(out){
      notify('Published. Version ' + out.publishedVersion + ' is live at ' + out.publishedPath);
    }, function(err){
      if (!err || err.code !== 'approval-required') throw err;

  /* ============================================================
     BOOT

     EV loads over the network now, so there are three states to show,
     never a silent fourth one where a fake event quietly stands in:
       1. renderLoading()   — while fetchEvent() is in flight
       2. boot()            — once it resolves, the console as it always was
       3. renderLoadError() — on a real failure (404 / network) — never a
                               fallback event, just the truth and a way back
     A 401 (not signed in / stale token) isn't shown as an in-page error at
     all — it sends the admin to sign in, same as any other admin page here.
     ============================================================ */
  function paintHeader(){
    var name = String(EV.name || '').trim() || 'Untitled event';
    $('ev-name').textContent = name + (PORTALS[EV.portal] ? ' | ' + PORTALS[EV.portal] : '');
    var metaBits = [fmtDT(EV.start)];
    if (EV.eventNo) metaBits.push(EV.eventNo);
    var catLabel = TYPES[EV.category] || EV.category;
    if (catLabel) metaBits.push(catLabel);
    $('ev-meta').textContent = metaBits.join('  |  ');
    document.title = 'Edit — ' + name + ' — Revamp CMS';
  }

  /* Preview, Publish and the rail only mean something once there is an event behind them. */
  function setChrome(ready){
    $('btn-preview').hidden = !ready;
    $('btn-publish').hidden = !ready;
    $('rail').hidden = !ready;
  }

  function renderLoading(){
    setChrome(false);
    $('ev-name').textContent = 'Loading…';
    $('ev-meta').textContent = '';
    $('rail').innerHTML = '';
    $('view').innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;' +
        'gap:14px;padding:140px 20px;text-align:center;color:var(--text-muted)">' +
        '<span class="spin" style="width:26px;height:26px;border-width:3px"></span>' +
        '<span style="font-size:13.5px;font-weight:600">Loading event…</span>' +
      '</div>';
  }

  /* kind: 'none' (no event in the address), otherwise decided from the failure itself */
  function renderLoadError(err, kind){
    var missing = kind === 'none' || (err && err.status === 404);
    var title = kind === 'none' ? 'No event selected'
      : missing ? 'Event not found' : 'Couldn’t load this event';
    var msg = kind === 'none' ? 'Use Back to events and open the event you want to edit.'
      : missing ? 'This event doesn’t exist or was deleted. Use Back to events to open another one.'
      : 'The event could not be loaded. Check your connection and try again.';
    if (err && kind !== 'none') console.error('Event load failed:', err);
    setChrome(false);
    $('ev-name').textContent = title;
    $('ev-meta').textContent = '';
    $('rail').innerHTML = '';
    document.title = 'Edit Event — Revamp CMS';
    /* the way out is the top bar's "Back to events", which stays on screen in every state */
    $('view').innerHTML = '<div style="padding:60px 20px">' + emptyState(
      IC.info, title, msg,
      missing ? '' : '<button class="btn btn-primary btn-sm" type="button" id="ev-retry">Try again</button>'
    ) + '</div>';
    var again = $('ev-retry');
    if (again) again.onclick = init;
  }

  var booted = false;

  function boot(){
    paintHeader();
    setChrome(true);

    /* a retry after a failed load comes through here again; the listeners must not be added twice */
    if (!booted){
      booted = true;

      $('btn-preview').onclick = openPreview;
      $('btn-publish').onclick = doPublish;

      /* one listener for every sub-tab and in-view link, so they work on whatever #view is showing —
         a loaded view, "Loading…" or "Couldn’t load this" alike */
      $('view').addEventListener('click', function(e){
        var el = e.target.closest ? e.target.closest('[data-tab],[data-goto]') : null;
        if (!el || !$('view').contains(el)) return;
        if (el.hasAttribute('data-tab')) go(cur.sec + '/' + el.getAttribute('data-tab'), true);
        else go(el.getAttribute('data-goto'), true);
      });

      /* the sub-tabs are one stop in the Tab order; the arrow keys move between them */
      $('view').addEventListener('keydown', function(e){
        var tab = e.target && e.target.getAttribute && e.target.getAttribute('role') === 'tab' ? e.target : null;
        if (!tab) return;
        var tabs = Array.prototype.slice.call(tab.parentNode.querySelectorAll('[role="tab"]'));
        var at = tabs.indexOf(tab), to = -1;
        if (e.key === 'ArrowRight') to = (at + 1) % tabs.length;
        else if (e.key === 'ArrowLeft') to = (at - 1 + tabs.length) % tabs.length;
        else if (e.key === 'Home') to = 0;
        else if (e.key === 'End') to = tabs.length - 1;
        if (to < 0) return;
        e.preventDefault();
        tabs[to].focus();
      });

      window.addEventListener('hashchange', function(){
        var h = location.hash.slice(1);
        if (h === routeId()) return;
        /* Back / Forward has already changed the address. While the user is being asked, the
           address goes back to the view that is still on screen; go() moves it on if they leave. */
        if (LEAVE.dirty()) history.replaceState(null, '', '#' + routeId());
        go(h);
      });

      /* The links that leave the view without going through go(): the rail, Back to events and the
         account menu's Sign out (auth.js draws that menu on <body>). Caught before their own
         handlers, so nothing navigates or signs out until the user has answered. */
      document.addEventListener('click', function(e){
        if (e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || !e.target.closest) return;
        var out = e.target.closest('.rv-acct-pop [role="menuitem"]');
        var link = out ? null : e.target.closest('a.back-btn, #rail a');
        if (!out && !link) return;
        if (link && link.target && link.target !== '_self') return;
        if (out && !LEAVE.dirty() && writesOut()){
          e.preventDefault(); e.stopPropagation();
          notifyError('Your last change is still being saved. Sign out once it has finished.');
          return;
        }
        if (!LEAVE.dirty()) return;
        e.preventDefault(); e.stopPropagation();
        leaveThen(function(){
          if (out) RevampAuth.signOutAndLeave(); else link.click();
        });
      }, true);

      /* a reload, closing the tab or an address typed over this one: only the browser can ask */
      window.addEventListener('beforeunload', function(e){
        if (!LEAVE.dirty() && !writesOut() && !(MODAL && MODAL.isDirty())) return;
        e.preventDefault();
        e.returnValue = '';
      });
    }

    go(location.hash.slice(1));
    setTimeout(loadTabCounts, 0);
  }

  function isAuthError(err){
    var msg = (err && err.message) || '';
    return !!((err && err.status === 401) || /not signed in/i.test(msg));
  }

  /* The sign-in page brings the user back to the address they were on. Going through RevampAuth records
     that this page was just sent there — which is what stops the sign-in page from forwarding a session
     the server has refused straight back here, and the two pages bouncing for ever. */
  function toSignIn(){
    if (window.RevampAuth && typeof RevampAuth.redirectToSignIn === 'function') return RevampAuth.redirectToSignIn();
    location.replace('/?next=' + encodeURIComponent(location.pathname + location.search + location.hash));
  }

  function onEventLoaded(data){
    EV = data;
    CTX.EV = EV;

    boot();
  }

  function init(){
    renderLoading();

    if (!eventSlug){
      renderLoadError(null, 'none');
      return;
    }

    C.fetchEvent(eventSlug).then(onEventLoaded).catch(function(err){
      if (!isAuthError(err)){ renderLoadError(err); return; }

      /* getIdToken() (auth.js) now waits for Firebase's own real first auth-state resolution
         before deciding the user isn't signed in, so this should be rare going forward — but a
         genuinely stale __session cookie, or a token that expired a moment before this call,
         can still surface as a real 401 here. Refresh the session once and retry before bouncing
         to sign-in, same "refresh, don't just bounce" reasoning as auth.js's own a.back-btn
         interceptor — only a SECOND auth failure, after that retry, is treated as the user truly
         not being signed in. */
      if (!window.RevampAuth){ toSignIn(); return; }
      RevampAuth.ensureSession().then(function(){
        return C.fetchEvent(eventSlug);
      }).then(onEventLoaded).catch(function(err2){
        if (isAuthError(err2)){ toSignIn(); return; }
        renderLoadError(err2);
      });
    });
  }

  init();
})();
</script>
