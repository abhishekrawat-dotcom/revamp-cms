<!-- ET Oneworld - Revamp CMS : per-event admin console ("Edit event") -->
<title>Edit Event &mdash; Revamp CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="edit-event.css">

<header class="topbar">
  <a class="back-btn" href="Event_Listing.html">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    Back to events
  </a>
  <span class="ev-title">
    <h1 id="ev-name">&nbsp;</h1>
    <span class="meta" id="ev-meta"></span>
  </span>
  <span class="topbar-acts">
    <button class="btn btn-secondary" type="button" id="btn-preview">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.6"/></svg>
      Preview
    </button>
    <button class="btn btn-primary" type="button" id="btn-publish">Publish</button>
  </span>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="main"><div id="view"></div></main>
</div>

<div class="toast-host" id="toast-host"></div>
<div id="modal-host"></div>

<script src="edit-event-core.js"></script>
<script src="edit-event-dashboard.js"></script>
<script src="edit-event-marketing.js"></script>
<script src="sidebar.js"></script>

<script>
(function(){
  'use strict';

  /* Everything shared lives in edit-event-core.js so the section files can
     use it too. The shell just borrows the names it needs. */
  var C = window.RevampCore;
  var $ = C.$, esc = C.esc, svg = C.svg, IC = C.IC, AV = C.AV;
  var comma = C.comma, compact = C.compact, money = C.money;
  var fmtDate = C.fmtDate, fmtDT = C.fmtDT;
  var statTile = C.statTile, panel = C.panel, panelFlush = C.panelFlush, emptyState = C.emptyState;
  var toast = C.toast, PORTALS = C.PORTALS, TYPES = C.TYPES;

  var qs = new URLSearchParams(location.search);
  var EV = C.eventById(qs.get('event')) || C.EVENTS[0];
  var PEOPLE = C.makePeople(EV);

  /* ============================================================
     FORMATTERS
     ============================================================ */
  /* ============================================================
     PERSISTED PROTOTYPE STATE
     ============================================================ */
  var KEY = 'revamp-edit-event-' + EV.id;
  var S = {
    sections: null, nav: null, checklist: null, published: false, theme: 'ET Red'
  };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); for (var k in p) if (p.hasOwnProperty(k)) S[k] = p[k]; }
  } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

  /* ============================================================
     NAVIGATION MODEL
     ============================================================ */
  var SECTIONS = [
    { id:'dashboard', label:'Dashboard', icon:IC.chart, tabs:[] },

    { id:'content', label:'Content', icon:IC.layers, tabs:[
        { id:'basics',   label:'Basics' },
        { id:'speakers', label:'Speakers' },
        { id:'agenda',   label:'Agenda' },
        { id:'sponsors', label:'Sponsors' },
        { id:'gallery',  label:'Gallery' },
        { id:'faq',      label:'FAQ' },
        { id:'contact',  label:'Contact' }
    ]},

    { id:'design', label:'Design', icon:IC.brush, tabs:[
        { id:'editor',   label:'Site editor', link:'custom_editor.html?event=' + EV.id },
        { id:'sections', label:'Page sections' },
        { id:'nav',      label:'Navigation' },
        { id:'theme',    label:'Theme' },
        { id:'media',    label:'Media' }
    ]},

    { id:'audience', label:'Audience', icon:IC.users, tabs:[
        { id:'reg',       label:'Registrations' },
        { id:'attendees', label:'Attendees' },
        { id:'shortlist', label:'Shortlisted' },
        { id:'payments',  label:'Payments' },
        { id:'insights',  label:'Insights' }
    ]},

    { id:'marketing', label:'Promotions', icon:IC.megaphone, tabs:[
        { id:'studio',    label:'Studio' },
        { id:'audiences', label:'Audiences' },
        { id:'campaigns', label:'Campaigns' },
        { id:'pipeline',  label:'Data pipeline' },
        { id:'crm',       label:'CRM' }
    ]},

    { id:'settings', label:'Settings', icon:IC.gear, tabs:[
        { id:'form',       label:'Registration form' },
        { id:'seo',        label:'URL & SEO' },
        { id:'links',      label:'Social links' },
        { id:'visibility', label:'Visibility' },
        { id:'advanced',   label:'Advanced' },
        { id:'history',    label:'History' }
    ]}
  ];

  var cur = { sec:'content', tab:'basics' };

  function secById(id){
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return SECTIONS[i];
    return null;
  }
  function routeId(){ return cur.tab ? cur.sec + '/' + cur.tab : cur.sec; }

  /* counts shown on the tabs, worked out at render time */
  function tabCount(sec, tab){
    if (sec === 'audience'){
      if (tab === 'reg')       return EV.registrations;
      if (tab === 'attendees') return PEOPLE.filter(function(p){ return p.attended; }).length;
      if (tab === 'shortlist') return EV.shortlist;
    }
    if (sec === 'content'){
      if (tab === 'speakers') return spkAll().length;
      if (tab === 'agenda')   return 7;
      if (tab === 'sponsors') return 10;
      if (tab === 'faq')      return FAQS.length;
    }
    return null;
  }

  function renderRail(){
    renderEventRail('rail', {
      activeSection: cur.sec === 'audience' && cur.tab === 'payments' ? 'payment' : cur.sec,
      eventId: EV.id
    });
  }

  function tabsHTML(){
    var s = secById(cur.sec);
    if (!s || !s.tabs.length) return '';
    return '<div class="subtabs">' + s.tabs.map(function(t){
      var n = tabCount(s.id, t.id);
      var inner = esc(t.label) + (n != null ? '<span class="cnt">' + comma(n) + '</span>' : '');
      /* a link tab leaves the console entirely — render it as a real anchor
         so middle-click and "open in new tab" behave the way people expect */
      if (t.link){
        return '<a class="tab-link" href="' + esc(t.link) + '">' +
          svg(IC.ext, 13) + inner + '</a>';
      }
      return '<button type="button" data-tab="' + t.id + '" aria-pressed="' + (cur.tab === t.id) + '">' +
        inner + '</button>';
    }).join('') + '</div>';
  }

  /* accepts "section" or "section/tab" */
  function go(route){
    var parts = String(route).split('/');
    if (parts[0] === 'audience' && parts[1] === 'reg') {
      location.href = 'audience-registrations.html?event=' + encodeURIComponent(EV.id);
      return;
    }
    if (parts[0] === 'marketing') {
      location.href = 'marketing.html?event=' + encodeURIComponent(EV.id) + (parts[1] ? '&tab=' + encodeURIComponent(parts[1]) : '');
      return;
    }
    if (parts[0] === 'payment') {
      location.href = 'edit-event.html?event=' + encodeURIComponent(EV.id) + '#audience/payments';
      return;
    }
    if (parts[0] === 'settings') {
      location.href = 'settings.html?event=' + encodeURIComponent(EV.id) + (parts[1] ? '&tab=' + encodeURIComponent(parts[1]) : '');
      return;
    }
    var s = secById(parts[0]);
    if (!s) s = SECTIONS[0];
    cur.sec = s.id;
    var real = s.tabs.filter(function(t){ return !t.link; });
    var asked = parts[1] && real.filter(function(t){ return t.id === parts[1]; }).length ? parts[1] : null;
    /* #design/editor means "take me to the editor", not "render a landing page" */
    var linked = parts[1] && s.tabs.filter(function(t){ return t.id === parts[1] && t.link; })[0];
    if (linked){ location.href = linked.link; return; }
    cur.tab = real.length ? (asked || real[0].id) : null;
    var r = routeId();
    if (location.hash.slice(1) !== r) location.hash = r;
    renderRail();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ============================================================
     SHARED VIEW HELPERS
     ============================================================ */
  function vhead(title, sub, right){
    var s = secById(cur.sec) || { label:'', tabs:[] };
    var t = '';
    if (cur.tab){
      var m = s.tabs.filter(function(x){ return x.id === cur.tab; })[0];
      if (m) t = m.label;
    }
    var crumb = (t && t !== s.label) ? s.label + ' › ' + t : s.label;
    return '<div class="vhead"><div class="vhead-row">' +
        '<div class="grow">' +
          '<div class="crumb">' + esc(crumb) + '</div>' +
          '<h2>' + esc(title) + '</h2>' +
          (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        '</div>' +
        (right ? '<div style="display:flex;gap:9px;flex-wrap:wrap">' + right + '</div>' : '') +
      '</div></div>';
  }

  /* ============================================================
     FAKE PEOPLE  (deterministic)
     ============================================================ */
  /* ============================================================
     VIEW : DASHBOARD
     ============================================================ */
  /* ============================================================
     VIEW : BASIC DETAILS

     Seven fields, one panel, read top to bottom the way someone
     actually describes an event: what it is called, when and where
     it happens, then how it reads to a visitor.

     The right rail shows the three surfaces that copy lands on —
     the listing card, a search result and the social share card —
     repainted on every keystroke, so the form is never guesswork.
     ============================================================ */
  var BASICS_DESC = 'India’s decision-makers gather to set the agenda for the year ahead.';
  var DESC_IDEAL = 160;

  function slugify(s){
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  /* the shared formatters take an ISO-ish string; toISOString() would shift
     the value into UTC and can move a late-evening event to the next day */
  function localIso(d){
    function p2(n){ return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) +
      "T" + p2(d.getHours()) + ":" + p2(d.getMinutes());
  }

  /* one numbered step inside the form panel */
  function fgroup(n, title, sub, rows){
    return '<div class="fgroup">' +
        '<div class="fgroup-head"><span class="n">' + n + '</span>' +
          '<h4>' + esc(title) + '</h4>' +
          '<span class="gsub">' + esc(sub) + '</span></div>' +
        '<div class="frow">' + rows + '</div>' +
      '</div>';
  }

  function viewBasics(){
    var e = EV;
    var slug = slugify(e.name);
    var desc = BASICS_DESC;

    var identity =
      '<div class="field c7">' +
        '<div class="flabel-row"><label for="b-name">Event name <span class="pill-req">Required</span></label></div>' +
        '<input class="inp" id="b-name" value="' + esc(e.name) + '" placeholder="e.g. MarTech+ Summit 2026">' +
        '<p class="hint">The headline on the microsite and in every listing.</p></div>' +

      '<div class="field c5"><label for="b-cat">Category</label>' +
        '<select class="inp" id="b-cat">' + Object.keys(TYPES).map(function(k){
          return '<option' + (k === e.type ? ' selected' : '') + '>' + esc(TYPES[k]) + '</option>';
        }).join('') + '</select>' +
        '<p class="hint">Decides which template and reports this event gets.</p></div>';

    var when =
      '<div class="field c4">' +
        '<div class="flabel-row"><label for="b-start">Starts <span class="pill-req">Required</span></label></div>' +
        '<input class="inp" id="b-start" type="datetime-local" value="' + (e.start ? e.start.slice(0,16) : '') + '"></div>' +

      '<div class="field c4"><div class="flabel-row"><label for="b-end">Ends</label>' +
          '<span class="pill-opt">Optional</span></div>' +
        '<input class="inp" id="b-end" type="datetime-local" value="' + (e.end ? e.end.slice(0,16) : '') + '"></div>' +

      '<div class="field c4"><label for="b-venue">Venue &amp; city</label>' +
        '<div class="inp-ico">' + svg(IC.globe, 15) +
          '<input class="inp" id="b-venue" value="' + esc(e.venue) + '" placeholder="e.g. Grand Hyatt, Mumbai"></div></div>' +

      '<div class="field c12"><div class="readouts" id="b-when"></div></div>';

    var reads =
      '<div class="field c12">' +
        '<div class="flabel-row"><label for="b-desc">Short description</label>' +
          '<span class="ctr" id="b-count"><span class="meter"><i></i></span><span class="t"></span></span></div>' +
        '<textarea class="inp" id="b-desc" maxlength="220" style="min-height:88px" ' +
          'placeholder="One or two lines, used wherever this event is listed.">' + esc(desc) + '</textarea>' +
        '<p class="hint">Shown in listings, search results and the social share card. ' +
          'Around ' + DESC_IDEAL + ' characters reads best everywhere.</p></div>' +

      '<div class="field c12"><label for="b-slug">Microsite URL</label>' +
        '<div class="inp-grp">' +
          '<span class="pre">etoneworld.com/</span>' +
          '<input class="inp" id="b-slug" value="' + esc(slug) + '" spellcheck="false">' +
          '<button class="gbtn" type="button" id="b-copy" title="Copy the full address">' +
            svg(IC.link, 13) + '<span>Copy</span></button>' +
        '</div>' +
        '<p class="hint" id="b-url"></p></div>';

    var form = panel('Event details', 'Name, when and where, and how it reads',
      fgroup(1, 'Identity', 'What this event is called', identity) +
      fgroup(2, 'Date & place', 'When it runs and where', when) +
      fgroup(3, 'How it reads', 'The copy a visitor meets first', reads));

    var side =
      '<div class="pvc">' +
        '<div class="pvc-head"><span class="eyebrow">Live preview</span>' +
          '<span class="seg" id="b-seg">' +
            '<button type="button" data-pv="list" aria-pressed="true">Listing</button>' +
            '<button type="button" data-pv="serp" aria-pressed="false">Search</button>' +
            '<button type="button" data-pv="og" aria-pressed="false">Social</button>' +
          '</span></div>' +
        '<div class="pvc-body" id="b-preview"></div>' +
        '<div class="pvc-foot" id="b-pvnote"></div>' +
      '</div>' +

      '<div class="pvc">' +
        '<div class="pvc-head"><span class="eyebrow">Ready to publish</span>' +
          '<span class="ctr" id="b-rdyn"></span></div>' +
        '<div class="rdy-bar"><i id="b-rdybar"></i></div>' +
        '<div id="b-rdy"></div>' +
      '</div>';

    return vhead('Basic details', 'What identifies this event and what a visitor sees. Everything else on the console inherits from here.',
        '<button class="btn btn-secondary btn-sm" type="button" id="btn-preview-2">' + svg(IC.eye, 13) + ' Preview site</button>') +

      '<div class="bx">' +
        '<div class="bx-main">' + form +

          '<div class="callout info" style="margin-bottom:18px">' + svg(IC.info, 17) +
            '<span><strong>Looking for something that used to be here?</strong>' +
            'Event number <b>' + e.eventNo + '</b> is issued by the system and sits in the header. ' +
            'The portal is set once when the event is created. ' +
            'Publishing and who can see the site are in <b>Settings &rsaquo; Visibility</b>, ' +
            'and the registration target is on <b>Reporting</b>, where it is used.</span></div>' +

          panel('Danger zone', 'Reversible, but not from here',
            '<div class="danger-row">' +
              '<div class="dt"><b>Archive this event</b>' +
              '<span>The microsite goes offline and the event moves out of active listings. ' +
              'Registrations, payments and reports are kept.</span></div>' +
              '<button class="btn btn-danger btn-sm" type="button" data-save="Archive requested">Archive event</button>' +
            '</div>') +
        '</div>' +
        '<aside class="bx-side">' + side + '</aside>' +
      '</div>' +

      '<div class="savebar" id="b-savebar">' +
        '<span class="sb-txt">Unsaved changes<span id="b-sbwhat">on this page</span></span>' +
        '<button class="sb-ghost" type="button" id="b-discard">Discard</button>' +
        '<button class="btn btn-primary btn-sm" type="button" id="b-save">Save changes</button>' +
      '</div>';
  }

  /* ---------- the live parts of the basics form ---------- */
  function wireBasics(){
    var f = {
      name:  $('b-name'),  cat:   $('b-cat'),   start: $('b-start'),
      end:   $('b-end'),   venue: $('b-venue'), desc:  $('b-desc'), slug: $('b-slug')
    };
    if (!f.name) return;

    var KEYS = ['name','cat','start','end','venue','desc','slug'];
    var initial = {};
    KEYS.forEach(function(k){ initial[k] = f[k] ? f[k].value : ''; });

    var slugTouched = false;
    var mode = 'list';

    function v(k){ return f[k] ? f[k].value : ''; }
    function trimmed(k){ return v(k).trim(); }

    /* ---- date maths, kept honest about half-filled forms ---- */
    function span(){
      var a = v('start') ? new Date(v('start')) : null;
      var b = v('end')   ? new Date(v('end'))   : null;
      if (a && isNaN(a)) a = null;
      if (b && isNaN(b)) b = null;
      return { a:a, b:b };
    }
    function dayCount(a, b){
      var x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
      var y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
      return Math.round((y - x) / 86400000) + 1;
    }
    function countdown(a){
      var now = new Date();
      var days = Math.ceil((a - now) / 86400000);
      if (days > 1)  return { cls:'', txt:'Opens in <b>' + days + ' days</b>' };
      if (days === 1) return { cls:'', txt:'Opens <b>tomorrow</b>' };
      if (days === 0) return { cls:'good', txt:'Happening <b>today</b>' };
      return { cls:'', txt:'Ran <b>' + Math.abs(days) + ' days</b> ago' };
    }

    function paintWhen(){
      var host = $('b-when');
      if (!host) return;
      var s = span(), out = [];

      if (!s.a){
        out.push({ cls:'bad', ico:IC.clock, txt:'No start date yet — the site will read <b>date to be announced</b>' });
      } else {
        if (s.b && s.b > s.a){
          var d = dayCount(s.a, s.b);
          var hrs = Math.round((s.b - s.a) / 3600000);
          out.push({ cls:'', ico:IC.clock,
            txt: d > 1 ? '<b>' + d + ' days</b> · ' + fmtDate(localIso(s.a)) + ' to ' + fmtDate(localIso(s.b))
                       : 'Single day · <b>' + hrs + ' hours</b>' });
        } else if (s.b && s.b <= s.a){
          out.push({ cls:'bad', ico:IC.info, txt:'The end is <b>before the start</b>' });
        } else {
          out.push({ cls:'', ico:IC.clock, txt:'Single day · <b>no end time set</b>' });
        }
        var c = countdown(s.a);
        out.push({ cls:c.cls, ico:IC.bell, txt:c.txt });
      }

      out.push({ cls: trimmed('venue') ? '' : 'bad', ico:IC.globe,
        txt: trimmed('venue') ? esc(trimmed('venue')) : 'No venue yet' });

      host.innerHTML = out.map(function(r){
        return '<span class="readout ' + r.cls + '">' + svg(r.ico, 13) + '<span>' + r.txt + '</span></span>';
      }).join('');
    }

    /* ---- description counter as a meter, not a number to decode ---- */
    function paintCount(){
      var box = $('b-count');
      if (!box) return;
      var n = v('desc').length;
      var pct = Math.min(100, Math.round(n / DESC_IDEAL * 100));
      box.className = 'ctr' + (n > DESC_IDEAL ? ' over' : (n > DESC_IDEAL * 0.9 ? ' warn' : ''));
      box.querySelector('i').style.width = pct + '%';
      box.querySelector('.t').textContent = n + ' / ' + DESC_IDEAL;
    }

    /* ---- the address line under the slug ---- */
    function paintUrl(){
      var url = $('b-url');
      if (!url) return;
      var s = trimmed('slug');
      if (!s){
        url.innerHTML = '<span style="color:var(--accent-strong)">Add an address or the site cannot go live.</span>';
      } else if (s !== slugify(s)){
        url.innerHTML = '<span style="color:var(--warn)">Will be tidied to <b>' + esc(slugify(s)) + '</b> on save.</span>';
      } else {
        url.innerHTML = 'Goes live at <b>etoneworld.com/' + esc(s) + '</b>';
      }
    }

    /* ---- the three surfaces in the rail ---- */
    function previewBits(){
      var s = span();
      var title = trimmed('name') || 'Untitled event';
      var d = trimmed('desc') || 'Add a short description and it will appear here.';
      var venue = trimmed('venue') || 'Venue to be confirmed';
      var when = s.a ? fmtDT(localIso(s.a)) : 'Date to be announced';
      var path = slugify(trimmed('slug')) || 'your-event';
      return { title:title, d:d, venue:venue, when:when, path:path, portal: PORTALS[EV.portal] || 'ET Oneworld' };
    }

    function paintPreview(){
      var host = $('b-preview'), note = $('b-pvnote');
      if (!host) return;
      var b = previewBits(), html, n;

      if (mode === 'serp'){
        html = '<div class="mock mock-serp">' +
            '<div class="u">etoneworld.com &rsaquo; ' + esc(b.path) + '</div>' +
            '<div class="t">' + esc(b.title) + ' | ' + esc(b.portal) + '</div>' +
            '<div class="d">' + esc(b.when) + ' · ' + esc(b.venue) + '. ' + esc(b.d) + '</div>' +
          '</div>';
        n = 'Google shows roughly the first 155 characters of the description.';
      } else if (mode === 'og'){
        html = '<div class="mock mock-og">' +
            '<div class="img"><span class="mp">' + esc(b.portal) + '</span>' +
              '<span class="mt">' + esc(b.title) + '</span>' +
              '<span class="md">' + esc(b.when) + ' · ' + esc(b.venue) + '</span></div>' +
            '<div class="cap"><span class="dom">etoneworld.com</span>' +
              '<b>' + esc(b.title) + '</b><span>' + esc(b.d) + '</span></div>' +
          '</div>';
        n = 'What a WhatsApp, LinkedIn or X share unfurls into.';
      } else {
        html = '<div class="mock">' +
            '<div class="mock-hero"><span class="mp">' + esc(b.portal) + ' presents</span>' +
              '<div class="mt">' + esc(b.title) + '</div></div>' +
            '<div class="mock-meta">' + svg(IC.clock, 12) + '<span>' + esc(b.when) + '</span></div>' +
            '<div class="mock-meta">' + svg(IC.globe, 12) + '<span>' + esc(b.venue) + '</span></div>' +
            '<div class="mock-body"><p>' + esc(b.d) + '</p><span class="cta">Register now</span></div>' +
          '</div>';
        n = 'The card on the events listing and the top of the microsite.';
      }
      host.innerHTML = html;
      if (note) note.textContent = n;
    }

    /* ---- what is still missing before this can go out ---- */
    function paintReady(){
      var host = $('b-rdy');
      if (!host) return;
      var s = span();
      var items = [
        ['Event name',        !!trimmed('name')],
        ['Start date & time', !!s.a && !(s.b && s.b <= s.a)],
        ['Venue or city',     !!trimmed('venue')],
        ['Short description', trimmed('desc').length >= 40 && v('desc').length <= DESC_IDEAL],
        ['Microsite address', !!slugify(trimmed('slug'))]
      ];
      var done = items.filter(function(i){ return i[1]; }).length;

      host.innerHTML = items.map(function(i){
        return '<div class="rdy-item' + (i[1] ? ' on' : '') + '">' +
            '<span class="tick">' + svg(i[1] ? IC.check : IC.plus, 11) + '</span>' +
            '<span class="lb">' + esc(i[0]) + '</span></div>';
      }).join('');

      var bar = $('b-rdybar');
      if (bar) bar.style.width = Math.round(done / items.length * 100) + '%';
      var num = $('b-rdyn');
      if (num) num.textContent = done + ' / ' + items.length;
    }

    /* ---- the sticky bar, shown only once something actually changed ---- */
    function paintDirty(){
      var bar = $('b-savebar');
      if (!bar) return;
      var changed = KEYS.filter(function(k){ return f[k] && f[k].value !== initial[k]; });
      bar.classList.toggle('on', changed.length > 0);
      var what = $('b-sbwhat');
      if (what && changed.length){
        what.textContent = changed.length === 1 ? '1 field edited' : changed.length + ' fields edited';
      }
    }

    function paint(){
      paintWhen(); paintCount(); paintUrl(); paintPreview(); paintReady(); paintDirty();
    }

    /* typing a name suggests an address, but only while the address is untouched */
    if (f.slug) f.slug.addEventListener('input', function(){ slugTouched = true; });
    if (f.name) f.name.addEventListener('input', function(){
      if (!slugTouched && f.slug) f.slug.value = slugify(f.name.value);
    });

    KEYS.forEach(function(k){
      if (!f[k]) return;
      f[k].addEventListener('input', paint);
      f[k].addEventListener('change', paint);
    });

    var seg = $('b-seg');
    if (seg) seg.querySelectorAll('[data-pv]').forEach(function(b){
      b.addEventListener('click', function(){
        mode = b.getAttribute('data-pv');
        seg.querySelectorAll('[data-pv]').forEach(function(x){
          x.setAttribute('aria-pressed', String(x === b));
        });
        paintPreview();
      });
    });

    var copy = $('b-copy');
    if (copy) copy.addEventListener('click', function(){
      var full = 'etoneworld.com/' + (slugify(trimmed('slug')) || 'your-event');
      var done = function(){
        copy.classList.add('done');
        copy.querySelector('span').textContent = 'Copied';
        setTimeout(function(){
          copy.classList.remove('done');
          copy.querySelector('span').textContent = 'Copy';
        }, 1600);
        toast('Address copied — ' + full);
      };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText('https://' + full).then(done, done);
      } else { done(); }
    });

    var save = $('b-save');
    if (save) save.addEventListener('click', function(){
      if (f.slug) f.slug.value = slugify(trimmed('slug'));
      KEYS.forEach(function(k){ if (f[k]) initial[k] = f[k].value; });
      paint();
      toast('Basic details saved');
    });

    var discard = $('b-discard');
    if (discard) discard.addEventListener('click', function(){
      KEYS.forEach(function(k){ if (f[k]) f[k].value = initial[k]; });
      slugTouched = false;
      paint();
      toast('Changes discarded');
    });

    paint();
  }

  var SEED_SPEAKERS = [

  var WEIGHTS = [

  function wLabel(id){
    for (var i = 0; i < WEIGHTS.length; i++) if (WEIGHTS[i].id === id) return WEIGHTS[i].label;
    return 'Featured';

  function stMeta(id){
    for (var i = 0; i < STATUSES.length; i++) if (STATUSES[i].id === id) return STATUSES[i];

  var HONORIFICS = /^(dr|mr|mrs|ms|miss|prof|professor|sir|shri|smt|adv|capt|col|gen|rev)\.?$/i;
  function initials(name){
    var p = String(name || '').trim().split(/\s+/).filter(Boolean)
      .filter(function(w){ return !HONORIFICS.test(w); });
    if (!p.length) return '?';
    var a = p[0][0], b = p.length > 1 ? p[p.length - 1][0] : '';

  /* ---------------- model ---------------- */
  function spkInit(){
    if (S.spkGroups && S.speakers) return;

  function spkIn(gid){ return spkAll().filter(function(p){ return p.gid === gid; }); }
  function spkById(id){
    var a = spkAll();

    return null;

  /* ---------------- photo helpers ---------------- */
  /* Everything that leaves the dialog is already square and already
     small — the console never hands a 6 MB camera file to the page. */
  function cropToSquare(img, tx, ty, zoom, view, out){
    var cover = Math.max(view / img.naturalWidth, view / img.naturalHeight);
    var s = cover * zoom;
    var cv = document.createElement('canvas');
    cv.width = out; cv.height = out;
    var cx = cv.getContext('2d');
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, out, out);
    cx.drawImage(img, (-tx) / s, (-ty) / s, view / s, view / s, 0, 0, out, out);
    return cv.toDataURL('image/jpeg', 0.86);
  }
  function shrinkLogo(img, maxW, maxH){
    var r = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.naturalWidth * r));
    cv.height = Math.max(1, Math.round(img.naturalHeight * r));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/png');
  }
  function readImage(file, cb){
    if (!file || !/^image\//.test(file.type)){ cb(null, 'That file is not an image.'); return; }
    if (file.size > 12 * 1024 * 1024){ cb(null, 'That image is over 12 MB. Try a smaller one.'); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){ cb(im, null); };
      im.onerror = function(){ cb(null, 'That image could not be read.'); };
      im.src = fr.result;
    };
    fr.onerror = function(){ cb(null, 'That file could not be read.'); };
    fr.readAsDataURL(file);
  }

  /* ---------------- LinkedIn lookup ----------------
     The prototype has no backend, so the profile is derived from the
     URL rather than retrieved. The shape of the interaction — paste,
     wait, review, correct — is what is being tested here. */
  var LI_TITLES = ['Chief Information Officer','Chief Marketing Officer','Head of Digital',
    'Chief Technology Officer','VP — Growth','Chief Data Officer','Head of Brand',
    'Director — Customer Experience','Chief Information Security Officer'];
  var LI_COMPANIES = ['Tata Digital','Reliance Retail','HDFC Bank','Infosys','Asian Paints',
    'Flipkart','Marico','Godrej Group','ICICI Lombard','Zomato'];

  function liLookup(url, cb){
    var m = String(url || '').match(/linkedin\.com\/in\/([^\/?#\s]+)/i);
    if (!m){ cb(null, 'That does not look like a LinkedIn profile link. It should contain linkedin.com/in/'); return; }
    var slug = decodeURIComponent(m[1]);
    setTimeout(function(){
      var words = slug.replace(/[-_](?=[a-z0-9]*\d)[a-z0-9]{4,}$/i, '').split(/[-_]/).filter(Boolean);
      var name = words.map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
      var h = 0;
      for (var i = 0; i < slug.length; i++) h = (h * 31 + slug.charCodeAt(i)) >>> 0;
      cb({
        name: name || 'New speaker',
        desig: LI_TITLES[h % LI_TITLES.length],
        comp: LI_COMPANIES[(h >>> 4) % LI_COMPANIES.length],
        li: url
      }, null);
    }, 850);
  }

            STATUSES.map(function(s){
              var n = counts[s.id] || 0;
              return '<div class="rdy-item' + (n ? ' on' : '') + '">' +
                  '<span class="badge ' + s.cls + '">' + esc(s.label) + '</span>' +

  /* ---------------- page wiring ---------------- */
  function wireSpeakers(){
    var add = $('spk-add');
    if (add) add.onclick = function(){ spkDialog(null, spkGroups()[0].id); };

    var addg = $('spk-addgroup');
    if (addg) addg.onclick = function(){
      S.spkGroups.push({ id: uid('g-'), name: 'New group' });
      spkCommit();
      toast('Group added — give it a name');
      var last = document.querySelectorAll('.gname');
      if (last.length){ last[last.length - 1].focus(); last[last.length - 1].select(); }
    };

    document.querySelectorAll('[data-gadd]').forEach(function(b){
      b.onclick = function(){ spkDialog(null, b.getAttribute('data-gadd')); };
    });
    document.querySelectorAll('[data-edit]').forEach(function(b){
      b.onclick = function(){ spkDialog(b.getAttribute('data-edit')); };
    });

    /* rename a group by typing in its title — no dialog for one field */
    document.querySelectorAll('[data-gname]').forEach(function(inp){
      var id = inp.getAttribute('data-gname');
      inp.onchange = function(){
        var v = inp.value.trim() || 'Untitled group';
        spkGroups().forEach(function(g){ if (g.id === id) g.name = v; });
        save();
      };
      inp.onkeydown = function(e){ if (e.key === 'Enter') inp.blur(); };
    });

    /* weight cycles through the four ranks on click */
    document.querySelectorAll('[data-weight]').forEach(function(b){
      b.onclick = function(){
        var p = spkById(b.getAttribute('data-weight'));
        if (!p) return;
        var i = 0;
        WEIGHTS.forEach(function(w, n){ if (w.id === p.weight) i = n; });
        p.weight = WEIGHTS[(i + 1) % WEIGHTS.length].id;
        spkCommit();
        toast(p.name + ' is now ' + wLabel(p.weight).toLowerCase());
      };
    });

    document.querySelectorAll('[data-up]').forEach(function(b){
      b.onclick = function(){ spkMove(b.getAttribute('data-up'), -1); };
    });
    document.querySelectorAll('[data-down]').forEach(function(b){
      b.onclick = function(){ spkMove(b.getAttribute('data-down'), 1); };
    });

    document.querySelectorAll('[data-gup]').forEach(function(b){
      b.onclick = function(){ grpMove(b.getAttribute('data-gup'), -1); };
    });
    document.querySelectorAll('[data-gdown]').forEach(function(b){
      b.onclick = function(){ grpMove(b.getAttribute('data-gdown'), 1); };
    });
    document.querySelectorAll('[data-gsort]').forEach(function(b){
      b.onclick = function(){
        var gid = b.getAttribute('data-gsort');
        var rank = {}; WEIGHTS.forEach(function(w, i){ rank[w.id] = i; });
        var rest = spkAll().filter(function(p){ return p.gid !== gid; });
        var mine = spkIn(gid).slice().sort(function(a, c){
          return (rank[a.weight] || 9) - (rank[c.weight] || 9);
        });
        S.speakers = spkSplice(rest, mine, gid);
        spkCommit();
        toast('Ordered by weight');
      };
    });
    document.querySelectorAll('[data-gdel]').forEach(function(b){
      b.onclick = function(){
        var gid = b.getAttribute('data-gdel');
        var g = spkGroups().filter(function(x){ return x.id === gid; })[0];
        var n = spkIn(gid).length;
        var keep = spkGroups().filter(function(x){ return x.id !== gid; })[0];
        confirmDialog('Delete ' + (g ? g.name : 'this group') + '?',
          n ? n + (n === 1 ? ' speaker moves' : ' speakers move') + ' to ' + keep.name + '. Nobody is deleted.'
            : 'The group is empty, so nothing else changes.',
          'Delete group', function(){
            spkAll().forEach(function(p){ if (p.gid === gid) p.gid = keep.id; });
            S.spkGroups = spkGroups().filter(function(x){ return x.id !== gid; });
            spkCommit();
            toast('Group deleted');
          });
      };
    });

    spkDragDrop();
  }

  /* put a group's people back in the flat list at that group's position */
  function spkSplice(rest, mine, gid){
    var out = [], done = false;
    spkAll().forEach(function(p){
      if (p.gid === gid){ if (!done){ out = out.concat(mine); done = true; } return; }
      out.push(p);
    });
    if (!done) out = out.concat(mine);
    return out;
  }

  function spkMove(id, dir){
    var p = spkById(id);
    if (!p) return;
    var mine = spkIn(p.gid);
    var i = mine.map(function(x){ return x.id; }).indexOf(id);
    var j = i + dir;
    if (j < 0 || j >= mine.length) return;
    mine.splice(j, 0, mine.splice(i, 1)[0]);
    S.speakers = spkSplice(spkAll().filter(function(x){ return x.gid !== p.gid; }), mine, p.gid);
    spkCommit();
  }

  function grpMove(gid, dir){
    var gs = spkGroups();
    var i = gs.map(function(g){ return g.id; }).indexOf(gid);
    var j = i + dir;
    if (j < 0 || j >= gs.length) return;
    gs.splice(j, 0, gs.splice(i, 1)[0]);
    spkCommit();
  }

  /* drag a row anywhere — including into another group */
  function spkDragDrop(){
    var dragId = null;
    document.querySelectorAll('.spk-row').forEach(function(row){
      row.addEventListener('dragstart', function(e){
        dragId = row.getAttribute('data-sid');
        row.classList.add('drag');
        try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch(err){}
      });
      row.addEventListener('dragend', function(){
        dragId = null;
        document.querySelectorAll('.spk-row').forEach(function(r){
          r.classList.remove('drag', 'over-top', 'over-bot');
        });
      });
      row.addEventListener('dragover', function(e){
        if (!dragId || row.getAttribute('data-sid') === dragId) return;
        e.preventDefault();
        var r = row.getBoundingClientRect();
        var after = (e.clientY - r.top) > r.height / 2;
        row.classList.toggle('over-bot', after);
        row.classList.toggle('over-top', !after);
      });
      row.addEventListener('dragleave', function(){ row.classList.remove('over-top', 'over-bot'); });
      row.addEventListener('drop', function(e){
        if (!dragId || row.getAttribute('data-sid') === dragId) return;
        e.preventDefault();
        var r = row.getBoundingClientRect();
        var after = (e.clientY - r.top) > r.height / 2;
        spkDropAt(dragId, row.getAttribute('data-sid'), after);
      });
    });

    /* dropping on an empty group moves the speaker into it */
    document.querySelectorAll('.grp').forEach(function(g){
      g.addEventListener('dragover', function(e){ if (dragId) e.preventDefault(); });
      g.addEventListener('drop', function(e){
        if (!dragId) return;
        if (e.target.closest && e.target.closest('.spk-row')) return;
        e.preventDefault();
        var p = spkById(dragId);
        if (!p) return;
        p.gid = g.getAttribute('data-grp');
        spkCommit();
      });
    });
  }

  function spkDropAt(id, targetId, after){
    var p = spkById(id), t = spkById(targetId);
    if (!p || !t) return;
    p.gid = t.gid;
    var list = spkAll().slice();
    list.splice(list.indexOf(p), 1);
    var at = list.indexOf(t) + (after ? 1 : 0);
    list.splice(at, 0, p);
    S.speakers = list;
    spkCommit();
  }

  /* ---------------- a small confirm, so nothing destructive is one click ---------------- */
  function confirmDialog(title, msg, okLabel, onOk){
    var host = $('modal-host');
    host.innerHTML =
      '<div class="modal-bg" id="cbg"><div class="modal" style="width:min(420px,100%)">' +
        '<div class="modal-head"><h3>' + esc(title) + '</h3></div>' +
        '<div class="modal-body"><p style="margin:0;font-size:13px;color:var(--text-muted)">' + esc(msg) + '</p></div>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-secondary" type="button" id="cno">Cancel</button>' +
          '<button class="btn btn-primary" type="button" id="cyes">' + esc(okLabel) + '</button>' +
        '</div></div></div>';
    var close = function(){ host.innerHTML = ''; };
    $('cno').onclick = close;
    $('cbg').onclick = function(e){ if (e.target.id === 'cbg') close(); };
    $('cyes').onclick = function(){ close(); onOk(); };
  }

  /* ============================================================

    /* ---- queue ---- */
    function paintQueue(){
      if (editing) return;
      $('q-n').textContent = Q.length + (Q.length === 1 ? ' speaker' : ' speakers');
      $('q-list').innerHTML = Q.map(function(e, i){
        var ph = e.photo ? '<span class="qph"><img src="' + e.photo + '" alt=""></span>'
                         : '<span class="qph" style="background:' + e.colour + ';color:#fff">' +
                           esc(e.name ? initials(e.name) : '') + '</span>';

            ph + '<span class="qn">' + (e.name ? esc(e.name) : '<em>Speaker ' + (i + 1) + '</em>') + '</span>' +
            (Q.length > 1 ? '<span class="qx" data-qx="' + i + '" role="button" aria-label="Remove">' +
              svg('<path d="M18 6L6 18M6 6l12 12"/>', 13) + '</span>' : '') +

      $('q-list').querySelectorAll('[data-q]').forEach(function(b){
        b.onclick = function(e){

          readForm(); qi = +b.getAttribute('data-q'); paintForm(); paintQueue();
        };

      $('q-list').querySelectorAll('[data-qx]').forEach(function(x){

          e.stopPropagation();
          var i = +x.getAttribute('data-qx');

          Q.splice(i, 1);

    function paintSave(){

        : (Q.length === 1 ? 'Add speaker' : 'Add all ' + Q.length + ' speakers');

    /* ---- form ---- */
    function field(id, label, val, ph, req){

            '<div class="logo-box">' +
              '<span class="lprev" id="sp-lprev">' +
                (e.logo ? '<img src="' + e.logo + '" alt="">' : svg(IC.image, 16)) + '</span>' +
              '<span class="lt">Company logo <span style="color:var(--text-faint)">— optional, any shape</span></span>' +
              '<button class="btn btn-secondary btn-sm" type="button" id="sp-logobtn">' +
                (e.logo ? 'Replace' : 'Upload') + '</button>' +
              (e.logo ? '<button class="btn btn-ghost btn-icon" type="button" id="sp-logodel" ' +
                'title="Remove logo">' + svg(IC.trash, 14) + '</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="frow" style="margin-top:18px">' +
          field('sp-name', 'Full name', e.name, 'e.g. Rajesh Uppal', true) +
          field('sp-desig', 'Designation', e.desig, 'e.g. Chief Information Officer', true) +
          field('sp-comp', 'Company', e.comp, 'e.g. Maruti Suzuki', true) +

          '<div class="field c6"><label for="sp-gid">Group</label>' +
            '<div class="inp-grp">' +
              '<select class="inp" id="sp-gid">' + spkGroups().map(function(g){
                return '<option value="' + esc(g.id) + '"' + (g.id === e.gid ? ' selected' : '') + '>' +
                  esc(g.name) + '</option>';
              }).join('') + '</select>' +
              '<button class="gbtn" type="button" id="sp-newg">' + svg(IC.plus, 12) + ' New</button>' +
            '</div>' +
            '<p class="hint">Becomes a heading on the live page.</p></div>' +

          '<div class="field c6"><label for="sp-weight">Weight</label>' +
            '<select class="inp" id="sp-weight">' + WEIGHTS.map(function(w){
              return '<option value="' + w.id + '"' + (w.id === e.weight ? ' selected' : '') + '>' +
                esc(w.label) + '</option>';
            }).join('') + '</select>' +
            '<p class="hint" id="sp-wnote"></p></div>' +

          '<div class="field c6"><label for="sp-status">Status</label>' +
            '<select class="inp" id="sp-status">' + STATUSES.map(function(s){
              return '<option value="' + s.id + '"' + (s.id === e.status ? ' selected' : '') + '>' +
                esc(s.label) + '</option>';
            }).join('') + '</select>' +
            '<p class="hint">Only confirmed speakers show on the public page.</p></div>' +
        '</div>' +

        '<div class="acc" data-open="' + (e.email || e.phone || e.bio ? 'true' : 'false') + '" id="sp-acc">' +
          '<button class="acc-head" type="button" id="sp-acch">' + svg(IC.caret, 14) +
            'Additional information' +
            '<span class="ah-sub">Email, mobile and a short bio — all optional</span></button>' +
          '<div class="acc-body"><div class="frow">' +
            field('sp-email', 'Email', e.email, 'name@company.com') +
            field('sp-phone', 'Mobile', e.phone, '+91 98200 00000') +
            '<div class="field c12"><label for="sp-bio">Short bio</label>' +
              '<textarea class="inp" id="sp-bio" style="min-height:70px" ' +
                'placeholder="A line or two for the speaker card.">' + esc(e.bio || '') + '</textarea></div>' +

      paintPhoto();

    function wnote(){
      var v = $('sp-weight').value, n = '';
      WEIGHTS.forEach(function(w){ if (w.id === v) n = w.note; });
      $('sp-wnote').textContent = n;
    }

    function wireForm(){
      wnote();
      $('sp-weight').onchange = wnote;

      $('sp-acch').onclick = function(){
        var a = $('sp-acc');
        a.setAttribute('data-open', a.getAttribute('data-open') === 'true' ? 'false' : 'true');
      };

      $('sp-newg').onclick = function(){
        readForm();
        var g = { id: uid('g-'), name: 'New group' };
        S.spkGroups.push(g);
        save();
        Q[qi].gid = g.id;
        paintForm();
        toast('Group added — rename it on the page');
      };

      $('sp-fetch').onclick = function(){
        var btn = this, url = $('sp-li').value.trim();
        var note = $('sp-linote');
        if (!url){ note.innerHTML = '<span style="color:var(--accent-strong)">Paste a LinkedIn profile link first.</span>'; return; }
        btn.disabled = true;
        btn.innerHTML = '<span class="spin"></span> Fetching';
        note.innerHTML = '';
        liLookup(url, function(data, err){
          btn.disabled = false;
          btn.textContent = 'Fetch details';
          if (err){ note.innerHTML = '<span style="color:var(--accent-strong)">' + esc(err) + '</span>'; return; }
          $('sp-name').value = data.name;
          $('sp-desig').value = data.desig;
          $('sp-comp').value = data.comp;
          note.innerHTML = svg(IC.check, 12) + ' Filled in from the profile — check it reads the way you want.';
          note.style.color = 'var(--ok)';
          readForm(); paintQueue();
        });
      };

      ['sp-name','sp-desig','sp-comp'].forEach(function(id){
        $(id).addEventListener('input', function(){ readForm(); paintQueue(); });
      });

      $('sp-logobtn').onclick = function(){ pickFile(function(file){
        readImage(file, function(img, err){
          if (err){ toast(err); return; }
          Q[qi].logo = shrinkLogo(img, 240, 120);
          paintForm();
        });
      }); };
      var ld = $('sp-logodel');
      if (ld) ld.onclick = function(){ Q[qi].logo = null; paintForm(); };
    }

    function pickFile(cb){
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = function(){ if (inp.files && inp.files[0]) cb(inp.files[0]); };
      inp.click();
    }

    /* ---- the square cropper ---- */
    var VIEW = 176, OUT = 320;

    function paintPhoto(){
      var e = Q[qi], box = $('sp-phbox');
      if (!e.img && !e.photo){
        box.innerHTML =
          '<div class="drop" id="sp-drop" tabindex="0" role="button">' +
            svg(IC.image, 26) +
            '<b>Add a photo</b><span>Drop a file here, or click to choose</span>' +
          '</div>';
        wireDrop();
        return;
      }
      if (!e.img){
        /* an already-saved photo: show it, offer to replace or start again */
        box.innerHTML =
          '<div class="crop"><div class="crop-view"><img src="' + e.photo + '" ' +
            'style="width:' + VIEW + 'px;height:' + VIEW + 'px"></div>' +
            '<div class="crop-acts">' +
              '<button class="btn btn-secondary btn-sm" type="button" id="sp-replace" style="flex:1">Replace photo</button>' +
              '<button class="btn btn-ghost btn-icon" type="button" id="sp-phdel" title="Remove">' +
                svg(IC.trash, 14) + '</button>' +
            '</div></div>';
        $('sp-replace').onclick = function(){ pickFile(loadPhoto); };
        $('sp-phdel').onclick = function(){ e.photo = null; paintPhoto(); paintQueue(); };
        return;
      }
      box.innerHTML =
        '<div class="crop">' +
          '<div class="crop-view" id="sp-cv"><img id="sp-cimg" src="' + e.img + '" alt=""></div>' +
          '<div class="crop-zoom">' + svg(IC.search, 13) +
            '<input type="range" id="sp-zoom" min="1" max="3" step="0.01" value="' + e.zoom + '">' +
          '</div>' +
          '<div class="crop-acts">' +
            '<button class="btn btn-secondary btn-sm" type="button" id="sp-replace" style="flex:1">Replace</button>' +
            '<button class="btn btn-ghost btn-icon" type="button" id="sp-phdel" title="Remove">' +
              svg(IC.trash, 14) + '</button>' +
          '</div>' +
        '</div>';

      var img = $('sp-cimg'), view = $('sp-cv');
      var nat = { w: e.natW, h: e.natH };

      function apply(){
        var cover = Math.max(VIEW / nat.w, VIEW / nat.h);
        var s = cover * e.zoom;
        var w = nat.w * s, h = nat.h * s;
        e.tx = Math.min(0, Math.max(VIEW - w, e.tx));
        e.ty = Math.min(0, Math.max(VIEW - h, e.ty));
        img.style.width = w + 'px';
        img.style.height = h + 'px';
        img.style.left = e.tx + 'px';
        img.style.top = e.ty + 'px';
      }
      function commitCrop(){
        var probe = new Image();
        probe.onload = function(){
          e.photo = cropToSquare(probe, e.tx, e.ty, e.zoom, VIEW, OUT);
          paintQueue();
        };
        probe.src = e.img;
      }
      apply();

      var down = null;
      view.addEventListener('pointerdown', function(ev){
        down = { x: ev.clientX, y: ev.clientY, tx: e.tx, ty: e.ty };
        view.setPointerCapture(ev.pointerId);
      });
      view.addEventListener('pointermove', function(ev){
        if (!down) return;
        e.tx = down.tx + (ev.clientX - down.x);
        e.ty = down.ty + (ev.clientY - down.y);
        apply();
      });
      view.addEventListener('pointerup', function(){ if (down){ down = null; commitCrop(); } });
      view.addEventListener('pointercancel', function(){ down = null; });

      $('sp-zoom').addEventListener('input', function(){ e.zoom = +this.value; apply(); });
      $('sp-zoom').addEventListener('change', commitCrop);

      $('sp-replace').onclick = function(){ pickFile(loadPhoto); };
      $('sp-phdel').onclick = function(){
        e.img = null; e.photo = null; e.zoom = 1; e.tx = 0; e.ty = 0;
        paintPhoto(); paintQueue();
      };
      commitCrop();
    }

    function loadPhoto(file){
      readImage(file, function(img, err){
        if (err){ toast(err); return; }
        var e = Q[qi];
        e.img = img.src; e.natW = img.naturalWidth; e.natH = img.naturalHeight;
        e.zoom = 1;
        /* centre the image in the frame to begin with */
        var cover = Math.max(VIEW / e.natW, VIEW / e.natH);
        e.tx = (VIEW - e.natW * cover) / 2;
        e.ty = (VIEW - e.natH * cover) / 2;
        paintPhoto();
      });
    }

    function wireDrop(){
      var d = $('sp-drop');
      if (!d) return;
      d.onclick = function(){ pickFile(loadPhoto); };
      d.onkeydown = function(ev){ if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); pickFile(loadPhoto); } };
      d.addEventListener('dragover', function(ev){ ev.preventDefault(); d.classList.add('over'); });
      d.addEventListener('dragleave', function(){ d.classList.remove('over'); });
      d.addEventListener('drop', function(ev){
        ev.preventDefault(); d.classList.remove('over');
        if (ev.dataTransfer.files && ev.dataTransfer.files[0]) loadPhoto(ev.dataTransfer.files[0]);
      });
    }

    /* ---- read the form back into the queue entry ---- */
    function readForm(){
      if (!$('sp-name')) return;
      var e = Q[qi];
      e.name = $('sp-name').value.trim();
      e.desig = $('sp-desig').value.trim();
      e.comp = $('sp-comp').value.trim();
      e.gid = $('sp-gid').value;
      e.weight = $('sp-weight').value;
      e.status = $('sp-status').value;
      e.li = $('sp-li').value.trim();
      e.email = $('sp-email').value.trim();
      e.phone = $('sp-phone').value.trim();
      e.bio = $('sp-bio').value.trim();
    }

    $('q-add') && ($('q-add').onclick = function(){
      readForm();
      Q.push(blank());
      qi = Q.length - 1;
      paintForm(); paintQueue(); paintSave();
    });

    $('ssave').onclick = function(){
      readForm();
      var bad = [];
      Q.forEach(function(e, i){ if (!e.name) bad.push(i + 1); });
      if (bad.length){
        $('sp-err').textContent = Q.length === 1 ? 'A name is needed before this can be saved.'
          : (bad.length === 1 ? 'Speaker ' + bad[0] + ' still needs a name.'
                              : 'Speakers ' + bad.join(', ') + ' still need a name.');
        if (!editing){ qi = bad[0] - 1; paintForm(); paintQueue(); }
        return;
      }
      var clean = Q.map(function(e){
        return {
          id: e.id, gid: e.gid, name: e.name, desig: e.desig, comp: e.comp,
          photo: e.photo || null, logo: e.logo || null, colour: e.colour || AV[0],
          weight: e.weight, status: e.status, email: e.email, phone: e.phone, li: e.li, bio: e.bio
        };
      });
      if (editing){

  function viewPeople(kind){
    var titleMap = {
      reg:       ['Registrations', 'Everyone who filled the registration form for this event.'],
      attendees: ['Attendees', 'Registrations that were actually checked in on the day.'],
      shortlist: ['Shortlisted users', 'People your team flagged for follow-up or VIP handling.'],
      visitors:  ['Unique visitors', 'Distinct people who opened the microsite, registered or not.']
    };
    var t = titleMap[kind] || titleMap.reg;
    var all = peopleFor(kind);

    var q = tState.q.toLowerCase();
    var rows = all.filter(function(p){
      if (!q) return true;
      return (p.name + ' ' + p.email + ' ' + p.comp + ' ' + p.desig + ' ' + p.city).toLowerCase().indexOf(q) >= 0;
    });
    rows.sort(function(a, b){
      var A = a[tState.sort], B = b[tState.sort];
      return (A > B ? 1 : A < B ? -1 : 0) * tState.dir;
    });

    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / tState.per));
    if (tState.page > pages) tState.page = pages;
    var from = (tState.page - 1) * tState.per;
    var page = rows.slice(from, from + tState.per);
    var selN = Object.keys(tState.sel).filter(function(k){ return tState.sel[k]; }).length;

    function th(key, label){
      var on = tState.sort === key;
      return '<th class="sortable' + (on ? ' sorted' : '') + '" data-sort="' + key + '">' + esc(label) +
        '<span class="arr">' + (on ? (tState.dir > 0 ? '↑' : '↓') : '↕') + '</span></th>';
    }

    var body = page.map(function(p){
      return '<tr>' +
        '<td style="width:34px"><input type="checkbox" data-sel="' + p.id + '"' + (tState.sel[p.id] ? ' checked' : '') + '></td>' +
        '<td><span class="person"><span class="avat" style="background:' + p.colour + '">' + esc(p.initials) + '</span>' +
          '<span class="pn"><b>' + esc(p.name) + '</b><span>' + esc(p.email) + '</span></span></span></td>' +

        '</tr>';
    }).join('');

    if (!page.length){
      body = '<tr><td colspan="9">' + emptyState(IC.search, 'Nothing matches that search',
        'Try a different name, company or city — or clear the search to see all ' + comma(all.length) + ' records.') + '</td></tr>';
    }

    var pagerBtns = '';
    var show = [];
    for (var i = 1; i <= pages; i++){
      if (i === 1 || i === pages || Math.abs(i - tState.page) <= 1) show.push(i);
      else if (show[show.length - 1] !== '…') show.push('…');

    pagerBtns = show.map(function(n){
      if (n === '…') return '<span style="color:var(--text-faint);padding:0 3px">…</span>';

    var tabs = '<div class="tabs">' +
      [['reg','Registrations',EV.registrations],['attendees','Attendees',PEOPLE.filter(function(p){return p.attended;}).length],
       ['shortlist','Shortlisted',EV.shortlist],['visitors','Unique visitors',PEOPLE.length]].map(function(x){
        return '<button type="button" data-goto="' + x[0] + '" aria-pressed="' + (kind === x[0]) + '">' +
          esc(x[1]) + ' (' + comma(x[2]) + ')</button>';
      }).join('') + '</div>';

    var toolbar =
      '<div class="toolbar">' +
        '<span class="search">' + svg(IC.search, 15) +

        '<button class="btn btn-secondary btn-sm" type="button" data-save="Column picker opened">Columns</button>' +
      '</div>';

    var bulk = selN
      ? '<div class="bulk"><b>' + selN + ' selected</b>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-save="Mailer queued for ' + selN + '">' + svg(IC.mail, 13) + ' Email</button>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-save="WhatsApp queued for ' + selN + '">' + svg(IC.wa, 13) + ' WhatsApp</button>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-save="Shortlisted ' + selN + '">Shortlist</button>' +
          '<button class="btn btn-ghost btn-sm" type="button" id="clear-sel">Clear</button>' +
        '</div>'
      : '';

    return vhead(t[0], t[1]) +
      '<div style="margin-bottom:16px">' + tabs + '</div>' +
      '<div class="panel">' + toolbar + bulk +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th style="width:34px"><input type="checkbox" id="sel-all"></th>' +
          th('name','Name') + th('desig','Designation') + th('comp','Company') +
          th('city','Location') + th('src','Source') + th('when','Registered') +
          (kind === 'reg' ? th('paid','Payment') : '') +
        '</tr></thead><tbody>' + body + '</tbody></table></div>' +
        '<div class="pager"><span class="cnt">Showing ' + (total ? from + 1 : 0) + ' to ' +
          Math.min(from + tState.per, total) + ' of ' + comma(total) + ' entries</span>' +
          '<button class="pg-btn" type="button" data-page="' + (tState.page - 1) + '"' + (tState.page <= 1 ? ' disabled' : '') + '>‹</button>' +
          pagerBtns +
          '<button class="pg-btn" type="button" data-page="' + (tState.page + 1) + '"' + (tState.page >= pages ? ' disabled' : '') + '>›</button>' +
        '</div>' +
      '</div>';
  }

  function wirePeople(){
    var q = $('tbl-q');
    if (q){
      q.oninput = function(){ tState.q = q.value; tState.page = 1; render();
        var n = $('tbl-q'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
    }
    document.querySelectorAll('[data-sort]').forEach(function(th){
      th.addEventListener('click', function(){
        var k = th.getAttribute('data-sort');
        if (tState.sort === k) tState.dir = -tState.dir; else { tState.sort = k; tState.dir = 1; }
        render();
      });
    });
    document.querySelectorAll('[data-page]').forEach(function(b){
      b.addEventListener('click', function(){
        var n = parseInt(b.getAttribute('data-page'), 10);
        if (!isNaN(n) && n > 0){ tState.page = n; render(); }
      });
    });
    document.querySelectorAll('[data-sel]').forEach(function(cb){
      cb.addEventListener('change', function(){
        tState.sel[cb.getAttribute('data-sel')] = cb.checked; render();
      });
    });
    var all = $('sel-all');
    if (all) all.onchange = function(){
      document.querySelectorAll('[data-sel]').forEach(function(cb){
        tState.sel[cb.getAttribute('data-sel')] = all.checked;
      });
      render();
    };
    var clr = $('clear-sel');
    if (clr) clr.onclick = function(){ tState.sel = {}; render(); };
  }

    'settings/visibility':  viewVisibility,

  };

  function render(){
    var r = routeId();
    var fn = VIEWS[r] || VIEWS.dashboard;
    $('view').innerHTML = tabsHTML() + fn();

    /* tabs */
    document.querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){ go(cur.sec + '/' + b.getAttribute('data-tab')); });
    });

    /* generic wiring available on every view */
    document.querySelectorAll('[data-goto]').forEach(function(b){
      b.addEventListener('click', function(){ go(b.getAttribute('data-goto')); });
    });
    document.querySelectorAll('[data-save]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        toast(b.getAttribute('data-save'));
      });
    });

    /* per-view wiring */
    if (r === 'dashboard') DASH.wire(CTX);
    if (r === 'content/basics') wireBasics();
    if (r === 'content/speakers') wireSpeakers();
    if (r === 'design/sections') wireSections();
    if (r === 'design/nav') wireSetNav();
    if (r === 'design/theme') wireTheme();
    if (r === 'settings/visibility') wireVisibility();
    if (cur.sec === 'marketing') MKT.wire(cur.tab, CTX);
    if (['settings/form','settings/advanced','settings/links'].indexOf(r) >= 0) wireReminders();
    if (['audience/attendees','audience/shortlist'].indexOf(r) >= 0) wirePeople();

    var p2 = $('btn-preview-2');
    if (p2) p2.onclick = openPreview;
  }

                '<div style="font-size:12.5px;opacity:.9">' + esc(fmtDT(EV.start)) + ' · ' + esc(EV.venue) + '</div>' +
                '<div style="margin-top:14px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">' +
                  '<span style="background:#fff;color:var(--accent-strong);padding:8px 18px;border-radius:8px;font-size:12.5px;font-weight:800">Register now</span>' +
                  '<span style="border:1.5px solid #fff;padding:8px 18px;border-radius:8px;font-size:12.5px;font-weight:800">Become a partner</span>' +
                '</div>' +
              '</div>' +
              '<div style="padding:18px 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;border-bottom:1px solid var(--border)">' +
                [['Delegates', comma(EV.registrations)], ['Speakers', String(spkAll().length)], ['Sessions','7'], ['Partners','10']].map(function(s){
                  return '<div><div style="font-family:var(--font-display);font-size:19px;font-weight:700">' + esc(s[1]) + '</div>' +
                    '<div style="font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700">' + esc(s[0]) + '</div></div>';
                }).join('') +
              '</div>' +
              '<div style="padding:20px">' +
                '<div class="eyebrow" style="margin-bottom:7px">About the event</div>' +
                '<p style="font-size:13px;color:var(--text-muted);margin:0 0 16px;line-height:1.6">India’s decision-makers gather to set the agenda for the year ahead. Two days of keynotes, closed-door roundtables and the conversations that do not happen anywhere else.</p>' +
                '<div class="eyebrow" style="margin-bottom:9px">Speakers</div>' +
                '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">' +
                  spkAll().slice(0,3).map(function(p, i){
                    var face = p.photo
                      ? '<div style="width:40px;height:40px;border-radius:50%;margin:0 auto 7px;overflow:hidden">' +
                          '<img src="' + p.photo + '" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>'
                      : '<div class="avat" style="background:' + (p.colour || AV[i]) + ';width:40px;height:40px;margin:0 auto 7px;font-size:14px">' +
                          esc(initials(p.name)) + '</div>';
                    return '<div style="border:1px solid var(--border);border-radius:10px;padding:11px;text-align:center">' +
                      face +
                      '<div style="font-size:12.5px;font-weight:700">' + esc(p.name) + '</div>' +
                      '<div style="font-size:10.5px;color:var(--text-muted)">' + esc(p.comp) + '</div></div>';
                  }).join('') +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="modal-foot">' +
          '<span style="flex:1;font-size:12px;color:var(--text-muted);align-self:center">This is a rendering of the current draft. Publish to make it live.</span>' +
          '<a class="btn btn-secondary" href="custom_editor.html?event=' + EV.id + '">' + svg(IC.brush, 14) + ' Edit in editor</a>' +
          '<button class="btn btn-primary" type="button" id="pv-publish">Publish</button>' +
        '</div>' +
      '</div></div>';

    function close(){ host.innerHTML = ''; }
    $('mclose').onclick = close;
    $('mbg').addEventListener('click', function(e){ if (e.target.id === 'mbg') close(); });
    $('pv-publish').onclick = function(){ close(); doPublish(); };
    host.querySelectorAll('[data-pv]').forEach(function(b){
      b.addEventListener('click', function(){
        host.querySelectorAll('[data-pv]').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
        $('pv-frame').style.maxWidth = b.getAttribute('data-pv') === 'mobile' ? '380px' : '100%';
      });
    });
  }

  function doPublish(){
    S.published = true; save();
    toast('Published. The microsite is live at etoneworld.com');
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function boot(){
    $('ev-name').textContent = EV.name + ' | ' + (PORTALS[EV.portal] || '');
    $('ev-meta').textContent = fmtDT(EV.start) + '  |  ' + EV.eventNo + '  |  ' + (TYPES[EV.type] || EV.type);
    document.title = 'Edit — ' + EV.name + ' — Revamp CMS';

    $('btn-preview').onclick = openPreview;
    $('btn-publish').onclick = doPublish;

    window.addEventListener('hashchange', function(){
      var h = location.hash.slice(1);
      if (h && h !== routeId()) go(h);
    });

    go(location.hash.slice(1) || 'content/basics');
  }

  boot();
})();
</script>
