<!-- ET Oneworld - Revamp CMS : standalone workbench for the DASHBOARD section.
     Open this file directly to work on edit-event-dashboard.js on its own.
     It renders the same view the console does, from the same JS, so whatever
     looks right here looks right inside edit-event.html. -->
<title>Dashboard workbench &mdash; Revamp CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="edit-event.css">
<style>
  .wb-bar{
    position: sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
    padding:10px 16px; background: var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .wb-bar .tag{
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
    background: var(--review-soft); color: var(--review); padding:3px 9px; border-radius:999px;
  }
  .wb-bar b{ font-size:14px; }
  .wb-bar .sp{ flex:1; }
  .wb-bar select{ max-width:260px; }
  .wb-main{ padding:22px 26px 60px; max-width:1400px; }
  @media (max-width:760px){ .wb-main{ padding:16px 14px 50px; } }
</style>

<div class="wb-bar">
  <span class="tag">Workbench</span>
  <b>Dashboard</b>
  <span style="font-size:12px;color:var(--text-muted)">edit-event-dashboard.js</span>
  <span class="sp"></span>
  <label style="font-size:12px;color:var(--text-muted)" for="wb-ev">Event</label>
  <select class="inp" id="wb-ev" style="width:auto"></select>
  <a class="btn btn-secondary btn-sm" href="edit-event.html#dashboard">Open in console</a>
</div>

<main class="wb-main"><div id="view"></div></main>
<div class="toast-host" id="toast-host"></div>

<script src="edit-event-core.js"></script>
<script src="edit-event-dashboard.js"></script>
<script>
(function(){
  'use strict';
  var C = window.RevampCore;
  var DASH = window.EditEventDashboard;

  var sel = document.getElementById('wb-ev');
  sel.innerHTML = C.EVENTS.map(function(e){
    return '<option value="' + e.id + '">' + C.esc(e.name) + '</option>';
  }).join('');

  function draw(){
    var EV = C.eventById(sel.value) || C.EVENTS[0];
    var KEY = 'revamp-edit-event-' + EV.id;
    var S = C.loadState(KEY);

    var ctx = C.makeCtx({
      EV: EV, S: S, PEOPLE: C.makePeople(EV),
      vhead: function(t, sub, right){
        return '<div class="vhead"><div class="vhead-row"><div class="grow">' +
          '<div class="crumb">Dashboard</div><h2>' + C.esc(t) + '</h2>' +
          (sub ? '<div class="sub">' + C.esc(sub) + '</div>' : '') + '</div>' +
          (right ? '<div style="display:flex;gap:9px;flex-wrap:wrap">' + right + '</div>' : '') +
          '</div></div>';
      },
      /* in the workbench a navigation just says where it would have gone */
      go: function(r){ C.toast('Would navigate to: ' + r); },
      render: draw,
      save: function(){ C.saveState(KEY, S); }
    });

    document.getElementById('view').innerHTML = DASH.view(ctx);
    DASH.wire(ctx);

    document.querySelectorAll('[data-goto]').forEach(function(b){
      b.addEventListener('click', function(){ ctx.go(b.getAttribute('data-goto')); });
    });
    document.querySelectorAll('[data-save]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); C.toast(b.getAttribute('data-save')); });
    });
  }

  sel.onchange = draw;
  draw();
})();
</script>
