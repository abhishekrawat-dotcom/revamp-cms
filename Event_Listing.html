<!-- ET Oneworld - Self-Serve Microsite Builder : Event Listing (v2 — premium dashboard redesign) -->
<title>Events &mdash; Revamp CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg: #F7F7F4;
    --surface: #FFFFFF;
    --surface-2: #F1F0EC;
    --surface-3: #E7E5DF;
    --border: #E6E4DE;
    --border-strong: #D7D4CB;
    --text: #1D1B17;
    --text-muted: #6C6A60;
    --text-faint: #9B988D;

    --accent: #FF0035;
    --accent-strong: #D6002C;
    --accent-soft: #FFE3E8;
    --accent-contrast: #FFFFFF;

    --brand-red: #FF0035;
    --draft: #8A7A99;
    --draft-soft: #EEE8F2;

    --ok: #16794F;
    --ok-soft: #E4F5EC;
    --warn: #A9700F;
    --warn-soft: #FBF0DA;
    --crit: #C13333;
    --crit-soft: #FBE8E7;

    --tag-blue: #1D5FA3; --tag-blue-soft: #E3EEFB;
    --tag-teal: #0E7C6B; --tag-teal-soft: #E0F5F0;
    --tag-violet: #7A3FA0; --tag-violet-soft: #F1E7F8;
    --tag-cyan: #0E7490; --tag-cyan-soft: #DFF4F8;
    --tag-amber: #9C6B0B; --tag-amber-soft: #F7EEDA;
    --tag-rose: #B23A6B; --tag-rose-soft: #FBE7EF;

    --shadow-xs: 0 1px 2px rgba(20,18,12,0.05);
    --shadow-sm: 0 3px 8px -2px rgba(20,18,12,0.08);
    --shadow-md: 0 14px 32px -14px rgba(20,18,12,0.22);
    --shadow-lg: 0 30px 60px -24px rgba(20,18,12,0.30);

    --r-sm: 8px; --r-md: 12px; --r-lg: 16px;

    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141310; --surface:#1B1A16; --surface-2:#232219; --surface-3:#2C2A20;
      --border:#332F24; --border-strong:#3E3A2C; --text:#EFEBDF; --text-muted:#A6A192; --text-faint:#726E60;
      --accent:#FF4D6D; --accent-strong:#FF7A90; --accent-soft:#3A0C14; --accent-contrast:#1B0508;
      --brand-red:#FF4D6D; --draft:#B9A9C9; --draft-soft:#2A2331;
      --ok:#4CB484; --ok-soft:#173225; --warn:#D8A64A; --warn-soft:#332711; --crit:#E27A7A; --crit-soft:#3A1E1D;
      --tag-blue:#7EB6E8; --tag-blue-soft:#132A3D;
      --tag-teal:#5FCDB8; --tag-teal-soft:#0F2B24;
      --tag-violet:#C79FE8; --tag-violet-soft:#2B1E38;
      --tag-cyan:#6FD3E8; --tag-cyan-soft:#0F2A30;
      --tag-amber:#E8C069; --tag-amber-soft:#332711;
      --tag-rose:#F08FB5; --tag-rose-soft:#3A1826;
      --shadow-sm:0 3px 8px -2px rgba(0,0,0,.4); --shadow-md:0 16px 34px -14px rgba(0,0,0,.55); --shadow-lg:0 32px 64px -24px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141310; --surface:#1B1A16; --surface-2:#232219; --surface-3:#2C2A20;
    --border:#332F24; --border-strong:#3E3A2C; --text:#EFEBDF; --text-muted:#A6A192; --text-faint:#726E60;
    --accent:#FF4D6D; --accent-strong:#FF7A90; --accent-soft:#3A0C14; --accent-contrast:#1B0508;
    --brand-red:#FF4D6D; --draft:#B9A9C9; --draft-soft:#2A2331;
    --ok:#4CB484; --ok-soft:#173225; --warn:#D8A64A; --warn-soft:#332711; --crit:#E27A7A; --crit-soft:#3A1E1D;
    --tag-blue:#7EB6E8; --tag-blue-soft:#132A3D;
    --tag-teal:#5FCDB8; --tag-teal-soft:#0F2B24;
    --tag-violet:#C79FE8; --tag-violet-soft:#2B1E38;
    --tag-cyan:#6FD3E8; --tag-cyan-soft:#0F2A30;
    --tag-amber:#E8C069; --tag-amber-soft:#332711;
    --tag-rose:#F08FB5; --tag-rose-soft:#3A1826;
    --shadow-sm:0 3px 8px -2px rgba(0,0,0,.4); --shadow-md:0 16px 34px -14px rgba(0,0,0,.55); --shadow-lg:0 32px 64px -24px rgba(0,0,0,.7);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; }
  p{ margin:0; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:var(--font-body); cursor:pointer; }
  input,select{ font-family:var(--font-body); font-size:13.5px; color:var(--text); }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  [hidden]{ display:none !important; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .muted{ color:var(--text-muted); }
  .faint{ color:var(--text-faint); }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

  /* ---------- buttons ---------- */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; font-size:13px; font-weight:600; padding:8px 14px; border-radius:var(--r-sm); border:1px solid transparent; white-space:nowrap; transition:background .15s ease,border-color .15s ease,color .15s ease,transform .05s ease; }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); color:var(--accent-contrast); }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-secondary{ background:var(--surface); color:var(--text); border-color:var(--border-strong); }
  .btn-secondary:hover{ background:var(--surface-2); }
  .btn-ghost{ background:transparent; color:var(--text-muted); border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); color:var(--text); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:7px; }
  .btn-block{ width:100%; }
  .btn[disabled]{ opacity:.45; pointer-events:none; }
  .icon-btn{ width:32px; height:32px; border-radius:var(--r-sm); border:1px solid transparent; background:transparent; color:var(--text-muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s ease,color .15s ease; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--text); }
  .icon-btn.active{ background:var(--accent-soft); color:var(--accent-strong); }
  .spin{ animation:spin .7s linear; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- layout shell ---------- */
  .app{ max-width:1240px; margin:0 auto; padding:0 24px 70px; display:flex; flex-direction:column; gap:12px; }

  /* ---------- main portal navigation (sticky, full-bleed, single row) ---------- */
  .main-nav{ background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:60; }
  .main-nav-inner{ max-width:1240px; margin:0 auto; height:60px; display:flex; align-items:center; gap:16px; padding:0 24px; }
  .main-nav-brand{ display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .brand-logo-img{ height:28px; width:auto; display:block; }

  .main-nav-scroll{ flex:0 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none; display:flex; align-items:center; gap:2px; }
  .main-nav-scroll::-webkit-scrollbar{ display:none; }
  .main-nav-links{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .main-nav-links a, .mp-btn{ display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text-muted); white-space:nowrap; background:none; border:none; font-family:var(--font-body); cursor:pointer; flex-shrink:0; }
  .main-nav-links a svg, .mp-btn svg{ flex-shrink:0; opacity:.75; }
  .main-nav-links a:hover, .mp-btn:hover{ background:var(--surface-2); color:var(--text); }
  .main-nav-links a.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:700; }
  .main-nav-links a.active svg{ opacity:1; }
  .main-nav-more{ flex-shrink:0; }
  .main-nav-portals{ flex-shrink:0; }

  .main-nav-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .avatar-btn{ width:34px; height:34px; border-radius:50%; border:none; background:none; padding:0; display:flex; align-items:center; justify-content:center; }
  .avatar-circle{ width:100%; height:100%; border-radius:50%; background:var(--accent); color:var(--accent-contrast); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; font-family:var(--font-display); }

  /* ---------- section bar: tabs + actions, one compact row ---------- */
  .section-bar{ position:relative; display:flex; align-items:center; justify-content:flex-end; gap:16px; flex-wrap:wrap; padding:10px 0 0; border-bottom:1px solid var(--border); min-height:46px; }
  .section-bar-left{ position:absolute; left:50%; top:10px; bottom:0; transform:translateX(-50%); display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; }
  .section-bar-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; padding-bottom:8px; }
  .sync-btn{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-faint); font-weight:600; padding:6px 9px; border-radius:7px; background:none; border:none; }
  .sync-btn:hover{ background:var(--surface-2); color:var(--text-muted); }

  /* ---------- tabs ---------- */
  .tabs-row{ display:flex; align-items:center; gap:4px; position:relative; }
  .tabs-row button{ position:relative; background:none; border:none; padding:8px 4px; margin-right:18px; font-size:13.5px; font-weight:600; color:var(--text-muted); display:flex; align-items:center; gap:7px; }
  .tabs-row button:hover{ color:var(--text); }
  .tabs-row button .tc{ font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--text-faint); background:var(--surface-2); border-radius:100px; padding:1px 7px; }
  .tabs-row button[aria-selected="true"]{ color:var(--text); }
  .tabs-row button[aria-selected="true"] .tc{ background:var(--accent-soft); color:var(--accent-strong); }
  .tabs-underline{ position:absolute; bottom:-1px; height:2px; background:var(--accent); border-radius:2px; transition:left .2s ease, width .2s ease; }

  /* ---------- special view banner ---------- */
  .special-banner{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--r-md); background:var(--accent-soft); color:var(--accent-strong); font-size:13px; font-weight:600; }
  .special-banner button{ background:none; border:none; color:var(--accent-strong); font-weight:700; text-decoration:underline; font-size:13px; margin-left:auto; }

  /* ---------- insights ---------- */
  .insights-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .insights-head h2{ font-size:17px; }
  .kpi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:12px; }
  @media (max-width:760px){ .kpi-grid{ grid-template-columns:1fr; } }
  .kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px 20px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow-xs); }
  .kpi-card .kpi-top{ display:flex; align-items:center; justify-content:space-between; }
  .kpi-card .kpi-label{ font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint); }
  .kpi-card .kpi-icon{ color:var(--text-faint); }
  .kpi-card .kpi-num{ font-family:var(--font-mono); font-size:29px; font-weight:600; letter-spacing:-0.01em; }
  .kpi-delta{ font-size:12px; font-weight:700; display:flex; align-items:center; gap:4px; }
  .kpi-delta.up{ color:var(--ok); } .kpi-delta.down{ color:var(--crit); }
  .kpi-delta .vs{ color:var(--text-faint); font-weight:600; }
  .kpi-skel{ height:29px; width:70%; background:var(--surface-3); border-radius:6px; }

  /* ---------- popovers (generic) ---------- */
  .popover-wrap{ position:relative; }
  .popover{ position:absolute; top:calc(100% + 6px); left:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow-md); min-width:230px; z-index:50; padding:8px; }
  .popover.right{ left:auto; right:0; }
  .popover.wide{ min-width:300px; }
  .popover-label{ padding:6px 8px 4px; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); }
  .popover-item{ display:flex; align-items:center; gap:9px; width:100%; padding:8px 9px; border-radius:7px; font-size:13px; color:var(--text); text-align:left; background:none; border:none; }
  .popover-item:hover{ background:var(--surface-2); }
  .popover-item svg{ color:var(--text-faint); flex-shrink:0; }
  .popover-item.danger{ color:var(--crit); } .popover-item.danger svg{ color:var(--crit); }
  .popover-sep{ height:1px; background:var(--border); margin:6px 2px; }
  .check-row{ display:flex; align-items:center; gap:9px; width:100%; padding:7px 9px; border-radius:7px; font-size:13px; background:none; border:none; text-align:left; color:var(--text); }
  .check-row:hover{ background:var(--surface-2); }
  .check-box{ width:16px; height:16px; border-radius:5px; border:1.5px solid var(--border-strong); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:transparent; }
  .check-row.on .check-box{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .radio-row{ display:flex; align-items:center; gap:9px; width:100%; padding:7px 9px; border-radius:7px; font-size:13px; background:none; border:none; text-align:left; color:var(--text); }
  .radio-row:hover{ background:var(--surface-2); }
  .radio-row .dot{ width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border-strong); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .radio-row .dot i{ width:7px; height:7px; border-radius:50%; background:transparent; }
  .radio-row.on .dot{ border-color:var(--accent); } .radio-row.on .dot i{ background:var(--accent); }
  .radio-row.on{ font-weight:700; }
  .popover-foot{ display:flex; justify-content:flex-end; gap:8px; padding:8px 4px 2px; border-top:1px solid var(--border); margin-top:4px; }

  .range-popover .custom-fields{ display:flex; gap:8px; padding:8px 8px 4px; }
  .range-popover .cf{ flex:1; }
  .range-popover .cf label{ display:block; font-size:10.5px; font-weight:700; color:var(--text-faint); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  .range-popover input[type=date]{ width:100%; padding:7px 8px; border-radius:7px; border:1px solid var(--border-strong); background:var(--bg); color:var(--text); font-size:12.5px; }

  /* ---------- toolbar ---------- */
  .toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .toolbar-filters-group{ flex:1; display:flex; align-items:center; justify-content:flex-start; gap:8px; flex-wrap:wrap; min-width:0; }
  .toolbar-right-group{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-sm); padding:8px 10px; width:100%; max-width:290px; color:var(--text-faint); }
  .search-box:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .search-box input{ border:none; background:none; outline:none; color:var(--text); font-size:13px; width:100%; }
  .search-box input::placeholder{ color:var(--text-faint); }
  .search-box svg{ flex-shrink:0; }
  .search-box .kbd{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 5px; flex-shrink:0; }
  .search-box .clear-btn{ background:none; border:none; color:var(--text-faint); display:flex; padding:0; flex-shrink:0; }
  .search-box .clear-btn:hover{ color:var(--text); }
  .toolbar-btn{ display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:var(--r-sm); border:1px solid var(--border-strong); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--text); }
  .toolbar-btn:hover{ background:var(--surface-2); }
  .toolbar-btn.active-filter{ border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft); }
  .toolbar-btn .badge-count{ font-family:var(--font-mono); font-size:10px; font-weight:700; background:var(--accent); color:#fff; border-radius:100px; padding:0 6px; }
  .qr-toolbar-btn{ border-color:var(--tag-violet); color:var(--tag-violet); background:var(--tag-violet-soft); }
  .qr-toolbar-btn:hover{ background:var(--tag-violet); color:#fff; }

  .chip-row{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .fchip{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--accent-strong); background:var(--accent-soft); border-radius:100px; padding:5px 6px 5px 11px; }
  .fchip button{ background:none; border:none; color:var(--accent-strong); display:flex; opacity:.7; }
  .fchip button:hover{ opacity:1; }
  .chip-clear{ font-size:12px; font-weight:700; color:var(--text-faint); background:none; border:none; text-decoration:underline; }
  .chip-clear:hover{ color:var(--text); }

  .result-line{ font-size:12.5px; color:var(--text-faint); white-space:nowrap; flex-shrink:0; }

  /* ---------- table ---------- */
  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); overflow:auto; box-shadow:var(--shadow-sm); }
  table.ev-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:13.5px; min-width:900px; }
  .ev-table thead th{ position:sticky; top:0; background:var(--surface-2); z-index:2; text-align:left; padding:13px 16px; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid var(--border-strong); white-space:nowrap; }
  .ev-table th.sortable{ cursor:pointer; user-select:none; }
  .ev-table th.sortable:hover{ color:var(--text); }
  .ev-table th .sort-ic{ margin-left:4px; opacity:.4; }
  .ev-table th.sorted .sort-ic{ opacity:1; color:var(--accent); }
  .ev-table td{ padding:16px; border-bottom:1px solid var(--border); vertical-align:top; }
  .ev-table tbody tr{ transition:background .12s ease; cursor:pointer; }
  .ev-table tbody tr td:first-child{ box-shadow:inset 3px 0 0 transparent; transition:box-shadow .12s ease; }
  .ev-table tbody tr.st-upcoming td:first-child{ box-shadow:inset 3px 0 0 var(--accent); }
  .ev-table tbody tr.st-active td:first-child{ box-shadow:inset 3px 0 0 var(--ok); }
  .ev-table tbody tr.st-completed td:first-child{ box-shadow:inset 3px 0 0 var(--text-faint); }
  .ev-table tbody tr.st-cancelled td:first-child{ box-shadow:inset 3px 0 0 var(--warn); }
  .ev-table tbody tr.st-draft td:first-child{ box-shadow:inset 3px 0 0 var(--draft); }
  .ev-table tbody tr.st-deleted td:first-child{ box-shadow:inset 3px 0 0 var(--crit); }
  .ev-table tbody tr:hover{ background:var(--surface-2); }
  .ev-table tbody tr:last-child td{ border-bottom:none; }

  .ev-name-cell{ display:flex; gap:11px; align-items:flex-start; min-width:250px; }
  .status-dot{ width:9px; height:9px; border-radius:50%; margin-top:7px; flex-shrink:0; }
  .status-dot.upcoming{ background:var(--accent); }
  .status-dot.active{ background:var(--ok); }
  .status-dot.completed{ background:var(--text-faint); }
  .status-dot.cancelled{ background:var(--warn); }
  .status-dot.draft{ background:var(--draft); }
  .status-dot.deleted{ background:var(--crit); }
  .ev-name-main{ min-width:0; }
  .ev-name-main .ev-link{ font-weight:700; font-size:14.5px; color:var(--text); line-height:1.35; background:none; border:none; padding:0; text-align:left; font-family:var(--font-body); display:inline; cursor:pointer; }
  .ev-name-main .ev-link:hover{ color:var(--accent-strong); text-decoration:underline; }
  .ev-meta-line{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-muted); margin-top:7px; flex-wrap:wrap; }
  .ev-meta-line .dotsep{ color:var(--text-faint); }
  .ev-id-chip{ font-size:10.5px; font-weight:800; letter-spacing:.02em; border-radius:100px; padding:3px 10px; color:var(--accent-strong); background:var(--accent-soft); }
  .ev-tag{ font-size:10.5px; font-weight:800; letter-spacing:.02em; border-radius:100px; padding:3px 10px; }
  .ev-tag-blue{ color:var(--tag-blue); background:var(--tag-blue-soft); }
  .ev-tag-teal{ color:var(--tag-teal); background:var(--tag-teal-soft); }
  .ev-tag-violet{ color:var(--tag-violet); background:var(--tag-violet-soft); }
  .ev-tag-cyan{ color:var(--tag-cyan); background:var(--tag-cyan-soft); }

  /* ---------- QR code modal ---------- */

  /* ---------- lower dashboard: segmentation + activity ---------- */

  /* ---------- segmentation table (list view) ---------- */

      var idxs = pool.map(function(_,i){ return i; });
      idxs.sort(function(a,b){ return rand(a) - rand(b); });
      var chosen = idxs.slice(0, count);
      var weights = [], wsum = 0;
      chosen.forEach(function(ci,k){ var w = 0.3 + rand(ci+100)*0.7; weights.push(w); wsum += w; });
      return chosen.map(function(ci,k){ return { label: pool[ci], value: Math.max(1, Math.round(base * (weights[k]/wsum) * 0.55)), trend: makeTrend(ci*17 + 5) }; })
        .sort(function(a,b){ return b.value - a.value; });
    }
    var mobileShare = 0.45 + rand(999)*0.25;
    var mobile = Math.round(base * mobileShare);

  function fmtNum(n){ return Number(n||0).toLocaleString('en-IN'); }
  function fmtCompact(n){
    n = Number(n||0);
    if (n >= 100000) return (n/100000).toFixed(2).replace(/\.00$/,'') + 'L';
    if (n >= 1000) return (n/1000).toFixed(2).replace(/\.00$/,'') + 'K';

  function showGlobalTooltip(target){
    var text = target.getAttribute('data-tooltip');
    if (!text) return;
    var el = $('gt-tooltip');
    el.textContent = text;
    el.hidden = false;
    var r = target.getBoundingClientRect();
    var tw = el.offsetWidth, th = el.offsetHeight;
    var left = Math.max(6, Math.min(r.left + r.width/2 - tw/2, window.innerWidth - tw - 6));
    var top = r.top - th - 8;
    if (top < 6) top = r.bottom + 8;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }
  function hideGlobalTooltip(){ var el = $('gt-tooltip'); if (el) el.hidden = true; }
  document.addEventListener('mouseover', function(e){

  });
  document.addEventListener('mouseout', function(e){

  document.addEventListener('focusin', function(e){

  function computeRangeDayCount(rs){
    if (rs.mode === 'today') return 1;
    if (rs.mode !== 'custom') return parseInt(rs.mode, 10);
    if (!rs.start || !rs.end) return 30;
    var d = (new Date(rs.end) - new Date(rs.start)) / 86400000;
    return Math.max(1, Math.round(d) + 1);
  }
  function computeRangeFactor(rs){
    if (rs.mode !== 'custom') return RANGE_FACTOR[rs.mode];
    return Math.min(1.6, Math.max(0.03, computeRangeDayCount(rs) / 30));
  }
  function computeRangeLabel(rs){
    if (rs.mode === 'today') return 'Today';
    if (rs.mode === '7') return 'Last 7 days';
    if (rs.mode === '10') return 'Last 10 days';
    if (rs.mode === '30') return 'Last 30 days';
    if (rs.start && rs.end) return fmtDate(rs.start) + ' → ' + fmtDate(rs.end);
    return 'Custom range';
  }
  function rangeFactor(){ return computeRangeFactor(state.range); }
  function rangeLabelText(){ return computeRangeLabel(state.range); }

    var bucket = state.specialView ? 'upcoming' : state.tab;
    var base = KPI_BASE[bucket];
    var f = rangeFactor();
    var ds = RANGE_DELTA_SCALE[state.range.mode] || 1;
    var vis = Math.round(base.visitors * f);
    var reg = Math.round(base.registrations * f);
    var rev = Math.round(base.revenue * f);
    var dVis = +(base.dVis * ds).toFixed(1);

    var dRev = +(base.dRev * ds).toFixed(1);

    function card(label, icon, value, delta){
      var up = delta >= 0;
      return '<div class="kpi-card fade-in">' +
        '<div class="kpi-top"><span class="kpi-label">' + label + '</span><span class="kpi-icon">' + icon + '</span></div>' +
        '<span class="kpi-num">' + value + '</span>' +
        '<span class="kpi-delta ' + (up?'up':'down') + '">' + (up ? IC.arrowUp : IC.arrowDown) + ' ' + Math.abs(delta) + '% <span class="vs">vs previous period</span></span>' +
      '</div>';
    }
    $('kpi-grid').innerHTML =
      card('Total Visitors', IC.users, fmtCompact(vis), dVis) +
      card('Total Registrations', IC.ticket, fmtCompact(reg), dReg) +
      card('Total Revenue', IC.wallet, fmtRupee(rev), dRev);

  /* =========================================================
     FILTER POPOVERS
  ========================================================= */
  function toggleInArray(arr, val){

    if (i===-1) arr.push(val); else arr.splice(i,1);
  }

    $('type-popover').innerHTML = '<div class="popover-label">Event type</div>' + Object.keys(EVENT_TYPES).map(function(k){
      var on = state.filters.types.indexOf(k) !== -1;

    }).join('');
    $('type-popover').querySelectorAll('[data-type]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); toggleInArray(state.filters.types, b.getAttribute('data-type')); state.page=1; renderTypePopover(); renderResults(); renderToolbarButtons(); });
    });
  }
  function renderPortalPopover(){

      var on = state.filters.portals.indexOf(k) !== -1;

      b.addEventListener('click', function(e){ e.stopPropagation(); toggleInArray(state.filters.portals, b.getAttribute('data-portal')); state.page=1; renderPortalPopover(); renderResults(); renderToolbarButtons(); });

  $('btn-type').addEventListener('click', function(e){ e.stopPropagation(); if (state.openPopover==='type-popover'){closeAll();return;} renderTypePopover(); openPopover('type-popover'); });
  $('btn-portal').addEventListener('click', function(e){ e.stopPropagation(); if (state.openPopover==='portal-popover'){closeAll();return;} renderPortalPopover(); openPopover('portal-popover'); });
  $('btn-qr-toolbar').addEventListener('click', function(){ openQRModal(); });

  function renderToolbarButtons(){
    var tCount = state.filters.types.length, pCount = state.filters.portals.length;
    $('btn-type').className = 'toolbar-btn' + (tCount?' active-filter':'');
    $('btn-type').innerHTML = 'Event Type' + (tCount ? ' <span class="badge-count">'+tCount+'</span>' : '') + ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 9l6 6 6-6"/></svg>';

    $('btn-portal').innerHTML = 'Portal' + (pCount ? ' <span class="badge-count">'+pCount+'</span>' : '') + ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 9l6 6 6-6"/></svg>';
  }

  function renderChips(){
    var chips = [];
    state.filters.types.forEach(function(k){ chips.push({ label:'Type: '+EVENT_TYPES[k], onRemove:function(){ toggleInArray(state.filters.types,k); } }); });
    state.filters.portals.forEach(function(k){ chips.push({ label:'Portal: '+PORTALS[k], onRemove:function(){ toggleInArray(state.filters.portals,k); } }); });
    state.filters.payment.forEach(function(k){ chips.push({ label:'Payment: '+(k==='paid'?'Paid':'Free'), onRemove:function(){ toggleInArray(state.filters.payment,k); } }); });
    if (!chips.length){ $('chip-row').innerHTML=''; return; }
    $('chip-row').innerHTML = chips.map(function(c,i){ return '<span class="fchip">'+esc(c.label)+'<button data-chip="'+i+'">'+IC.x+'</button></span>'; }).join('') +
      '<button class="chip-clear" id="chip-clear-all">Clear all</button>';
    $('chip-row').querySelectorAll('[data-chip]').forEach(function(b){
      b.addEventListener('click', function(){ chips[parseInt(b.getAttribute('data-chip'),10)].onRemove(); state.page=1; renderResults(); renderToolbarButtons(); });
    });
    $('chip-clear-all').addEventListener('click', function(){ state.filters = {types:[],portals:[],payment:[]}; state.page=1; renderResults(); renderToolbarButtons(); });
  }

  /* =========================================================
     SEARCH
  ========================================================= */
  $('search-input').value = state.search;
  $('btn-clear-search').hidden = !state.search;
  $('search-input').addEventListener('input', function(){
    state.search = this.value.trim(); state.page = 1;
    $('btn-clear-search').hidden = !state.search;
    $('search-kbd').hidden = !!state.search;
    syncHash(); renderResults();
  });
  $('btn-clear-search').addEventListener('click', function(){
    state.search=''; $('search-input').value=''; $('btn-clear-search').hidden=true; $('search-kbd').hidden=false;
    syncHash(); renderResults(); $('search-input').focus();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA'){
      e.preventDefault(); $('search-input').focus();
    }
  });

  /* =========================================================
     FILTER + SORT + PAGINATE
  ========================================================= */
  function bucketEvents(){
    var status = state.specialView || state.tab;
    return EVENTS.filter(function(e){ return e.status === status; });
  }
  function matches(e){
    if (state.filters.types.length && state.filters.types.indexOf(e.type) === -1) return false;
    if (state.filters.portals.length && state.filters.portals.indexOf(e.portal) === -1) return false;
    if (state.filters.payment.length && state.filters.payment.indexOf(e.payment.type) === -1) return false;
    if (state.search){
      var hay = (e.name + ' ' + e.venue + ' ' + e.city + ' ' + PORTALS[e.portal] + ' ' + EVENT_TYPES[e.type] + ' ' + e.createdBy).toLowerCase();
      if (hay.indexOf(state.search.toLowerCase()) === -1) return false;
    }
    return true;
  }
  function sortValue(e, field){
    if (field==='start') return e.start ? new Date(e.start).getTime() : -Infinity;
    if (field==='registrations') return e.registrations;
    if (field==='visitors') return e.visitors;
    if (field==='payment') return e.payment.type==='paid' ? e.payment.amount : -1;
    return 0;
  }
  function getFilteredSorted(){
    var list = bucketEvents().filter(matches);
    var field = state.sort.field, dir = state.sort.dir === 'asc' ? 1 : -1;
    list.sort(function(a,b){ return (sortValue(a,field) - sortValue(b,field)) * dir; });
    return list;
  }

  /* =========================================================
     TABLE / CARD RENDER
  ========================================================= */
  function dateCellHTML(e){
    if (!e.start) return '<div class="unset">Date not set</div>';
    var out = '<div class="d1">' + fmtDate(e.start) + '</div><div class="d2">' + fmtTime(e.start) + '</div>';
    if (e.status === 'active') out += '<div class="live-tag"><i></i>Live now</div>';
    else if (e.status === 'upcoming'){
      var du = daysUntil(e.start);
      if (du >= 0 && du <= 7) out += '<div class="d3">' + (du===0?'Today':du===1?'Tomorrow':'In '+du+' days') + '</div>';
    }
    return out;
  }
  function regCellHTML(e){
    return '<span class="reg-num">' + fmtNum(e.registrations) + '</span>';
  }
  function payCellHTML(e){
    if (e.payment.type === 'free') return '<span class="pay-free">Free</span>';
    return '<span class="pay-amt" data-tooltip="' + (e.payment.txns||0) + ' transactions">' + fmtRupee(e.payment.amount) + '</span><div class="pay-sub">Collected</div>';
  }
  function metaLine(e){
    return '<span class="ev-id-chip mono">Event ID ' + e.eventNo + '</span>' +
      '<span class="dotsep">&middot;</span><span class="ev-tag ' + (TYPE_TAG_CLASS[e.type]||'ev-tag-blue') + '">' + esc(EVENT_TYPES[e.type].replace(' (IP)','')) + '</span>';
  }

  function venueQuickviewBodyHTML(e){
    var venueText = e.venue === 'Virtual'
      ? (e.city && e.city !== 'Online' ? e.city + ' (Virtual)' : 'Virtual')
      : ((e.venue || 'Venue to be confirmed') + (e.city ? ', ' + e.city : ''));
    return '<div class="venue-pop-row">' + IC.pin + '<span>' + esc(venueText) + '</span></div>' +
      '<div class="venue-pop-row">' + IC.userCircle + '<span>Created by ' + esc(e.createdBy) + '</span></div>';
  }

  var qvCloseTimer = null;
  function cancelCloseQV(){ clearTimeout(qvCloseTimer); }
  function scheduleCloseQV(){ clearTimeout(qvCloseTimer); qvCloseTimer = setTimeout(function(){ if (state.openPopover === 'venue-quickview') closeAll(); }, 220); }

  function openVenueQuickview(anchorEl, id){
    var e = findEvent(id);
    var pop = $('venue-quickview');
    if (!e || !pop) return;
    if (state.openPopover === 'venue-quickview' && state.venuePopoverFor === id) return;
    closeAll();
    pop.innerHTML = venueQuickviewBodyHTML(e);
    pop.hidden = false;
    var r = anchorEl.getBoundingClientRect();
    var popW = 240, popH = pop.offsetHeight || 64;
    var left = Math.max(12, Math.min(r.left, window.innerWidth - popW - 12));
    var top = r.bottom + 8;
    if (top + popH > window.innerHeight - 12) top = Math.max(12, r.top - 8 - popH);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    state.openPopover = 'venue-quickview';
    state.venuePopoverFor = id;
  }

  function quickActionIcon(action, icon, label, id, colorClass){
    return '<button class="icon-btn qa-btn ' + colorClass + '" data-row-action="' + action + '" data-id="' + id + '" data-tooltip="' + label + '" aria-label="' + label + '">' + icon + '</button>';
  }

  function rowActionsHTML(e, ctx){
    var menuId = 'rowmenu-' + (ctx||'row') + '-' + e.id;
    var items = [];
    if (e.status === 'draft'){
      items.push(['duplicate', IC.copy, 'Clone Event']);
      items.push(['sep']);
      items.push(['delete-forever', IC.trash, 'Delete event', true]);
    } else if (e.status === 'cancelled'){
      items.push(['duplicate', IC.copy, 'Clone Event']);
      items.push(['copylink', IC.link, 'Copy event link']);
      items.push(['sep']);
      items.push(['restore', IC.restore, 'Restore to Upcoming']);
      items.push(['delete-forever', IC.trash, 'Delete permanently', true]);
    } else if (e.status === 'deleted'){
      items.push(['restore', IC.restore, 'Restore']);
      items.push(['sep']);
      items.push(['delete-forever', IC.trash, 'Delete permanently', true]);
    } else {
      items.push(['setup', IC.settings, 'Event setup']);
      items.push(['sep']);
      items.push(['duplicate', IC.copy, 'Clone Event']);
      items.push(['copylink', IC.link, 'Copy event link']);
      items.push(['sep']);
      if (e.status === 'active') items.push(['complete', IC.checkCirc, 'Mark as completed']);
      if (e.status === 'active' || e.status === 'upcoming') items.push(['cancel', IC.ban, 'Cancel event']);
      items.push(['archive', IC.trash, 'Delete event', true]);
    }
    var menuHTML = items.map(function(it){
      if (it[0]==='sep') return '<div class="popover-sep"></div>';
      return '<button class="popover-item' + (it[3]?' danger':'') + '" data-row-action="' + it[0] + '" data-id="' + e.id + '">' + it[1] + ' ' + it[2] + '</button>';
    }).join('');
    var quickIcons = '';
    if (e.status === 'draft'){
      quickIcons = quickActionIcon('edit', IC.edit, 'Edit', e.id, 'qa-edit');
    } else if (e.status !== 'deleted'){
      quickIcons = quickActionIcon('edit', IC.edit, 'Edit', e.id, 'qa-edit') +
        quickActionIcon('view', IC.eye, 'Preview', e.id, 'qa-view') +
        quickActionIcon('reports', IC.chart, 'Report', e.id, 'qa-report');
    }
    return '<div class="row-action-group">' + quickIcons +
      '<div class="popover-wrap">' +
        '<button class="icon-btn" data-row-menu-btn="' + menuId + '" aria-label="More actions">' + IC.dots + '</button>' +
        '<div class="popover row-menu" id="' + menuId + '" hidden>' + menuHTML + '</div>' +
      '</div>' +
    '</div>';
  }

  function renderResults(){
    var list = getFilteredSorted();
    var total = list.length;
    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    var pageList = list.slice((state.page-1)*PAGE_SIZE, state.page*PAGE_SIZE);

    renderChips();
    $('result-line').textContent = state.loading ? '' : ('Showing ' + (total ? ((state.page-1)*PAGE_SIZE+1) : 0) + '–' + Math.min(total, state.page*PAGE_SIZE) + ' of ' + total + ' event' + (total===1?'':'s'));

    document.querySelectorAll('.ev-table th.sortable').forEach(function(th){
      th.classList.toggle('sorted', th.getAttribute('data-sort') === state.sort.field);
      var ic = th.querySelector('.sort-ic');
      if (ic) ic.style.transform = (th.getAttribute('data-sort')===state.sort.field && state.sort.dir==='desc') ? 'rotate(180deg)' : 'none';
    });

    if (state.loading){
      $('table-body').innerHTML = Array(5).fill(0).map(function(){
        return '<tr class="skel-row">' + Array(6).fill(0).map(function(){ return '<td><div class="skel skel-line"></div></td>'; }).join('') + '</tr>';
      }).join('');
      $('card-list').innerHTML = '';
      $('pagination').innerHTML = '';
      return;
    }

    if (!total){
      var hasFilters = state.search || state.filters.types.length || state.filters.portals.length || state.filters.payment.length;
      var emptyHTML;
      if (hasFilters){
        emptyHTML = '<div class="empty-state">' + IC.plusOutline + '<h3 style="margin-top:12px;">No events match</h3><p>Try a different search term, or clear your filters.</p>' +
          '<button class="btn btn-secondary" id="empty-clear">Clear filters</button></div>';
      } else {
        var bucket = state.specialView || state.tab;
        var mainBucket = ['active','upcoming','completed'].indexOf(bucket) !== -1;
        emptyHTML = '<div class="empty-state">' + IC.plusOutline + '<h3 style="margin-top:12px;">No ' + statusLabel(bucket).toLowerCase() + ' events</h3>' +
          '<p>' + (mainBucket ? 'Create your first event — it takes about ten minutes.' : 'Nothing here right now.') + '</p>' +
          (mainBucket ? '<a class="btn btn-primary" href="create-event.html">Create Event</a>' : '') + '</div>';
      }
      $('table-body').innerHTML = '<tr><td colspan="6">' + emptyHTML + '</td></tr>';
      $('card-list').innerHTML = emptyHTML;
      var ec = $('empty-clear'); if (ec) ec.addEventListener('click', function(){ state.search=''; $('search-input').value=''; $('btn-clear-search').hidden=true; state.filters={types:[],portals:[],payment:[]}; state.page=1; renderResults(); renderToolbarButtons(); });
      $('pagination').innerHTML = '';
      return;
    }

    $('table-body').innerHTML = pageList.map(function(e){
      return '<tr data-row="' + e.id + '" data-status="' + e.status + '" class="st-' + e.status + '" tabindex="0">' +
        '<td><div class="ev-name-cell"><span class="status-dot ' + e.status + '" data-tooltip="' + statusLabel(e.status) + '"></span>' +
          '<div class="ev-name-main"><a class="ev-link" href="custom_editor.html?event=' + e.id + '" data-venue-id="' + e.id + '">' + esc(e.name) + '</a>' +
          '<div class="ev-meta-line">' + metaLine(e) + '</div></div></div></td>' +
        '<td class="ev-date-cell">' + dateCellHTML(e) + '</td>' +
        '<td><span class="vis-num">' + fmtNum(e.visitors) + '</span></td>' +
        '<td class="reg-cell">' + regCellHTML(e) + '</td>' +
        '<td>' + payCellHTML(e) + '</td>' +
        '<td class="row-actions">' + rowActionsHTML(e, 'row') + '</td>' +
      '</tr>';
    }).join('');

    $('card-list').innerHTML = pageList.map(function(e){
      var whenText = e.start ? (fmtDate(e.start) + ' · ' + fmtTime(e.start)) : 'Date not set';
      return '<div class="ev-card fade-in">' +
        '<div class="ev-card-top"><span class="status-dot ' + e.status + '" data-tooltip="' + statusLabel(e.status) + '" style="margin-top:7px;"></span>' +
          '<div class="ev-name-main"><a class="ev-link" href="custom_editor.html?event=' + e.id + '" data-venue-id="' + e.id + '" style="font-weight:700;font-size:14.5px;">' + esc(e.name) + '</a>' +
          '<div class="ev-meta-line">' + metaLine(e) + '</div></div>' +
          rowActionsHTML(e, 'card') +
        '</div>' +
        '<div class="ev-card-info">' +
          '<div class="ev-info-row">' +
            '<span class="ev-info-item">' + IC.calendarSm + '<span class="v' + (e.start?'':' faint2') + '">' + esc(whenText) + '</span></span>' +
            '<span class="ev-info-item">' + IC.users + '<span class="v">' + fmtNum(e.visitors) + ' visitors</span></span>' +
          '</div>' +
          '<div class="ev-info-row">' +
            '<span class="ev-info-item">' + IC.ticket + '<span class="v">' + fmtNum(e.registrations) + ' registrations</span></span>' +
            '<span class="ev-info-item">' + IC.wallet + '<span class="v' + (e.payment.type==='free'?' faint2':'') + '">' + (e.payment.type==='free' ? 'Free' : fmtRupee(e.payment.amount)) + '</span></span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    renderPagination(total, totalPages);
    wireRowEvents();
  }

  function renderPagination(total, totalPages){
    if (totalPages <= 1){ $('pagination').innerHTML=''; return; }
    var btns = '';
    btns += '<button ' + (state.page===1?'disabled':'') + ' data-page="' + (state.page-1) + '" aria-label="Previous page">‹</button>';
    for (var i=1;i<=totalPages;i++){
      btns += '<button aria-current="' + (state.page===i) + '" data-page="' + i + '">' + i + '</button>';
    }
    btns += '<button ' + (state.page===totalPages?'disabled':'') + ' data-page="' + (state.page+1) + '" aria-label="Next page">›</button>';
    $('pagination').innerHTML = btns;
    $('pagination').querySelectorAll('[data-page]').forEach(function(b){
      b.addEventListener('click', function(){
        state.page = parseInt(b.getAttribute('data-page'),10); renderResults();
        try { window.scrollTo({top:0, behavior:'smooth'}); } catch(e){ try { window.scrollTo(0,0); } catch(e2){} }
      });
    });
  }

  function applyView(){
    var rv = $('results-view');
    if (rv) rv.className = 'view-' + state.view;
    $('view-toggle').querySelectorAll('[data-view]').forEach(function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-view') === state.view);
    });
  }
  function wireViewToggle(){
    $('view-toggle').querySelectorAll('[data-view]').forEach(function(b){
      b.addEventListener('click', function(){ state.view = b.getAttribute('data-view'); applyView(); });
    });
  }

  function wireSortHeaders(){
    document.querySelectorAll('.ev-table th.sortable').forEach(function(th){
      th.addEventListener('click', function(){
        var f = th.getAttribute('data-sort');
        if (state.sort.field === f) state.sort.dir = state.sort.dir==='asc'?'desc':'asc';
        else { state.sort.field = f; state.sort.dir = 'asc'; }
        renderResults();
      });
    });
  }

  function wireRowEvents(){
    document.querySelectorAll('[data-row]').forEach(function(tr){
      tr.addEventListener('click', function(e){
        if (e.target.closest('a, button, .popover')) return;
        window.location.href = 'custom_editor.html?event=' + tr.getAttribute('data-row');
      });
      tr.addEventListener('keydown', function(e){
        if (e.key==='Enter' && !e.target.closest('a, button')) window.location.href = 'custom_editor.html?event=' + tr.getAttribute('data-row');
      });
    });
    document.querySelectorAll('[data-venue-id]').forEach(function(a){
      function show(){ cancelCloseQV(); openVenueQuickview(a, a.getAttribute('data-venue-id')); }
      a.addEventListener('mouseenter', show);
      a.addEventListener('focus', show);
      a.addEventListener('mouseleave', scheduleCloseQV);
      a.addEventListener('blur', scheduleCloseQV);
      a.addEventListener('click', function(e){
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
        e.preventDefault(); e.stopPropagation();
        show();
      });
    });
    document.querySelectorAll('[data-row-menu-btn]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var panelId = btn.getAttribute('data-row-menu-btn');
        if (state.openPopover === panelId){ closeAll(); btn.classList.remove('force-show'); return; }
        closeAll();
        $(panelId).hidden = false; state.openPopover = panelId;
        btn.classList.add('force-show');
      });
    });
    document.querySelectorAll('[data-row-action]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        handleRowAction(btn.getAttribute('data-row-action'), btn.getAttribute('data-id'));
        closeAll();
      });
    });
  }

  function findEvent(id){ return EVENTS.find(function(e){ return e.id===id; }); }

  function handleRowAction(action, id){
    var e = findEvent(id);
    if (!e) return;
    switch(action){
      case 'view': case 'edit': case 'setup':
        window.location.href = 'custom_editor.html?event=' + id; break;
      case 'reports':
        toast('Opens the reporting workspace — coming soon.'); break;
      case 'duplicate':
        var copy = Object.assign({}, e, { id: nextId(), name: e.name + ' (Copy)', status:'upcoming', registrations:0, visitors:0 });
        EVENTS.splice(EVENTS.indexOf(e)+1, 0, copy);
        toast('Duplicated as "' + copy.name + '"'); renderApp(); break;
      case 'copylink':
        var url = eventPublicUrl(e);
        if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ toast('Link copied — ' + url); }).catch(function(){ toast(url); }); }
        else toast(url);
        break;
      case 'complete':
        e.status = 'completed'; toast('"' + e.name + '" marked as completed'); renderApp(); break;
      case 'cancel':
        e.status = 'cancelled'; toast('"' + e.name + '" cancelled'); renderApp(); break;
      case 'archive':
        e.status = 'deleted'; toast('"' + e.name + '" deleted — restore it anytime from the Deleted tab'); renderApp(); break;
      case 'restore':
        e.status = 'upcoming'; toast('"' + e.name + '" restored to Upcoming'); renderApp(); break;
      case 'delete-forever':
        EVENTS.splice(EVENTS.indexOf(e), 1); toast('"' + e.name + '" deleted permanently'); renderApp(); break;
    }
  }

  function eventSlug(e){
    return e.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }
  function eventPublicUrl(e, section){
    var base = 'https://events.economictimes.indiatimes.com/' + eventSlug(e);
    if (section === 'agenda') return base + '/agenda';
    if (section === 'speakers') return base + '/speakers';
    return base;
  }

  /* =========================================================
     AUDIENCE SEGMENTATION — per IP event: Top Company, Top Designation,
     Top Source, Mobile vs Desktop. Two presentations: ranked list or donut chart.
  ========================================================= */
  var SEG_DIM_KEY = { company:'companies', designation:'designations', source:'sources', device:'devices' };
  var SEG_DIM_ICONS = { company:IC.building, designation:IC.userCircle, source:IC.share, device:IC.monitor };
  var SEG_DIM_COLOR_CLASS = { company:'dim-blue', designation:'dim-teal', source:'dim-violet', device:'dim-cyan' };
  var SEG_NAME_COL_LABEL = { company:'Company', designation:'Designation', source:'Source', device:'Device' };

  function renderSegmentControls(){
    var validIds = IP_EVENT_IDS.filter(function(id){ var e = findEvent(id); return e && (e.status==='upcoming'||e.status==='active'||e.status==='completed'); });
    if (validIds.indexOf(state.segmentEventId) === -1) state.segmentEventId = validIds[0] || null;

    var sel = $('segment-event-select');

      sel.innerHTML = '<option>No IP events yet</option>';
      sel.disabled = true;
    } else {
      sel.disabled = false;
      sel.innerHTML = validIds.map(function(id){
        var e = findEvent(id);
        return '<option value="' + id + '" ' + (state.segmentEventId===id?'selected':'') + '>' + esc(e.name) + '</option>';
      }).join('');
    }
    sel.onchange = function(){ state.segmentEventId = sel.value; renderSegmentControls(); renderSegmentBody(); };

    $('segment-icon-avatar').innerHTML = IC.users;

    $('segment-dim-tabs').innerHTML = Object.keys(SEGMENT_DIMENSIONS).map(function(k){
      return '<button type="button" class="' + SEG_DIM_COLOR_CLASS[k] + '" aria-pressed="' + (state.segmentDimension===k) + '" data-dim="' + k + '">' + SEG_DIM_ICONS[k] + ' ' + SEGMENT_DIMENSIONS[k] + '</button>';
    }).join('');
    $('segment-dim-tabs').querySelectorAll('[data-dim]').forEach(function(b){
      b.addEventListener('click', function(){ state.segmentDimension = b.getAttribute('data-dim'); renderSegmentControls(); renderSegmentBody(); });
    });

    $('segment-view-toggle').querySelectorAll('[data-segview]').forEach(function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-segview') === state.segmentView);
      b.onclick = function(){ state.segmentView = b.getAttribute('data-segview'); renderSegmentControls(); renderSegmentBody(); };
    });
  }

  function renderSparkline(trend, color){
    var w = 64, h = 22, pad = 2;
    var max = Math.max.apply(null, trend), min = Math.min.apply(null, trend);
    var range = (max - min) || 1;
    var pts = trend.map(function(v,i){
      var x = pad + (i/(trend.length-1)) * (w - 2*pad);
      var y = h - pad - ((v-min)/range) * (h - 2*pad);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" class="seg-spark"><polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function renderIntentBadge(shareFrac){
    var level = shareFrac >= 0.22 ? 'high' : shareFrac >= 0.12 ? 'medium' : 'low';
    var glyph = level === 'high' ? '&uarr;' : level === 'medium' ? '&ndash;' : '&darr;';
    var label = level === 'high' ? 'High' : level === 'medium' ? 'Medium' : 'Low';
    return '<span class="intent-badge intent-' + level + '">' + glyph + ' ' + label + '</span>';
  }

  function renderSegTopRow(insightHTML, entries, total){
    var topN = entries.slice(0, Math.min(5, entries.length)).reduce(function(s,x){ return s + x.value; }, 0);
    var topPct = total ? Math.round((topN/total)*100) : 0;
    return '<div class="seg-top-row">' +
      '<div class="seg-insight">' + insightHTML + '</div>' +
      '<div class="seg-stat-tile"><span class="seg-stat-icon">' + IC.users + '</span>' +
        '<div><div class="seg-stat-label">Total Registrations</div><div class="seg-stat-value mono">' + fmtNum(total) + '</div></div></div>' +
      '<div class="seg-stat-tile"><span class="seg-stat-icon">' + IC.chart + '</span>' +
        '<div><div class="seg-stat-label">Top ' + Math.min(5, entries.length) + ' Share</div><div class="seg-stat-value mono">' + topPct + '%</div></div></div>' +
    '</div>';
  }

  function renderSegTable(entries, total, fmtVal, dim){
    var nameLabel = SEG_NAME_COL_LABEL[dim] || 'Name';
    var rows = entries.map(function(x,i){
      var pct = total ? Math.round((x.value/total)*100) : 0;
      var color = SEG_PALETTE[i % SEG_PALETTE.length];
      return '<tr>' +
        '<td><span class="seg-rank-cell" style="background:' + color + '22;color:' + color + ';">' + (i+1) + '</span></td>' +
        '<td><div class="seg-name-cell"><span class="seg-avatar" style="background:' + color + '22;color:' + color + ';">' + esc(x.label.charAt(0)) + '</span><span>' + esc(x.label) + '</span></div></td>' +
        '<td class="mono">' + fmtVal(x.value) + '</td>' +
        '<td class="mono">' + pct + '%</td>' +
        '<td>' + renderSparkline(x.trend, color) + '</td>' +
        '<td>' + renderIntentBadge(total ? x.value/total : 0) + '</td>' +
      '</tr>';
    }).join('');
    return '<div class="seg-table-wrap"><table class="seg-table"><thead><tr>' +
      '<th></th><th>' + nameLabel + '</th><th>Registered</th><th>Share</th><th>Trend (7d)</th><th>Attendance Intent</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  var SEG_OTHERS_COLOR = '#C7C3B8';
  function buildSegSlices(entries){
    var top = entries.slice(0, 5).map(function(x,i){ return { label:x.label, value:x.value, color:SEG_PALETTE[i % SEG_PALETTE.length] }; });
    var othersValue = entries.slice(5).reduce(function(s,x){ return s + x.value; }, 0);
    if (othersValue > 0) top.push({ label:'Others', value:othersValue, color:SEG_OTHERS_COLOR });
    return top;
  }
  function renderSegDonut(slices, total, size){
    size = size || 176;
    var r = size/2 - 12, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
    var offset = 0;
    var arcs = slices.map(function(s){
      var frac = total ? s.value/total : 0;
      var dash = Math.max(0, frac*circ - 3);
      var html = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="16" stroke-linecap="round" ' +
        'stroke-dasharray="' + dash.toFixed(2) + ' ' + (circ-dash).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')">' +
        '<title>' + esc(s.label) + ' — ' + Math.round(frac*100) + '%</title></circle>';
      offset += frac*circ;
      return html;
    }).join('');
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" class="seg-donut">' + arcs + '</svg>';
  }
  function renderSegLegend(slices, total, fmtVal){
    return '<div class="seg-legend">' + slices.map(function(s){
      var pct = total ? Math.round((s.value/total)*100) : 0;
      return '<div class="seg-legend-row"><span class="seg-swatch" style="background:' + s.color + ';"></span>' +
        '<span class="seg-legend-label">' + esc(s.label) + '</span>' +
        '<span class="seg-legend-val mono">' + fmtVal(s.value) + '</span>' +
        '<span class="seg-legend-pct">' + pct + '%</span></div>';
    }).join('') + '</div>';
  }
  function renderSegChartView(entries, total, fmtVal){
    var slices = buildSegSlices(entries);
    var hasOthers = entries.length > 5;
    var centerPct, centerLabel;
    if (hasOthers){
      var topN = entries.slice(0, 5).reduce(function(s,x){ return s + x.value; }, 0);
      centerPct = total ? Math.round((topN/total)*100) : 0;
      centerLabel = 'Top 5 Share';
    } else {
      var top = entries[0];
      centerPct = total ? Math.round((top.value/total)*100) : 0;
      centerLabel = top.label;
    }
    return '<div class="seg-chart-row">' +
      '<div class="seg-donut-wrap">' + renderSegDonut(slices, total) +
        '<div class="seg-donut-center"><div class="seg-donut-center-pct">' + centerPct + '%</div><div class="seg-donut-center-label">' + esc(centerLabel) + '</div></div>' +
      '</div>' +
      renderSegLegend(slices, total, fmtVal) +
    '</div>';
  }

  function renderSegmentBody(){
    if (state.loading){
      $('segment-body').innerHTML = Array(4).fill(0).map(function(){ return '<div class="skel skel-line" style="height:16px;margin-bottom:12px;"></div>'; }).join('');
      return;
    }
    var ev = findEvent(state.segmentEventId);
    if (!ev){
      $('segment-sub').textContent = 'No IP events with audience data yet';
      $('segment-body').innerHTML = '<p class="muted" style="font-size:12.5px;">Audience segmentation is available for Intellectual Property (IP) events once they have registrations.</p>';
      return;
    }
    var dim = state.segmentDimension;
    var audience = EVENT_AUDIENCE[ev.id] || { companies:[], designations:[], sources:[], devices:[] };
    var entries = (audience[SEG_DIM_KEY[dim]] || []).slice().sort(function(a,b){ return b.value - a.value; });

    $('segment-sub').textContent = SEGMENT_DIMENSIONS[dim] + ' for ' + ev.name;

    if (!entries.length){ $('segment-body').innerHTML = '<p class="muted" style="font-size:12.5px;">No audience data yet for this event.</p>'; return; }

    var total = entries.reduce(function(s,x){ return s+x.value; }, 0);
    var top = entries[0];
    var topShare = total ? Math.round((top.value/total)*100) : 0;

    var insightHTML = IC.chart + '<span><strong>' + esc(top.label) + '</strong> leads registrations with <strong>' + topShare + '%</strong> of total registrations.</span>';

    var bodyHTML = renderSegTopRow(insightHTML, entries, total) + (state.segmentView === 'chart'
      ? renderSegChartView(entries, total, fmtNum)
      : renderSegTable(entries.slice(0, 5), total, fmtNum, dim));

    $('segment-body').innerHTML = bodyHTML;
  }

  /* =========================================================
     LATEST ACTIVITY ON THIS PORTAL — platform-wide flow metrics for the
     selected period (Today / 7 / 10 / 30 days / Custom), not a per-event log.
  ========================================================= */
  var ACTIVITY_METRICS = [
    { key:'registrations',   label:'New Registrations', desc:'Registrations recorded across live and upcoming IP events', icon:IC.ticket,    color:'act-blue',   kind:'events', metricCol:'Registrations', dateCol:'Last Registration' },
    { key:'visitors',        label:'Visitors',          desc:'Visitors who viewed an IP event microsite',                 icon:IC.users,     color:'act-teal',   kind:'events', metricCol:'Visitors',      dateCol:'Last Visit' },
    { key:'mailersSent',     label:'Mailers Sent',      desc:'Promotional mailers dispatched for IP events',              icon:IC.mail,      color:'act-amber',  kind:'events', metricCol:'Mailers Sent',  dateCol:'Last Mailer Sent' },
    { key:'newslettersSent', label:'Newsletters Sent',  desc:'Newsletter performance across the portal',                  icon:IC.newspaper, color:'act-violet', kind:'newsletter' },
    { key:'subscribers',     label:'New Subscribers',   desc:'Subscriber growth across the portal',                       icon:IC.userPlus,  color:'act-rose',   kind:'subscribers' }
  ];

  function activityEventRows(key, f){
    var rows = IP_EVENT_IDS.map(function(id){
      var e = findEvent(id);
      var act = IP_ACTIVITY[id];
      var value, lastDays;
      if (key === 'registrations'){ value = Math.round((e.registrations||0) * f); lastDays = act.lastRegDays; }
      else if (key === 'visitors'){ value = Math.round((e.visitors||0) * f); lastDays = act.lastVisitDays; }
      else { value = Math.round((act.mailersSent||0) * f); lastDays = act.lastMailerDays; }
      return { id:id, name:e.name, value:value, lastDays:lastDays };
    }).filter(function(r){ return r.value > 0; }).sort(function(a,b){ return b.value - a.value; });
    return rows.slice(0, 6);
  }

  function renderActivityEventsTable(m, f){
    var rows = activityEventRows(m.key, f);
    if (!rows.length) return '<p class="act-empty">No IP events with activity in this period.</p>';
    return '<div class="act-table-wrap"><table class="act-table"><thead><tr>' +
      '<th>Event Name</th><th>' + m.metricCol + '</th><th>' + m.dateCol + '</th><th></th>' +
    '</tr></thead><tbody>' + rows.map(function(r){
      return '<tr>' +
        '<td class="act-event-name">' + esc(r.name) + '</td>' +
        '<td class="mono">' + fmtNum(r.value) + '</td>' +
        '<td>' + fmtRelativeDays(r.lastDays) + '</td>' +
        '<td><a class="act-view-btn" href="custom_editor.html?event=' + r.id + '">View &rarr;</a></td>' +
      '</tr>';
    }).join('') + '</tbody></table></div>';
  }

  function renderNewsletterPanel(f){
    var sent = Math.round(PORTAL_ACTIVITY_BASE.newslettersSent * f);
    var opened = Math.round(sent * 0.42);
    var clicked = Math.round(sent * 0.11);
    var openRate = sent ? Math.round((opened/sent)*100) : 0;
    return '<div class="act-kpi-row">' +
      '<div class="act-kpi-tile"><div class="act-kpi-label">Sent</div><div class="act-kpi-value mono">' + fmtCompact(sent) + '</div></div>' +
      '<div class="act-kpi-tile"><div class="act-kpi-label">Opened</div><div class="act-kpi-value mono">' + fmtCompact(opened) + '</div></div>' +
      '<div class="act-kpi-tile"><div class="act-kpi-label">Clicked</div><div class="act-kpi-value mono">' + fmtCompact(clicked) + '</div></div>' +
      '<div class="act-kpi-tile highlight"><div class="act-kpi-label">Gross Open Rate</div><div class="act-kpi-value mono">' + openRate + '%</div></div>' +
    '</div>';
  }

  function renderSubscriberPanel(f){
    var subs = Math.round(PORTAL_ACTIVITY_BASE.subscribers * f);
    var unsub = Math.round(subs * 0.09);
    var recent = Math.round(subs * 0.35);
    var seed = Math.sin(subs * 3.7) * 10000; seed -= Math.floor(seed);
    var trendUp = seed > 0.35;
    var trendPct = Math.round(seed * 18) + 2;
    return '<div class="act-kpi-row">' +
      '<div class="act-kpi-tile"><div class="act-kpi-label">Subscribers</div><div class="act-kpi-value mono">' + fmtCompact(subs) + '</div>' +
        '<div class="act-trend ' + (trendUp?'up':'down') + '">' + (trendUp?IC.arrowUp:IC.arrowDown) + ' ' + trendPct + '% vs previous period</div></div>' +
      '<div class="act-kpi-tile"><div class="act-kpi-label">Unsubscribers</div><div class="act-kpi-value mono">' + fmtCompact(unsub) + '</div></div>' +
      '<div class="act-kpi-tile"><div class="act-kpi-label">Recent Subscribers</div><div class="act-kpi-value mono">' + fmtCompact(recent) + '</div></div>' +
    '</div>';
  }

  function renderActivity(){
    $('activity-range-label').textContent = computeRangeLabel(state.activityRange);
    if (state.loading){
      $('activity-body').innerHTML = Array(5).fill(0).map(function(){ return '<div class="skel skel-line" style="height:14px;margin-bottom:16px;"></div>'; }).join('');
      return;
    }
    var f = computeRangeFactor(state.activityRange);
    $('activity-body').innerHTML = '<div class="activity-accordion">' + ACTIVITY_METRICS.map(function(m){
      var total = Math.round(PORTAL_ACTIVITY_BASE[m.key] * f);
      var isOpen = state.activityOpenKey === m.key;
      var panelHTML = m.kind === 'events' ? renderActivityEventsTable(m, f)
        : m.kind === 'newsletter' ? renderNewsletterPanel(f)
        : renderSubscriberPanel(f);
      return '<div class="activity-item ' + m.color + '">' +
        '<button type="button" class="activity-row" data-act-key="' + m.key + '" aria-expanded="' + isOpen + '">' +
          '<span class="activity-row-icon">' + m.icon + '</span>' +
          '<span class="activity-row-main"><div class="activity-row-label">' + m.label + '</div><div class="activity-row-desc">' + m.desc + '</div></span>' +
          '<span class="activity-row-total mono">' + fmtCompact(total) + '</span>' +
          '<span class="activity-row-chevron">' + IC.chevDown + '</span>' +
        '</button>' +
        (isOpen ? '<div class="activity-panel fade-in"><div class="activity-panel-inner">' + panelHTML + '</div></div>' : '') +
      '</div>';
    }).join('') + '</div>';

    $('activity-body').querySelectorAll('[data-act-key]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-act-key');
        state.activityOpenKey = (state.activityOpenKey === key) ? null : key;
        renderActivity();
      });
    });
  }

  /* =========================================================
     APP RENDER
  ========================================================= */
  function renderApp(){
    renderMoreMenu();
    renderTabs();
    renderSpecialBanner();
    renderInsightsTitle();
    renderKPIs();
    renderToolbarButtons();
    renderResults();
    renderSegmentControls();
    renderSegmentBody();
    renderActivity();
  }

  /* =========================================================
     NEED HELP — opens the visitor's mail client addressed to Customer Care.
     No backend here, so this is a mailto: link, not an actual send.
  ========================================================= */
  var HELP_EMAIL = 'customercare@economictimesb2b.com';
  function openHelpModal(){
    var root = $('sheet-root');
    root.innerHTML = '<div class="modal-scrim" id="help-scrim"><div class="modal-card fade-in">' +
      '<div class="modal-card-head"><div><h3>Need help?</h3><p>Send your query about this dashboard or an event, straight to our team.</p></div>' +
        '<button class="icon-btn" id="help-close" aria-label="Close">' + IC.x + '</button></div>' +
      '<div class="modal-card-body">' +
        '<div class="email-row">' + IC.mail + '<span>' + HELP_EMAIL + '</span><button id="help-copy-email" data-tooltip="Copy address" type="button">' + IC.copy + '</button></div>' +
        '<div><label class="flabel">Subject</label><input class="finput" id="help-subject" value="Support request — Events dashboard"></div>' +
        '<div><label class="flabel">Your query</label><textarea class="finput" id="help-message" placeholder="Tell us what you need help with — an event, registrations, payments, anything…"></textarea></div>' +
      '</div>' +
      '<div class="modal-card-foot"><button class="btn btn-secondary" id="help-cancel">Cancel</button><button class="btn btn-primary" id="help-send" style="margin-left:auto;">' + IC.mail + ' Send via email</button></div>' +
    '</div></div>';
    function close(){ root.innerHTML=''; }
    $('help-close').addEventListener('click', close);
    $('help-cancel').addEventListener('click', close);
    $('help-scrim').addEventListener('click', function(e){ if (e.target===$('help-scrim')) close(); });
    $('help-copy-email').addEventListener('click', function(){
      if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(HELP_EMAIL).then(function(){ toast('Email address copied'); }).catch(function(){ toast(HELP_EMAIL); }); }
      else toast(HELP_EMAIL);
    });
    $('help-send').addEventListener('click', function(){
      var subject = $('help-subject').value.trim() || 'Support request — Events dashboard';
      var message = $('help-message').value.trim();
      if (!message){ toast('Add a quick note so our team knows what you need.'); return; }
      var mailto = 'mailto:' + HELP_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(message);
      window.location.href = mailto;
      toast('Opening your email app…');
      close();
    });
  }
  $('btn-help').addEventListener('click', openHelpModal);
  $('venue-quickview').addEventListener('mouseenter', cancelCloseQV);
  $('venue-quickview').addEventListener('mouseleave', scheduleCloseQV);

  function init(){
    try {
      wireSortHeaders();
      wireViewToggle();
      applyView();
      state.loading = true;
      renderApp();
      setTimeout(function(){
        state.loading = false;
        renderApp();
      }, 550);
    } catch(err){
      renderErrorBanner(init);
    }
  }
  init();

})();
</script>
