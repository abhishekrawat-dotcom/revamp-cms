  /* =========================================================
     PORTALS — the dashboard works on one ET portal at a time
     (owner, 2026-11-03): the switcher sets the person's working portal, remembered for them on the server
     (portal-picker.js: GET / PUT /api/me/working-portal, cached in this browser for the first paint). The list,
     its tab counts, the totals, the QR picker and Create Event follow it. "All portals" lists every event with a
     Portal column, and the events that have no portal yet each get a one-click Set portal.
  ========================================================= */
  function inWorkingPortal(e){ return state.portal === 'all' || e.portal === state.portal; }
  function onRoster(slug){ return PORTAL_ROSTER.some(function(p){ return p.slug === slug; }); }
  /* a portal's name for this page: the roster's, else the picker's (its cache knows the working portal's name
     before the roster has come), else what the server said on an event of that portal; the slug only as a last resort */
  function portalNameOf(slug){
    if (slug === 'all') return 'All portals';
    if (!slug || slug === 'none') return 'No portal yet';
    for (var i = 0; i < PORTAL_ROSTER.length; i++) if (PORTAL_ROSTER[i].slug === slug) return PORTAL_ROSTER[i].name;
    var named = window.RevampPortals ? window.RevampPortals.nameOf(slug) : '';
    if (named) return named;
    for (var j = 0; j < EVENTS.length; j++) if (EVENTS[j].portal === slug && EVENTS[j].portalName) return EVENTS[j].portalName;
    return slug;
  }
  /* live events (every list but Deleted) by portal: { all, none, by: { slug: n } } */
  function portalCounts(){
    var c = { all:0, none:0, by:{} };
    EVENTS.forEach(function(e){
      if (e.status === 'deleted') return;
      c.all++;
      if (!e.portal) c.none++;
      else c.by[e.portal] = (Object.prototype.hasOwnProperty.call(c.by, e.portal) ? c.by[e.portal] : 0) + 1;
    });
    return c;
  }
  function portalsWithEvents(c){
    return Object.keys(c.by).map(function(slug){ return { slug: slug, name: portalNameOf(slug), count: c.by[slug] }; })
      .sort(function(a, b){ return a.name.localeCompare(b.name, 'en', { sensitivity:'base' }); });
  }

     for this visit by "Show them" is still the working one */

     ET portals (most people work on one to three, so theirs are not lost among the whole roster). Keys: arrows
     move, Enter picks, Escape closes and gives focus back to the button. */
  var navActive = '';
  function renderPortalsNavMenu(){

  function portalNavOptions(){

    function hit(slug, name){ return !q || name.toLowerCase().indexOf(q) !== -1 || slug.indexOf(q) !== -1; }

      '<span class="pn-name">' + esc(name) + '</span>' + (count > 0 ? '<span class="pn-count">' + count + '</span>' : '') +

    }
    if (o.others.length){
      html += '<div role="group" aria-labelledby="pn-g-other"><div class="popover-label" id="pn-g-other">Other ET portals</div>' +
        o.others.map(function(p){ return portalNavOptionHTML(p.slug, p.name, 0); }).join('') + '</div>';
    }
    if (rosterState === 'loading') html += '<div class="pn-msg">Loading portals…</div>';
    else if (rosterState === 'failed') html += '<div class="pn-msg">The portal list could not be loaded. <button type="button" class="pn-link" id="pn-retry">Retry</button></div>';
    else if (!html) html = '<div class="pn-msg">No portal matches “' + esc(o.q) + '”.</div>';
    listEl.innerHTML = html;
    var ids = portalNavIds();
    if (ids.indexOf(navActive) === -1) navActive = ids[0] || '';
    markPortalNavActive();
    listEl.querySelectorAll('[data-pn]').forEach(function(opt){
      opt.addEventListener('click', function(e){ e.stopPropagation(); pickPortalFromNav(opt.getAttribute('data-pn')); });
    });
    var retry = $('pn-retry');
    if (retry) retry.addEventListener('click', function(e){ e.stopPropagation(); loadRoster(); renderPortalNavList(); });
  }
  function portalNavIds(){
    var o = portalNavOptions(), ids = o.all >= 0 ? ['all'] : [];
    return ids.concat(o.withEvents.map(function(p){ return p.slug; }), o.others.map(function(p){ return p.slug; }));
  }
  function markPortalNavActive(){
    var listEl = $('portal-nav-list'), input = $('portal-nav-search');
    if (!listEl || !input) return;
    listEl.querySelectorAll('[data-pn]').forEach(function(opt){
      var on = opt.getAttribute('data-pn') === navActive;
      opt.classList.toggle('pn-active', on);
      if (on && typeof opt.scrollIntoView === 'function') opt.scrollIntoView({ block:'nearest' });
    });
    if (navActive) input.setAttribute('aria-activedescendant', 'pn-opt-' + navActive);
    else input.removeAttribute('aria-activedescendant');
  }
  function onPortalNavKey(e){
    var ids = portalNavIds(), at = ids.indexOf(navActive);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if (!ids.length) return;
      at = e.key === 'ArrowDown' ? (at + 1) % ids.length : (at <= 0 ? ids.length - 1 : at - 1);
      navActive = ids[at];
      markPortalNavActive();
    } else if (e.key === 'Home' || e.key === 'End'){
      if (!ids.length) return;
      e.preventDefault();
      navActive = e.key === 'Home' ? ids[0] : ids[ids.length - 1];
      markPortalNavActive();
    } else if (e.key === 'Enter'){
      e.preventDefault();
      if (navActive) pickPortalFromNav(navActive);
    } else if (e.key === 'Escape' || e.key === 'Esc'){
      e.preventDefault();
      closeAll();
      $('btn-portals-nav').focus();
    } else if (e.key === 'Tab'){
      closeAll();
    }
  }
  function openPortalsNav(){
    renderPortalsNavMenu(); openPopover('portals-nav-menu');
    $('portal-nav-search').focus();
  }
  function pickPortalFromNav(v){
    switchPortal(v);
    $('btn-portals-nav').focus();
  }
  $('btn-portals-nav').addEventListener('click', function(e){
    e.stopPropagation();
    if (state.openPopover==='portals-nav-menu'){ closeAll(); return; }
    openPortalsNav();
  });

  /* Switching is the person's choice: the list moves at once, then it is saved for them (F2). A save that fails
     keeps the choice in this browser and says so. */
  function switchPortal(v){
    if (v !== 'all' && !(rosterState !== 'ready' || onRoster(v))) return false;
    state.portal = v;
    state.portalReturn = '';
    state.portalChosen = true; state.portalKnown = true; state.portalSettled = true; state.portalTouched = true;
    state.filters.portals = [];
    state.page = 1;
    closeAll();
    renderApp();
    if (window.RevampPortals) window.RevampPortals.setWorking(v).then(null, function(err){
      toast((err && err.message) || 'Your portal choice is kept in this browser only.');
    });
    return true;
  }
  /* "Show them" (the events with no portal yet) and "Show all portals" look at every portal for this visit only:
     nothing is saved, Create Event keeps starting on the working portal, and Back returns to it */
  function showAllPortalsForNow(filter){
    state.portalTouched = true;
    if (state.portal !== 'all'){ state.portalReturn = state.portal; state.portal = 'all'; }
    state.filters.portals = filter ? [filter] : [];
    state.page = 1;
    renderApp();
  }
  function showNoPortal(){
    /* the events with no portal may all be drafts, or all past: open the list that has some of them */
    var none = EVENTS.filter(function(e){ return !e.portal && e.status !== 'deleted'; });
    function has(s){ return none.some(function(e){ return e.status === s; }); }
    var bucket = state.specialView || state.tab;
    if (!has(bucket)){
      var tab = ['active','upcoming','completed'].filter(has)[0];
      if (tab){ state.tab = tab; state.specialView = null; }
      else { var view = ['draft','cancelled'].filter(has)[0]; if (view) state.specialView = view; }
    }
    showAllPortalsForNow('none');
  }
  function backToWorkingPortal(){
    if (!state.portalReturn) return;
    state.portal = state.portalReturn;
    state.portalReturn = '';
    state.filters.portals = [];
    state.page = 1;
    renderApp();
  }

  /* F1: paint at once on the portal this browser remembers for the person; ask the server (it wins when it has a
     choice) and fetch the roster at the same time. With nothing remembered here, the first list waits up to 3 s
     for the server, so it does not open on every portal and then jump to theirs. */
  var portalWait = Promise.resolve();
  function startPortals(){
    var RP = window.RevampPortals;
    if (!RP){
      /* portal-picker.js did not load: every portal, and the switcher says the list is missing */
      rosterState = 'failed'; state.portalKnown = true; state.portalSettled = true;
      return;
    }
    var cached = RP.cachedWorking();
    if (cached){ state.portal = cached; state.portalChosen = true; state.portalKnown = true; }
    loadRoster();
    var answered = RP.working().then(applyWorking, function(){ applyWorking(null); });
    portalWait = cached ? Promise.resolve() : new Promise(function(resolve){
      answered.then(resolve, resolve);
      setTimeout(function(){
        if (!state.portalSettled){ state.portalSettled = true; state.portalKnown = true; }
        resolve();
      }, 3000);
    });
  }
  /* the server's answer (else this browser's, else null). It moves the list only while the person has not switched.
     No choice (null) means the person now signed in has none anywhere: the first paint may have been on the portal
     of the last person seen in this browser (portal-picker.js reads theirs until auth.js has said who this is), so
     the list goes back to every portal with the first-visit callout, and Create Event to no portal. */
  function applyWorking(v){
    var valid = v === 'all' || (typeof v === 'string' && /^[a-z0-9]{1,40}$/.test(v) && (rosterState !== 'ready' || onRoster(v)));
    state.portalSettled = true; state.portalKnown = true;
    if (!state.portalTouched){
      if (valid && (v !== state.portal || !state.portalChosen)){
        state.portal = v; state.portalChosen = true; state.portalReturn = ''; state.filters.portals = []; state.page = 1;
      } else if (!valid && state.portalChosen){
        if (state.portal !== 'all'){ state.portal = 'all'; state.filters.portals = []; state.page = 1; }
        state.portalChosen = false; state.portalReturn = '';
      }
    }
    renderApp();
  }
  function loadRoster(){
    if (!window.RevampPortals) return;
    rosterState = 'loading';
    window.RevampPortals.list().then(function(list){
      PORTAL_ROSTER = list; rosterState = 'ready';
      /* a remembered portal the roster no longer has is no choice: every portal, and the first-visit callout */
      if (state.portal !== 'all' && !onRoster(state.portal)){ state.portal = 'all'; state.portalChosen = false; state.portalReturn = ''; }
      renderApp();
      afterRoster();
    }, function(){
      rosterState = 'failed';
      afterRoster();
    });
  }
  /* an open switcher menu or phone Filters sheet shows the roster (or why it is missing) as soon as that is known */
  function afterRoster(){
    if (state.openPopover === 'portals-nav-menu') renderPortalNavList();
    if ($('m-portal')) openMobileFilters();
  }

  /* Set portal on an event with none (a row's ⋯ menu, or the chip in its Portal cell). Changing a portal that is
     already set is done in the event console's Basics, so a stray click here never moves an event. */
  function openSetPortalFor(id, opener){
    var e = findEvent(id);
    if (!e || e.portal) return;
    if (!window.RevampPortals){ toast('The portal list did not load. Reload the page and try again.'); return; }
    window.RevampPortals.openSetPortal({
      eventId: e.id, eventName: e.name, current: '', hasGeneratedSite: e.hasGeneratedSite, published: e.published,
      returnFocus: opener || null,
      onDone: function(slug, name){
        var wasShown = getFilteredSorted().indexOf(e) !== -1;
        e.portal = slug; e.portalName = name || portalNameOf(slug);
        renderApp();
        var msg = '“' + e.name + '” is now on ' + e.portalName + '.';
        /* the row left the list (another portal, or the "no portal yet" filter): offer to follow it there */
        if (wasShown && getFilteredSorted().indexOf(e) === -1) toastAction(msg, 'View', function(){ switchPortal(slug); });
        else toast(msg);
      },
      /* somebody set it meanwhile: the row shows what the server now has (the window says so, with Reload) */
      onConflict: function(current, currentName){
        e.portal = typeof current === 'string' ? current : '';
        e.portalName = currentName || (e.portal ? portalNameOf(e.portal) : '');
        renderApp();
      }
    });
  }
  /* a toast with one button (the Set portal toast's View) — it stays a little longer, so the button can be reached */
  function toastAction(msg, label, run){
    var region = $('toast-region');
    var t = document.createElement('div'); t.className = 'toast';
    var text = document.createElement('span'); text.textContent = msg; t.appendChild(text);
    var b = document.createElement('button'); b.type = 'button'; b.className = 'toast-btn'; b.textContent = label;
    b.addEventListener('click', function(){ t.remove(); run(); });
    t.appendChild(b);
    region.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); }, 220); }, 6000);
  }
  /* the cell (and the card line) for an event's portal: its name, or the "No portal yet" chip with Set portal */
  function portalCellHTML(e){
    if (e.portal) return '<span class="ev-portal-name">' + esc(portalNameOf(e.portal)) + '</span>';
    if (window.RevampPortals && e.status !== 'deleted') return window.RevampPortals.chipHtml({ eventId: e.id, eventName: e.name });
    return '<span class="muted">No portal yet</span>';
  }

  /* The notice above the list: in Show them, what is shown and the way back; on a first visit, the callout that
     asks for a portal; and while any event has no portal yet, how many, with the way to them and to the page
     where suggested portals are reviewed (portal-review.html). */
  function renderPortalNotice(){
    var el = $('portal-notice');
    if (!el) return;
    if (state.loading){ el.innerHTML = ''; return; }
    var c = portalCounts(), html = '';
    var review = '<a class="pn-link" href="portal-review.html">Review suggested portals</a>';
    if (state.portalReturn){
      var onlyNone = state.filters.portals.length === 1 && state.filters.portals[0] === 'none';
      /* one other portal looked at for now (ETB2B AI's "Show this portal's drafts"): named, not "every portal" */
      var onlyOne = state.filters.portals.length === 1 && !onlyNone ? state.filters.portals[0] : '';
      html += '<div class="portal-notice">' + IC.globe + '<span class="pn-text">' +
        (onlyNone ? 'Showing the events with no portal yet.' : onlyOne ? 'Showing ' + esc(portalNameOf(onlyOne)) + ' for now.' : 'Showing every portal for now.') + '</span>' +
        '<button type="button" class="pn-link" id="pn-back">Back to ' + esc(portalNameOf(state.portalReturn)) + '</button>' +
        (onlyNone ? review : '') + '</div>';
    } else {
      if (state.portalSettled && !state.portalChosen && window.RevampPortals){
        html += '<div class="portal-notice portal-callout">' + IC.globe + '<span class="pn-text">Choose the portal you work on. The events list, Create Event and its previous editions follow it.</span>' +
          '<button type="button" class="btn btn-secondary btn-sm" id="pn-choose">Choose portal</button></div>';
      }
      var filteringNone = state.portal === 'all' && state.filters.portals.indexOf('none') !== -1;
      if (c.none){
        html += '<div class="portal-notice">' + IC.alert + '<span class="pn-text">' +
          (c.none === 1 ? '1 event has no portal yet.' : c.none + ' events have no portal yet.') + '</span>' +
          (filteringNone ? '' : '<button type="button" class="pn-link" id="pn-show-none">Show them</button>') + review + '</div>';
      }
    }
    el.innerHTML = html;
    var back = $('pn-back'), choose = $('pn-choose'), showNone = $('pn-show-none');
    if (back) back.addEventListener('click', backToWorkingPortal);
    if (showNone) showNone.addEventListener('click', showNoPortal);
    if (choose) choose.addEventListener('click', function(e){
      e.stopPropagation();
      /* the top-bar switcher is hidden on phones: the Filters sheet carries the Portal choice there */
      var phone = typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 640px)').matches;
      if (phone) openMobileFilters(); else openPortalsNav();
    });
  }

  /* =========================================================
     TABS
  ========================================================= */
  function renderTabs(){
    var counts = { upcoming:0, active:0, completed:0 };
    EVENTS.forEach(function(e){ if (counts[e.status]!==undefined && inWorkingPortal(e)) counts[e.status]++; });
    var tabs = [['active','Active'],['upcoming','Upcoming'],['completed','Completed']];
    $('status-tabs').innerHTML = tabs.map(function(t){
      var selected = !state.specialView && state.tab === t[0];
      return '<button role="tab" aria-selected="'+selected+'" data-tab="'+t[0]+'">'+t[1]+' <span class="tc">'+counts[t[0]]+'</span></button>';
    }).join('') + '<span class="tabs-underline" id="tabs-underline"></span>';
    $('status-tabs').querySelectorAll('[data-tab]').forEach(function(b){
      b.addEventListener('click', function(){
        state.tab = b.getAttribute('data-tab'); state.specialView = null; state.page = 1;
        syncHash(); renderApp();
      });
    });
    requestAnimationFrame(positionUnderline);
  }
  function positionUnderline(){
    var active = $('status-tabs').querySelector('[aria-selected="true"]');
    var underline = $('tabs-underline');
    if (!active || !underline) { if(underline) underline.style.width='0'; return; }
    underline.style.left = active.offsetLeft + 'px';
    underline.style.width = active.offsetWidth + 'px';
  }
  window.addEventListener('resize', positionUnderline);

  /* =========================================================
     SPECIAL VIEW BANNER
  ========================================================= */
  function renderSpecialBanner(){
    var el = $('special-banner');
    if (!state.specialView){ el.innerHTML=''; return; }
    var labels = { draft:'Draft events', cancelled:'Cancelled events', deleted:'Deleted events' };
    var icons = { draft:IC.file, cancelled:IC.ban, deleted:IC.trash2 };

      '<button id="btn-back-tabs">Back to Active</button></div>';

  /* =========================================================
     INSIGHTS
  ========================================================= */
  function computeRangeLabel(rs){
    if (rs.mode === 'today') return 'Today';
    if (rs.mode === '7') return 'Last 7 days';
    if (rs.mode === '10') return 'Last 10 days';
    if (rs.mode === '30') return 'Last 30 days';
    if (rs.start && rs.end) return fmtDate(rs.start) + ' → ' + fmtDate(rs.end);
    return 'Custom range';
  }
  /* the Insights period's label: a custom period whose dates were never applied is read as the last 30 days
     (activityPeriod), so it is called that, as Latest activity's picker does */
  function rangeLabelText(){ return activityRangeLabel(state.range); }

  function renderInsightsTitle(){
    var base = state.specialView ? 'upcoming' : state.tab;
    $('insights-title').textContent = statusLabel(base) + ' Event Insights';
    $('range-label').textContent = rangeLabelText();
  }

  /* The three cards for the tab's events in the period picked beside them (QA follow-up, UX-022): visitors and new
     registrations are those events' own figures for those days, from GET /api/insights?from=&to= (the very read
     Latest activity makes, kept in the same place, so one period is read once). They used to add up all-time
     counters under a "Last 30 days" label, and right beside Latest activity's real figures for the 30 days that read
     as a contradiction. A figure that is loading, failed or has no source shows a dash and says why, never a 0.
     Payments are not part of this release, so the third card says that instead of a revenue figure (it summed the
     ticket prices set on paid events, which is no revenue, and has no period). */
  function renderKPIs(){
    if (state.loading){
      $('kpi-grid').innerHTML = ['Visitors','New registrations','Revenue'].map(function(l){
        return '<div class="kpi-card"><div class="kpi-top"><span class="kpi-label">'+l+'</span></div><div class="kpi-skel skel"></div></div>';
      }).join('');
      return;
    }
    var bucket = state.specialView ? 'upcoming' : state.tab;
    var inTab = {};
    /* the tab's events on the working portal, as the list shows them (inWorkingPortal) */
    EVENTS.forEach(function(e){ if (e.status === bucket && inWorkingPortal(e)) inTab[e.id] = true; });
    var p = activityPeriod(state.range);
    var part = p ? ensureFigures(p, 'insights') : null;
    var vis = 0, reg = 0, note = '';
    var ok = !!(part && part.state === 'ok'), loading = !!(part && part.state === 'loading');
    if (ok){
      part.data.events.forEach(function(ev){
        if (!ev || !inTab[ev.eventId] || !ev.window) return;
        vis += Math.max(0, Number(ev.window.views) || 0);
        reg += Math.max(0, Number(ev.window.registrations) || 0);
      });
      if (p.cut) note = '<p class="kpi-note">These figures cover the last 365 days of that period (' + esc(fmtDayRange(p)) + ').</p>';
    } else if (!p){
      note = '<p class="kpi-note">That period has not started yet. Pick one that has.</p>';
    } else if (part.state === 'error'){
      note = '<p class="kpi-note">These figures could not be loaded. <button type="button" class="btn btn-secondary btn-sm" id="kpi-retry">Try again</button></p>';
    }

    function card(label, icon, n, sub){
      var value = loading ? '<div class="kpi-skel skel"></div><span class="sr-only">Loading</span>'
        : ok ? '<span class="kpi-num" title="' + fmtNum(n) + '">' + fmtCompact(n) + '</span>'
        : '<span class="kpi-num kpi-none" aria-label="No figure">—</span>';
      return '<div class="kpi-card fade-in">' +
        '<div class="kpi-top"><span class="kpi-label">' + label + '</span><span class="kpi-icon">' + icon + '</span></div>' +
        value + '<span class="kpi-sub">' + (ok || loading ? sub : (p ? 'Could not be loaded' : 'No figure for that period')) + '</span>' +
      '</div>';
    }
    $('kpi-grid').innerHTML =
      card('Visitors', IC.users, vis, 'Page views of these events’ sites') +
      card('New registrations', IC.ticket, reg, 'People who registered on these events’ sites') +
      '<div class="kpi-card is-none fade-in">' +
        '<div class="kpi-top"><span class="kpi-label">Revenue</span><span class="kpi-icon">' + IC.wallet + '</span></div>' +
        '<span class="kpi-num kpi-none" aria-label="No figure">—</span><span class="kpi-sub">Payments are not part of Oneworld 2.0 yet</span>' +
      '</div>' + note;
    var retry = $('kpi-retry');
    if (retry) retry.addEventListener('click', function(){ loadPart(p, 'insights'); renderKPIs(); });
  }

  function renderRangePopover(){

    var body = opts.map(function(o){

    }).join('');

      '</div>' +

        else { renderActivityRangePopover(); }

    var cancelBtn = $('arange-cancel'), applyBtn = $('arange-apply');
    if (cancelBtn) cancelBtn.addEventListener('click', function(){ state.activityRange.mode='30'; closeAll(); renderActivity(); });
    if (applyBtn) applyBtn.addEventListener('click', function(){
      var s = $('arange-start').value, e = $('arange-end').value;
      if (!s || !e){ toast('Pick both a start and end date.'); return; }

  /* =========================================================
     FILTER POPOVERS
  ========================================================= */
  function toggleInArray(arr, val){
    var i = arr.indexOf(val);
    if (i===-1) arr.push(val); else arr.splice(i,1);
  }
  function renderTypePopover(){
    $('type-popover').innerHTML = '<div class="popover-label">Event type</div>' + Object.keys(EVENT_TYPES).map(function(k){
      var on = state.filters.types.indexOf(k) !== -1;
      return '<button class="check-row ' + (on?'on':'') + '" data-type="' + k + '"><span class="check-box">' + (on?IC.check:'') + '</span>' + EVENT_TYPES[k] + '</button>';
    }).join('');
    $('type-popover').querySelectorAll('[data-type]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); toggleInArray(state.filters.types, b.getAttribute('data-type')); state.page=1; renderTypePopover(); renderResults(); renderToolbarButtons(); });
    });
  }
  /* All portals only (a one-portal view hides it: the switcher is the portal control there): "No portal yet", then
     every portal that has events, with their counts */
  function portalFilterRows(){
    var c = portalCounts();
    return [{ slug:'none', name:'No portal yet', count:c.none }].concat(portalsWithEvents(c));
  }
  function renderPortalPopover(){
    $('portal-popover').innerHTML = '<div class="popover-label">Portal</div>' + portalFilterRows().map(function(p){
      var on = state.filters.portals.indexOf(p.slug) !== -1;
      return '<button class="check-row ' + (on?'on':'') + '" data-portal="' + esc(p.slug) + '"><span class="check-box">' + (on?IC.check:'') + '</span>' + esc(p.name) +
        ' <span class="mono muted" style="margin-left:auto;">' + p.count + '</span></button>';
    }).join('');
    $('portal-popover').querySelectorAll('[data-portal]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); toggleInArray(state.filters.portals, b.getAttribute('data-portal')); state.page=1; renderPortalPopover(); renderResults(); renderToolbarButtons(); });
    });
  }
  $('btn-type').addEventListener('click', function(e){ e.stopPropagation(); if (state.openPopover==='type-popover'){closeAll();return;} renderTypePopover(); openPopover('type-popover'); });
  $('btn-portal').addEventListener('click', function(e){ e.stopPropagation(); if (state.openPopover==='portal-popover'){closeAll();return;} renderPortalPopover(); openPopover('portal-popover'); });
  $('btn-qr-toolbar').addEventListener('click', function(){ openQRModal(); });

  function renderToolbarButtons(){
    var tCount = state.filters.types.length, pCount = state.portal === 'all' ? state.filters.portals.length : 0;
    $('btn-type').className = 'toolbar-btn' + (tCount?' active-filter':'');
    $('btn-type').innerHTML = 'Event Type' + (tCount ? ' <span class="badge-count">'+tCount+'</span>' : '') + ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 9l6 6 6-6"/></svg>';
    $('btn-portal').parentNode.hidden = state.portal !== 'all';
    var portalLabel = pCount ? (esc(portalNameOf(state.filters.portals[0])) + (pCount>1 ? ' +'+(pCount-1) : '')) : 'Portal';
    $('btn-portal').className = 'toolbar-btn' + (pCount?' active-filter':'');
    $('btn-portal').innerHTML = portalLabel + ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 9l6 6 6-6"/></svg>';
  }

  function renderChips(){
    var chips = [];
    state.filters.types.forEach(function(k){ chips.push({ label:'Type: '+EVENT_TYPES[k], onRemove:function(){ toggleInArray(state.filters.types,k); } }); });
    if (state.portal === 'all') state.filters.portals.forEach(function(k){ chips.push({ label:'Portal: '+portalNameOf(k), onRemove:function(){ toggleInArray(state.filters.portals,k); } }); });
    state.filters.payment.forEach(function(k){ chips.push({ label:'Payment: '+(k==='paid'?'Paid':'Free'), onRemove:function(){ toggleInArray(state.filters.payment,k); } }); });
    /* the date and "created by you" filters (set from the address or by ETB2B AI) show as chips like the rest,
       so what hides an event is always on screen and one ✕ away */
    if (state.created) chips.push({ label:'Created ' + fmtDayRange(state.created), onRemove:function(){ state.created = null; } });
    if (state.starts) chips.push({ label:'Starts ' + fmtDayRange(state.starts), onRemove:function(){ state.starts = null; } });
    if (state.mine) chips.push({ label:'Created by you', onRemove:function(){ state.mine = false; } });
    if (!chips.length){ $('chip-row').innerHTML=''; return; }
    $('chip-row').innerHTML = chips.map(function(c,i){ return '<span class="fchip">'+esc(c.label)+'<button type="button" data-chip="'+i+'" aria-label="Remove filter: '+esc(c.label)+'">'+IC.x+'</button></span>'; }).join('') +
      '<button class="chip-clear" id="chip-clear-all">Clear all</button>';
    $('chip-row').querySelectorAll('[data-chip]').forEach(function(b){
      b.addEventListener('click', function(){ chips[parseInt(b.getAttribute('data-chip'),10)].onRemove(); state.page=1; renderResults(); renderToolbarButtons(); });
    });
    $('chip-clear-all').addEventListener('click', function(){ state.filters = {types:[],portals:[],payment:[]}; clearDateFilters(); state.page=1; renderResults(); renderToolbarButtons(); });
  }
  function clearDateFilters(){ state.created = null; state.starts = null; state.mine = false; }
  function hasDateFilters(){ return !!(state.created || state.starts || state.mine); }

  /* =========================================================
     SEARCH
  ========================================================= */
  $('search-input').value = state.search;
  $('btn-clear-search').hidden = !state.search;
  $('search-input').addEventListener('input', function(){
    state.search = this.value.trim(); state.page = 1;
    $('btn-clear-search').hidden = !state.search;
    $('search-kbd').hidden = !!state.search;
    syncHash(); renderResults();
  });
  $('btn-clear-search').addEventListener('click', function(){
    state.search=''; $('search-input').value=''; $('btn-clear-search').hidden=true; $('search-kbd').hidden=false;
    syncHash(); renderResults(); $('search-input').focus();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA'){
      e.preventDefault(); $('search-input').focus();
    }
  });

  /* =========================================================
     FILTER + SORT + PAGINATE
  ========================================================= */
  function bucketEvents(){
    var status = state.specialView || state.tab;
    return EVENTS.filter(function(e){ return e.status === status && inWorkingPortal(e); });
  }
  function matches(e){
    if (state.filters.types.length && state.filters.types.indexOf(e.type) === -1) return false;
    /* the Portal filter counts only in All portals: a value left from there (or by the address or ETB2B AI) can
       never hide rows in a one-portal view, where it has no chip and nobody could see why */
    if (state.portal === 'all' && state.filters.portals.length && state.filters.portals.indexOf(e.portal || 'none') === -1) return false;
    if (state.filters.payment.length && state.filters.payment.indexOf(e.payment.type) === -1) return false;
    if (state.created && !inDays(e.createdAt, state.created)) return false;
    if (state.starts && !inDays(e.start, state.starts)) return false;
    if (state.mine && !isMine(e)) return false;
    /* the search looks through the event's own cells (searchHit) and the name of its portal ("No portal yet" for
       none); ETB2B AI's server searches the very same (functions/lib/dash-bot.js searchHit) */
    if (state.search && !searchHit(e, state.search) && !portalSearchHit(e, state.search)) return false;
    return true;
  }
  /* createdBy is the creator's sign-in email (functions/lib/api.js), so "mine" is the signed-in person's own */
  function isMine(e){
    var me = listingMe().email.toLowerCase();
    return !!me && String(e.createdBy || '').toLowerCase() === me;
  }
  function sortValue(e, field){
    if (field==='start') return e.start ? new Date(e.start).getTime() : -Infinity;
    if (field==='registrations') return e.registrations;
    if (field==='visitors') return e.visitors;
    if (field==='payment') return e.payment.type==='paid' ? e.payment.amount : -1;
    return 0;
  }
  function getFilteredSorted(){
    var list = bucketEvents().filter(matches);
    var field = state.sort.field, dir = state.sort.dir === 'asc' ? 1 : -1;
    list.sort(function(a,b){ return (sortValue(a,field) - sortValue(b,field)) * dir; });
    return list;
  }

  /* =========================================================
     TABLE / CARD RENDER
  ========================================================= */
  function dateCellHTML(e){
    if (!e.start) return '<div class="unset">Date not set</div>';
    var out = '<div class="d1">' + fmtDate(e.start) + '</div><div class="d2">' + fmtTime(e.start) + '</div>';
    if (e.status === 'active') out += '<div class="live-tag"><i></i>Live now</div>';
    else if (e.status === 'upcoming'){
      var du = daysUntil(e.start);
      if (du >= 0 && du <= 7) out += '<div class="d3">' + (du===0?'Today':du===1?'Tomorrow':'In '+du+' days') + '</div>';
    }
    return out;
  }
  function regCellHTML(e){
    return '<span class="reg-num">' + fmtNum(e.registrations) + '</span>';
  }
  function payCellHTML(e){
    if (e.payment.type === 'free') return '<span class="pay-free">Free</span>';
    return '<span class="pay-amt" data-tooltip="' + (e.payment.txns||0) + ' transactions">' + fmtRupee(e.payment.amount) + '</span><div class="pay-sub">Collected</div>';
  }
  function metaLine(e){
    return '<span class="ev-id-chip mono">Event ID: ' + e.eventNo + '</span>' +
      '<span class="dotsep">&middot;</span><span class="ev-tag ' + (TYPE_TAG_CLASS[e.type]||'ev-tag-blue') + '">' + esc(typeLabel(e.type).replace(' (IP)','')) + '</span>';
  }

  function venueQuickviewBodyHTML(e){
    var venueText = e.venue === 'Virtual'
      ? (e.city && e.city !== 'Online' ? e.city + ' (Virtual)' : 'Virtual')
      : ((e.venue || 'Venue to be confirmed') + (e.city ? ', ' + e.city : ''));
    return '<div class="venue-pop-row">' + IC.pin + '<span>' + esc(venueText) + '</span></div>' +
      '<div class="venue-pop-row">' + IC.userCircle + '<span>Created by ' + esc(e.createdBy) + '</span></div>';
  }

  var qvCloseTimer = null;
  function cancelCloseQV(){ clearTimeout(qvCloseTimer); }
  function scheduleCloseQV(){ clearTimeout(qvCloseTimer); qvCloseTimer = setTimeout(function(){ if (state.openPopover === 'venue-quickview') closeAll(); }, 220); }

  function openVenueQuickview(anchorEl, id){
    var e = findEvent(id);
    var pop = $('venue-quickview');
    if (!e || !pop) return;
    if (state.openPopover === 'venue-quickview' && state.venuePopoverFor === id) return;
    closeAll();
    pop.innerHTML = venueQuickviewBodyHTML(e);
    pop.hidden = false;
    var r = anchorEl.getBoundingClientRect();
    var popW = 240, popH = pop.offsetHeight || 64;
    var left = Math.max(12, Math.min(r.left, window.innerWidth - popW - 12));
    var top = r.bottom + 8;
    if (top + popH > window.innerHeight - 12) top = Math.max(12, r.top - 8 - popH);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    state.openPopover = 'venue-quickview';
    state.venuePopoverFor = id;
  }

  function quickActionIcon(action, icon, label, id, colorClass){
    return '<button class="icon-btn qa-btn ' + colorClass + '" data-row-action="' + action + '" data-id="' + id + '" data-tooltip="' + label + '" aria-label="' + label + '">' + icon + '</button>';
  }

  function rowActionsHTML(e, ctx){
    var menuId = 'rowmenu-' + (ctx||'row') + '-' + e.id;
    var items = [];
    if (e.status === 'draft'){
      items.push(['duplicate', IC.copy, 'Clone Event']);
      items.push(['sep']);
      items.push(['delete-forever', IC.trash, 'Delete event', true]);
    } else if (e.status === 'cancelled'){
      items.push(['duplicate', IC.copy, 'Clone Event']);
      items.push(['copylink', IC.link, 'Copy event link']);
      items.push(['sep']);
      items.push(['restore', IC.restore, 'Restore to Upcoming']);
      items.push(['delete-forever', IC.trash, 'Delete permanently', true]);
    } else if (e.status === 'deleted'){
      items.push(['restore', IC.restore, 'Restore']);
      items.push(['sep']);
      items.push(['delete-forever', IC.trash, 'Delete permanently', true]);
    } else {
      items.push(['setup', IC.settings, 'Event setup']);
      items.push(['sep']);
      items.push(['duplicate', IC.copy, 'Clone Event']);
      items.push(['copylink', IC.link, 'Copy event link']);
      if (e.status === 'active'){
        items.push(['sep']);
        items.push(['complete', IC.checkCirc, 'Mark as completed']);
      }
    }
    /* an event with no portal yet: setting one comes first (a deleted event is left as it is) */
    if (!e.portal && e.status !== 'deleted') items.unshift(['set-portal', IC.globe, 'Set portal'], ['sep']);
    var menuHTML = items.map(function(it){
      if (it[0]==='sep') return '<div class="popover-sep"></div>';
      return '<button class="popover-item' + (it[3]?' danger':'') + '" data-row-action="' + it[0] + '" data-id="' + e.id + '">' + it[1] + ' ' + it[2] + '</button>';
    }).join('');
    var quickIcons = '';
    if (e.status === 'draft'){
      /* a draft is previewed like any other event: its last editor preview, or its saved site */
      quickIcons = quickActionIcon('edit', IC.edit, 'Edit', e.id, 'qa-edit') +
        quickActionIcon('view', IC.eye, 'Preview', e.id, 'qa-view');
    } else if (e.status !== 'deleted'){
      quickIcons = quickActionIcon('edit', IC.edit, 'Edit', e.id, 'qa-edit') +
        quickActionIcon('view', IC.eye, 'Preview', e.id, 'qa-view') +
        quickActionIcon('reports', IC.chart, 'Report', e.id, 'qa-report');
    }
    return '<div class="row-action-group">' + quickIcons +
      '<div class="popover-wrap">' +
        '<button class="icon-btn" data-row-menu-btn="' + menuId + '" aria-label="More actions">' + IC.dots + '</button>' +
        '<div class="popover row-menu" id="' + menuId + '" hidden>' + menuHTML + '</div>' +
      '</div>' +
    '</div>';
  }

  function renderResults(){
    var list = getFilteredSorted();
    var total = list.length;
    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    var pageList = list.slice((state.page-1)*PAGE_SIZE, state.page*PAGE_SIZE);

    /* every change to what the list shows passes through here, so the address always matches it */
    syncHash();
    renderChips();
    renderPortalNotice();
    /* All portals adds the Portal column and the cards' portal line (CSS on #results-view.all-portals) */
    var allPortals = state.portal === 'all', cols = allPortals ? 7 : 6;
    $('results-view').classList.toggle('all-portals', allPortals);
    $('result-line').textContent = state.loading ? '' : ('Showing ' + (total ? ((state.page-1)*PAGE_SIZE+1) : 0) + '–' + Math.min(total, state.page*PAGE_SIZE) + ' of ' + total + ' event' + (total===1?'':'s') +
      (allPortals ? '' : ' on ' + portalNameOf(state.portal)));

    document.querySelectorAll('.ev-table th.sortable').forEach(function(th){
      th.classList.toggle('sorted', th.getAttribute('data-sort') === state.sort.field);
      var ic = th.querySelector('.sort-ic');
      if (ic) ic.style.transform = (th.getAttribute('data-sort')===state.sort.field && state.sort.dir==='desc') ? 'rotate(180deg)' : 'none';
    });

    if (state.loading){
      $('table-body').innerHTML = Array(5).fill(0).map(function(){
        return '<tr class="skel-row">' + Array(cols).fill(0).map(function(){ return '<td><div class="skel skel-line"></div></td>'; }).join('') + '</tr>';
      }).join('');
      $('card-list').innerHTML = '';
      $('pagination').innerHTML = '';
      return;
    }

    if (!total){
      var hasFilters = state.search || state.filters.types.length || (allPortals && state.filters.portals.length) || state.filters.payment.length || hasDateFilters();
      var emptyHTML;
      if (hasFilters){
        emptyHTML = '<div class="empty-state">' + IC.plusOutline + '<h3 style="margin-top:12px;">No events match</h3><p>Try a different search term, or clear your filters.</p>' +
          '<button class="btn btn-secondary" id="empty-clear">Clear filters</button></div>';
      } else if (!allPortals && !EVENTS.some(function(e){ return e.portal === state.portal && e.status !== 'deleted'; })){
        /* a portal with no events at all yet: start its first, or look at every portal (for this visit) */
        var pName = esc(portalNameOf(state.portal));
        emptyHTML = '<div class="empty-state">' + IC.plusOutline + '<h3 style="margin-top:12px;">' + pName + ' has no events yet</h3>' +
          '<p>Create its first event, or show the events of every portal.</p>' +
          '<a class="btn btn-primary" href="' + esc(createHref()) + '">Create Event</a> ' +
          '<button type="button" class="btn btn-secondary" data-empty-all-portals>Show all portals</button></div>';
      } else {
        var bucket = state.specialView || state.tab;
        var mainBucket = ['active','upcoming','completed'].indexOf(bucket) !== -1;
        emptyHTML = '<div class="empty-state">' + IC.plusOutline + '<h3 style="margin-top:12px;">No ' + statusLabel(bucket).toLowerCase() + ' events</h3>' +
          '<p>' + (mainBucket ? 'Create your first event — it takes about ten minutes.' : 'Nothing here right now.') + '</p>' +
          (mainBucket ? '<a class="btn btn-primary" href="' + esc(createHref()) + '">Create Event</a>' : '') + '</div>';
      }
      $('table-body').innerHTML = '<tr><td colspan="' + cols + '">' + emptyHTML + '</td></tr>';
      $('card-list').innerHTML = emptyHTML;
      var ec = $('empty-clear'); if (ec) ec.addEventListener('click', function(){ state.search=''; $('search-input').value=''; $('btn-clear-search').hidden=true; state.filters={types:[],portals:[],payment:[]}; clearDateFilters(); state.page=1; renderResults(); renderToolbarButtons(); });
      /* in the table and in the cards alike (the table is hidden on phones) */
      document.querySelectorAll('[data-empty-all-portals]').forEach(function(b){ b.addEventListener('click', function(){ showAllPortalsForNow(''); }); });
      $('pagination').innerHTML = '';
      return;
    }

    $('table-body').innerHTML = pageList.map(function(e){
      return '<tr data-row="' + e.id + '" data-status="' + e.status + '" class="st-' + e.status + '" tabindex="0">' +
        '<td><div class="ev-name-cell"><span class="status-dot ' + e.status + '" data-tooltip="' + statusLabel(e.status) + '"></span>' +
          '<div class="ev-name-main"><a class="ev-link" href="edit-event.html?event=' + e.id + '" data-venue-id="' + e.id + '">' + esc(e.name) + '</a>' +
          '<div class="ev-meta-line">' + metaLine(e) + '</div></div></div></td>' +
        '<td class="col-portal">' + portalCellHTML(e) + '</td>' +
        '<td class="ev-date-cell">' + dateCellHTML(e) + '</td>' +
        '<td><span class="vis-num">' + fmtNum(e.visitors) + '</span></td>' +
        '<td class="reg-cell">' + regCellHTML(e) + '</td>' +
        '<td>' + payCellHTML(e) + '</td>' +
        '<td class="row-actions">' + rowActionsHTML(e, 'row') + '</td>' +
      '</tr>';
    }).join('');

    $('card-list').innerHTML = pageList.map(function(e){
      var whenText = e.start ? (fmtDate(e.start) + ' · ' + fmtTime(e.start)) : 'Date not set';
      return '<div class="ev-card fade-in">' +
        '<div class="ev-card-top"><span class="status-dot ' + e.status + '" data-tooltip="' + statusLabel(e.status) + '" style="margin-top:7px;"></span>' +
          '<div class="ev-name-main"><a class="ev-link" href="edit-event.html?event=' + e.id + '" data-venue-id="' + e.id + '" style="font-weight:700;font-size:14.5px;">' + esc(e.name) + '</a>' +
          '<div class="ev-meta-line">' + metaLine(e) + '</div></div>' +
          rowActionsHTML(e, 'card') +
        '</div>' +
        '<div class="ev-card-info">' +
          '<div class="ev-card-portal">' + IC.globe + portalCellHTML(e) + '</div>' +
          '<div class="ev-info-row">' +
            '<span class="ev-info-item">' + IC.calendarSm + '<span class="v' + (e.start?'':' faint2') + '">' + esc(whenText) + '</span></span>' +
            '<span class="ev-info-item">' + IC.users + '<span class="v">' + fmtNum(e.visitors) + ' visitors</span></span>' +
          '</div>' +
          '<div class="ev-info-row">' +
            '<span class="ev-info-item">' + IC.ticket + '<span class="v">' + fmtNum(e.registrations) + ' registrations</span></span>' +
            '<span class="ev-info-item">' + IC.wallet + '<span class="v' + (e.payment.type==='free'?' faint2':'') + '">' + (e.payment.type==='free' ? 'Free' : fmtRupee(e.payment.amount)) + '</span></span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    renderPagination(total, totalPages);
    wireRowEvents();
  }

  function renderPagination(total, totalPages){
    if (totalPages <= 1){ $('pagination').innerHTML=''; return; }
    var btns = '';
    btns += '<button ' + (state.page===1?'disabled':'') + ' data-page="' + (state.page-1) + '" aria-label="Previous page">‹</button>';
    for (var i=1;i<=totalPages;i++){
      btns += '<button aria-current="' + (state.page===i) + '" data-page="' + i + '">' + i + '</button>';
    }
    btns += '<button ' + (state.page===totalPages?'disabled':'') + ' data-page="' + (state.page+1) + '" aria-label="Next page">›</button>';
    $('pagination').innerHTML = btns;
    $('pagination').querySelectorAll('[data-page]').forEach(function(b){
      b.addEventListener('click', function(){
        state.page = parseInt(b.getAttribute('data-page'),10); renderResults();
        try { window.scrollTo({top:0, behavior:'smooth'}); } catch(e){ try { window.scrollTo(0,0); } catch(e2){} }
      });
    });
  }

  function applyView(){
    var rv = $('results-view');
    if (rv) rv.className = 'view-' + state.view + (state.portal === 'all' ? ' all-portals' : '');
    $('view-toggle').querySelectorAll('[data-view]').forEach(function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-view') === state.view);
    });
  }
  function wireViewToggle(){
    $('view-toggle').querySelectorAll('[data-view]').forEach(function(b){
      b.addEventListener('click', function(){ state.view = b.getAttribute('data-view'); applyView(); });
    });
  }

  function wireSortHeaders(){
    document.querySelectorAll('.ev-table th.sortable').forEach(function(th){
      th.addEventListener('click', function(){
        var f = th.getAttribute('data-sort');
        if (state.sort.field === f) state.sort.dir = state.sort.dir==='asc'?'desc':'asc';
        else { state.sort.field = f; state.sort.dir = 'asc'; }
        renderResults();
      });
    });
  }

  function wireRowEvents(){
    document.querySelectorAll('[data-row]').forEach(function(tr){
      tr.addEventListener('click', function(e){
        if (e.target.closest('a, button, .popover')) return;
        window.location.href = 'edit-event.html?event=' + tr.getAttribute('data-row');
      });
      tr.addEventListener('keydown', function(e){
        if (e.key==='Enter' && !e.target.closest('a, button')) window.location.href = 'edit-event.html?event=' + tr.getAttribute('data-row');
      });
    });
    document.querySelectorAll('[data-venue-id]').forEach(function(a){
      function show(){ cancelCloseQV(); openVenueQuickview(a, a.getAttribute('data-venue-id')); }
      a.addEventListener('mouseenter', show);
      a.addEventListener('focus', show);
      a.addEventListener('mouseleave', scheduleCloseQV);
      a.addEventListener('blur', scheduleCloseQV);
      a.addEventListener('click', function(e){
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
        e.preventDefault(); e.stopPropagation();
        show();
      });
    });
    document.querySelectorAll('[data-row-menu-btn]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var panelId = btn.getAttribute('data-row-menu-btn');
        if (state.openPopover === panelId){ closeAll(); btn.classList.remove('force-show'); return; }
        closeAll();
        $(panelId).hidden = false; state.openPopover = panelId;
        placeRowMenu($(panelId), btn);
        btn.classList.add('force-show');
      });
    });
    document.querySelectorAll('[data-row-action]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        handleRowAction(btn.getAttribute('data-row-action'), btn.getAttribute('data-id'), btn);
        closeAll();
      });
    });
    /* the "No portal yet" chip's Set portal, in the Portal cell and on the card */
    document.querySelectorAll('[data-set-portal]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        openSetPortalFor(btn.getAttribute('data-set-portal'), btn);
      });
    });
  }

  function findEvent(id){ return EVENTS.find(function(e){ return e.id===id; }); }

  function handleRowAction(action, id, from){
    var e = findEvent(id);
    if (!e) return;
    switch(action){
      case 'set-portal':
        /* the ⋯ menu closes behind the window, so focus comes back to its ⋯ button */
        var wrap = from && from.closest ? from.closest('.popover-wrap') : null;
        /* an open row menu sits in <body> (placeRowMenu): its row is where it came from */
        var panel = !wrap && from && from.closest ? from.closest('.row-menu') : null;
        if (panel && panel._rvHome) wrap = panel._rvHome;
        openSetPortalFor(id, wrap ? wrap.querySelector('[data-row-menu-btn]') : null); break;
      case 'edit': case 'setup':
        window.location.href = 'edit-event.html?event=' + id; break;
      case 'view':
        /* the same page the Design editor's Preview opens (and the event console's Preview) */
        window.open('/preview/' + encodeURIComponent(e.id) + '?draft=1', '_blank'); break;
      case 'reports':
        window.location.href = 'audience-registrations.html?event=' + id; break;
      case 'duplicate':
        var copy = Object.assign({}, e, { id: nextId(), name: e.name + ' (Copy)', status:'upcoming', registrations:0, visitors:0 });
        EVENTS.splice(EVENTS.indexOf(e)+1, 0, copy);
        toast('Duplicated as "' + copy.name + '"'); renderApp(); break;
      case 'copylink':
        var url = eventPublicUrl(e);
        if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ toast('Link copied — ' + url); }).catch(function(){ toast(url); }); }
        else toast(url);
        break;
      case 'complete':
        e.status = 'completed'; toast('"' + e.name + '" marked as completed'); renderApp(); break;
      case 'cancel':
        e.status = 'cancelled'; toast('"' + e.name + '" cancelled'); renderApp(); break;
      case 'archive':
        e.status = 'deleted'; toast('"' + e.name + '" deleted — restore it anytime from the Deleted tab'); renderApp(); break;
      case 'restore':
        e.status = 'upcoming'; toast('"' + e.name + '" restored to Upcoming'); renderApp(); break;
      case 'delete-forever':
        EVENTS.splice(EVENTS.indexOf(e), 1); toast('"' + e.name + '" deleted permanently'); renderApp(); break;
    }
  }

  function eventSlug(e){
    return e.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }
  function eventPublicUrl(e, section){
    var base = 'https://events.economictimes.indiatimes.com/' + eventSlug(e);
    if (section === 'agenda') return base + '/agenda';
    if (section === 'speakers') return base + '/speakers';
    return base;
  }
