    $('sheet-scrim').addEventListener('click', function(e){ if (e.target===$('sheet-scrim')) closeMobileFilters(); });
    $('sheet-clear').addEventListener('click', function(){ state.filters={types:[],portals:[],payment:[]}; openMobileFilters(); });
    $('sheet-apply').addEventListener('click', closeMobileFilters);
    asDialog($('sheet-card'), 'sheet-title', closeMobileFilters);
    var f = keep ? root.querySelector(keep) : null;
    try { (f || $('m-portal')).focus(); } catch(e){}
  }
  $('btn-mobile-filters').addEventListener('click', openMobileFilters);

  /* =========================================================
     UPDATED — reads the events again (refreshEvents) and says when the list was last read. It used to say "Updated
     2 min ago" whatever the time, spin, toast "Event data refreshed" and read nothing (UX-022).
  ========================================================= */
  function renderSync(){
    var btn = $('btn-sync'), label = $('sync-label'), ic = $('sync-ic');
    var busy = state.loading || state.refreshing;
    ic.classList.toggle('spin-on', busy);
    var at = state.loadedAt ? fmtTime(new Date(state.loadedAt).toISOString()) : '';
    label.textContent = state.loading ? 'Loading…' : state.refreshing ? 'Updating…' : state.loadFailed ? 'Not loaded' : 'Updated ' + at;
    btn.setAttribute('aria-label', state.loadFailed ? 'Load the events again' : at ? 'Read the events again. Last read at ' + at : 'Read the events again');
    btn.setAttribute('aria-busy', busy ? 'true' : 'false');
  }
  $('btn-sync').addEventListener('click', function(){
    if (state.loading || state.refreshing) return;
    if (state.loadFailed){ loadAndRender(); return; }
    loadCreateDrafts();          // the unfinished Create Event drafts are read again too
    refreshEvents().then(function(ok){ if (ok) toast('The list is up to date (read at ' + fmtTime(new Date(state.loadedAt).toISOString()) + ').'); });
  });

  /* =========================================================
     ERROR STATE (defensive — shows only if data prep fails)
  ========================================================= */
  function renderErrorBanner(retry){
    $('error-slot').innerHTML = '<div class="error-banner fade-in">' + IC.alert +
      '<span>Couldn’t load your events. Check your connection and try again.</span>' +
      '<button class="btn btn-secondary btn-sm" id="btn-retry">Retry</button></div>';
    $('btn-retry').addEventListener('click', function(){ $('error-slot').innerHTML=''; retry(); });
  }

  /* =========================================================
     LATEST ACTIVITY — what happened across all the events in the period picked beside it (Today, the last 7,
     10 or 30 days, or a custom period), in real figures only. Each row reads the source the rest of Oneworld 2.0
     reads for it, so it never disagrees with an event's own Dashboard, Mailer performance or the Activity log:
       New registrations, Visitors   GET /api/insights?from=&to=   (functions/lib/api-audience.js: every event's
                                     day by day totals; an older event's registrations are read from its records)
       Mailer opens                  GET /api/promo/analytics/all  (functions/lib/promo-track.js: the tracked
                                     mailers' opens and clicks, kept by day for the last 30 India days)
       Changes to events             GET /api/activity/all?from=&to=   (the Activity log)
     A row with no figure says so in words, with a dash where the number would be: never a made-up number.
     Newsletters and subscribers have no source in Oneworld 2.0 (it sends no mail yet), so their row says that.
     Each period is read once, after the events list has loaded and once the card is (nearly) on screen: the
     figures add up every event's days, which is not worth reading for someone who never scrolls down to them.
     The day figures (GET /api/insights) are the exception: the Insights cards at the top read them for their own
     period straight away, and this card reuses that read when its period is the same.
     They are kept while the page stays open (a reload of the events list reads them again).
  ========================================================= */
  var ACTIVITY_ROWS = [
    { key:'registrations', label:'New registrations', desc:'People who registered on your events’ sites', icon:IC.ticket, color:'act-blue' },
    { key:'visitors', label:'Visitors', desc:'Page views of your events’ sites', icon:IC.users, color:'act-teal' },
    { key:'mailers', label:'Mailer opens', desc:'Opens of the mailers made in Promotions', icon:IC.mail, color:'act-amber' },
    { key:'changes', label:'Changes to events', desc:'Edits, publishing and approvals, from the Activity log', icon:IC.edit, color:'act-violet' },
    { key:'newsletters', label:'Newsletters and subscribers', desc:'Not part of Oneworld 2.0 yet, so there is nothing to count', icon:IC.newspaper, color:'act-rose', none:true }
  ];
  var CHANGES_LIMIT = 100;       // the Activity log's largest page: past it the row reads "100+", never a guess
  var CHANGES_SHOWN = 8;
  var EVENTS_SHOWN = 6;
  var activityCache = {};        // "from..to" -> { insights, changes }: each { state: 'loading' | 'ok' | 'error', data }
  var mailerFigures = null;      // the same for every period (Mailer performance's 30 days), read once
  var activityInView = false;    // the card has come near the screen (always true where the browser cannot tell)
  var activityWatch = null;
  /* reads nothing until the card is within 300 px of the screen; a browser without IntersectionObserver reads at once */
  function watchActivityCard(){
    if (activityInView || activityWatch) return;
    if (typeof window.IntersectionObserver !== 'function'){ activityInView = true; return; }
    activityWatch = new IntersectionObserver(function(entries){
      if (!entries.some(function(e){ return e.isIntersecting; })) return;
      activityInView = true;
      activityWatch.disconnect();
      renderActivity();
    }, { rootMargin: '300px 0px' });
    activityWatch.observe($('activity-card'));
  }
  function forgetActivity(){ activityCache = {}; mailerFigures = null; }

  function todayIst(){ return istDay(new Date().toISOString()); }
  function addDaysTo(day, n){ return new Date(Date.parse(day + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10); }
  /* The period picked, as India days { from, to } (both included), never past today; null when it has not begun.
     A custom period with no dates yet (the picker left open) is the last 30 days, as its label then says. */
  function activityPeriod(rs){
    var today = todayIst(), from, to;
    if (rs.mode === 'today'){ from = today; to = today; }
    else if (rs.mode === 'custom' && validDay(rs.start) && validDay(rs.end)){ from = rs.start; to = rs.end; }
    else { var n = parseInt(rs.mode, 10); if (!(n > 0)) n = 30; from = addDaysTo(today, 1 - n); to = today; }
    if (from > to){ var x = from; from = to; to = x; }
    if (from > today) return null;
    if (to > today) to = today;
    /* the server adds up at most a year of days (GET /api/insights): a longer custom period is its newest 365 */
    var cut = from < addDaysTo(to, -364);
    if (cut) from = addDaysTo(to, -364);
    return { from: from, to: to, cut: cut };
  }
  function activityRangeLabel(rs){
    if (rs.mode === 'custom' && !(validDay(rs.start) && validDay(rs.end))) return 'Last 30 days';
    return computeRangeLabel(rs);
  }
  /* the start of an India day as a server time, for the Activity log's from / to (to is the day after, not included) */
  function istDayStart(day, plusDays){ return new Date(Date.parse(day + 'T00:00:00+05:30') + (plusDays || 0) * 86400000).toISOString(); }

  /* GET a JSON answer with the person's sign-in, as loadEvents() does; rejects on any failure */
  function getJson(url){
    if (!window.RevampAuth || typeof window.RevampAuth.getIdToken !== 'function') return Promise.reject(new Error('Not signed in.'));
    return window.RevampAuth.getIdToken().then(function(token){
      return fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    }).then(function(res){
      return res.json().catch(function(){ return null; }).then(function(data){
        if (!res.ok || !data || typeof data !== 'object') throw new Error((data && data.error) || ('Could not load (' + res.status + ')'));
        return data;
      });
    });
  }
  /* Reads one part into holder[part] and redraws the panel when it lands. An answer of the wrong shape is a failure
     (shown as one), never a zero. */
  function readPart(holder, part, url, shapeOk){
    holder[part] = { state:'loading' };
    getJson(url).then(function(data){
      if (!shapeOk(data)) throw new Error('An answer this panel cannot read.');
      holder[part] = { state:'ok', data: data };
    }).catch(function(err){
      holder[part] = { state:'error', message: String((err && err.message) || '') };
    }).then(function(){ if (!state.loading){ renderKPIs(); renderActivity(); } });   // the Insights cards read the same figures
  }
  function periodKey(p){ return p.from + '..' + p.to; }
  function loadPart(p, part){
    var entry = activityCache[periodKey(p)];
    if (part === 'insights') readPart(entry, 'insights', '/api/insights?from=' + p.from + '&to=' + p.to,
      function(d){ return Array.isArray(d.byDay) && Array.isArray(d.events); });
    else if (part === 'changes') readPart(entry, 'changes', '/api/activity/all?limit=' + CHANGES_LIMIT + '&from=' + encodeURIComponent(istDayStart(p.from)) +
      '&to=' + encodeURIComponent(istDayStart(p.to, 1)), function(d){ return Array.isArray(d.items); });
    else {
      if (!mailerFigures) mailerFigures = {};
      readPart(mailerFigures, 'all', '/api/promo/analytics/all', function(d){ return typeof d.available === 'boolean' && Array.isArray(d.series); });
    }
  }
  /* one part of one period's figures, read the first time it is asked for: the Insights cards ask for 'insights'
     as soon as the events have loaded, Latest activity for 'insights' and 'changes' once its card is near the
     screen, and a period both show is read once */
  function ensureFigures(p, part){
    var key = periodKey(p);
    if (!activityCache[key]) activityCache[key] = {};
    if (!activityCache[key][part]) loadPart(p, part);
    return activityCache[key][part];
  }
  function activityData(p){
    var insights = ensureFigures(p, 'insights'), changes = ensureFigures(p, 'changes');
    if (!mailerFigures) loadPart(p, 'mailers');
    return { insights: insights, changes: changes, mailers: mailerFigures.all };
  }
  function partOf(key){ return key === 'registrations' || key === 'visitors' ? 'insights' : key; }

  function sumDays(list, field, p){
    var n = 0;
    (list || []).forEach(function(d){ if (d && d.date >= p.from && d.date <= p.to) n += Math.max(0, Number(d[field]) || 0); });
    return n;
  }
  /* One row's figure: { loading } | { error } | { none: why there is no number } | { value, more } */
  function activityFigure(row, p, data){
    if (row.none) return { none: row.desc };
    var part = data[partOf(row.key)];
    if (!part || part.state === 'loading') return { loading: true };
    if (part.state === 'error') return { error: true };
    var d = part.data;
    if (row.key === 'registrations') return { value: sumDays(d.byDay, 'registrations', p) };
    if (row.key === 'visitors') return { value: sumDays(d.byDay, 'views', p) };
    if (row.key === 'changes') return { value: d.items.length, more: !!d.next };
    /* mailers: counted only while tracking is on, and kept for 30 days */
    if (!d.available) return { none: 'Mailer tracking is not switched on yet, so no opens are counted' };
    var first = d.series.length ? String(d.series[0].date || '') : '';
    if (!first || p.from < first) return { none: 'Mailer opens are kept for the last 30 days: pick a shorter period' };
    return { value: sumDays(d.series, 'opens', p), clicks: sumDays(d.series, 'clicks', p) };
  }
  function daysAgo(day){
    var today = todayIst();
    if (!validDay(day)) return '—';
    return fmtRelativeDays(Math.round((Date.parse(today + 'T00:00:00Z') - Date.parse(day + 'T00:00:00Z')) / 86400000));
  }
  /* "3 Nov 2026, 12:30 pm", India time: RevampCore's one way of writing a moment (UX-010) */
  function whenIst(iso){ return window.RevampCore.fmtDate(iso, { time: true, ist: true }); }
  function retryHTML(key){
    return '<p class="act-empty">These figures could not be loaded.</p>' +
      '<button type="button" class="btn btn-secondary btn-sm" data-act-retry="' + key + '">Try again</button>';
  }
  /* the events with the most of it in the period, from their own window figures */
  function activityEventsTable(row, data, p){
    var field = row.key === 'registrations' ? 'registrations' : 'views';
    var lastField = row.key === 'registrations' ? 'lastRegistration' : 'lastView';
    var rows = data.insights.data.events.filter(function(e){ return e && e.window && Number(e.window[field]) > 0; })
      .sort(function(a, b){ return b.window[field] - a.window[field]; });
    var label = row.key === 'registrations' ? 'registrations' : 'visitors';
    if (!rows.length) return '<p class="act-empty">No ' + label + ' on your events ' + periodWords(p) + '.</p>';
    var more = rows.length > EVENTS_SHOWN ? '<p class="act-empty">' + fmtNum(rows.length) + ' events had ' + label + ' in this period; the ' + EVENTS_SHOWN + ' with the most are shown.</p>' : '';
    return '<div class="act-table-wrap"><table class="act-table"><thead><tr>' +
      '<th>Event</th><th>' + (row.key === 'registrations' ? 'Registrations' : 'Visitors') + '</th><th>' + (row.key === 'registrations' ? 'Last registration' : 'Last visit') + '</th><th></th>' +
    '</tr></thead><tbody>' + rows.slice(0, EVENTS_SHOWN).map(function(e){
      return '<tr>' +
        '<td class="act-event-name">' + esc(e.name || e.eventId) + '</td>' +
        '<td class="mono">' + fmtNum(e.window[field]) + '</td>' +
        '<td>' + daysAgo(e.window[lastField]) + '</td>' +
        '<td><a class="act-view-btn" href="edit-event.html?event=' + encodeURIComponent(e.eventId) + '#dashboard">Dashboard &rarr;</a></td>' +
      '</tr>';
    }).join('') + '</tbody></table></div>' + more;
  }
  /* "today", "on 2 Nov 2026", "in 26 Oct – 1 Nov 2026" */
  function periodWords(p){ return p.from === p.to ? (p.from === todayIst() ? 'today' : 'on ' + fmtDayRange(p)) : 'in ' + fmtDayRange(p); }
  function activityPanel(row, fig, data, p){
    if (fig.error) return retryHTML(row.key);
    if (fig.none) return '<p class="act-empty">' + esc(fig.none) + '.</p>' +
      (row.key === 'mailers' ? '<a class="act-view-btn" href="mailer-performance.html">Mailer performance &rarr;</a>' : '');
    if (row.key === 'registrations' || row.key === 'visitors') return activityEventsTable(row, data, p);
    if (row.key === 'mailers'){
      return '<div class="act-kpi-row">' +
        '<div class="act-kpi-tile"><div class="act-kpi-label">Opens</div><div class="act-kpi-value mono">' + fmtNum(fig.value) + '</div></div>' +
        '<div class="act-kpi-tile"><div class="act-kpi-label">Clicks</div><div class="act-kpi-value mono">' + fmtNum(fig.clicks) + '</div></div>' +
      '</div><p class="act-foot"><a class="act-view-btn" href="mailer-performance.html">Mailer performance &rarr;</a></p>';
    }
    var items = data.changes.data.items.slice(0, CHANGES_SHOWN);
    if (!items.length) return '<p class="act-empty">No changes to your events ' + periodWords(p) + '.</p>';
    return '<ul class="act-changes">' + items.map(function(it){
      return '<li><span class="act-change-what">' + (esc(it.detail) || esc(it.action) || '—') + '</span>' +
        '<span class="act-change-meta">' + esc(it.byLabel || it.by || '') + ' · ' + esc(it.eventName || it.eventId || '') + ' · ' + whenIst(it.at) + '</span></li>';
    }).join('') + '</ul>';      // "Full activity log" is the card's own button, right above
  }

  function renderActivity(){
    var rs = state.activityRange;
    $('activity-range-label').textContent = activityRangeLabel(rs);
    if (state.loading){
      $('activity-body').innerHTML = Array(5).fill(0).map(function(){ return '<div class="skel skel-line" style="height:14px;margin-bottom:16px;"></div>'; }).join('');
      return;
    }
    var p = activityPeriod(rs);
    if (!p){
      $('activity-body').innerHTML = '<p class="act-empty">That period has not started yet. Pick one that has.</p>';
      return;
    }
    watchActivityCard();
    /* until the card is near the screen every row waits, as if loading, and nothing is read */
    var data = activityInView ? activityData(p) : { insights: null, changes: null, mailers: null };
    $('activity-body').innerHTML = (p.cut ? '<p class="act-empty">These figures cover the last 365 days of that period (' + fmtDayRange(p) + ').</p>' : '') +
      '<div class="activity-accordion">' + ACTIVITY_ROWS.map(function(row){
      var fig = activityFigure(row, p, data);
      var total = fig.loading ? '<span class="skel act-total-skel" aria-hidden="true"></span><span class="sr-only">Loading</span>'
        : (fig.error || fig.none) ? '<span class="act-total-none" aria-label="No figure">—</span>'
        : '<span title="' + fmtNum(fig.value) + (fig.more ? ' or more' : '') + '">' + fmtCompact(fig.value) + (fig.more ? '+' : '') + '</span>';
      var desc = fig.error ? 'Could not be loaded. Open this row to try again' : fig.none ? fig.none : row.desc;
      var head = '<span class="activity-row-icon">' + row.icon + '</span>' +
        '<span class="activity-row-main"><span class="activity-row-label">' + row.label + '</span><span class="activity-row-desc">' + esc(desc) + '</span></span>' +
        '<span class="activity-row-total mono">' + total + '</span>';
      /* a row with nothing behind it opens nothing */
      if (row.none) return '<div class="activity-item ' + row.color + ' is-none"><div class="activity-row is-static">' + head + '<span class="activity-row-chevron" aria-hidden="true"></span></div></div>';
      var isOpen = state.activityOpenKey === row.key && !fig.loading;
      return '<div class="activity-item ' + row.color + '">' +
        '<button type="button" class="activity-row" data-act-key="' + row.key + '" aria-expanded="' + isOpen + '"' + (fig.loading ? ' aria-busy="true"' : '') + '>' + head +
          '<span class="activity-row-chevron">' + IC.chevDown + '</span>' +
        '</button>' +
        (isOpen ? '<div class="activity-panel fade-in"><div class="activity-panel-inner">' + activityPanel(row, fig, data, p) + '</div></div>' : '') +
      '</div>';
    }).join('') + '</div>';

    $('activity-body').querySelectorAll('[data-act-key]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-act-key');
        state.activityOpenKey = (state.activityOpenKey === key) ? null : key;
        renderActivity();
      });
    });
    $('activity-body').querySelectorAll('[data-act-retry]').forEach(function(btn){
      btn.addEventListener('click', function(){
        loadPart(p, partOf(btn.getAttribute('data-act-retry')));
        renderActivity();
      });
    });
  }

  /* =========================================================
     APP RENDER
  ========================================================= */
  function renderApp(){
    renderPortalView();
    renderSpecialBanner();
    renderToolbarButtons();
    renderResults();              // the Insights cards with it: they count what the list shows (renderInsights)
    renderSync();
    /* when the events could not be loaded, Latest activity is not shown either: one failed state, not a page of
       figures beside a list that says it is empty (UX-027) */
    $('lower-panels').hidden = !!state.loadFailed;
    if (!state.loadFailed) renderActivity();
  }

  /* =========================================================
     UNFINISHED IN CREATE EVENT (UX-048)
     Create Event saves each draft to the person's own account (create-drafts.js, functions/lib/create-drafts.js), so
     the Drafts tab lists them here, above the draft events, with Resume (it opens on any computer) and Discard. They
     are not events yet, so they sit in a box of their own with its own heading and words, and the tab's count adds
     them to the draft events. A draft that has already made its event says so: that event is in the list below as
     well, and stays when the draft is discarded. The working portal narrows them as it narrows the events (one with
     no portal yet, still on Create Event's first screen, is shown on every portal), and so do the search and the
     Type and Portal filters; a date filter hides them, since they have no dates yet, and says so.
  ========================================================= */
  var CDRAFTS = { state: 'idle', list: [], error: '' };     // state: idle | loading | ready | error
  var CDRAFT_TYPE = { IP: 'ip', Client: 'client', Awards: 'awards' };
  function loadCreateDrafts(){
    if (!window.RevampCreateDrafts){ CDRAFTS.state = 'error'; CDRAFTS.error = 'This page did not load completely. Reload it to see them.'; renderCreateDrafts(); return; }
    /* nothing is drawn while the first answer is awaited: most people have no unfinished draft, and an empty box that
       appears and goes would only move the list */
    if (CDRAFTS.state !== 'ready') CDRAFTS.state = 'loading';
    /* a discard that could not reach the server earlier is made first, so it is never listed again */
    RevampCreateDrafts.flushRemovals().then(function(){ return RevampCreateDrafts.list(); }).then(function(list){
      CDRAFTS.list = list; CDRAFTS.state = 'ready'; CDRAFTS.error = '';
      renderCreateDraftsAndCounts();
    }, function(err){
      CDRAFTS.state = 'error'; CDRAFTS.error = (err && err.message) || 'The server could not be reached.';
      renderCreateDraftsAndCounts();
    });
  }
  /* the box, and the Drafts tab's count and an empty list's words, which both count the box too */
  function renderCreateDraftsAndCounts(){ if (state.loading) renderCreateDrafts(); else renderResults(); }
  /* back from Create Event by the browser's Back button: the page comes from its cache, so the list is read again */
  window.addEventListener('pageshow', function(e){ if (e.persisted) loadCreateDrafts(); });
  function createDraftsOnPortal(){
    return CDRAFTS.list.filter(function(d){ var p = d.summary && d.summary.portal; return !p || state.portal === 'all' || p === state.portal; });
  }
  /* d (a list() row) against the search and the Type and Portal filters, as an event is (matches) */
  function createDraftMatches(d){
    var s = d.summary || {};
    if (state.filters.types.length && state.filters.types.indexOf(CDRAFT_TYPE[s.category] || '') === -1) return false;
    if (state.portal === 'all' && state.filters.portals.length && state.filters.portals.indexOf(s.portal || 'none') === -1) return false;
    if (state.search){
      var q = searchLine(state.search, 80).toLowerCase();
      var cells = [s.name || 'Untitled event', s.client || '', s.portal ? portalNameOf(s.portal) : 'No portal yet'];
      if (!cells.some(function(v){ return searchLine(v, 200).toLowerCase().indexOf(q) !== -1; })) return false;
    }
    return true;
  }
  /* the unfinished drafts the Drafts tab shows now; none while a date filter is on (they have no dates yet) */
  function createDraftsShown(){
    if (CDRAFTS.state !== 'ready' || state.created || state.starts) return [];
    return createDraftsOnPortal().filter(createDraftMatches);
  }
  function createDraftRow(d){
    var w = RevampCreateDrafts.describe(d, { portalName: function(slug){ return portalNameOf(slug); } });
    var href = 'create-event.html?draft=' + encodeURIComponent(d.id);
    var meta = [w.type, w.portal, w.where, w.when ? 'Last edited ' + w.when : ''].filter(Boolean).join(' · ');
    return '<li class="cdraft" data-cdraft="' + esc(d.id) + '">' +
      '<div class="cdraft-main"><a class="cdraft-name" href="' + esc(href) + '">' + esc(w.name) + '</a>' +
        '<div class="cdraft-meta">' + esc(meta) + '</div>' +
        '<div class="cdraft-meta">' + (w.eventId ? 'Its event, <span class="mono">' + esc(w.eventId) + '</span>, is already created: it is in the draft events below too.'
          : 'Not an event yet: it becomes one when you finish it in Create Event.') + '</div>' +
      '</div>' +
      '<div class="cdraft-actions"><a class="btn btn-secondary btn-sm" href="' + esc(href) + '" aria-label="Resume ' + esc(w.name) + '">Resume</a>' +
        '<button class="btn btn-ghost btn-sm" type="button" data-cdraft-discard="' + esc(d.id) + '" aria-label="Discard ' + esc(w.name) + '">Discard</button></div>' +
    '</li>';
  }
  function renderCreateDrafts(){
    var el = $('create-drafts');
    if (!el) return;
    if (state.specialView !== 'draft' || CDRAFTS.state === 'idle' || CDRAFTS.state === 'loading'){ el.innerHTML = ''; return; }
    var head = '<div class="cdrafts-head"><h2 id="cdrafts-title" tabindex="-1">Unfinished in Create Event</h2>';
    if (CDRAFTS.state === 'error'){
      el.innerHTML = '<div class="cdrafts">' + head + '</div><div class="cdrafts-error" role="alert"><span>Your unfinished Create Event drafts could not be loaded: ' + esc(CDRAFTS.error.replace(/\.$/, '')) + '. Your events below are not affected.</span>' +
        '<button class="btn btn-secondary btn-sm" type="button" id="cdrafts-retry">Try again</button></div></div>';
      $('cdrafts-retry').addEventListener('click', loadCreateDrafts);
      return;
    }
    var onPortal = createDraftsOnPortal(), shown = createDraftsShown();
    var elsewhere = CDRAFTS.list.length - onPortal.length, hidden = onPortal.length - shown.length;
    if (!CDRAFTS.list.length || (!shown.length && !elsewhere && !hidden)){ el.innerHTML = ''; return; }
    var notes = [];
    if (hidden) notes.push((state.created || state.starts)
      ? (hidden === 1 ? '1 is' : hidden + ' are') + ' not shown while a date filter is on: they have no dates yet.'
      : (hidden === 1 ? '1 does' : hidden + ' do') + ' not match the search or filters.');
    if (elsewhere) notes.push((elsewhere === 1 ? '1 more is' : elsewhere + ' more are') + ' on other portals: choose All portals to see ' + (elsewhere === 1 ? 'it' : 'them') + '.');
    el.innerHTML = '<div class="cdrafts">' + head + '<span class="tc">' + shown.length + '</span></div>' +
      '<p class="cdrafts-note">Events you started in Create Event and have not finished, saved to your account as you typed them. Resume one on any computer.' +
        (notes.length ? ' ' + notes.join(' ') : '') + '</p>' +
      (shown.length ? '<ul class="cdrafts-list">' + shown.map(createDraftRow).join('') + '</ul>' : '') +
    '</div>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-cdraft-discard]'), function(b){
      b.addEventListener('click', function(){ confirmDiscardCreateDraft(b.getAttribute('data-cdraft-discard'), b); });
    });
  }
  /* Discard asks first and names what goes (the draft, its pictures) and what stays (an event it already made). After
     it, the focus goes to the next unfinished draft, else to the box's heading, else to the search box. */
  function confirmDiscardCreateDraft(id, opener){
    var d = CDRAFTS.list.filter(function(x){ return x.id === id; })[0];
    if (!d) return;
    var w = RevampCreateDrafts.describe(d, { portalName: portalNameOf });
    openDialog({
      title: 'Discard “' + w.name + '”?',
      sub: 'Everything entered in this draft is deleted, from your account and from every computer, with its logo and pictures. This cannot be undone.',
      body: w.eventId ? '<p style="margin:0;font-size:13px;">Its event, <span class="mono">' + esc(w.eventId) + '</span>, is not deleted: it stays in your draft events.</p>' : '',
      action: 'Discard draft', danger: true, opener: opener,
      onAction: function(dlg){
        dlg.setBusy(true, 'Discarding…');
        dlg.error('');
        var ids = shownIds(), at = ids.indexOf(id);
        RevampCreateDrafts.remove(id).then(function(){
          try { RevampCreateDrafts.forgetLocal(window.localStorage, id); } catch(e){}
          CDRAFTS.list = CDRAFTS.list.filter(function(x){ return x.id !== id; });
          dlg.opener = null;
          $('sheet-root').innerHTML = '';
          renderResults();
          toast('Draft discarded: ' + w.name);
          var left = shownIds(), next = left[Math.min(at, left.length - 1)];
          var to = next ? document.querySelector('#create-drafts [data-cdraft="' + next + '"] .cdraft-name') : $('cdrafts-title');
          try { (to || $('search-input')).focus(); } catch(e){}
        }, function(err){
          dlg.setBusy(false);
          dlg.error('The draft could not be discarded: ' + String((err && err.message) || 'please try again.').replace(/\.$/, '') + '. It is still in your account.');
        });
      }
    });
    function shownIds(){ return createDraftsShown().map(function(x){ return x.id; }); }
  }

  /* =========================================================
     NEED HELP — opens the visitor's mail client addressed to Customer Care.
     No backend here, so this is a mailto: link, not an actual send.
  ========================================================= */
  var HELP_EMAIL = 'customercare@economictimesb2b.com';
  /* returnTo: the control that opened it ("Need help?", or "Email Customer Care" in ETB2B AI's panel), which gets
     the focus back when the window closes, so a keyboard user is left where they were */
  function openHelpModal(returnTo){
    var root = $('sheet-root');
    root.innerHTML = '<div class="modal-scrim" id="help-scrim"><div class="modal-card fade-in">' +
      '<div class="modal-card-head"><div><h3 id="help-title">Need help?</h3><p>Send your query about this dashboard or an event, straight to our team.</p></div>' +
        '<button class="icon-btn" id="help-close" aria-label="Close">' + IC.x + '</button></div>' +
      '<div class="modal-card-body">' +
        '<div class="email-row">' + IC.mail + '<span>' + HELP_EMAIL + '</span><button id="help-copy-email" data-tooltip="Copy address" aria-label="Copy address" type="button">' + IC.copy + '</button></div>' +
        '<div><label class="flabel" for="help-subject">Subject</label><input class="finput" id="help-subject" value="Support request — Events dashboard"></div>' +
        '<div><label class="flabel" for="help-message">Your query</label><textarea class="finput" id="help-message" placeholder="Tell us what you need help with: an event, its site, registrations, promotions…"></textarea></div>' +
      '</div>' +
      '<div class="modal-card-foot"><button class="btn btn-secondary" id="help-cancel">Cancel</button><button class="btn btn-primary" id="help-send" style="margin-left:auto;">' + IC.mail + ' Send via email</button></div>' +
    '</div></div>';
    function close(){
      root.innerHTML='';
      giveFocusBack(returnTo);
    }
    asDialog(root.querySelector('.modal-card'), 'help-title', close);
    $('help-close').addEventListener('click', close);
    $('help-cancel').addEventListener('click', close);
    $('help-scrim').addEventListener('click', function(e){ if (e.target===$('help-scrim')) close(); });
    $('help-copy-email').addEventListener('click', function(){
      if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(HELP_EMAIL).then(function(){ toast('Email address copied'); }).catch(function(){ toast(HELP_EMAIL, 'info'); }); }
      else toast(HELP_EMAIL, 'info');
    });
    $('help-send').addEventListener('click', function(){
      var subject = $('help-subject').value.trim() || 'Support request — Events dashboard';
      var message = $('help-message').value.trim();
      if (!message){ toast('Add a quick note so our team knows what you need.', 'error'); return; }
      var mailto = 'mailto:' + HELP_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(message);
      window.location.href = mailto;
      toast('Opening your email app…', 'info');
      close();
    });
    /* the window is where the keyboard is now (its controls were behind the page before) */
    try { $('help-message').focus(); } catch(e){}
  }
  $('btn-help').addEventListener('click', function(){ openHelpModal($('btn-help')); });
  $('venue-quickview').addEventListener('mouseenter', cancelCloseQV);
  $('venue-quickview').addEventListener('mouseleave', scheduleCloseQV);

  /* =========================================================
     THE LIST'S ONE DOOR FOR ETB2B AI — window.RvListing (dash-bot-client.js uses nothing else on this page)
     The bot changes what the list shows and can put it back exactly ("do it, then undo"); it reads no figure
     from here: every fact it states comes from its server. Nothing in here deletes, cancels, publishes or
     changes an event.
  ========================================================= */
  /* updated: Last edited (UX-037), so an Undo puts a list sorted that way back as it was */
  var LISTING_SORTS = { start:1, updated:1, registrations:1, visitors:1 };
  function listingMe(){
    var u = null;
    try { u = window.RevampAuth && typeof window.RevampAuth.currentUser === 'function' ? window.RevampAuth.currentUser() : null; } catch(e){}
    return { email: u && u.email ? String(u.email) : '', name: u && u.displayName ? String(u.displayName) : '' };
  }
  /* A deep copy of what decides the list, put back by restore(). Read only: "shown" (how many events match),
     "portal" (the portal scope the list shows: a roster slug, 'none' for the events with no portal yet, '' for every
     portal; one value in the Portal filter of All portals counts as that one) and "working" (the portal the person
     works in, saved for them: a slug or 'all'). listPortal and portalReturn are the list's own portal state, which
     restore() puts back while the working portal is unchanged. ETB2B AI's answers and lists follow "portal". */
  function listScope(){
    if (state.portal !== 'all') return state.portal;
    return state.filters.portals.length === 1 ? state.filters.portals[0] : '';
  }
  function listingSnapshot(){
    return JSON.parse(JSON.stringify({
      tab: state.tab, specialView: state.specialView, search: state.search, filters: state.filters,
      created: state.created, starts: state.starts, mine: state.mine, sort: state.sort, page: state.page, view: state.view,
      portal: listScope(),
      working: workingPortal(), listPortal: state.portal, portalReturn: state.portalReturn,
      shown: state.loading ? 0 : getFilteredSorted().length
    }));
  }
  /* a portal scope ETB2B AI may put the list on: 'all', 'none' or a portal on ET's roster (any slug's shape until
     the roster has come, as the Portal filter takes it) */
  function scopeOk(v){ return v === 'all' || v === 'none' || (typeof v === 'string' && /^[a-z0-9]{1,40}$/.test(v) && (rosterState !== 'ready' || onRoster(v))); }
  /* The list on a portal scope, WITHOUT moving the portal the person works in: their own portal is shown as it
     is; any other portal (or the events with no portal yet) is looked at "for now" over every portal, as "Show
     them" does, with the notice's way back; every portal is All portals, or a look at every portal for now. */
  function showScope(v){
    var working = workingPortal();
    if (v === working){ state.portal = working; state.portalReturn = ''; state.filters.portals = []; return; }
    state.portalTouched = true;
    state.portalReturn = working === 'all' ? '' : working;
    state.portal = 'all';
    state.filters.portals = v === 'all' ? [] : [v];
  }
  /* only the keys this page knows, once each (a snapshot may come back from the tab's storage) */
  function knownKeys(list, table){
    var out = [];
    (Array.isArray(list) ? list : []).forEach(function(t){ if (typeof t === 'string' && Object.prototype.hasOwnProperty.call(table, t) && out.indexOf(t) === -1) out.push(t); });
    return out;
  }
  function knownTypes(list){ return knownKeys(list, EVENT_TYPES); }
  /* the Portal filter's values: 'none' (no portal yet) and a roster slug, once each; until the roster has come, any
     value of a slug's shape (matches() reads the filter only in All portals, and a slug no event has hides nothing
     that a chip does not name) */
  function knownPortalFilters(list){
    var out = [];
    (Array.isArray(list) ? list : []).forEach(function(v){
      if (typeof v !== 'string' || out.indexOf(v) !== -1) return;
      if (v === 'none' || (/^[a-z0-9]{1,40}$/.test(v) && (rosterState !== 'ready' || onRoster(v)))) out.push(v);
    });
    return out;
  }
  /* Puts the list on ETB2B AI's view: {view, search, types, mine, created, starts, sort[, portal]}. The list then
     shows exactly what the bot's card says, so a filter it does not name (a portal pick) is cleared
     too; a missing view or sort keeps the current one. portal, when given, is the portal scope to show
     (showScope, which never moves the portal the person works in). Returns the list as it was before, for Undo. */
  function listingApply(patch){
    var before = listingSnapshot();
    var p = patch && typeof patch === 'object' ? patch : {};
    /* the list's own move between tabs (setBucket), so a sort left as it was follows the new list's default */
    if (['active','upcoming','completed','draft','cancelled'].indexOf(p.view) !== -1) setBucket(p.view);
    state.search = typeof p.search === 'string' ? p.search.trim().slice(0, 80) : '';
    state.filters = { types: knownTypes(p.types), portals: [], payment: [] };
    if (scopeOk(p.portal)) showScope(p.portal);
    state.mine = p.mine === true;
    state.created = cleanRange(p.created);
    state.starts = cleanRange(p.starts);
    if (p.sort && LISTING_SORTS[p.sort.field]) state.sort = { field: p.sort.field, dir: p.sort.dir === 'desc' ? 'desc' : 'asc' };
    state.page = 1;
    closeAll(); showSearch();
    renderApp(); syncHash();
    scrollResultsIntoView();
    return before;
  }
  /* The list exactly as a snapshot had it: tab, view, search, filters, sort, page, list / cards, and the portal it
     was looking at while the person still works in the same portal. The portal they work in is their saved choice
     (the switcher): it is moved back only with opts.portal, which dash-bot-client.js passes when the Undo takes
     back a switch ETB2B AI itself made ("switch to ETAuto"). */
  function listingRestore(snap, opts){
    if (!snap || typeof snap !== 'object') return false;
    if (opts && opts.portal === true && (snap.working === 'all' || (scopeOk(snap.working) && snap.working !== 'none')) && snap.working !== workingPortal()) switchPortal(snap.working);
    if (typeof snap.working === 'string' && snap.working === workingPortal() && (snap.listPortal === 'all' || snap.listPortal === snap.working)){
      state.portal = snap.listPortal;
      state.portalReturn = state.portal === 'all' && snap.working !== 'all' ? snap.working : '';
    }
    var f = snap.filters && typeof snap.filters === 'object' ? snap.filters : {};
    state.tab = ['active','upcoming','completed'].indexOf(snap.tab) !== -1 ? snap.tab : 'active';
    state.specialView = ['draft','cancelled','deleted'].indexOf(snap.specialView) !== -1 ? snap.specialView : null;
    state.search = typeof snap.search === 'string' ? snap.search : '';
    state.filters = { types: knownTypes(f.types), portals: knownPortalFilters(f.portals), payment: [] };
    state.created = cleanRange(snap.created);
    state.starts = cleanRange(snap.starts);
    state.mine = snap.mine === true;
    if (snap.sort && LISTING_SORTS[snap.sort.field]) state.sort = { field: snap.sort.field, dir: snap.sort.dir === 'desc' ? 'desc' : 'asc' };
    state.page = Math.max(1, parseInt(snap.page, 10) || 1);
    state.view = snap.view === 'grid' ? 'grid' : 'list';
    closeAll(); showSearch(); applyView();
    renderApp(); syncHash();
    return true;
  }
  /* After a change the top of the list comes into view: the search box, the chips and the status tabs above
     the table say what is being shown, so scrolling to the table itself would hide exactly that. */
  function scrollResultsIntoView(){
    var reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch(e){}
    try { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); } catch(e){ try { window.scrollTo(0, 0); } catch(e2){} }
  }
  var listingReadyDone = null;
  var listingReady = new Promise(function(resolve){ listingReadyDone = resolve; });
  function markListingReady(){ if (listingReadyDone){ listingReadyDone(); listingReadyDone = null; } }
  /* ETB2B AI's "switch to ETAuto": the switcher's own switchPortal (saved for the person). -> the list as it was
     before (with the portal worked in then), for Undo, or null when that portal is not one to switch to */
  function listingSetPortal(v){
    if (v !== 'all' && !(typeof v === 'string' && /^[a-z0-9]{1,40}$/.test(v))) return null;
    var before = listingSnapshot();
    if (!switchPortal(v)) return null;
    syncHash();
    scrollResultsIntoView();
    return before;
  }
  window.RvListing = {
    snapshot: listingSnapshot,
    apply: listingApply,
    restore: listingRestore,
    setPortal: listingSetPortal,
    openHelp: function(returnTo){ openHelpModal(returnTo); },
    me: listingMe,
    /* settles once the first load of the events has finished, or failed */
    ready: function(){ return listingReady; }
  };

  /* The real network fetch (GET /api/events) that replaces the old synchronous mock/localStorage data —
     unlike those, this can genuinely fail (not signed in yet, token expired, offline, server error), so
     this is also the retry target handed to renderErrorBanner() below. */
  function loadAndRender(){
    $('error-slot').innerHTML = '';
    state.loading = true;
    state.loadFailed = null;
    forgetActivity();             // a reload (or Try again) reads the activity figures afresh too
    renderApp();
    /* the first list also waits (at most 3 s, and only when this browser remembers nothing) for the working portal */
    Promise.all([loadEvents(), portalWait]).then(function(got){
      var rows = got[0];
      EVENTS.length = 0;
      rows.forEach(function(row){ EVENTS.push(row); });
      state.loading = false;
      state.loadedAt = Date.now();
      landingTab();
      renderApp();
      markListingReady();
    }).catch(function(err){
      /* one failed state where the list would be, worded by its cause, with Try again; no counts, no figures and no
         "Create your first event" beside it, so nobody thinks their events are gone (UX-027) */
      state.loading = false;
      state.loadFailed = { status: Number(err && err.status) || 0, offline: !!(window.navigator && window.navigator.onLine === false), message: String((err && err.message) || '') };
      EVENTS.length = 0;
      renderApp();
      markListingReady();
      console.warn('[Event Listing] Could not load events: ' + (err && err.message));
    });
  }
  /* back online after a failed load: load again by itself */
  window.addEventListener('online', function(){ if (state.loadFailed) loadAndRender(); });

  function init(){
    try {
      wireSortHeaders();
      wireViewToggle();
      applyView();
      startPortals();
      loadAndRender();
      loadApprovers();
      loadCreateDrafts();
    } catch(err){
      renderErrorBanner(init);
      markListingReady();
    }
  }
  init();

})();
</script>
<!-- ETB2B AI: the chat kit, then this page's side of the bot (it reaches the list only through window.RvListing) -->
<script src="etb2b-chat.js"></script>
<script src="dash-bot-client.js"></script>
</body>
