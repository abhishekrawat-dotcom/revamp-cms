<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Payments - Payment Prototype</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .approve-row { display: flex; gap: 8px; }
    .btn-ghost { background: transparent; border: 1px solid transparent; color: var(--c-secondary); cursor: pointer; transition: all 0.2s; padding: 6px 12px; border-radius: 8px; font-weight: 500; font-size: 13px; }
    .btn-ghost:hover { background: var(--bg-main); color: var(--danger); }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="header-container"></div>
    <div class="main-content">
      <div class="fade-in">
        <div style="margin-bottom:24px;">
          <div style="font-size:24px; font-weight:700;">Offline Payments</div>
          <div style="color:var(--c-secondary); font-size:14px; margin-top:4px;">Bank transfers and NEFT/RTGS payments pending manual approval</div>
        </div>

        <div class="toolbar" id="status-filters">
          <button class="chip active" onclick="setOfflineTab('Pending')">Pending</button>
          <button class="chip" onclick="setOfflineTab('Approved')">Approved</button>
          <button class="chip" onclick="setOfflineTab('Rejected')">Rejected</button>
        </div>

        <div class="table-container" id="offline-table-container"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="sidebar.js"></script>
  <script>
    let currentTab = 'Pending';

    document.addEventListener("DOMContentLoaded", () => {
      renderHeader("Offline Payments");
      renderOfflinePayments();
    });

    function setOfflineTab(status) {
      currentTab = status;
      const buttons = document.querySelectorAll('#status-filters .chip');
      buttons.forEach(btn => {
        if (btn.innerText === status) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      renderOfflinePayments();
    }

    function changeOfflineStatus(id, newStatus) {
      const offline = window.appData.offline;
      const item = offline.find(o => o.id === id);
      if (item) {
        item.status = newStatus;
        if (newStatus === 'Rejected') {
          item.reason = prompt("Reason for rejection:") || "UTR mismatch";
        }
        window.saveData('offline', offline);
        renderOfflinePayments();
      }
    }

    function renderOfflinePayments() {
      const offline = window.appData.offline.filter(o => o.status === currentTab);
      const container = document.getElementById('offline-table-container');
      
      if (offline.length === 0) {
        container.innerHTML = `
          <div style="padding:40px; text-align:center; color:var(--c-secondary);">
            <i class="ti ti-building-bank" style="font-size:32px; margin-bottom:12px;"></i>
            <div>No ${currentTab.toLowerCase()} transactions.</div>
          </div>
        `;
        return;
      }

      const getPillClass = (status) => {
        const map = { Approved:"pill-success", Rejected:"pill-danger", Pending:"pill-warning" };
        return map[status] || "pill-neutral";
      };

      let html = `
        <table>
          <thead>
            <tr><th>ID</th><th>Client</th><th>Amount</th><th>UTR</th><th>Date</th><th>Status</th><th></th></tr>
          </thead>
          <tbody>
            ${offline.map(o => `
              <tr>
                <td class="mono">${o.id}</td>
                <td style="font-weight:600">${o.client}</td>
                <td style="font-weight:600; color:var(--brand-color)">${window.utils.fmtCurrency(o.amount)}</td>
                <td class="mono">${o.utr}</td>
                <td style="color:var(--c-secondary)">${window.utils.fmtDate(o.date)}</td>
                <td>
                  <span class="spill ${getPillClass(o.status)}">
                    <span class="pill-dot"></span>${o.status}
                  </span>
                </td>
                <td>
                  ${o.status === 'Pending' ? `
                    <div class="approve-row">
                      <button class="btn-secondary btn-sm" onclick="changeOfflineStatus('${o.id}', 'Approved')">Approve</button>
                      <button class="btn-ghost btn-sm" onclick="changeOfflineStatus('${o.id}', 'Rejected')">Reject</button>
                    </div>
                  ` : ''}
                  ${o.status === 'Rejected' && o.reason ? `<div style="color:var(--danger); font-size:12px; margin-top:4px;">${o.reason}</div>` : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      container.innerHTML = html;
    }
  </script>
</body>
</html>
