<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Invoice - Payment Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../../motion.css">
  <style>
    .doc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .doc-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .doc-card-icon { width: 40px; height: 40px; border-radius: 8px; background: var(--brand-light); color: var(--brand-color); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .doc-card-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .doc-card-meta { font-size: 12px; color: var(--c-secondary); }
  </style>
</head>
<body>
  <header class="topbar" id="header-container"></header>
  <div class="shell">
    <nav class="rail" id="sidebar-container" aria-label="Sections"></nav>
    <div class="main main-content">
      <div class="fade-in">
        <div style="margin-bottom:24px;">
          <div style="font-size:24px; font-weight:700;">Tax Invoices</div>
          <div style="color:var(--c-secondary); font-size:14px; margin-top:4px;">Generated tax invoices linked to successful transactions</div>
        </div>

        <div id="tax-cards-container" class="doc-cards"></div>
        <div class="table-container" id="tax-table-container"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="../../edit-event-core.js"></script>
  <script src="../../app-shell.js"></script>
  <script src="sidebar.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      /* the top bar comes from app-shell.js now */
      renderTaxInvoices();
    });

    function renderTaxInvoices() {
      const invoices = window.appData.invoices;
      const cardsContainer = document.getElementById('tax-cards-container');
      const tableContainer = document.getElementById('tax-table-container');
      
      if (invoices.length === 0) {
        cardsContainer.innerHTML = '';
        tableContainer.innerHTML = `
          <div style="padding:40px; text-align:center; color:var(--c-secondary);">
            <i class="ti ti-file-invoice" style="font-size:32px; margin-bottom:12px;"></i>
            <div>No tax invoices generated yet.</div>
          </div>
        `;
        return;
      }

      cardsContainer.innerHTML = invoices.slice(0, 3).map(inv => `
        <div class="doc-card">
          <div style="display:flex; align-items:flex-start; gap:12px;">
            <div class="doc-card-icon"><i class="ti ti-file-text"></i></div>
            <div style="flex:1">
              <div class="doc-card-name">${inv.invoiceNo}</div>
              <div class="doc-card-meta">Txn: ${inv.txnId} · ${inv.time}</div>
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-size:18px; font-weight:800; color:var(--c-primary)">${window.utils.fmtCurrency(inv.amountPaid)}</div>
              <div style="font-size:11px; color:var(--success); margin-top:2px;">Fully paid</div>
            </div>
            <button class="btn-secondary btn-sm" onclick="alert('Downloading ${inv.invoiceNo}')"><i class="ti ti-download"></i> Download</button>
          </div>
        </div>
      `).join('');

      tableContainer.innerHTML = `
        <table>
          <thead>
            <tr><th>Txn ID</th><th>Invoice No.</th><th>Generated At</th><th>Amount Due</th><th>Amount Paid</th><th></th></tr>
          </thead>
          <tbody>
            ${invoices.map(i => `
              <tr>
                <td class="mono">${i.txnId}</td>
                <td class="mono" style="font-weight:600">${i.invoiceNo}</td>
                <td style="color:var(--c-secondary)">${i.time}</td>
                <td style="font-weight:600; color:var(--brand-color)">${window.utils.fmtCurrency(i.amountDue)}</td>
                <td style="font-weight:600; color:var(--success)">${window.utils.fmtCurrency(i.amountPaid)}</td>
                <td><button class="btn-secondary btn-sm" onclick="alert('Downloading ${i.invoiceNo}')"><i class="ti ti-download"></i> Download</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
