<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment — ET Events</title>
  <meta name="description" content="ET Events Payment Management — Inside-Event View">
  <!-- Tabler Icons (CMS relies heavily on SVGs, but we'll use Tabler for our modals for now to match our logic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../../motion.css">
</head>
<body>

  <!-- Topbar rendered by JS -->
  <header class="topbar" id="header-container"></header>

  <div class="shell">
    <!-- Sidebar rendered by JS -->
    <nav class="rail" id="sidebar-container" aria-label="Sections"></nav>

    <!-- Main content rendered by JS -->
    <main class="main" id="app-content"></main>
  </div>

  <!-- ═══════════════════════════════════════════
       CREATE COUPON MODAL (single declaration)
  ═══════════════════════════════════════════ -->
  <div class="modal-backdrop" id="add-coupon-modal" style="display:none;" onclick="if(event.target===this) closeAddCouponModal()">
    <div class="modal" style="width: 500px;" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h3 class="modal-title">Create Coupon</h3>
          <p class="modal-subtitle" id="coupon-modal-subtitle">Discount coupon for Payment Page</p>
        </div>
        <button class="btn-icon" onclick="closeAddCouponModal()" aria-label="Close"><i class="ti ti-x"></i></button>
      </div>

      <div class="modal-body">
        <div class="form-col">

          <div class="form-section">
            <div class="form-section-header"><span class="fsec-title">Applicability</span></div>
            <label class="field">
              <span class="field-label">Apply this coupon to:</span>
              <div id="coupon-pages-checkboxes" style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
                <!-- Filled dynamically -->
              </div>
            </label>
          </div>

          <div class="form-section">
            <div class="form-section-header"><span class="fsec-title">Quick Templates</span></div>
            <div class="subtabs" id="coupon-templates" style="margin-bottom:0; border-bottom:none;">
              <button class="active" onclick="applyCouponTemplate('earlybird', this)">Early Bird</button>
              <button onclick="applyCouponTemplate('bogo', this)">Buy 1 Get 1</button>
              <button onclick="applyCouponTemplate('buy2get1', this)">Buy 2 Get 1</button>
              <button onclick="applyCouponTemplate('custom', this)">Custom</button>
            </div>
          </div>

          <div class="form-section" style="margin-top: 16px;">
            <div class="form-section-header"><span class="fsec-title">Coupon Details</span></div>
            <label class="field">
              <span class="field-label">Label <span class="req">*</span></span>
              <input type="text" id="coupon-label" placeholder="e.g. Early Bird">
            </label>
            <label class="field" style="margin-top:8px;">
              <span class="field-label">Coupon Code / Tracking Name</span>
              <div class="code-display-row">
                <select id="coupon-code" style="background:transparent; border:none; outline:none; font-family:var(--font-mono); font-size:14px; font-weight:700; letter-spacing:1.5px; color:var(--text); width:100%; cursor:pointer;">
                  <option value="AUTO_APPLIED">AUTO_APPLIED</option>
                </select>
                <button class="btn-regen" onclick="regenerateCouponCode()" title="Regenerate code"><i class="ti ti-refresh"></i></button>
              </div>
              <span class="field-hint" id="coupon-type-hint">Applied automatically — no code entry needed.</span>
            </label>
          </div>

          <div class="form-section">
            <div class="form-section-header"><span class="fsec-title">Type</span></div>
            <div class="seg">
              <button class="seg-btn active" id="btn-type-auto" onclick="setCouponType('auto')"><i class="ti ti-bolt"></i> Auto-applied</button>
              <button class="seg-btn" id="btn-type-code" onclick="setCouponType('code')"><i class="ti ti-tag"></i> Code-based</button>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-header"><span class="fsec-title">Checkout Display</span></div>
            <label class="checkline" style="margin-bottom:8px; display: flex; align-items: center; gap: 8px;">
              <input type="checkbox" id="coupon-show-desc" checked onchange="document.getElementById('coupon-desc-field').style.display = this.checked ? 'block' : 'none'">
              <span style="font-size: 13px; color: var(--text);">Show description on checkout card (Auto-applied only)</span>
            </label>
            <label class="field" id="coupon-desc-field">
              <span class="field-label">Description text</span>
              <input type="text" id="coupon-desc-text" placeholder="e.g. 20% Early Bird Off applied automatically">
            </label>
          </div>

          <div class="form-section">
            <div class="form-section-header"><span class="fsec-title">Discount</span></div>
            <div class="two-col">
              <label class="field">
                <span class="field-label">Type</span>
                <select id="coupon-discount-type" onchange="updateDiscountLabel(); window.updateCouponDesc()">
                  <option value="percent">Percentage (%)</option>
                  <option value="flat">Flat amount (₹)</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label" id="discount-val-label">Percentage (max 30%) <span class="req">*</span></span>
                <input type="number" id="coupon-discount" placeholder="15" oninput="checkDiscountWarning(); window.updateCouponDesc()">
              </label>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-header"><span class="fsec-title">Validity</span></div>
            <div class="two-col">
              <label class="field">
                <span class="field-label">Validity Start</span>
                <input type="datetime-local" id="coupon-start">
              </label>
              <label class="field">
                <span class="field-label">Run this offer till <span class="req">*</span></span>
                <input type="datetime-local" id="coupon-end">
              </label>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-header"><span class="fsec-title">Usage Limits</span></div>
            <div class="two-col">
              <label class="field">
                <span class="field-label">Minimum tickets required</span>
                <input type="number" id="coupon-min-qty" placeholder="e.g. 2">
                <span class="field-hint">Coupon applies if order has at least X tickets.</span>
              </label>
              <label class="field">
                <span class="field-label">Max total redemptions</span>
                <input type="number" id="coupon-max-uses" placeholder="Unlimited">
              </label>
            </div>
            <label class="field" style="margin-top: 12px;">
              <span class="field-label">Max per user</span>
              <input type="number" id="coupon-max-user" value="1">
            </label>
          </div>

          <div id="coupon-warning" class="callout warn-box" style="display:none;">
            <i class="ti ti-alert-triangle" style="font-size:18px;flex-shrink:0;margin-top:1px;"></i>
            <span>Discounts above 30% will be sent to Finance for approval.</span>
          </div>

          <div id="coupon-error" class="form-error" style="display:none;"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeAddCouponModal()">Cancel</button>
        <button class="btn btn-primary" id="btn-save-coupon" onclick="saveCoupon()">Activate Coupon</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       PAGE PREVIEW MODAL
  ═══════════════════════════════════════════ -->
  <div class="drawer-backdrop" id="page-preview-modal" style="display:none; justify-content:center; align-items:center; z-index:9999; padding:20px;" onclick="if(event.target===this) document.getElementById('page-preview-modal').style.display='none'">
    <div style="background:var(--surface); border-radius:24px; width:100%; max-width:400px; position:relative; overflow:hidden; border:1px solid var(--border);">
      <button class="btn-icon" style="position:absolute; top:12px; right:12px; z-index:10; background:rgba(0,0,0,0.5); color:#fff; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center;" onclick="document.getElementById('page-preview-modal').style.display='none'"><i class="ti ti-x"></i></button>
      <div class="preview-mockup" style="margin:0; box-shadow:none;">
        <div class="mockup-body" style="padding:24px; padding-bottom:32px;">
          <div class="mockup-title" id="pm-page-name">Page Name</div>
          <div class="mockup-price" id="pm-price" style="margin-bottom:4px;"></div>
          <div id="pm-gst" style="font-size:11px;color:rgba(255,255,255,0.55);text-align:center;margin-bottom:4px;min-height:0"></div>
          <div id="pm-price-note" style="text-align:center;font-size:11px;color:rgba(255,255,255,0.55);margin-bottom:4px;font-style:italic;min-height:0"></div>
          <div id="pm-desc-container" style="margin-top:16px;"></div>
          <div class="mockup-divider" style="margin:20px 0"></div>
          <div class="mockup-btn-wrap" id="pm-btn-wrap">
            <div class="mockup-coupon-box" id="pm-coupon-box" style="display:none"></div>
            <button class="mockup-btn">Reserve My Seat</button>
          </div>
          <div id="pm-button-note" style="text-align:center;font-size:11px;color:rgba(255,255,255,0.55);min-height:0"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       TOAST HOST
  ═══════════════════════════════════════════ -->
  <div class="toast-host" id="toast-host"></div>

  <script src="data.js"></script>
  <script src="../../edit-event-core.js"></script>
  <script src="../../app-shell.js"></script>
  <script src="sidebar.js"></script>
  <script src="index.js"></script>
</body>
</html>
