<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promotions - Revamp CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="edit-event.css">
  <link rel="stylesheet" href="motion.css">
  <style>
    body{background:var(--bg);overflow-x:hidden}
    .marketing-page{display:flex;align-items:flex-start;min-height:calc(100vh - var(--topbar-h))}
    .marketing-main{flex:1;min-width:0;padding:0 28px 60px}
    .marketing-tabs{display:flex;gap:28px;border-bottom:1px solid var(--border);margin:0 0 31px;white-space:nowrap;overflow-x:auto}
    .marketing-tabs button{position:relative;border:0;background:none;padding:20px 0 14px;color:var(--text-muted);font-size:15px;font-weight:700;cursor:pointer}
    .marketing-tabs button[aria-selected="true"]{color:var(--accent-strong)}
    .marketing-tabs button[aria-selected="true"]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);border-radius:3px}
    .marketing-tabs small{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-left:4px}
    .marketing-view{max-width:1500px;margin:0 auto}
    @media(max-width:760px){.marketing-main{padding:0 14px 40px}.marketing-tabs{gap:20px}}
  </style>
</head>
<body>
<!-- top bar and rail are rendered by app-shell.js — same markup on every section -->
<header class="topbar" id="topbar"></header>
<div class="marketing-page">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="marketing-main"><div class="marketing-view" id="page"></div></main>
</div>
<div class="toast-host" id="toast-host"></div>
<script src="edit-event-core.js"></script>
<script src="edit-event-marketing.js"></script>
<script src="app-shell.js"></script>
<script>
(function(){
  'use strict';
  var C=window.RevampCore, MKT=window.EditEventMarketing, page=document.getElementById('page');
  var query=new URLSearchParams(location.search), tab=query.get('tab')||'studio';
  var EV=C.eventById(query.get('event'))||C.EVENTS[0];

  window.RevampShell.mount({ section:'marketing', eventId:EV.id });

  function ctx(){
    var S=C.loadState('revamp-edit-event-'+EV.id);
    return C.makeCtx({EV:EV,S:S,PEOPLE:C.makePeople(EV),vhead:function(title,sub,right){return '<h2 class="sr-only">'+C.esc(title)+(sub?'. '+C.esc(sub):'')+'</h2>'+(right?'<div class="page-acts">'+right+'</div>':'');},save:function(){ C.saveState('revamp-edit-event-'+EV.id, S); },go:function(route){location.href='marketing.html?event='+EV.id+'&tab='+route;}});
  }
  function tabs(){return '<div class="marketing-tabs">'+MKT.TABS.map(function(item){return '<button type="button" data-tab="'+item.id+'" aria-selected="'+(item.id===tab)+'">'+item.label+'</button>';}).join('')+'</div>';}
  function render(){
    /* one ctx for both calls — view() and wire() have to share the same state
       object or a wired change lands on a copy nothing is rendering from */
    var c=ctx();
    page.innerHTML=tabs()+'<div class="marketing-view-body">'+MKT.view(tab,c)+'</div>';
    MKT.wire(tab,c);
    document.querySelectorAll('[data-tab]').forEach(function(button){button.onclick=function(){tab=button.getAttribute('data-tab');history.replaceState(null,'','marketing.html?event='+EV.id+'&tab='+tab);render();};});
    document.querySelectorAll('[data-save]').forEach(function(button){button.onclick=function(){C.toast(button.getAttribute('data-save'));};});
  }
  render();
})();
</script>
</body>
</html>
