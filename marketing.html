<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing - Revamp CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="edit-event.css">
  <style>
    body{background:var(--bg);overflow-x:hidden}
    .marketing-page{display:flex;min-height:calc(100vh - var(--topbar-h))}
    .marketing-main{flex:1;min-width:0;padding:0 28px 60px}
    .event-picker{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:var(--text-muted)}
    .event-picker select{min-width:210px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}
    .marketing-tabs{display:flex;gap:28px;border-bottom:1px solid var(--border);margin:0 0 31px;white-space:nowrap;overflow-x:auto}
    .marketing-tabs button{position:relative;border:0;background:none;padding:20px 0 14px;color:var(--text-muted);font-size:15px;font-weight:700;cursor:pointer}
    .marketing-tabs button[aria-selected="true"]{color:var(--accent-strong)}
    .marketing-tabs button[aria-selected="true"]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);border-radius:3px}
    .marketing-tabs small{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-left:4px}
    .marketing-view{max-width:1500px;margin:0 auto}
    @media(max-width:760px){.marketing-main{padding:0 14px 40px}.topbar{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 14px}.event-picker{width:100%;margin-left:0}.event-picker select{flex:1}.marketing-tabs{gap:20px}}
  </style>
</head>
<body>
<header class="topbar">
  <a class="back-btn" href="Event_Listing.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Back to events</a>
  <span class="ev-title"><h1 id="event-name">&nbsp;</h1><span class="meta" id="event-meta"></span></span>
  <label class="event-picker" for="event-select">Event <select id="event-select"></select></label>
</header>
<div class="marketing-page">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="marketing-main"><div class="marketing-view" id="page"></div></main>
</div>
<div class="toast-host" id="toast-host"></div>
<script src="edit-event-core.js"></script>
<script src="edit-event-marketing.js"></script>
<script src="sidebar.js"></script>
<script>
(function(){
  'use strict';
  var C=window.RevampCore, MKT=window.EditEventMarketing, select=document.getElementById('event-select'), page=document.getElementById('page');
  var query=new URLSearchParams(location.search), tab=query.get('tab')||'banners';
  select.innerHTML=C.EVENTS.map(function(e){return '<option value="'+e.id+'">'+C.esc(e.name)+'</option>';}).join('');
  select.value=query.get('event')||C.EVENTS[0].id;
  function event(){return C.eventById(select.value)||C.EVENTS[0];}
  function ctx(ev){
    return C.makeCtx({EV:ev,S:C.loadState('revamp-edit-event-'+ev.id),PEOPLE:C.makePeople(ev),vhead:function(title,sub,right){return '<div class="vhead"><div class="vhead-row"><div class="grow"><div class="crumb">Marketing › '+C.esc((MKT.TABS.filter(function(t){return t.id===tab;})[0]||MKT.TABS[0]).label)+'</div><h2>'+C.esc(title)+'</h2>'+(sub?'<div class="sub">'+C.esc(sub)+'</div>':'')+'</div>'+(right?'<div style="display:flex;gap:9px;flex-wrap:wrap">'+right+'</div>':'')+'</div></div>';},save:function(){},go:function(route){location.href='marketing.html?event='+ev.id+'&tab='+route;}});
  }
  function header(ev){document.getElementById('event-name').textContent=ev.name+' | '+(C.PORTALS[ev.portal]||'');document.getElementById('event-meta').textContent=C.fmtDT(ev.start)+'  |  '+ev.eventNo+'  |  '+(C.TYPES[ev.type]||ev.type);}
  function rail(){renderEventRail('rail',{activeSection:'marketing',onSection:function(section){if(section==='dashboard'){location.href='dashboard.html';return;}if(section==='audience'){location.href='audience-registrations.html?event='+encodeURIComponent(select.value);return;}if(section==='design'){location.href='custom_editor.html?event='+encodeURIComponent(select.value);return;}if(section==='payment'){location.href='edit-event.html?event='+encodeURIComponent(select.value)+'#audience/payments';return;}if(section==='marketing')return;location.href='edit-event.html?event='+encodeURIComponent(select.value)+'#'+section;}});}
  function tabs(){return '<div class="marketing-tabs">'+MKT.TABS.map(function(item){return '<button type="button" data-tab="'+item.id+'" aria-selected="'+(item.id===tab)+'">'+item.label+'</button>';}).join('')+'</div>';}
  function render(){var ev=event();header(ev);rail();page.innerHTML=tabs()+'<div class="marketing-view-body">'+MKT.view(tab,ctx(ev))+'</div>';MKT.wire(tab,ctx(ev));document.querySelectorAll('[data-tab]').forEach(function(button){button.onclick=function(){tab=button.getAttribute('data-tab');history.replaceState(null,'','marketing.html?event='+select.value+'&tab='+tab);render();};});document.querySelectorAll('[data-save]').forEach(function(button){button.onclick=function(){C.toast(button.getAttribute('data-save'));};});}
  select.onchange=function(){tab='banners';history.replaceState(null,'','marketing.html?event='+select.value+'&tab='+tab);render();};
  render();
})();
</script>
</body>
</html>
