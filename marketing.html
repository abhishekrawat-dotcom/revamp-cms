<style>
  /* The date line and, while the event has no portal, "No portal yet" with Set portal beside it (paintHeader),
     as in the event console. Only the console's tokens, so it follows the light and dark switch. On a phone or a
     narrow window the top bar has room for the button alone: the date line and the chip's label give way to a
     button of the same words. */
  .ev-title .ev-sub{ display:flex; align-items:center; gap:8px; min-width:0; margin-top:1px; }
  /* the date line gives way first; the chip only when there is no room left at all, and it is then cut off rather
     than drawn over the buttons beside it (its padding keeps room for a focus ring) */
  .ev-title .ev-sub .meta{ min-width:0; flex:0 1000 auto; margin-top:0; }
  .ev-title .ev-portal{ display:inline-flex; align-items:center; flex:0 1 auto; min-width:0; overflow:hidden; padding:4px; margin:-4px; }
  .ev-title .ev-portal[hidden]{ display:none; }
  .ev-portal-wide{ display:inline-flex; align-items:center; gap:6px; }
  .ev-portal-mini{ display:none; align-items:center; min-height:24px; padding:3px 9px; border-radius:999px; cursor:pointer;
    border:1px solid var(--border); background: var(--surface); color: var(--text); font-size:11.5px; font-weight:700;
    line-height:1.2; white-space:nowrap; }
  .ev-portal-mini:hover, .ev-portal-mini:focus-visible{ border-color: var(--accent); }
  @media (max-width: 680px){
    .ev-title .ev-sub.has-portal-chip .meta{ display:none; }
    .ev-portal-wide{ display:none; }
    .ev-portal-mini{ display:inline-flex; }
  }
</style>
<!-- a block of its own: the one above is the event console's header rules, kept identical to edit-event.html's -->
<style>
  /* the line under the tabs while a mailer ETB2B AI opened waits on the Mailers tab (mailerWaitingHtml) */
  .promo-deep-note{ margin-top:12px; align-items:center; flex-wrap:wrap; }
  .promo-deep-note > span{ flex:1 1 220px; min-width:0; }
  /* a studio opened full-window covers the whole page: ETB2B AI is hidden with it, and so kept out of Tab's way */
  html.promo-studio-open .rvc{ visibility:hidden; }
  /* ...except while its editor is in "Edit with AI" (promo-studio/oneworld-ai-mode.js, batch B18-ai): then ETB2B AI is
     how the post or mail is changed, and stands at the bottom right over the studio (layer 1000, promo.css) */
  html.promo-studio-open.promo-studio-ai .rvc{ visibility:visible; --rvc-z-launcher:1001 !important; --rvc-z-panel:1002 !important; }
</style>
<script>try{var t=localStorage.getItem("revamp-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme:dark)").matches))document.documentElement.setAttribute("data-theme","dark");else document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
</head>

<script>

    var id = new URLSearchParams(location.search).get('event'), b = document.getElementById('btn-preview');

<!-- ETB2B AI's brain for the post and mailer editors ("Edit with AI", batch B18-ai): it reaches the open studio frame.
     It loads before the assistant (etb2b-assistant.js), which picks it up, as it does the dash brain. -->
<script src="promo-ai-client.js"></script>

<script>
(function(){
  'use strict';

  /* The page is a shell: the top bar and rail of the event console, a heading and three tabs. Each tab's studio
     is its own file and is mounted once, when the tab is first opened: Social posts is the promotional platform's
     posts studio (promo-social-studio.html, in a frame); Site-look posts is Oneworld's own (promo-posts.js), handed
     the event's Kit — its brand and content, from RevampPromo.load(); Mailers is the platform's mailer studio
     (promo-mailer-studio.html, in a frame).

     States, never a silent fallback: no event in the address, an event that does not exist, a Kit that did not
     load (with Try again), and signed out (auth.js sends the user to sign in). The old Promotions screens
     (edit-event-marketing.js, sample data) are not loaded here any more.

     UX-121: only Site-look posts reads the Kit, so the tabs are drawn at once, beside the event's own request, and
     the framed studio of the tab shown starts loading straight away; Site-look posts waits for the Kit in its own
     pane, and a Kit that did not load is said there. On Social posts, its catalog (with every card's post) is asked
     for beside the event and the Kit (prefetchSocial), and the frame takes that answer instead of asking again once
     it has loaded. */
  var C = window.RevampCore;
  var $ = C.$, esc = C.esc, svg = C.svg, IC = C.IC;
  var eventId = (new URLSearchParams(location.search).get('event') || '').trim();

  var TABS = [
    { id: 'posts', label: 'Social posts', root: 'promo-social-root' },
    { id: 'site-posts', label: 'Site-look posts', root: 'promo-posts-root' },
    { id: 'mailers', label: 'Mailers', root: 'promo-mailers-root' }
  ];
  /* the old screens' tab names (and any other value) still arrive from bookmarks and links: they open Social posts */
  function tabFrom(v){ return v === 'mailers' ? 'mailers' : v === 'site-posts' ? 'site-posts' : 'posts'; }
  var tab = tabFrom(new URLSearchParams(location.search).get('tab'));

  /* ETB2B AI on the events dashboard opens Promotions on what the person asked for ("a save-the-date post and an
     announcement mailer"): &template=<id> is one of the platform's social posts, which the Social posts frame opens
     in its editor (promo-studio/oneworld-social.js); &post=<type> is a site-look post, which promo-posts.js opens;
     &mailer= is the mailer deep link the Mailers frame already takes (MAILER_DEEP). A post counts only on the tab
     the page opens on, and only for the first time that tab is mounted. A mailer named while another tab opens
     first waits on the Mailers tab, and a line under the tabs says so until Mailers is shown. */
  var DEEP = new URLSearchParams(location.search);
  var SOCIAL_DEEP = tab === 'posts' && /^[a-z]+\.[a-z-]+$/.test(DEEP.get('template') || '') ? '&template=' + DEEP.get('template') : '';
  var POST_DEEP = tab === 'site-posts' && /^[a-z-]+$/.test(DEEP.get('post') || '') ? DEEP.get('post') : '';
  var MAILER_WAITING = tab !== 'mailers' && !!DEEP.get('mailer');

  var KIT = null, KIT_P = null, mounted = {};

  function toast(msg, opts){ C.toast(msg, opts); }

  function errText(err){
    var status = err && typeof err.status === 'number' ? err.status : 0;
    if (status === 401) return 'Your sign-in has expired. Sign in again, then try once more.';
    if (!status) return 'We couldn’t reach the server. Check your connection and try again.';
    if (status >= 500) return 'Something went wrong on our side. Please try again.';
    return (err && err.message) || 'That could not be done. Please try again.';
  }
  function isAuthError(err){
    return !!((err && err.status === 401) || /not signed in/i.test((err && err.message) || ''));
  }
  function toSignIn(){
    if (window.RevampAuth && typeof RevampAuth.redirectToSignIn === 'function') return RevampAuth.redirectToSignIn();
    location.replace('/?next=' + encodeURIComponent(location.pathname + location.search + location.hash));
  }
  /* a 401 is first answered by refreshing the session once; only a second one means signed out */
  function withSession(call){
    return call().catch(function(err){
      if (!isAuthError(err) || !window.RevampAuth) throw err;
      return RevampAuth.ensureSession().then(call);
    }).catch(function(err){
      if (isAuthError(err)) { toSignIn(); return new Promise(function(){}); }
      throw err;
    });
  }

  /* The event's portal is the server's: ev.portalName, which it gives only for a portal on ET's roster */
  function paintHeader(ev){
    var name = String(ev.name || '').trim() || 'Untitled event';
    var portalName = String(ev.portalName || '').trim();
    $('ev-name').textContent = name + (portalName ? ' | ' + portalName : '');
    var bits = [];
    if (ev.start) bits.push(C.fmtDT(ev.start));
    if (ev.eventNo) bits.push(ev.eventNo);
    var cat = C.TYPES[ev.category] || ev.category;
    if (cat) bits.push(cat);
    $('ev-meta').textContent = bits.join('  |  ');
    /* '<Page> · <Event> — EventSphere', as every event page's tab reads (UX-003) */
    document.title = 'Promotions · ' + name + ' — EventSphere';
    paintPortalChip(ev, name);
  }
  /* "No portal yet" and Set portal beside the date line while the event has none: RevampPortals' chip, and on a
     phone a button of the same words in its place (the rules at the top of the page). The page does without
     both when portal-picker.js is missing. The Kit, with the portal's name and wordmark for every mailer and
     post, is loaded once for the page, so once the portal is set the page is loaded again. */
  function paintPortalChip(ev, name){
    var host = $('ev-portal'), RP = window.RevampPortals;
    if (!host || !RP || typeof RP.chipHtml !== 'function') return;
    var none = !String(ev.portalName || '').trim();
    host.hidden = !none;
    if (host.parentNode && host.parentNode.classList) host.parentNode.classList.toggle('has-portal-chip', none);
    host.innerHTML = none ? '<span class="ev-portal-wide">' + RP.chipHtml({ eventId: eventId, eventName: name }) + '</span>' +
      '<button type="button" class="ev-portal-mini" data-set-portal="' + esc(eventId) + '" aria-label="No portal yet. Set portal">Set portal</button>' : '';
    host.onclick = function(e){
      var b = e.target && e.target.closest ? e.target.closest('[data-set-portal]') : null;
      if (!b || typeof RP.openSetPortal !== 'function') return;
      RP.openSetPortal({
        eventId: eventId, eventName: name, current: '',
        hasGeneratedSite: !!ev.generatedAt, published: ev.published === true,
        onDone: function(){ location.reload(); }
      });
    };
  }

  function head(){
    return '<div class="promo-head"><h2>Promotions</h2>' +
      '<div class="sub">Social posts in the ET portal’s look, posts in this site’s own look, and mailers — all from this event’s real speakers, partners and agenda.</div></div>';
  }
  function tabsHtml(){
    return '<div class="subtabs promo-tabs" role="tablist" aria-label="Promotions">' + TABS.map(function(t){
      var on = t.id === tab;
      return '<button type="button" role="tab" id="tab-' + t.id + '" aria-controls="pane-' + t.id + '" aria-selected="' + on + '" tabindex="' + (on ? '0' : '-1') + '" data-tab="' + t.id + '">' + t.label + '</button>';
    }).join('') + '</div>';
  }

  function renderLoading(){
    $('view').innerHTML = head() + '<div class="promo-state" role="status"><span class="spin"></span><b>Loading this event’s promotions…</b></div>';
  }
  /* no event, or one that could not be read: RevampCore's one state for it (UX-008), with Preview and the rail put
     away, since there is no event for them to lead to */
  function renderEventError(err, kind){
    $('ev-meta').textContent = '';
    $('rail').innerHTML = '';
    $('rail').hidden = true;
    C.renderLoadError($('view'), err, { kind: kind, none: 'the event whose promotions you want to make', title: 'ev-name', hide: ['btn-preview'], onRetry: init });
  }
  /* the Kit did not load: said in Site-look posts' own pane (the only tab that reads it), with Try again */
  function renderKitError(host, err){
    console.error('Promotions kit failed to load:', err);
    host.innerHTML = '<div style="padding:40px 20px">' + C.emptyState(IC.info, 'The event’s look and content did not load',
      errText(err) + ' Nothing has been lost.',
      '<button class="btn btn-primary btn-sm" type="button" id="promo-retry">Try again</button>') + '</div>';
    var again = $('promo-retry');
    if (again) again.onclick = function(){ mounted['site-posts'] = false; KIT_P = null; show(); };
  }

  function mailerWaitingHtml(){
    if (!MAILER_WAITING) return '';
    return '<div class="callout promo-deep-note" id="promo-mailer-waiting" role="status">' + svg(IC.info, 16) +
      '<span>ETB2B AI also opened a mailer for you. It is ready on the Mailers tab.</span>' +
      '<button class="btn btn-secondary btn-sm" type="button" id="promo-mailer-open">Open Mailers</button></div>';
  }
  /* the mailer has been seen: the line goes, for good */
  function mailerSeen(){
    if (!MAILER_WAITING) return;
    MAILER_WAITING = false;
    var note = $('promo-mailer-waiting');
    if (note){ note.hidden = true; note.innerHTML = ''; }
  }
  function renderTabs(){
    $('view').innerHTML = head() + tabsHtml() + mailerWaitingHtml() + TABS.map(function(t){
      return '<section class="promo-pane" role="tabpanel" id="pane-' + t.id + '" aria-labelledby="tab-' + t.id + '"' + (t.id === tab ? '' : ' hidden') + '>' +
        '<div id="' + t.root + '"></div></section>';
    }).join('');
    var list = $('view').querySelector('[role="tablist"]');
    list.addEventListener('click', function(e){
      var b = e.target.closest('[data-tab]');
      if (b) select(b.getAttribute('data-tab'), false);
    });
    /* one stop in the Tab order; the arrow keys move between the tabs */
    list.addEventListener('keydown', function(e){
      var i = TABS.map(function(t){ return t.id; }).indexOf(tab), to = -1;
      if (e.key === 'ArrowRight') to = (i + 1) % TABS.length;
      else if (e.key === 'ArrowLeft') to = (i - 1 + TABS.length) % TABS.length;
      else if (e.key === 'Home') to = 0;
      else if (e.key === 'End') to = TABS.length - 1;
      if (to < 0) return;
      e.preventDefault();
      select(TABS[to].id, true);
    });
    /* the line's own button: the keyboard lands on the Mailers tab, as the line goes */
    var openMailers = $('promo-mailer-open');
    if (openMailers) openMailers.onclick = function(){ select('mailers', true); };
    show();
  }
  function select(id, focus){
    tab = tabFrom(id);
    history.replaceState(null, '', 'marketing.html?event=' + encodeURIComponent(eventId) + '&tab=' + tab + location.hash);
    TABS.forEach(function(t){
      var b = $('tab-' + t.id), on = t.id === tab;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
      $('pane-' + t.id).hidden = !on;
      if (on && focus) b.focus();
    });
    /* a studio left full-window in the tab now shown covers the page again, from where the page is now: its close
       puts the page back there. The lock follows what is on screen (lockPage). */
    [FRAMES.social, FRAMES.mailer].forEach(function(k){
      var f = $(k.id);
      if (k.tab === tab && f && f._rvPin && f.classList.contains('is-studio')) f._rvPin.y = window.pageYOffset || 0;
    });
    lockPage();
    if (tab === 'mailers') mailerSeen();
    show();
  }
  /* each studio is mounted the first time its tab is shown, and kept: switching tabs loses nothing. Site-look
     posts, drawn in this page, is told when it is shown again (shown()): what it would have drawn while hidden —
     where every size reads 0 — it draws now. The two framed studios lay themselves out and report their height. */
  function show(){
    if (mounted[tab]) {
      var studio = window.RevampPromoPosts;
      if (tab === 'site-posts' && studio && typeof studio.shown === 'function') studio.shown();
      return;
    }
    var t = TABS.filter(function(x){ return x.id === tab; })[0];
    var host = $(t.root);
    if (tab === 'site-posts') {
      if (!window.RevampPromoPosts) { host.innerHTML = '<p class="promo-quiet">The posts studio did not load. Reload the page.</p>'; return; }
      mounted['site-posts'] = true;
      if (!KIT) {
        host.innerHTML = '<div class="promo-state" role="status"><span class="spin"></span><b>Loading this event’s look and content…</b></div>';
        kitPromise(!KIT_P).then(function(kit){
          KIT = kit || {};
          if ($(t.root) === host) mountSitePosts(host);
        }, function(err){ if ($(t.root) === host) renderKitError(host, err); });
        return;
      }
      mountSitePosts(host);
      return;
    }
    /* Social posts and Mailers are the promotional platform's own studios (promo-social-studio.html,
       promo-mailer-studio.html), each in a frame on this event, in this page's look and light or dark
       (promo-studio/oneworld-theme.js). Each frame grows to its content, so this page scrolls instead of a box
       inside it, and takes the whole window while a studio or a full-size view is open: the frame says so (the
       listener below). */
    if (tab === 'posts') {
      mounted.posts = true;
      var frame = '<iframe class="promo-social-frame" id="promo-social-frame" title="Social posts" src="promo-social-studio.html?event=' +
        encodeURIComponent(eventId) + '"></iframe>';
      /* the post ETB2B AI opened rides on the frame's address, as a mailer's does on its frame (SOCIAL_DEEP is
         checked above: lower-case letters, a dot and hyphens only) */
      host.innerHTML = SOCIAL_DEEP ? frame.replace('"></iframe>', SOCIAL_DEEP + '"></iframe>') : frame;
      SOCIAL_DEEP = '';
      watchFrame(FRAMES.social);
      return;
    }
    mounted.mailers = true;
    /* the mail's top banner is drawn in this browser (promo-banner.js), so it is started here, the first time
       Mailers is shown, before the studio asks for it (rvBanner); promo-banner.js keeps the run for those asks */
    ensureBanner(false);
    host.innerHTML = '<iframe class="promo-mailer-frame" id="promo-mailer-frame" title="Mailers" src="promo-mailer-studio.html?event=' +
      encodeURIComponent(eventId) + (MAILER_DEEP ? MAILER_DEEP : '') + '"></iframe>';
    watchFrame(FRAMES.mailer);
  }
  function mountSitePosts(host){
    var ctx = { eventId: eventId, kit: KIT, toast: toast };
    /* the post ETB2B AI opened (POST_DEEP): its editor, or why the event cannot make it yet */
    if (POST_DEEP) { ctx.open = POST_DEEP; POST_DEEP = ''; }
    window.RevampPromoPosts.mount(host, ctx);
  }
  /* the event's Kit, asked for once a page (fresh: asked for again, after a failure); KIT is set as soon as it
     comes, so Site-look posts opened after that mounts at once */
  function kitPromise(fresh){
    if (!KIT_P || fresh) {
      var p = KIT_P = withSession(function(){ return window.RevampPromo.load(eventId, !!fresh); });
      p.then(function(kit){ if (KIT_P === p) KIT = kit || {}; }, function(){});
    }
    return KIT_P;
  }
  /* UX-121: Social posts' catalog with every card's post (cards=1), asked for now, beside the event and the Kit,
     instead of after its frame has loaded; the frame takes it once (promo-studio/oneworld-social.js owCatalog) and
     asks itself when this did not answer. Only when the page opens on Social posts. */
  function prefetchSocial(){
    if (tab !== 'posts' || !window.RevampAuth || typeof RevampAuth.authedFetch !== 'function') return;
    var p = RevampAuth.authedFetch('/api/promo/social/catalog?eventId=' + encodeURIComponent(eventId) + '&cards=1').then(function(r){
      return r.text().then(function(text){ return { status: r.status, text: text }; });
    }).then(null, function(){ return null; });
    window.RevampSocialPrefetch = { eventId: eventId, catalog: p, used: false };
  }
  var MAILER_DEEP = (function(){
    var q = new URLSearchParams(location.search), m = q.get('mailer'), v = q.get('version');
    return m ? '&mailer=' + encodeURIComponent(m) + (v ? '&version=' + encodeURIComponent(v) : '') : '';
  })();

  /* -> a promise of { ok, none?, url?, error? }; never rejects, so the studio is always answered */
  function ensureBanner(fresh){
    var B = window.RevampPromoBanner, p;
    if (!B || typeof B.ensure !== 'function') return Promise.resolve({ ok: false, error: 'The mail banner drawing did not load. Reload the page.' });
    try { p = Promise.resolve(B.ensure(eventId, { fresh: !!fresh })); } catch (err) { p = Promise.reject(err); }
    return p.then(function(r){
      return r && typeof r === 'object' ? r : { ok: false, error: 'The mail banner could not be made.' };
    }, function(err){
      console.error('The mail banner was not made:', err);
      return { ok: false, error: String((err && err.message) || 'The mail banner could not be made.') };
    });
  }

  /* What the two framed studios tell this page (postMessage, same origin). Each message is taken only from one of
     our own frames' windows, and each frame speaks only for itself:
       { rvSocialStudio | rvMailerStudio: 'open' | 'close' }  a studio or a full-size view takes the whole window,
                                                              or gives it back
       { rvSocialHeight | rvMailerHeight: h }                 its content is h px tall: the frame grows to it. The
                                                              first report is answered { rvSocialTall | rvMailerTall:
                                                              true }, and the frame then turns its own scrolling off
       { rvToast: { m, ms } }                                 a message from a tall frame, whose own toast would sit at
                                                              its bottom, out of sight: the console shows it
       { rvBanner: 'ensure', id, fresh? }                     (Mailers only) the mail's top banner, before the studio
                                                              opens, downloads, exports or copies a mail: answered
                                                              { rvBannerReady: { id, ok, error? } } to that frame
     The team's Mailer performance page frames the mailer studio too and answers none of this, so there the frame
     keeps its own scrolling. */
  var FRAMES = {
    social: { id: 'promo-social-frame', tab: 'posts', studio: 'rvSocialStudio', height: 'rvSocialHeight', tall: 'rvSocialTall' },
    mailer: { id: 'promo-mailer-frame', tab: 'mailers', studio: 'rvMailerStudio', height: 'rvMailerHeight', tall: 'rvMailerTall' }
  };
  /* a frame is on screen only while its tab's pane is shown. A frame can say 'open' or 'close' from a hidden tab:
     a deep-linked mailer opens after its previews load, which can be after the user has moved to another tab. */
  function onScreen(kind){
    var pane = $('pane-' + kind.tab);
    return !!(pane && !pane.hidden);
  }
  function frameOf(win){
    var kinds = [FRAMES.social, FRAMES.mailer];
    for (var i = 0; i < kinds.length; i++) {
      var f = $(kinds[i].id);
      if (win && f && f.contentWindow === win) return { kind: kinds[i], el: f };
    }
    return null;
  }
  function tell(win, msg){ try { win.postMessage(msg, location.origin); } catch (e) { /* the frame has gone */ } }
  function tellTall(f, kind){ var m = {}; m[kind.tall] = true; tell(f.contentWindow, m); }

  /* A studio taking the whole window fixes its frame over the page, which leaves the flow: the page would shrink
     and lose its scroll position. The frame's host keeps the frame's height while it is open, and the scroll is
     put back when it closes. The frame's reported height is set aside meanwhile: on the element it would hold
     over the full-window rule (promo.css). A frame in a hidden tab measures 0, so there the height it reported is
     the one its host keeps. The scroll is put back only when the closing frame is on screen: otherwise the page
     shown is another tab's, and its place must not move. */
  function studioOpen(f){
    if (f.classList.contains('is-studio')) return;
    var h = f.offsetHeight || parseInt(f.style.height, 10) || 0;
    f._rvPin = { y: window.pageYOffset || 0, height: f.style.height };
    if (f.parentNode && h > 0) f.parentNode.style.minHeight = h + 'px';
    f.style.height = '';
    f.classList.add('is-studio');
    lockPage();
  }
  function studioClose(f, kind){
    if (!f.classList.contains('is-studio')) return;
    var pin = f._rvPin || { y: window.pageYOffset || 0, height: '' }, shown = onScreen(kind);
    f._rvPin = null;
    f.classList.remove('is-studio');
    f.style.height = pin.height;
    if (f.parentNode) f.parentNode.style.minHeight = '';
    lockPage();
    if (shown) window.scrollTo(0, pin.y);
  }
  /* the page is locked only while a full-window frame is on screen: one in a hidden tab cannot be seen, and must
     not stop the tab that is shown from scrolling (select() asks again on every switch) */
  function lockPage(){
    var open = [FRAMES.social, FRAMES.mailer].some(function(k){
      var f = $(k.id);
      return !!(f && f.classList.contains('is-studio') && onScreen(k));
    });
    document.documentElement.classList.toggle('promo-studio-open', open);
    aiMode();
  }
  /* "Edit with AI" in the editor of the full-window frame shown (promo-studio/oneworld-ai-mode.js says { rvAiMode }):
     ETB2B AI comes over the studio. A frame in a hidden tab, or not full-window, does not count. */
  function aiMode(){
    var on = [FRAMES.social, FRAMES.mailer].some(function(k){
      var f = $(k.id);
      return !!(f && f._rvAi === 'ai' && f.classList.contains('is-studio') && onScreen(k));
    });
    document.documentElement.classList.toggle('promo-studio-ai', on);
  }
  /* the frame grows to its content, never below the studio's own minimum; not while it fills the window */
  function grow(f, kind, h){
    h = Math.ceil(Number(h));
    if (!isFinite(h) || h <= 0 || f.classList.contains('is-studio')) return;
    f.style.height = Math.max(620, h) + 'px';
    if (!f._rvTall) { f._rvTall = true; tellTall(f, kind); }
  }
  /* a frame whose page is reloaded on its own (the browser's Reload frame) starts again: not full-window, not yet
     told it is tall. Each page it loads is watched for leaving. */
  function watchFrame(kind){
    var f = $(kind.id);
    if (!f || !f.addEventListener) return;
    f.addEventListener('load', function(){
      var w = f.contentWindow;
      try {
        w.addEventListener('pagehide', function(){ if ($(kind.id) !== f) return; f._rvAi = ''; studioClose(f, kind); f._rvTall = false; });
      } catch (e) { /* not ours to watch */ }
    });
  }
  function relayToast(t){
    if (!t || typeof t !== 'object' || t.m == null) return;
    /* the platform's own ✓ goes: the message's kind draws its mark. The studio sends the kind where it knows it
       (every Oneworld message, and the platform's where its words are a server's own); only a message sent without
       one has its kind read from the words by RevampCore.toast (a failure stays up in red, something done gets the tick) */
    var text = String(t.m).slice(0, 300).replace(/^\s*[✓✔]\s*/, '');
    if (!text.trim()) return;
    var kind = t.k === 'success' || t.k === 'error' || t.k === 'info' ? t.k : 'auto';
    toast(text, { kind: kind, duration: Number(t.ms) > 0 ? Number(t.ms) : undefined });
  }
  window.addEventListener('message', function(e){
    var d = e.data;
    if (e.origin !== location.origin || !d || typeof d !== 'object') return;
    var from = frameOf(e.source);
    if (!from) return;
    var f = from.el, kind = from.kind;
    if (d[kind.studio] === 'open') studioOpen(f);
    else if (d[kind.studio] === 'close') studioClose(f, kind);
    if (d[kind.height] != null) grow(f, kind, d[kind.height]);
    if (d.rvToast) relayToast(d.rvToast);
    if (d.rvAiMode != null) { f._rvAi = d.rvAiMode === 'ai' ? 'ai' : ''; aiMode(); }
    if (d.rvBanner === 'ensure' && kind === FRAMES.mailer) {
      var id = d.id, win = e.source;
      ensureBanner(!!d.fresh).then(function(r){
        var a = { id: id, ok: !!r.ok };
        if (!r.ok) a.error = String(r.error || 'The mail banner could not be made.');
        tell(win, { rvBannerReady: a });
      });
    }
  });

  function init(){
    if (!eventId) { renderEventError(null, 'none'); return; }
    $('ev-name').textContent = 'Loading…';
    $('ev-meta').textContent = '';
    $('rail').hidden = false;
    renderEventRail('rail', { activeSection: 'marketing', eventId: eventId });
    renderLoading();
    window.RevampPromo.use(eventId);
    /* the Kit (for Site-look posts and the mail banner) and Social posts' catalog start beside the event, and the
       tabs are drawn at once, so the studio's frame loads while the event is still on its way; an event that does
       not exist replaces them with its message (renderEventError) */
    kitPromise(false);
    prefetchSocial();
    mounted = {};
    renderTabs();
    withSession(function(){ return C.fetchEvent(eventId); }).then(function(ev){
      paintHeader(ev);
    }, function(err){ renderEventError(err); });
  }

  init();
})();
</script>
<!-- ETB2B AI, bottom-right as on every page: etb2b-assistant.js mounts it here and tells it this page and its event.
     It hides while a studio is open full-window (the rule in the head); the framed studios never carry it. -->
<div id="rv-assistant" data-rv-assistant="promotions"></div>
<script src="etb2b-chat.js"></script>
<script src="dash-bot-client.js"></script>
<script src="etb2b-assistant.js"></script>
</body>
