<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailers — Oneworld 2.0</title>
<!-- GENERATED by tools/extract-promo-studio.py: the promotional platform's mailer studio, on Oneworld.
     Shown inside Promotions → Mailers (marketing.html), and as the team's Mailer performance
     (mailer-performance.html, ?scope=all). Edit promo-studio/oneworld.js, not this file. -->
<script src="promo-studio/oneworld-theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/quill/quill.snow.css">
<link rel="stylesheet" href="promo-studio/mailer-studio.css">
<link rel="stylesheet" href="promo-studio/oneworld.css">
<link rel="stylesheet" href="promo-studio/oneworld-mail-easy.css">
<script src="assets/vendor/quill/quill.js"></script>
<script type="module" src="promo-studio/richtext.js"></script>
</head>
<body class="ow-embed">
  <div id="app" style="display:block">
    <div class="ow-bar">
      <div class="pnav" id="prodNav" style="display:none">
        <button data-v="dash" onclick="showAnalytics()" title="Open and click performance">Dashboard</button>
        <button data-v="events" onclick="showPortals()" title="Pick a portal and an event">Events</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

  <div id="mailer">
    <div class="ed-top">
      <button class="back" type="button" onclick="closeMailer()">← Back to mailers</button>
      <h1 class="ttl ow-sr">Mailer editor</h1>
      <div class="ed-pick">
        <select id="mlPick" onchange="switchMailer()" aria-label="Mailer"></select>
        <div class="seg" id="mlWidth">
          <button data-v="desktop" class="on" onclick="mlSetWidth('desktop')">Desktop</button>
          <button data-v="mobile" onclick="mlSetWidth('mobile')">Mobile</button>
        </div>
      </div>
      <div class="sp"></div>
      <div class="acts">
        <span class="mlver none" id="mlVer"></span>
        <span class="pill cache" id="mlState" style="display:none"></span>
        <button class="btn alt sm" onclick="mlSave()">Save</button>
        <button class="btn ghost sm" onclick="mlSaveAs()">Save as new</button>
        <button class="btn sm" onclick="mlDownload()" title="Download the mail as an .html file: the file you send from your email tool">Download</button>
        <div class="ed-menuwrap">
          <button class="btn ghost sm" onclick="toggleMenu('mlMore',event)" title="More" aria-label="More actions">···</button>
          <div class="ed-menu grp" id="mlMore">
            <!-- Grouped by INTENT. Watching first-timers, the one convergent
                 question was "which button actually sends this?" — six exits with
                 no guidance. Headers answer it: send / share / check. -->
            <div class="mh">Share for sign-off</div>
            <button class="desc" onclick="mlExport('png',800)"><b>Save as picture · desktop, 800 px wide</b><i>To show your team, not for sending</i></button>
            <button class="desc" onclick="mlExport('png',390)"><b>Save as picture · phone, 390 px wide</b><i>How it looks on a phone</i></button>
            <button class="desc" onclick="mlExport('pdf',800)"><b>Save as PDF</b><i>A document to share or print</i></button>
            <div class="mh mt">Check your work</div>
            <button class="desc" onclick="mlDownloadTest()"><b>Preview copy</b><i>A clean file just to check — not counted</i></button>
            <button class="desc" onclick="mlCopy()"><b>Copy HTML</b><i>Paste the raw code somewhere else</i></button>
            <div class="msep"></div>
            <button onclick="mlRenameVersion()">Rename this version…</button>
            <button onclick="mlDeleteVersion()">Delete this version</button>
            <button onclick="closeMenus();mlUndo()">Undo  (⌘/Ctrl+Z)</button>
            <button onclick="closeMenus();mlRedo()">Redo  (⌘/Ctrl+Y)</button>
            <button onclick="mlRebuild()">Rebuild from event data</button>
            <button onclick="mlRelayoutOpen(event)">Change layout…</button>
            <button onclick="mlImportOpen()">Import an HTML file…</button>
          </div>
        </div>
        <!-- Target layouts for "Change layout". Built on open, because whether a
             mailer is available depends on what this event actually has. -->
        <div class="ed-menuwrap">
          <div class="ed-menu wide" id="mlLayouts"></div>
        </div>
        <input type="file" id="mlFile" accept=".html,.htm,text/html,message/rfc822"
               style="display:none" onchange="mlImportFile(this)">
      </div>
    </div>
    <div class="ml-body">
      <!-- left rail: the block palette. Drag a block onto the canvas to place it
           exactly where you want it; clicking one drops it after the selection. -->
      <!-- ONEWORLD PORT (B18): the rail is gone; "+ Add a section" opens the sections in plain groups -->

      <!-- canvas -->
      <div class="ml-stage" id="mlStage">
        <!-- What a layout switch or an import actually did. Neither is lossless,
             so the result is stated rather than left for the sender to notice. -->
        <div class="ml-note" id="mlNote" style="display:none"></div>
        <div class="ml-canvas" id="mlCanvas">
          <!-- The preview runs sender-authored mail HTML (including the `html`
               block's raw markup) at the app origin. `allow-same-origin` is kept
               because the studio reaches into contentDocument for every core job —
               measuring the canvas, drawing the hotspot overlay, in-place editing
               (data-ed) and neutralising links — and images must still load. But
               `allow-scripts` is deliberately WITHHELD: email HTML never legitimately
               runs script, so with scripting off an injected <script> or an
               img/onerror handler in a Custom HTML block cannot execute or touch the
               parent. Defence in depth alongside the server-side sanitiser. -->
          <iframe class="ml-frame" id="mlFrame" title="Mailer preview" sandbox="allow-same-origin"></iframe>
          <div class="ml-ov" id="mlOv"></div>
        </div>
      </div>

      <!-- right: settings -->
      <div class="ml-props" id="mlProps"></div>
    </div>

    <!-- block palette popover -->
    <div class="ml-pop" id="mlPop" role="dialog" aria-label="Add a section">
      <div class="hd">Add a section<button type="button" onclick="mlPopClose()" aria-label="Close">✕</button></div>
      <div class="ml-pal" id="mlPal"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- In-app dialogs: raw browser prompt()/confirm() look nothing like the app and
       jar a first-timer. This one modal serves Save-name, Rename, Delete and the AI
       confirmations. Built by uiModal(); a Promise resolves on OK/Cancel. -->
  <div class="ui-modal" id="uiModal" aria-hidden="true">
    <div class="ui-card" role="dialog" aria-modal="true">
      <h4 id="uiModalTitle"></h4>
      <div id="uiModalBody" class="ui-body"></div>
      <input id="uiModalInput" style="display:none" autocomplete="off">
      <div class="ui-acts">
        <button class="btn ghost sm" id="uiModalCancel"></button>
        <button class="btn sm" id="uiModalOk"></button>
      </div>
    </div>
  </div>


<script src="auth.js"></script>
<script src="assets/vendor/html-to-image.js"></script>
<script src="promo-studio/mailer-studio.js"></script>
<script src="promo-studio/oneworld.js"></script>
<script src="promo-studio/oneworld-mail-easy.js"></script>
</body>
</html>
