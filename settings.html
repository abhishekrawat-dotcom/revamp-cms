<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Revamp CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="edit-event.css">
  <style>
    body{background:var(--bg);overflow-x:hidden}.settings-page{display:flex;min-height:calc(100vh - var(--topbar-h))}.settings-main{flex:1;min-width:0;padding:0 28px 60px}.event-picker{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:var(--text-muted)}.event-picker select{min-width:210px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}
    .settings-tabs{display:flex;gap:28px;border-bottom:1px solid var(--border);margin:0 0 31px;white-space:nowrap;overflow-x:auto}.settings-tabs button{position:relative;border:0;background:none;padding:20px 0 14px;color:var(--text-muted);font-size:15px;font-weight:700;cursor:pointer}.settings-tabs button[aria-selected=true]{color:var(--accent-strong)}.settings-tabs button[aria-selected=true]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);border-radius:3px}.settings-view{max-width:1500px;margin:0 auto}.settings-row{display:flex;align-items:center;gap:14px;padding:17px 20px;border-bottom:1px solid var(--border)}.settings-row:last-child{border-bottom:0}.settings-row .handle{color:var(--text-faint);font-size:18px}.settings-row .copy{flex:1;min-width:0}.settings-row b{display:block;font-size:14px}.settings-row .copy span{display:block;color:var(--text-muted);font-size:12px;margin-top:2px}.toggle{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--text-muted);font-weight:700;cursor:pointer}.toggle i{width:38px;height:22px;border-radius:20px;background:var(--surface-3);position:relative}.toggle i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .15s}.toggle[aria-pressed=true]{color:var(--accent-strong)}.toggle[aria-pressed=true] i{background:var(--accent)}.toggle[aria-pressed=true] i:after{transform:translateX(16px)}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px}.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
    @media(max-width:760px){.settings-main{padding:0 14px 40px}.topbar{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 14px}.event-picker{width:100%;margin-left:0}.event-picker select{flex:1}.settings-tabs{gap:20px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="topbar"><a class="back-btn" href="Event_Listing.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Back to events</a><span class="ev-title"><h1 id="event-name">&nbsp;</h1><span class="meta" id="event-meta"></span></span><label class="event-picker" for="event-select">Event <select id="event-select"></select></label></header>
<div class="settings-page"><nav class="rail" id="rail" aria-label="Sections"></nav><main class="settings-main"><div class="settings-view" id="page"></div></main></div>
<div class="toast-host" id="toast-host"></div>
<script src="edit-event-core.js"></script><script src="sidebar.js"></script>
<script>
(function(){'use strict';var C=window.RevampCore,select=document.getElementById('event-select'),page=document.getElementById('page'),query=new URLSearchParams(location.search),tab=query.get('tab')||'form';select.innerHTML=C.EVENTS.map(function(e){return '<option value="'+e.id+'">'+C.esc(e.name)+'</option>';}).join('');select.value=query.get('event')||C.EVENTS[0].id;var state={published:false};
function ev(){return C.eventById(select.value)||C.EVENTS[0]}function head(e){document.getElementById('event-name').textContent=e.name+' | '+(C.PORTALS[e.portal]||'');document.getElementById('event-meta').textContent=C.fmtDT(e.start)+'  |  '+e.eventNo+'  |  '+(C.TYPES[e.type]||e.type)}
function rail(){renderEventRail('rail',{activeSection:'settings',onSection:function(s){if(s==='dashboard'){location.href='dashboard.html';return}if(s==='audience'){location.href='audience-registrations.html?event='+select.value;return}if(s==='marketing'){location.href='marketing.html?event='+select.value;return}if(s==='design'){location.href='custom_editor.html?event='+select.value;return}if(s==='payment'){location.href='edit-event.html?event='+select.value+'#audience/payments';return}if(s==='settings')return;location.href='edit-event.html?event='+select.value+'#'+s}})}
var tabs=[['form','Registration form'],['seo','URL & SEO'],['links','Social links'],['visibility','Visibility'],['advanced','Advanced'],['history','History']];function tabbar(){return '<div class="settings-tabs">'+tabs.map(function(t){return '<button data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>'}
function toggle(label,desc,on,key){return '<div class="settings-row"><span class="handle">⠿</span><span class="copy"><b>'+label+'</b><span>'+desc+'</span></span><button class="toggle" data-toggle="'+key+'" aria-pressed="'+on+'"><i></i><span>'+(on?'On':'Off')+'</span></button></div>'}
function form(){var f=[['Full name','Text','Required',true],['Work email','Email','Required',true],['Mobile number','Phone','Required',true],['Company','Text','Required',true],['Designation','Text','Required',true],['City','Dropdown','Optional',true],['Industry','Dropdown','Optional',true],['How did you hear about us?','Dropdown','Optional',false],['Dietary preference','Radio','Optional',false]];return title('Registration form','What a visitor fills in to register. Fewer fields convert better - 7 is the sweet spot.','Add field')+'<section class="panel"><div class="panel-head"><h3>Form fields</h3><span class="panel-head sub">7 of 9 enabled</span></div>'+f.map(function(x){return toggle(x[0],x[1]+' · '+x[2],x[3],x[0])}).join('')+'</section><section class="panel"><div class="panel-head"><h3>Behaviour</h3></div><div class="panel-body"><div class="form-grid"><div class="field"><label>After submitting</label><select><option>Show thank-you message</option><option>Redirect to payment</option></select></div><div class="field"><label>Confirmation email</label><select><option>Send immediately</option><option>Do not send</option></select></div><div class="field"><label>Duplicate handling</label><select><option>Block duplicate emails</option><option>Allow duplicates</option></select></div></div></div></section>'}
function seo(){return title('URL & SEO','Control the public URL, page title, and social preview.')+'<section class="panel"><div class="panel-body"><div class="form-grid"><div class="field"><label>Microsite URL</label><input value="martech-summit-2026"></div><div class="field"><label>Page title</label><input value="MarTech+ Summit 2026 | ETBrandEquity"></div><div class="field"><label>Canonical URL</label><input value="https://etoneworld.com/martech-summit-2026"></div></div><button class="btn btn-primary btn-sm" data-action="save">Save changes</button></div></section>'}
function links(){return title('Social links','The icon row in the microsite footer. Empty links are hidden automatically.')+'<section class="panel"><div class="panel-head"><h3>Icons in the footer</h3><span class="panel-head sub">4 of 6 shown</span></div>'+[['LinkedIn','https://linkedin.com/company/et-oneworld',true],['X (Twitter)','https://x.com/ETOneworld',true],['Instagram','https://instagram.com/etoneworld',true],['YouTube','https://youtube.com/@etoneworld',true],['Facebook','',false],['WhatsApp channel','',false]].map(function(x){return '<div class="settings-row"><span class="copy"><b>'+x[0]+'</b><input style="width:100%;margin-top:7px;padding:8px;border:1px solid var(--border);border-radius:7px" value="'+x[1]+'" placeholder="Paste the profile URL"></span><button class="toggle" data-toggle="'+x[0]+'" aria-pressed="'+x[2]+'"><i></i><span>'+(x[2]?'Shown':'Hidden')+'</span></button></div>'}).join('')+'</section>'}
function visibility(){return title('Visibility','Who can reach this microsite right now.')+'<section class="panel"><div class="panel-body">'+toggle('Private draft','Only signed-in team members can open it. Nothing is indexed.',state.published,'published')+'</div></section>'}
function advanced(){return title('Advanced settings','Behaviour switches that change how the event runs, not how it looks.')+'<section class="panel"><div class="panel-head"><h3>Registration & privacy</h3></div>'+toggle('Require approval before registration counts','Every entry goes to a moderation queue first.',false,'approval')+toggle('Close registrations automatically at capacity','Stops accepting entries once the target is hit.',true,'capacity')+toggle('Show a live registration counter on the site','Social proof on the hero block.',false,'counter')+toggle('Collect GST details at payment','Adds GSTIN and billing address to checkout.',true,'gst')+toggle('Allow calendar download (.ics)','Adds an Add to calendar button after registering.',true,'calendar')+toggle('Index this microsite in search engines','Turn off for private or client-only events.',true,'indexing')+'</section>'}
function history(){return title('History','A record of important changes made to this event.')+'<section class="panel"><div class="panel-head"><h3>Recent changes</h3></div>'+[['Sep 10, 2026','Registration form','Industry field added'],['Sep 8, 2026','Visibility','Registration target updated'],['Aug 28, 2026','URL & SEO','Page title changed']].map(function(x){return '<div class="settings-row"><span class="copy"><b>'+x[1]+'</b><span>'+x[2]+' · '+x[0]+'</span></span></div>'}).join('')+'</section>'}
function title(h,s,action){return '<div class="vhead"><div class="vhead-row"><div class="grow"><div class="crumb">Settings › '+h+'</div><h2>'+h+'</h2><div class="sub">'+s+'</div></div>'+(action?'<button class="btn btn-primary btn-sm" data-action="add">+ '+action+'</button>':'')+'</div></div>'}
function render(){var e=ev();head(e);rail();page.innerHTML=tabbar()+(tab==='form'?form():tab==='seo'?seo():tab==='links'?links():tab==='visibility'?visibility():tab==='advanced'?advanced():history());document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.getAttribute('data-tab');history.replaceState(null,'','settings.html?event='+select.value+'&tab='+tab);render()}});document.querySelectorAll('[data-toggle]').forEach(function(b){b.onclick=function(){var on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on));b.querySelector('span').textContent=!on?'On':'Off';C.toast('Setting '+(!on?'enabled':'turned off'))}});document.querySelectorAll('[data-action]').forEach(function(b){b.onclick=function(){C.toast(b.getAttribute('data-action')==='save'?'Settings saved':'Field builder opened')}})}
select.onchange=function(){tab='form';history.replaceState(null,'','settings.html?event='+select.value+'&tab=form');render()};render();
})();
</script>
</body>
</html>
