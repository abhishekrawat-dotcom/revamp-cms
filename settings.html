<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings &mdash; Revamp CMS</title>
</head>
<body>
<noscript><p>This page has moved. <a href="/Event_Listing.html">Go to your events</a>.</p></noscript>
<script src="sidebar.js"></script>
<script>
/* Settings is a view of the event console; this address is kept so old links and bookmarks still
   arrive there, on the tab they asked for. */
(function(){
  var q = new URLSearchParams(location.search);
  var id = String(q.get('event') || '').trim();
  var tab = String(q.get('tab') || '');
  if (['form', 'seo', 'links', 'visibility', 'history'].indexOf(tab) === -1) tab = 'form';
  location.replace(id ? '/edit-event.html?event=' + encodeURIComponent(id) + '#settings/' + tab : '/Event_Listing.html');
})();
</script>
</body>
</html>
