<head>
<meta charset="utf-8">

<title>Publishing approvals &mdash; EventSphere</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>
/* An event's settings are a view of its console; this address is kept so old links and bookmarks still arrive
   there, on the tab they asked for. Without an event (or with ?tab=approvals) it is the one place of the rule
   every event shares: who approves changes before they go live (settings.js, UX-108). */
(function(){
  var q = new URLSearchParams(location.search);
  var id = String(q.get('event') || '').trim();
  var tab = String(q.get('tab') || '');
  if (!id || tab === 'approvals') return;
  if (['form', 'seo', 'links', 'visibility', 'history'].indexOf(tab) === -1) tab = 'form';
  location.replace('/edit-event.html?event=' + encodeURIComponent(id) + '#settings/' + tab);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="edit-event.css">
<script>try{var t=localStorage.getItem("revamp-theme");document.documentElement.setAttribute("data-theme",t==="dark"||(!t&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");}catch(e){}</script>
<style>

  .pa-acts{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }

  @media (max-width: 760px){ .pa-main{ padding:16px 16px 70px; } .pa-acts .btn{ flex:1 1 auto; justify-content:center; } }
</style>
