<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Settings &mdash; EventSphere</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>
/* An event's settings are a view of its console; this address is kept so old links and bookmarks still arrive
   there, on the tab they asked for. Without an event (or with ?tab=approvals) it is the one place of what every
   event shares: who has access, as what and in which portals (settings-access.js), and the approval rule
   (settings.js, UX-108). */
(function(){
  var q = new URLSearchParams(location.search);
  var id = String(q.get('event') || '').trim();
  var tab = String(q.get('tab') || '');
  if (!id || tab === 'approvals') return;
  if (['form', 'seo', 'links', 'visibility', 'history'].indexOf(tab) === -1) tab = 'form';
  location.replace('/edit-event.html?event=' + encodeURIComponent(id) + '#settings/' + tab);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="settings.css">
</head>
