<!-- ET Oneworld - Revamp CMS : standalone dashboard page -->
<meta charset="utf-8">
<title>Dashboard &mdash; Revamp CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="edit-event.css">
<link rel="stylesheet" href="motion.css">
<style>
  body {
    margin: 0;
    background: var(--surface-2);
    color: var(--text);
    /* was var(--font-sans), a token never defined anywhere in the project —
       silently fell back to the browser default. Fixed to the same token
       every other page uses. */
    font-family: var(--font-body);
  }
  .dash-shell {
    min-height: calc(100vh - var(--topbar-h));
    background: var(--bg);
    display: flex;
    align-items: flex-start;
  }
  .dash-main-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .dash-main {
    max-width: 1460px;
    width: 100%;
    margin: 0 auto;
    padding: 22px 24px 60px;
  }
  @media (max-width: 760px) {
    .dash-main { padding: 18px 14px 48px; }
  }
</style>

<!-- top bar and rail are rendered by app-shell.js — same markup on every section -->
<header class="topbar" id="topbar"></header>

<div class="dash-shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>

  <div class="dash-main-wrap">
    <main class="dash-main">
      <div id="view"></div>
    </main>
  </div>
</div>

<div class="toast-host" id="toast-host"></div>
<select id="dash-event" hidden aria-hidden="true"></select>

<script src="edit-event-core.js"></script>
<script src="edit-event-dashboard.js"></script>
<script src="app-shell.js"></script>
<script>
(function(){
  'use strict';
  var C = window.RevampCore;
  var DASH = window.EditEventDashboard;
  var sel = document.getElementById('dash-event');

  /* the event travels in the URL like it does on every other section, so
     arriving here from Promotions or Settings does not silently drop you
     back onto event 1 */
  var eventId = new URLSearchParams(location.search).get('event') || C.EVENTS[0].id;

  sel.innerHTML = C.EVENTS.map(function(e){
    return '<option value="' + e.id + '">' + C.esc(e.name) + '</option>';
  }).join('');
  sel.value = (C.eventById(eventId) || C.EVENTS[0]).id;

  window.RevampShell.mount({ section: 'dashboard', eventId: sel.value });

  function draw(){
    var EV = C.eventById(sel.value) || C.EVENTS[0];
    var KEY = 'revamp-edit-event-' + EV.id;
    var S = C.loadState(KEY);

    var ctx = C.makeCtx({
      EV: EV,
      S: S,
      PEOPLE: C.makePeople(EV),
      vhead: function(t, sub, right){
        /* the rail already names the section; a heading repeating it costs
           a hundred pixels for nothing. Keep it for screen readers only. */
        return '<h2 class="sr-only">' + C.esc(t) + (sub ? '. ' + C.esc(sub) : '') + '</h2>' +
          (right ? '<div class="page-acts">' + right + '</div>' : '');
      },
      go: function(r){
        location.href = 'edit-event.html?event=' + encodeURIComponent(EV.id) + '#' + r;
      },
      render: draw,
      save: function(){ C.saveState(KEY, S); }
    });

    document.getElementById('view').innerHTML = DASH.view(ctx);
    DASH.wire(ctx);

    document.querySelectorAll('[data-goto]').forEach(function(b){
      b.addEventListener('click', function(){ ctx.go(b.getAttribute('data-goto')); });
    });

    document.querySelectorAll('[data-save]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); C.toast(b.getAttribute('data-save')); });
    });
  }

  sel.onchange = draw;
  draw();
})();
</script>
