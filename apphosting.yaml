# Firebase App Hosting settings for backend "revamp-cms" (project revamp-cms, region us-east4).
# Reference: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0     # scales to zero when idle — no cost while unused (the first request after idle is slower)
  maxInstances: 2     # ET's own teams only; raise if traffic grows

  # Back to the original, plain-JSON-in/JSON-out numbers. These were bumped to cpu:2/memoryMiB:2048/
  # concurrency:4 for the Lovable live-URL import feature, when this backend launched headless Chrome
  # in-process (functions/lib/api.js's HEADLESS RENDER ADAPTER block). That never actually worked in
  # production — Firebase App Hosting's buildpack-built container has no way to install the system
  # libraries Chrome needs — and has since been replaced with a call to a separate, dedicated Cloud Run
  # service that does the real rendering (see lovable-scraper-service/README.md and
  # LOVABLE_SCRAPER_URL/LOVABLE_SCRAPER_SECRET below). Every /api/* handler back here is plain JSON-in/
  # JSON-out again (including the ZIP-upload import path's own image-rehosting step, which ran fine at
  # these same original numbers before the Lovable feature existed at all), so there's no reason left to
  # carry Chrome-sized headroom on this service.
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # functions/lib/firebase.js needs the bucket (same value as functions/.env); not a secret
  - variable: FIREBASE_STORAGE_BUCKET
    value: revamp-cms.firebasestorage.app
    availability:
      - RUNTIME

  # The Gemini key for the /api/* AI endpoints. Requires `firebase apphosting:secrets:set GEMINI_API_KEY
  # --project revamp-cms` — a separate command/secret from `firebase functions:secrets:set`, which only grants
  # access to classic Cloud Functions (no longer deployed) and does nothing for this backend.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # The Claude key. With it set, every text call (design plan, section code, redesign, chat, brief and page
  # reading) goes to Claude first and falls back to Gemini on any failure; without it everything stays on
  # Gemini (functions/lib/llm.js). Pictures are always Gemini's. The secret was set with
  # `firebase apphosting:secrets:set ANTHROPIC_API_KEY --project revamp-cms` (the backend must be granted
  # access to it: a rollout that names a secret it cannot read FAILS). To go back to Gemini only without
  # removing the key, add a plain variable LLM_PROVIDER with the value gemini.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME

  # Where functions/lib/api.js's scrapeLovableUrl() sends live-URL Lovable imports to actually be rendered
  # — the Cloud Run URL of the separate lovable-scraper-service/ (see its README.md for what it is, why it
  # exists, and the exact `gcloud run deploy` command that prints this URL). Not a secret, just an address;
  # no trailing slash.
  - variable: LOVABLE_SCRAPER_URL
    value: "https://lovable-scraper-service-298413755047.us-east4.run.app"
    availability:
      - RUNTIME

  # The shared secret scrapeLovableUrl() sends as the X-Scraper-Secret header — must be the SAME value as
  # the SCRAPER_SECRET env var set on lovable-scraper-service itself (see that service's README.md).
  # Requires `firebase apphosting:secrets:set LOVABLE_SCRAPER_SECRET --project revamp-cms`.
  - variable: LOVABLE_SCRAPER_SECRET
    secret: LOVABLE_SCRAPER_SECRET
    availability:
      - RUNTIME

  # The address every tracked mailer points at: its open pixel (/t/o/<id>.gif) and, when "Link tracking" is on,
  # every link (/t/c/<id>?u=…&s=…) — see functions/lib/promo-track.js. Not a secret. It is PERMANENT in every
  # mail sent with it: links and pixels already in inboxes keep pointing at this address even if it is changed
  # later, so this host must keep serving /t/ for as long as those mails are read. It must stay a bare origin
  # (https, no path, no trailing slash); anything else turns tracking off rather than put a broken address in a
  # mail.
  - variable: MAILER_TRACK_BASE
    value: "https://revamp-cms--revamp-cms.us-east4.hosted.app"
    availability:
      - RUNTIME

  # The key that signs every tracked link, so /t/c/ only ever redirects to a link Oneworld itself put in a mail
  # (64 hex characters from `openssl rand -hex 32`; 32+ characters, no fallback). Until this entry is enabled,
  # mailer tracking is OFF: downloads are plain, nothing is recorded, and the dashboards say opens and clicks
  # aren't being saved. Enable it (remove the leading "# " from the four lines below) ONLY after the owner has
  # run `firebase apphosting:secrets:set TRACK_SECRET --project revamp-cms` and granted this backend access
  # when asked: a rollout that names a secret it cannot read FAILS. Once enabled, never remove it — every
  # tracked link already sent would then answer "bad link".
  # - variable: TRACK_SECRET
  #   secret: TRACK_SECRET
  #   availability:
  #     - RUNTIME

  # TRACK_SECRET_PREVIOUS, for rotating the key: it only ever checks links, it never signs them. To rotate, set
  # it to the OLD value (`firebase apphosting:secrets:set TRACK_SECRET_PREVIOUS --project revamp-cms`), set
  # TRACK_SECRET to a new one, enable the entry below and roll out: links already sent keep working, and new
  # mails use the new key. After a leak, do NOT keep the old key here: drop it instead, and every link signed
  # with it answers "bad link" — that is the price of revoking it.
  # - variable: TRACK_SECRET_PREVIOUS
  #   secret: TRACK_SECRET_PREVIOUS
  #   availability:
  #     - RUNTIME
