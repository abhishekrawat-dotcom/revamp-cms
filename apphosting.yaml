# Firebase App Hosting settings for backend "revamp-cms" (project revamp-cms, region us-east4).
# Reference: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0     # scales to zero when idle — no cost while unused (the first request after idle is slower)
  maxInstances: 2     # ET's own teams only; raise if traffic grows

  # Back to the original, plain-JSON-in/JSON-out numbers. These were bumped to cpu:2/memoryMiB:2048/
  # concurrency:4 for the Lovable live-URL import feature, when this backend launched headless Chrome
  # in-process (functions/lib/api.js's HEADLESS RENDER ADAPTER block). That never actually worked in
  # production — Firebase App Hosting's buildpack-built container has no way to install the system
  # libraries Chrome needs — and has since been replaced with a call to a separate, dedicated Cloud Run
  # service that does the real rendering (see lovable-scraper-service/README.md and
  # LOVABLE_SCRAPER_URL/LOVABLE_SCRAPER_SECRET below). Every /api/* handler back here is plain JSON-in/
  # JSON-out again (including the ZIP-upload import path's own image-rehosting step, which ran fine at
  # these same original numbers before the Lovable feature existed at all), so there's no reason left to
  # carry Chrome-sized headroom on this service.
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # functions/lib/firebase.js needs the bucket (same value as functions/.env); not a secret
  - variable: FIREBASE_STORAGE_BUCKET
    value: revamp-cms.firebasestorage.app
    availability:
      - RUNTIME

  # The Gemini key for the /api/* AI endpoints. Requires `firebase apphosting:secrets:set GEMINI_API_KEY
  # --project revamp-cms` — a separate command/secret from `firebase functions:secrets:set`, which only grants
  # access to classic Cloud Functions (no longer deployed) and does nothing for this backend.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # Where functions/lib/api.js's scrapeLovableUrl() sends live-URL Lovable imports to actually be rendered
  # — the Cloud Run URL of the separate lovable-scraper-service/ (see its README.md for what it is, why it
  # exists, and the exact `gcloud run deploy` command that prints this URL). Not a secret, just an address;
  # no trailing slash.
  - variable: LOVABLE_SCRAPER_URL
    value: "https://lovable-scraper-service-298413755047.us-east4.run.app"
    availability:
      - RUNTIME

  # The shared secret scrapeLovableUrl() sends as the X-Scraper-Secret header — must be the SAME value as
  # the SCRAPER_SECRET env var set on lovable-scraper-service itself (see that service's README.md).
  # Requires `firebase apphosting:secrets:set LOVABLE_SCRAPER_SECRET --project revamp-cms`.
  - variable: LOVABLE_SCRAPER_SECRET
    secret: LOVABLE_SCRAPER_SECRET
    availability:
      - RUNTIME
