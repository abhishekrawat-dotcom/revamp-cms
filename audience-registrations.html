    var cols = ['Name','Email','Email quality','Phone','Designation','Company','Location',
                'Source','Registered','Payment','Amount','Shortlisted','Attended','Buckets'];
    var lines = [cols.join(',')];
    list.forEach(function(p){
      lines.push([
        p.name, p.email, QUALITY[p.quality].label, p.phone, p.desig, p.comp, p.city,
        p.src, p.when, p.paid?'Paid':'Unpaid', p.amount || 0,
        p.shortlist?'Yes':'No', p.attended?'Yes':'No',
        p.buckets.map(function(b){ var x=bucketById(b); return x?x.label:b; }).join(' | ')
      ].map(function(v){
        v = String(v == null ? '' : v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
      }).join(','));
    });
    var name = 'registrations-' + current().eventNo + '-' + what + '.csv';
    var blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 800);
    logAct('export', comma(list.length) + ' rows exported to CSV', list.length);
    C.toast('Exported ' + comma(list.length) + ' rows to ' + name);
  }

  /* ======================================================================
     MODAL PLUMBING
     ====================================================================== */
  function modal(title, bodyHTML, footHTML, width){
    layer.innerHTML =
      '<div class="modal-bg" id="mbg"><div class="modal" style="width:min('+(width||600)+'px,100%)">' +
        '<div class="modal-head"><h3>'+esc(title)+'</h3>' +
          '<button class="btn btn-ghost btn-icon" type="button" id="mx">'+svg(I.x,17)+'</button></div>' +
        '<div class="modal-body">'+bodyHTML+'</div>' +
        (footHTML ? '<div class="modal-foot">'+footHTML+'</div>' : '') +
      '</div></div>';
    $('mx').onclick = closeLayer;
    $('mbg').addEventListener('click', function(e){ if (e.target.id === 'mbg') closeLayer(); });
  }
  function closeLayer(){ layer.innerHTML = ''; }
  document.addEventListener('click', function(e){
    if (!T || !T.vmenu) return;
    if (e.target.closest && e.target.closest('.views')) return;
    T.vmenu = false; render();
  });

  /* ----------------------------------------------------------------
     Keyboard. A report gets driven for long stretches; these are the
     three shortcuts that actually save time.
     ---------------------------------------------------------------- */
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeLayer(); if (T && T.vmenu){ T.vmenu = false; render(); } return; }
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key === '/'){ e.preventDefault(); var q = $('q'); if (q) q.focus(); return; }
    if (e.key === 'r'){ act('reveal'); return; }
    if (e.key === 'a'){
      e.preventDefault();
      var rows = filtered().slice((T.page-1)*T.per, (T.page-1)*T.per + T.per);
      var allOn = rows.every(function(p){ return T.sel[p.id]; });
      rows.forEach(function(p){ if (allOn) delete T.sel[p.id]; else T.sel[p.id] = true; });
      render();
      return;
    }
  });

  /* ---------------------------------------------------------------- filters */
  function openFilters(){
    var all = people();
    /* Long facets (company has dozens of values) are unusable as a plain
       list, so each one gets its own type-to-narrow box. */
    function facet(key, title, values){
      var counts = {};
      all.forEach(function(p){ counts[p[key]] = (counts[p[key]] || 0) + 1; });
      var list = (values || Object.keys(counts)).sort(function(a,b){ return (counts[b]||0)-(counts[a]||0); });
      return '<div class="facet" data-facet="'+key+'"><h4>'+esc(title)+'</h4>' +
        (list.length > 6 ? '<input class="facet-search" data-fsearch="'+key+'" placeholder="Search '+esc(title.toLowerCase())+'…">' : '') +
        '<div class="facet-list" data-flist="'+key+'">' +
        list.map(function(v){
          var on = T.f[key].indexOf(v) >= 0;
          return '<label class="fopt" data-fv="'+esc(v.toLowerCase())+'"><input type="checkbox" data-f="'+key+'" value="'+esc(v)+'"'+(on?' checked':'')+'>' +
            '<span class="fl">'+esc(v)+'</span><span class="fc">'+comma(counts[v]||0)+'</span></label>';
        }).join('') + '<div class="none" hidden>No match</div></div></div>';
    }

    var qCounts = { official:0, personal:0, junk:0 };
    all.forEach(function(p){ qCounts[p.quality]++; });
    var qFacet = '<div class="facet"><h4>Email quality</h4><div class="facet-list">' +
      Object.keys(QUALITY).map(function(k){
        var on = T.f.quality.indexOf(k) >= 0;
        return '<label class="fopt"><input type="checkbox" data-f="quality" value="'+k+'"'+(on?' checked':'')+'>' +
          '<span class="fl"><span class="qdot '+QUALITY[k].cls+'" style="display:inline-block;margin-right:6px"></span>' +
          QUALITY[k].label+'</span><span class="fc">'+comma(qCounts[k])+'</span></label>';
      }).join('') + '</div></div>';

    var bCounts = {};
    all.forEach(function(p){ p.buckets.forEach(function(b){ bCounts[b] = (bCounts[b]||0)+1; }); });
    var bFacet = '<div class="facet"><h4>Bucket</h4><div class="facet-list">' +
      lists().map(function(b){
        var on = T.f.bucket.indexOf(b.id) >= 0;
        return '<label class="fopt"><input type="checkbox" data-f="bucket" value="'+b.id+'"'+(on?' checked':'')+'>' +
          '<span class="fl"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+b.colour+';margin-right:6px"></span>' +
          esc(b.label)+'</span><span class="fc">'+comma(bCounts[b.id]||0)+'</span></label>';
      }).join('') + '</div></div>';

    var sCounts = {};
    all.forEach(function(p){ sCounts[p.status] = (sCounts[p.status]||0) + 1; });
    var sFacet = '<div class="facet"><h4>Decision status</h4><div class="facet-list">' +
      STATUS_ORDER.map(function(k){
        var on = T.f.status.indexOf(k) >= 0;
        return '<label class="fopt"><input type="checkbox" data-f="status" value="'+k+'"'+(on?' checked':'')+'>' +
          '<span class="fl"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+
          STATUS[k].colour+';margin-right:6px"></span>'+STATUS[k].label+'</span>' +
          '<span class="fc">'+comma(sCounts[k]||0)+'</span></label>';
      }).join('') + '</div></div>';

    /* registration window - two dates plus the presets people actually use */
    var dates = all.map(function(p){ return p.when; }).sort();
    var earliest = dates[0] || '', latest = dates[dates.length-1] || '';
    var dFacet = '<div class="facet"><h4>Registered between</h4>' +
      '<div style="display:flex;gap:8px;margin-bottom:8px">' +
        '<input class="inp" type="date" id="f-from" value="'+esc(T.f.from)+'" min="'+esc(earliest)+'" max="'+esc(latest)+'">' +
        '<input class="inp" type="date" id="f-to" value="'+esc(T.f.to)+'" min="'+esc(earliest)+'" max="'+esc(latest)+'">' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        '<button class="btn btn-secondary btn-sm" type="button" data-dpreset="all">All time</button>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-dpreset="first">First half</button>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-dpreset="last">Most recent 30</button>' +
      '</div></div>';

    var fCounts = {};
    all.forEach(function(p){ fCounts[p.formType] = (fCounts[p.formType]||0) + 1; });
    var fFacet = '<div class="facet"><h4>Registration form</h4><div class="facet-list">' +
      FORM_TYPES.map(function(k){
        var on = T.f.form.indexOf(k) >= 0;
        return '<label class="fopt"><input type="checkbox" data-f="form" value="'+esc(k)+'"'+(on?' checked':'')+'>' +
          '<span class="fl">'+esc(k)+'</span><span class="fc">'+comma(fCounts[k]||0)+'</span></label>';
      }).join('') + '</div></div>';

    var eFacet = '<div class="facet"><h4>Mailer engagement</h4><div class="facet-list">' +
      [['','Any engagement',all.length],
       ['opened','Opened at least one',all.filter(function(p){return p.opens;}).length],
       ['clicked','Clicked a link',all.filter(function(p){return p.clicks;}).length],
       ['cold','Never opened',all.filter(function(p){return !p.opens;}).length]].map(function(x){
        return '<label class="fopt"><input type="radio" name="eng" data-eng="'+x[0]+'"'+(T.f.engaged===x[0]?' checked':'')+'>' +
          '<span class="fl">'+esc(x[1])+'</span><span class="fc">'+comma(x[2])+'</span></label>';
      }).join('') + '</div></div>';

    var other = '<div class="facet"><h4>Other</h4><div class="facet-list">' +
      '<label class="fopt"><input type="radio" name="pay" data-pay="" '+(!T.f.pay?'checked':'')+'><span class="fl">Any payment status</span></label>' +
      '<label class="fopt"><input type="radio" name="pay" data-pay="paid" '+(T.f.pay==='paid'?'checked':'')+'><span class="fl">Paid only</span><span class="fc">'+comma(all.filter(function(p){return p.paid;}).length)+'</span></label>' +
      '<label class="fopt"><input type="radio" name="pay" data-pay="unpaid" '+(T.f.pay==='unpaid'?'checked':'')+'><span class="fl">Unpaid only</span><span class="fc">'+comma(all.filter(function(p){return !p.paid;}).length)+'</span></label>' +
      '<label class="fopt" style="margin-top:6px"><input type="checkbox" data-flag="shortlist" '+(T.f.shortlist?'checked':'')+'><span class="fl">Shortlisted only</span></label>' +
      '<label class="fopt"><input type="checkbox" data-flag="attended" '+(T.f.attended?'checked':'')+'><span class="fl">Attended only</span></label>' +
      '<label class="fopt"><input type="checkbox" data-flag="dupe" '+(T.f.dupe?'checked':'')+'><span class="fl">Possible duplicates only</span>' +
      '<span class="fc">'+comma(all.filter(function(p){return p.dupe;}).length)+'</span></label>' +
      '<label class="fopt"><input type="checkbox" data-flag="verified" '+(T.f.verified?'checked':'')+'><span class="fl">Verified contacts only</span>' +
      '<span class="fc">'+comma(all.filter(function(p){return p.verified;}).length)+'</span></label>' +
      '</div></div>';

    modal('Filters',
      '<div class="facets">' +
        facet('desig','Designation') + facet('comp','Company') +
        facet('city','Location') + facet('src','Source') +
        qFacet + bFacet + sFacet + fFacet + dFacet + eFacet + other +
      '</div>',
      '<button class="btn btn-ghost" type="button" id="f-clear">Clear all</button>' +
      '<button class="btn btn-primary" type="button" id="f-apply">Show results</button>', 740);

    each('[data-f]', function(el){
      el.onchange = function(){
        var k = el.getAttribute('data-f'), v = el.value;
        if (el.checked){ if (T.f[k].indexOf(v) < 0) T.f[k].push(v); }
        else T.f[k] = T.f[k].filter(function(x){ return x !== v; });
      };
    });
    each('[data-fsearch]', function(el){
      el.oninput = function(){
        var key = el.getAttribute('data-fsearch');
        var term = el.value.toLowerCase().trim();
        var list = document.querySelector('[data-flist="'+key+'"]');
        if (!list) return;
        var shown = 0;
        list.querySelectorAll('[data-fv]').forEach(function(opt){
          var hit = !term || opt.getAttribute('data-fv').indexOf(term) >= 0;
          opt.hidden = !hit;
          if (hit) shown++;
        });
        var none = list.querySelector('.none');
        if (none) none.hidden = shown > 0;
      };
    });
    each('[data-pay]', function(el){ el.onchange = function(){ T.f.pay = el.getAttribute('data-pay'); }; });
    each('[data-eng]', function(el){ el.onchange = function(){ T.f.engaged = el.getAttribute('data-eng'); }; });
    var fr = $('f-from'), to = $('f-to');
    if (fr) fr.onchange = function(){ T.f.from = fr.value; };
    if (to) to.onchange = function(){ T.f.to = to.value; };
    each('[data-dpreset]', function(el){
      el.onclick = function(){
        var kind = el.getAttribute('data-dpreset');
        var ds = people().map(function(p){ return p.when; }).sort();
        if (kind === 'all'){ T.f.from = ''; T.f.to = ''; }
        if (kind === 'first'){ T.f.from = ds[0]; T.f.to = ds[Math.floor(ds.length/2)]; }
        if (kind === 'last'){ T.f.from = ds[Math.max(0, ds.length-30)]; T.f.to = ds[ds.length-1]; }
        if (fr) fr.value = T.f.from;
        if (to) to.value = T.f.to;
      };
    });
    each('[data-flag]', function(el){ el.onchange = function(){ T.f[el.getAttribute('data-flag')] = el.checked; }; });
    $('f-clear').onclick = function(){ T.f = freshState().f; closeLayer(); T.page = 1; render(); };
    $('f-apply').onclick = function(){ closeLayer(); T.page = 1; render(); C.toast(comma(filtered().length)+' match'); };
  }

  /* ---------------------------------------------------------------- columns */
  function openColumns(){
    var labels = { desig:'Designation', comp:'Company', city:'Location', src:'Source',
                   when:'Registered', status:'Status', pay:'Payment', bucket:'Buckets' };
    modal('Columns',
      '<p style="font-size:13px;color:var(--text-muted);margin:0 0 13px">Name and the row menu are always shown.</p>' +
      '<div class="facet-list" style="max-height:none">' +
      Object.keys(labels).map(function(k){
        return '<label class="fopt"><input type="checkbox" data-col="'+k+'"'+(T.cols[k]?' checked':'')+'>' +
          '<span class="fl">'+labels[k]+'</span></label>';
      }).join('') + '</div>',
      '<button class="btn btn-ghost" type="button" id="c-reset">Reset</button>' +
      '<button class="btn btn-primary" type="button" id="c-done">Done</button>', 420);

    each('[data-col]', function(el){ el.onchange = function(){ T.cols[el.getAttribute('data-col')] = el.checked; }; });
    $('c-reset').onclick = function(){ T.cols = JSON.parse(JSON.stringify(DEF_COLS)); closeLayer(); render(); };
    $('c-done').onclick  = function(){ closeLayer(); render(); };
  }

  /* ---------------------------------------------------------------- buckets */
  function openBucket(){
    var sel = selectedPeople();
    if (!sel.length){ C.toast('Select some people first'); return; }
    modal('Add ' + comma(sel.length) + ' to a list',
      '<p style="font-size:13px;color:var(--text-muted);margin:0 0 14px">' +
        'Lists are how you split registrations into things you will actually do. Someone can sit on more than one.</p>' +
      '<div class="field" style="margin-bottom:16px"><label for="bk-new">Create a new list</label>' +
        '<div style="display:flex;gap:8px">' +
        '<input class="inp" id="bk-new" placeholder="e.g. Roundtable invitees" maxlength="40">' +
        '<button class="btn btn-primary" type="button" id="bk-create" style="flex-shrink:0">Create &amp; add</button>' +
        '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' +
      lists().map(function(b){
        var inAll = sel.every(function(p){ return p.buckets.indexOf(b.id) >= 0; });
        var total = people().filter(function(p){ return p.buckets.indexOf(b.id) >= 0; }).length;
        return '<button class="cbucket" type="button" data-bk="'+b.id+'" aria-pressed="'+inAll+'">' +
          '<span style="width:11px;height:11px;border-radius:50%;background:'+b.colour+'"></span>' +
          '<span style="flex:1;text-align:left;font-weight:700;font-size:13.5px">'+esc(b.label)+
            '<span style="display:block;font-weight:600;font-size:11px;color:var(--text-muted)">'+comma(total)+' on this list</span></span>' +
          (inAll ? '<span class="badge b-accent">Added</span>' : '') +
          (b.locked ? '' : '<span class="vx" data-delist="'+b.id+'" title="Delete list">'+svg(I.trash,13)+'</span>') +
        '</button>';
      }).join('') + '</div>',
      '<button class="btn btn-secondary" type="button" id="bk-clear">Remove from all</button>' +
      '<button class="btn btn-primary" type="button" id="bk-done">Done</button>', 460);

    var nEl = $('bk-new');
    if (nEl){
      $('bk-create').onclick = function(){
        var l = createList(nEl.value);
        if (!l){ C.toast('Give the list a name first'); nEl.focus(); return; }
        addToList(sel, l.id); render(); openBucket();
        C.toast('Added to ' + l.label);
      };
      nEl.onkeydown = function(e){ if (e.key === 'Enter') $('bk-create').onclick(); };
    }
    each('[data-delist]', function(el){
      el.onclick = function(e){
        e.stopPropagation();
        deleteList(el.getAttribute('data-delist'));
        render(); openBucket();
        C.toast('List deleted');
      };
    });

    each('[data-bk]', function(el){
      el.onclick = function(){
        var id = el.getAttribute('data-bk');
        var inAll = sel.every(function(p){ return (D.buckets[p.id]||[]).indexOf(id) >= 0; });
        sel.forEach(function(p){
          var list = D.buckets[p.id] || [];
          if (inAll) list = list.filter(function(x){ return x !== id; });
          else if (list.indexOf(id) < 0) list.push(id);
          D.buckets[p.id] = list;
        });
        logAct('list', comma(sel.length) + (inAll ? ' removed from ' : ' added to ') + bucketById(id).label, sel.length);
        saveStore(); render();
        C.toast((inAll ? 'Removed from ' : 'Added to ') + bucketById(id).label);
        openBucket();
      };
    });
    $('bk-clear').onclick = function(){
      sel.forEach(function(p){ delete D.buckets[p.id]; });
      saveStore(); closeLayer(); render(); C.toast('Removed from all buckets');
    };
    $('bk-done').onclick = function(){ closeLayer(); };
  }

  /* ----------------------------------------------------------------
     COMPOSER

     The real job on this screen is deciding who is in and who is out,
     then telling them. So the composer is built around the audience,
     not the message: pick who, then pick what to say. Sending a
     Confirmation or a Regret also RECORDS that decision, so the list
     and the mailbox can never disagree.
     ---------------------------------------------------------------- */
  var MSG_TYPES = [
    { id:'confirm',  label:'Confirmation', sets:'confirmed', tone:'var(--ok)',     desc:'Approve them to attend' },
    { id:'regret',   label:'Regret',       sets:'regretted', tone:'var(--accent)', desc:'Politely decline' },
    { id:'waitlist', label:'Waitlist',     sets:'waitlist',  tone:'var(--warn)',   desc:'Hold them in reserve' },
    { id:'reminder', label:'Reminder',     sets:null,        tone:'var(--info)',   desc:'Nudge before the day' },
    { id:'update',   label:'Update',       sets:null,        tone:'var(--review)', desc:'Any other announcement' }
  ];
  function msgType(id){
    for (var i=0;i<MSG_TYPES.length;i++) if (MSG_TYPES[i].id===id) return MSG_TYPES[i];
    return MSG_TYPES[0];
  }

  var TEMPLATES = {
    confirm: {
      email: { subject:'You are confirmed for {{event}}',
        body:'Hi {{first}},\n\nGood news - your place at {{event}} is confirmed.\n\n{{date}}\n{{venue}}\n\nYour pass is linked to this email address. Please carry a photo ID on the day.\n\nSee you there,\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, your place at {{event}} is confirmed. {{date}}, {{venue}}. Carry a photo ID on the day. See you there!' }
    },
    regret: {
      email: { subject:'About your {{event}} registration',
        body:'Hi {{first}},\n\nThank you for your interest in {{event}}.\n\nWe had far more registrations than seats this year, and we are not able to confirm a place for you at this edition. This is a capacity decision and nothing else.\n\nWe would genuinely like to see you at the next one - you will hear from us first.\n\nWith regards,\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, thank you for registering for {{event}}. We were oversubscribed this year and could not confirm a seat for you. We will reach out first for the next edition.' }
    },
    waitlist: {
      email: { subject:'You are on the waitlist for {{event}}',
        body:'Hi {{first}},\n\nYou are on the waitlist for {{event}} on {{date}}.\n\nSeats do open up as confirmations settle, and we release them in order. We will write the moment one is yours.\n\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, you are on the waitlist for {{event}} ({{date}}). Seats do open up - we will message you the moment one is yours.' }
    },
    reminder: {
      email: { subject:'{{event}} is almost here',
        body:'Hi {{first}},\n\n{{event}} opens on {{date}} at {{venue}}. Doors at 8:30am, first session at 9.\n\nAdd it to your calendar so it does not slip.\n\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, {{event}} is on {{date}} at {{venue}}. Doors open 8:30am. See you there!' }
    },
    update: {
      email: { subject:'An update on {{event}}',
        body:'Hi {{first}},\n\nA quick update on {{event}}.\n\n[Write your update here]\n\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, a quick update on {{event}}: [write your update here]' }
    }
  };

  var comp = null;
  function freshComp(){
    return {
      step: 1, type: 'confirm', channel: 'email', subject: '', body: '', touched: false,
      when: { mode:'now', date:'', time:'10:00' },
      aud: { source: null, status: 'pending', view: 0, list: 'hot', skipJunk: true, skipSent: true }
    };
  }

  function todayISO(){ return new Date().toISOString().slice(0,10); }

  function scheduledAt(){
    if (comp.when.mode !== 'later' || !comp.when.date) return null;
    var t = comp.when.time || '10:00';
    var when = new Date(comp.when.date + 'T' + t + ':00');
    return isNaN(when.getTime()) ? null : when.getTime();
  }
  function isPast(){
    var at = scheduledAt();
    return at != null && at <= Date.now();
  }
  function whenLabel(){
    var at = scheduledAt();
    if (at == null) return 'immediately';
    var d = new Date(at);
    var hh = d.getHours(), mm = d.getMinutes();
    var ap = hh >= 12 ? 'pm' : 'am', h12 = hh % 12 || 12;
    return fmtDate(comp.when.date) + ' at ' + h12 + (mm ? ':' + (mm<10?'0':'') + mm : '') + ap;
  }

  function alreadySent(id, type){
    for (var i=0;i<D.comms.length;i++){
      var c = D.comms[i];
      if (c.type === type && c.ids && c.ids.indexOf(id) >= 0) return true;
    }
    return false;
  }

  /* the list before any skip rules */
  function audienceBase(){
    var a = comp.aud;
    if (a.source === 'selected') return selectedPeople();
    if (a.source === 'all')      return people();
    if (a.source === 'status')   return people().filter(function(p){ return p.status === a.status; });
    if (a.source === 'list')     return people().filter(function(p){ return p.buckets.indexOf(a.list) >= 0; });
    if (a.source === 'view'){
      var v = D.views[a.view];
      if (!v) return filtered();
      var keep = { f:T.f, seg:T.seg, q:T.q, tab:T.tab };
      T.f = JSON.parse(JSON.stringify(v.f)); T.seg = v.seg; T.q = v.q || ''; T.tab = v.tab || 'reg';
      var out = filtered();
      T.f = keep.f; T.seg = keep.seg; T.q = keep.q; T.tab = keep.tab;
      return out;
    }
    return filtered();
  }

  /* and after them, with a count of everyone dropped and why.

     Two safety nets, because a Send button that cannot be pressed is a dead
     end rather than a safeguard:
       - an empty source falls back to the whole registration list, which is
         the collective of everyone - registered, shortlisted, confirmed and
         bucketed alike;
       - if the skip rules empty it out, the softest guard (already-sent) is
         relaxed rather than leaving you with nobody.
     Both are announced in the summary, never done silently. */
  function audience(){
    var base = audienceBase(), fellBack = false, relaxed = false;

    if (!base.length){
      base = people();
      fellBack = true;
    }

    var skip = { junk:0, dnc:0, sent:0 };
    function apply(useSent){
      skip = { junk:0, dnc:0, sent:0 };
      return base.filter(function(p){
        if (p.buckets.indexOf('dnc') >= 0){ skip.dnc++; return false; }
        if (comp.aud.skipJunk && p.quality === 'junk'){ skip.junk++; return false; }
        if (useSent && comp.aud.skipSent && alreadySent(p.id, comp.type)){ skip.sent++; return false; }
        return true;
      });
    }

    var list = apply(true);
    if (!list.length && base.length){
      list = apply(false);
      relaxed = list.length > 0;
    }

    return { list:list, skip:skip, base:base.length, fellBack:fellBack, relaxed:relaxed };
  }

  function mergeFor(p){
    var ev = current();
    return {
      '{{name}}': p.name,
      '{{first}}': p.name.split(' ')[0],
      '{{company}}': p.comp,
      '{{designation}}': p.desig,
      '{{event}}': ev.name,
      '{{date}}': fmtDate(ev.start),
      '{{venue}}': ev.venue
    };
  }
  function applyMerge(text, p){
    var m = mergeFor(p), out = text;
    Object.keys(m).forEach(function(k){ out = out.split(k).join(m[k]); });
    return out;
  }

  function loadTemplate(){
    var t = TEMPLATES[comp.type][comp.channel];
    comp.subject = t.subject || '';
    comp.body = t.body;
    comp.touched = false;
  }

  function openComposer(){
    if (!comp) comp = freshComp();
    /* default the audience to whatever the person is looking at */
    if (comp.aud.source === null){
      comp.aud.source = selectedIds().length ? 'selected' : (filtered().length ? 'filtered' : 'all');
    }
    /* land the list picker on a list that has members, not an empty seed */
    if (!comp.aud.list || !people().filter(function(p){ return p.buckets.indexOf(comp.aud.list) >= 0; }).length){
      var populated = lists().filter(function(l){
        return people().filter(function(p){ return p.buckets.indexOf(l.id) >= 0; }).length;
      })[0];
      if (populated) comp.aud.list = populated.id;
    }
    if (!comp.body) loadTemplate();
    drawComposer();
  }

  function stepsBar(){
    function sp(n, label){
      var cls = comp.step === n ? 'sp on' : (comp.step > n ? 'sp done' : 'sp');
      return '<span class="'+cls+'"><span class="sn">'+(comp.step > n ? '&#10003;' : n)+'</span>'+label+'</span>';
    }
    return '<div class="steps">' + sp(1,'Audience') + '<span class="line"></span>' + sp(2,'Message') + '</div>';
  }

  function drawComposer(){
    var A = audience();
    var t = msgType(comp.type);

    var bodyHTML = comp.step === 1 ? stepOne(A) : stepTwo(A);

    var foot;
    if (comp.step === 1){
      foot = '<button class="btn btn-ghost" type="button" id="c-cancel">Cancel</button>' +
        '<button class="btn btn-primary" type="button" id="c-next">' +
        'Continue with '+comma(A.list.length)+'</button>';
    } else {
      foot = '<button class="btn btn-ghost" type="button" id="c-back">Back</button>' +
        '<button class="btn btn-secondary" type="button" id="c-test">Send test to me</button>' +
        '<button class="btn btn-primary" type="button" id="c-send">' +
        svg(I.send,14)+' '+(comp.when.mode === 'later' ? 'Schedule for ' : 'Send to ')+comma(A.list.length)+'</button>';
    }

    modal('Send communication', stepsBar() + bodyHTML, foot, 660);
    comp.step === 1 ? wireStepOne() : wireStepTwo(A);
  }

  function stepOne(A){
    var selN = selectedIds().length;
    var all = people();

    function opt(id, title, sub, n, extra){
      return '<button class="aud-opt'+(n?'':' hollow')+'" type="button" data-aud="'+id+'" aria-pressed="'+(comp.aud.source===id)+'">' +
        '<span class="ao-r"></span>' +
        '<span class="ao-t"><b>'+esc(title)+'</b>' +
          '<span>'+esc(n ? sub : 'Nothing here yet - picking this sends to everyone instead')+'</span>'+(extra||'')+'</span>' +
        '<span class="ao-n">'+comma(n)+'</span>' +
      '</button>';
    }

    var statusPick = comp.aud.source === 'status'
      ? '<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">' +
        STATUS_ORDER.map(function(k){
          var n = all.filter(function(p){ return p.status===k; }).length;
          return '<button class="bkt" type="button" data-audstatus="'+k+'" style="cursor:pointer;border:1px solid '+
            (comp.aud.status===k?STATUS[k].colour:'var(--border)')+';background:'+
            (comp.aud.status===k?STATUS[k].colour+'1F':'transparent')+';color:'+
            (comp.aud.status===k?STATUS[k].colour:'var(--text-muted)')+'">'+STATUS[k].label+' '+comma(n)+'</button>';
        }).join('') + '</div>'
      : '';

    var listPick = comp.aud.source === 'list'
      ? '<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">' +
        lists().map(function(l){
          var n = all.filter(function(p){ return p.buckets.indexOf(l.id) >= 0; }).length;
          return '<button class="bkt" type="button" data-audlist="'+l.id+'" style="cursor:pointer;border:1px solid '+
            (comp.aud.list===l.id?l.colour:'var(--border)')+';background:'+
            (comp.aud.list===l.id?l.colour+'1F':'transparent')+';color:'+
            (comp.aud.list===l.id?l.colour:'var(--text-muted)')+'">'+esc(l.label)+' '+comma(n)+'</button>';
        }).join('') + '</div>'
      : '';

    var viewPick = comp.aud.source === 'view' && D.views.length
      ? '<div style="margin-top:9px"><select class="inp" id="c-view">' +
        D.views.map(function(v,i){ return '<option value="'+i+'"'+(comp.aud.view===i?' selected':'')+'>'+esc(v.name)+'</option>'; }).join('') +
        '</select></div>'
      : '';

    var opts =
      (selN ? opt('selected','The '+comma(selN)+' you selected','Ticked in the table right now', selN) : '') +
      opt('filtered','Everyone matching the current view', T.tab==='reg' && T.seg==='all' && !activeFilterCount() && !T.q
            ? 'No filters applied, so this is the whole '+ (T.tab==='reg'?'registration list':T.tab)
            : 'Current tab, segment, search and filters', filtered().length) +
      opt('status','By decision status','Pick pending, confirmed, regretted or waitlisted',
            all.filter(function(p){ return p.status===comp.aud.status; }).length, statusPick) +
      opt('list','A named list','Everyone you put on one list',
            all.filter(function(p){ return p.buckets.indexOf(comp.aud.list) >= 0; }).length, listPick) +
      (D.views.length ? opt('view','A saved view','Reuse a filter set you saved earlier',
            (function(){ var keep=comp.aud.source; comp.aud.source='view'; var n=audienceBase().length; comp.aud.source=keep; return n; })(),
            viewPick) : '') +
      opt('all','Every registration','Everyone on this event, no filtering', all.length);

    var junkN = A.skip.junk + (comp.aud.skipJunk ? 0 : 0);
    var baseList = audienceBase();
    var junkAvail = baseList.filter(function(p){ return p.quality==='junk'; }).length;
    var sentAvail = baseList.filter(function(p){ return alreadySent(p.id, comp.type); }).length;
    var dncAvail  = baseList.filter(function(p){ return p.buckets.indexOf('dnc')>=0; }).length;

    return opts +
      '<h4 style="font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin:18px 0 6px">Leave out</h4>' +
      '<label class="skipline"><input type="checkbox" data-skip="skipJunk"'+(comp.aud.skipJunk?' checked':'')+'>' +
        'Junk and disposable addresses<span class="sc">'+comma(junkAvail)+'</span></label>' +
      '<label class="skipline"><input type="checkbox" data-skip="skipSent"'+(comp.aud.skipSent?' checked':'')+'>' +
        'Anyone already sent this message<span class="sc">'+comma(sentAvail)+'</span></label>' +
      '<div class="skipline locked"><input type="checkbox" checked disabled>' +
        'Do-not-contact bucket <span style="color:var(--text-faint)">(always)</span><span class="sc">'+comma(dncAvail)+'</span></div>' +

      '<div class="willdo sticky-sum">'+svg(I.users,17)+
        '<span><b>'+comma(A.list.length)+' will receive this</b>' +
        (A.fellBack
          ? 'That source is empty, so this is falling back to all ' + comma(A.base) + ' registrations &mdash; ' +
            'everyone on the event, whatever their status or list. '
          : 'From '+comma(A.base)+' in the audience') +
        (A.skip.junk||A.skip.sent||A.skip.dnc
          ? (A.fellBack ? 'Leaving out ' : ' &mdash; leaving out ') + [
              A.skip.junk ? comma(A.skip.junk)+' junk' : '',
              A.skip.sent ? comma(A.skip.sent)+' already sent' : '',
              A.skip.dnc  ? comma(A.skip.dnc)+' do-not-contact' : ''
            ].filter(Boolean).join(', ')
          : (A.fellBack ? 'Nobody is being left out' : ' &mdash; nobody is being left out')) + '.' +
        (A.relaxed
          ? '<br><b style="color:var(--warn)">Everyone here has already had this message.</b> ' +
            'The already-sent guard was relaxed so you can still send &mdash; untick it above if that was not the intent.'
          : '') +
        '</span></div>';
  }

  function stepTwo(A){
    var t = msgType(comp.type);
    var sample = A.list[0] || people()[0];

    var types = '<div class="mtype">' + MSG_TYPES.map(function(m){
      return '<button class="mt" type="button" data-mtype="'+m.id+'" aria-pressed="'+(comp.type===m.id)+'">' +
        '<b><span class="mi" style="background:'+m.tone+'"></span>'+esc(m.label)+'</b>' +
        '<span>'+esc(m.desc)+'</span></button>';
    }).join('') + '</div>';

    var chan = '<div class="chan">' +
      ['email','whatsapp'].map(function(c){
        return '<button type="button" data-chan="'+c+'" aria-pressed="'+(comp.channel===c)+'">' +
          svg(c==='email'?I.mail:I.wa,14)+' '+(c==='email'?'Email':'WhatsApp')+'</button>';
      }).join('') + '</div>';

    return types + chan +
      (comp.channel === 'email'
        ? '<div class="field" style="margin-bottom:14px"><label for="c-sub">Subject</label>' +
          '<input class="inp" id="c-sub" value="'+esc(comp.subject)+'"></div>'
        : '') +
      '<div class="field" style="margin-bottom:14px"><label for="c-body">Message</label>' +
        '<textarea class="inp" id="c-body" style="min-height:170px">'+esc(comp.body)+'</textarea>' +
        '<div class="mergebar">' +
          ['{{first}}','{{name}}','{{company}}','{{event}}','{{date}}','{{venue}}'].map(function(m){
            return '<button type="button" data-merge="'+m+'">'+m+'</button>';
          }).join('') +
        '</div>' +
        '<p class="hint" id="c-count">'+comp.body.length+' characters</p>' +
      '</div>' +
      '<div class="field" style="margin-bottom:14px"><label>Preview'+(sample?' &mdash; as '+esc(sample.name):'')+'</label>' +
        '<div class="preview" id="c-prev">'+esc(sample ? applyMerge(comp.body, sample) : comp.body)+'</div></div>' +
      '<div class="field" style="margin-bottom:14px"><label>When should this go out?</label>' +
        '<div class="when-row">' +
          '<button type="button" data-when="now" aria-pressed="'+(comp.when.mode==='now')+'">' +
            svg(I.send,14)+' Send now</button>' +
          '<button type="button" data-when="later" aria-pressed="'+(comp.when.mode==='later')+'">' +
            svg(I.clock,14)+' Schedule</button>' +
        '</div>' +
        (comp.when.mode === 'later'
          ? '<div class="when-when">' +
              '<div class="field"><label for="w-date">Date</label>' +
                '<input class="inp" id="w-date" type="date" value="'+esc(comp.when.date)+'" min="'+todayISO()+'"></div>' +
              '<div class="field"><label for="w-time">Time</label>' +
                '<input class="inp" id="w-time" type="time" value="'+esc(comp.when.time)+'"></div>' +
            '</div>' +
            '<div class="when-presets">' +
              '<button type="button" data-wpre="tomorrow">Tomorrow 10:00</button>' +
              '<button type="button" data-wpre="week">In a week</button>' +
              '<button type="button" data-wpre="eve">Evening before the event</button>' +
            '</div>' +
            (comp.when.date
              ? '<p class="hint">Goes out '+esc(whenLabel())+'. '+
                (comp.channel==='whatsapp'
                  ? 'WhatsApp sends outside 9am&ndash;9pm are held until morning.'
                  : 'You can cancel it from the Insights tab any time before then.')+'</p>'
              : '<p class="hint" style="color:var(--warn)">Pick a date, or it will go out immediately.</p>') +
            (comp.when.date && isPast()
              ? '<p class="hint" style="color:var(--accent-strong)">That time has already passed &mdash; it will send immediately.</p>'
              : '')
          : '') +
      '</div>' +

      '<div class="willdo">'+svg(t.sets?I.badge2:I.send,17)+
        '<span><b>'+comma(A.list.length)+' '+(comp.channel==='email'?'emails':'WhatsApp messages')+
          (comp.when.mode==='later' && comp.when.date && !isPast() ? ', scheduled' : '')+'</b>' +
        (t.sets
          ? 'Sending this also marks all '+comma(A.list.length)+' as <strong>'+STATUS[t.sets].label+'</strong>, so the list matches what they were told.'
          : 'This does not change anyone&rsquo;s decision status.') + '</span></div>';
  }

  function wireStepOne(){
    $('c-cancel').onclick = closeLayer;
    $('c-next').onclick = function(){ comp.step = 2; if (!comp.touched) loadTemplate(); drawComposer(); };

    each('[data-aud]', function(el){
      el.onclick = function(){ comp.aud.source = el.getAttribute('data-aud'); drawComposer(); };
    });
    each('[data-audstatus]', function(el){
      el.onclick = function(e){ e.stopPropagation(); comp.aud.status = el.getAttribute('data-audstatus'); drawComposer(); };
    });
    each('[data-audlist]', function(el){
      el.onclick = function(e){ e.stopPropagation(); comp.aud.list = el.getAttribute('data-audlist'); drawComposer(); };
    });
    each('[data-skip]', function(el){
      el.onchange = function(){ comp.aud[el.getAttribute('data-skip')] = el.checked; drawComposer(); };
    });
    var v = $('c-view');
    if (v) v.onchange = function(){ comp.aud.view = Number(v.value); drawComposer(); };
  }

  function wireStepTwo(A){
    $('c-back').onclick = function(){ comp.step = 1; drawComposer(); };
    $('c-cancel') && ($('c-cancel').onclick = closeLayer);

    each('[data-mtype]', function(el){
      el.onclick = function(){
        comp.type = el.getAttribute('data-mtype');
        if (!comp.touched) loadTemplate();
        drawComposer();
      };
    });
    each('[data-chan]', function(el){
      el.onclick = function(){
        comp.channel = el.getAttribute('data-chan');
        if (!comp.touched) loadTemplate();
        drawComposer();
      };
    });

    var bodyEl = $('c-body'), subEl = $('c-sub');
    var sample = A.list[0] || people()[0];
    function refresh(){
      comp.body = bodyEl.value; comp.touched = true;
      if (subEl) comp.subject = subEl.value;
      $('c-prev').textContent = sample ? applyMerge(comp.body, sample) : comp.body;
      $('c-count').textContent = comp.body.length + ' characters';
    }
    bodyEl.oninput = refresh;
    if (subEl) subEl.oninput = refresh;

    each('[data-merge]', function(el){
      el.onclick = function(){
        var tag = el.getAttribute('data-merge');
        var pos = bodyEl.selectionStart || bodyEl.value.length;
        bodyEl.value = bodyEl.value.slice(0,pos) + tag + bodyEl.value.slice(pos);
        bodyEl.focus(); bodyEl.setSelectionRange(pos+tag.length, pos+tag.length);
        refresh();
      };
    });

    each('[data-when]', function(el){
      el.onclick = function(){
        comp.when.mode = el.getAttribute('data-when');
        if (comp.when.mode === 'later' && !comp.when.date){
          var d = new Date(Date.now() + 86400000);
          comp.when.date = d.toISOString().slice(0,10);
        }
        drawComposer();
      };
    });
    var wd = $('w-date'), wt = $('w-time');
    if (wd) wd.onchange = function(){ comp.when.date = wd.value; drawComposer(); };
    if (wt) wt.onchange = function(){ comp.when.time = wt.value; drawComposer(); };
    each('[data-wpre]', function(el){
      el.onclick = function(){
        var k = el.getAttribute('data-wpre'), d;
        if (k === 'tomorrow'){ d = new Date(Date.now() + 86400000); comp.when.time = '10:00'; }
        if (k === 'week'){ d = new Date(Date.now() + 7*86400000); comp.when.time = '10:00'; }
        if (k === 'eve'){
          var ev = current();
          d = ev.start ? new Date(new Date(ev.start).getTime() - 86400000) : new Date(Date.now() + 86400000);
          comp.when.time = '18:00';
        }
        comp.when.date = d.toISOString().slice(0,10);
        drawComposer();
      };
    });

    $('c-test').onclick = function(){ C.toast('Test ' + comp.channel + ' sent to you'); };
    $('c-send').onclick = function(){ sendNow(); };
  }

  function sendNow(){
    var A = audience(), t = msgType(comp.type);
    if (!A.list.length){ C.toast('Nobody to send to'); return; }

    var at = scheduledAt();
    var later = at != null && at > Date.now();
    var chan = comp.channel === 'email' ? 'email' : 'WhatsApp';

    D.comms.unshift({
      when: new Date().toISOString(),
      sendAt: later ? at : null,
      status: later ? 'scheduled' : 'sent',
      channel: comp.channel,
      type: comp.type,
      subject: comp.channel === 'email' ? comp.subject : comp.body.slice(0,48),
      count: A.list.length,
      ids: A.list.map(function(p){ return p.id; })
    });

    /* a scheduled message has not been read by anyone yet, so it must not
       move anyone's decision status until it actually goes out */
    if (t.sets && !later) A.list.forEach(function(p){ D.status[p.id] = t.sets; });

    logAct('send', t.label + (later ? ' scheduled by ' : ' sent by ') + chan +
      ' to ' + comma(A.list.length) + (later ? ' for ' + whenLabel() : '') +
      (t.sets && !later ? ', marked ' + STATUS[t.sets].label : ''), A.list.length);
    saveStore();
    var n = A.list.length;
    comp = freshComp();
    closeLayer();
    render();
    C.toast(later
      ? comma(n) + ' ' + chan + ' messages scheduled for ' + whenLabelFrom(at)
      : comma(n) + ' ' + chan + ' messages queued' + (t.sets ? ' - marked ' + STATUS[t.sets].label : ''));
  }

  function whenLabelFrom(at){
    var d = new Date(at);
    var hh = d.getHours(), mm = d.getMinutes();
    var ap = hh >= 12 ? 'pm' : 'am', h12 = hh % 12 || 12;
    return fmtDate(d.toISOString().slice(0,10)) + ' at ' + h12 + (mm ? ':' + (mm<10?'0':'') + mm : '') + ap;
  }

  /* a scheduled send goes out for real, applying whatever it was going to do */
  function releaseScheduled(idx){
    var c = D.comms[idx];
    if (!c || c.status !== 'scheduled') return;
    c.status = 'sent'; c.when = new Date().toISOString(); c.sendAt = null;
    var t = msgType(c.type || 'update');
    if (t.sets) (c.ids||[]).forEach(function(id){ D.status[id] = t.sets; });
    logAct('send', t.label + ' released early to ' + comma(c.count), c.count);
    saveStore(); render();
    C.toast(comma(c.count) + ' messages queued');
  }
  function cancelScheduled(idx){
    var c = D.comms[idx];
    if (!c || c.status !== 'scheduled') return;
    D.comms.splice(idx, 1);
    logAct('send', 'Cancelled a scheduled ' + (c.channel==='email'?'email':'WhatsApp') +
      ' to ' + comma(c.count), c.count);
    saveStore(); render();
    C.toast('Scheduled send cancelled');
  }

  /* ---------------------------------------------------------------- person drawer */
  function openPerson(id){
    var p = people().filter(function(x){ return String(x.id) === String(id); })[0];
    if (!p) return;
    var q = QUALITY[p.quality];
    var log = D.comms.filter(function(c){ return c.ids && c.ids.indexOf(p.id) >= 0; });

    layer.innerHTML =
      '<div class="drawer-bg" id="dbg"></div>' +
      '<aside class="drawer">' +
        '<div class="drawer-head">' +
          '<span class="avat" style="background:'+p.colour+';width:44px;height:44px;font-size:15px">'+esc(p.initials)+'</span>' +
          '<span style="flex:1;min-width:0">' +
            '<b style="font-size:16px;display:block">'+esc(p.name)+'</b>' +
            '<span style="font-size:12.5px;color:var(--text-muted)">'+esc(p.desig)+' · '+esc(p.comp)+'</span>' +
          '</span>' +
          '<button class="btn btn-ghost btn-icon" type="button" id="dx">'+svg(I.x,17)+'</button>' +
        '</div>' +

        '<div class="drawer-body">' +
          '<div class="dsec">' +
            '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px">' +
              '<span class="badge '+q.tone+'">'+q.label+' email</span>' +
              (p.paid ? '<span class="badge b-ok">Paid '+C.money(p.amount)+'</span>' : '<span class="badge b-mute">Unpaid</span>') +
              (p.attended ? '<span class="badge b-info">Attended</span>' : '') +
              (p.shortlist ? '<span class="badge b-review">Shortlisted</span>' : '') +
              (p.verified ? '<span class="badge b-ok">Verified</span>' : '<span class="badge b-warn">Unverified</span>') +
              (p.dupe ? '<span class="badge b-warn">Possible duplicate</span>' : '') +
              '<span class="badge '+STATUS[p.status].tone+'">'+STATUS[p.status].label+'</span>' +
            '</div>' +
          '</div>' +

          '<div class="dsec"><h4>Contact</h4>' +
            '<div class="drow"><span class="k">Email</span><span class="v">'+esc(p.email)+
              ' <button class="vx" type="button" data-dcopy="email" title="Copy">'+svg(I.copy,12)+'</button></span></div>' +
            '<div class="drow"><span class="k">Quality</span><span class="v" style="font-weight:600;color:var(--text-muted)">'+q.note+'</span></div>' +
            '<div class="drow"><span class="k">Phone</span><span class="v">'+esc(p.phone)+
              ' <button class="vx" type="button" data-dcopy="phone" title="Copy">'+svg(I.copy,12)+'</button></span></div>' +
            '<div class="drow"><span class="k">Location</span><span class="v">'+esc(p.city)+'</span></div>' +
          '</div>' +

          '<div class="dsec"><h4>Registration</h4>' +
            '<div class="drow"><span class="k">Registered</span><span class="v">'+fmtDate(p.when)+'</span></div>' +
            '<div class="drow"><span class="k">Source</span><span class="v">'+esc(p.src)+'</span></div>' +
            '<div class="drow"><span class="k">Payment</span><span class="v">'+(p.paid ? C.money(p.amount) : 'Not paid')+'</span></div>' +
          '</div>' +

          '<div class="dsec"><h4>Buckets</h4>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
            lists().map(function(b){
              var on = p.buckets.indexOf(b.id) >= 0;
              return '<button class="bkt" type="button" data-pbk="'+b.id+'" style="cursor:pointer;border:1px solid '+
                (on ? b.colour : 'var(--border)')+';background:'+(on ? b.colour+'1F' : 'transparent')+
                ';color:'+(on ? b.colour : 'var(--text-muted)')+'">'+esc(b.label)+'</button>';
            }).join('') + '</div>' +
          '</div>' +

          '<div class="dsec"><h4>Engagement</h4>' +
            '<div class="drow"><span class="k">Mailers opened</span><span class="v num">'+p.opens+'</span></div>' +
            '<div class="drow"><span class="k">Links clicked</span><span class="v num">'+p.clicks+'</span></div>' +
          '</div>' +

          '<div class="dsec"><h4>Notes</h4>' +
            '<textarea class="inp" id="p-note" placeholder="Anything the next person picking this up should know…" ' +
            'style="min-height:70px">'+esc(p.note || '')+'</textarea>' +
          '</div>' +

          '<div class="dsec"><h4>Communication history</h4>' +
            (log.length
              ? '<div class="tline">' + log.slice(0,8).map(function(c){
                  return '<div class="ti"><b>'+esc(c.channel.charAt(0).toUpperCase()+c.channel.slice(1))+' · '+esc(c.subject)+'</b>' +
                    '<span>'+new Date(c.when).toLocaleString()+' · sent to '+comma(c.count)+'</span></div>';
                }).join('') + '</div>'
              : '<p style="font-size:12.5px;color:var(--text-muted);margin:0">Nothing sent to this person yet.</p>') +
          '</div>' +
        '</div>' +

        '<div class="drawer-foot">' +
          '<button class="btn btn-primary btn-sm" type="button" data-pact="msg">'+svg(I.send,13)+' Message</button>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-pact="short">'+svg(I.star,13)+' '+(p.shortlist?'Un-shortlist':'Shortlist')+'</button>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-pact="junk">'+svg(I.ban,13)+' '+(D.junk[p.id]?'Unmark junk':'Mark junk')+'</button>' +
        '</div>' +
      '</aside>';

    $('dx').onclick = closeLayer;
    $('dbg').onclick = closeLayer;

    var note = $('p-note');
    if (note){
      note.onblur = function(){
        var v = note.value.trim();
        if (v) D.notes[p.id] = v; else delete D.notes[p.id];
        saveStore();
        if (v !== (p.note || '')) C.toast('Note saved');
      };
    }

    each('[data-dcopy]', function(el){
      el.onclick = function(){
        var w = el.getAttribute('data-dcopy');
        copyText(w === 'email' ? p.email : p.phone, w === 'email' ? 'Email' : 'Phone');
      };
    });

    each('[data-pbk]', function(el){
      el.onclick = function(){
        var id2 = el.getAttribute('data-pbk');
        var list = D.buckets[p.id] || [];
        if (list.indexOf(id2) >= 0) list = list.filter(function(x){ return x !== id2; });
        else list.push(id2);
        D.buckets[p.id] = list;
        saveStore(); render(); openPerson(p.id);
      };
    });

    each('[data-pact]', function(el){
      el.onclick = function(){
        var a = el.getAttribute('data-pact');
        if (a === 'short'){
          if (D.shortlist[p.id]) delete D.shortlist[p.id]; else D.shortlist[p.id] = true;
          saveStore(); render(); openPerson(p.id);
          C.toast(D.shortlist[p.id] ? 'Shortlisted' : 'Removed from shortlist');
        }
        if (a === 'junk'){
          if (D.junk[p.id]) delete D.junk[p.id]; else D.junk[p.id] = true;
          CACHE = {}; saveStore(); render(); openPerson(p.id);
          C.toast(D.junk[p.id] ? 'Marked as junk' : 'Unmarked');
        }
        if (a === 'msg'){
          T.sel = {}; T.sel[p.id] = true;
          comp = freshComp(); comp.aud.source = 'selected';
          closeLayer(); render(); openComposer();
        }
      };
    });
  }

  /* ======================================================================
     BOOT
     ====================================================================== */
  select.onchange = function(){
    T = freshState();
    D = loadStore();
    CACHE = {};
    history.replaceState(null, '', 'audience-registrations.html?event=' + select.value);
    render();
  };

  $('top-send').onclick = function(){ comp = freshComp(); openComposer(); };

  T = freshState();
  render();
})();
</script>
</body>
</html>
