<script>try{var t=localStorage.getItem("revamp-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme:dark)").matches))document.documentElement.setAttribute("data-theme","dark");else document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
  <style>
    body{ background:var(--bg); overflow-x:hidden; }
    .reg-page{ display:flex; min-height:calc(100vh - var(--topbar-h)); }
    .reg-main{ flex:1; min-width:0; max-width:100%; overflow-x:hidden; padding:0 26px 70px; }

    .rep-head{ padding:22px 0 14px; }
    .rep-head h2{ font-size:20px; }
    .rep-head p{ font-size:13px; color:var(--text-muted); margin-top:4px; max-width:720px; }

    /* the four totals */
    .segs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:9px; padding:2px 2px 14px; }
    .seg{ text-align:left; min-width:0; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:11px 13px;
      display:flex; flex-direction:column; gap:2px; font:inherit; color:inherit; }
    button.seg{ cursor:pointer; }
    button.seg:hover{ border-color:var(--accent); }
    .seg[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
    .seg .sv{ font-size:22px; font-weight:800; font-family:var(--font-display); letter-spacing:-.02em; }
    .seg .sl{ font-size:11.5px; font-weight:700; color:var(--text-muted); }
    .seg .ss{ font-size:11px; color:var(--text-faint); }

    .rep-progress{ font-size:12.5px; color:var(--text-muted); margin:0 0 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .rep-progress:empty{ display:none; }
    .rep-note{ font-size:12.5px; color:var(--warn); background:var(--warn-soft); border-radius:9px; padding:8px 12px; margin:0 0 10px; }

    .panel{ background:var(--surface); border:1px solid var(--border); border-radius:15px; box-shadow:var(--shadow-sm); overflow:hidden; }
    .toolbar{ display:flex; align-items:flex-end; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .toolbar .tf{ display:flex; flex-direction:column; gap:4px; font-size:11.5px; font-weight:700; color:var(--text-muted); min-width:0; }
    .toolbar select, .toolbar input[type="search"]{ height:36px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); padding:0 10px; font:inherit; font-size:13px; max-width:100%; }
    .toolbar .tf-form select{ min-width:200px; max-width:280px; }
    .toolbar .tf-q{ flex:1 1 220px; }
    .toolbar .tf-q input{ width:100%; }
    .toolbar .acts{ margin-left:auto; display:flex; gap:8px; }

    .rep-tbl{ width:100%; border-collapse:collapse; font-size:13.5px; }
    .rep-tbl th{ background:var(--surface-2); color:var(--text-muted); padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
    .rep-tbl td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
    .rep-tbl td .clip{ display:block; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rep-tbl tbody tr{ cursor:pointer; }
    .rep-tbl tbody tr:hover, .rep-tbl tbody tr:focus-visible{ background:var(--surface-2); outline:none; }
    .rep-tbl tbody tr:focus-visible td:first-child{ box-shadow: inset 3px 0 0 var(--accent); }
    .rep-tbl .nm b{ display:block; font-size:13.5px; white-space:nowrap; }
    .rep-wrap{ overflow-x:auto; }
    .rep-more{ display:flex; justify-content:center; padding:12px; border-top:1px solid var(--border); }
    .rep-empty{ padding:48px 20px; text-align:center; color:var(--text-muted); }
    .rep-empty b{ display:block; color:var(--text); font-size:15px; margin-bottom:6px; }
    .rep-empty .btn{ margin-top:12px; }

    /* a narrow window: each response is a card */
    @media (max-width: 720px){
      .rep-tbl thead{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
      .rep-tbl, .rep-tbl tbody, .rep-tbl tr, .rep-tbl td{ display:block; width:100%; }
      .rep-tbl tr{ border-bottom:1px solid var(--border); padding:10px 14px; }
      .rep-tbl td{ border:0; padding:3px 0; display:flex; gap:10px; justify-content:space-between; align-items:baseline; }
      .rep-tbl td::before{ content:attr(data-label); font-size:11.5px; font-weight:700; color:var(--text-muted); flex-shrink:0; }
      .rep-tbl td.nm::before{ content:none; }
      .rep-tbl td .clip{ max-width:62vw; text-align:right; }
      .toolbar .tf-form select{ min-width:0; max-width:none; }
      .toolbar .tf{ flex:1 1 140px; }
      .toolbar .acts{ margin-left:0; width:100%; }
    }

    /* the drawer of one response */
    .drawer-bg{ position:fixed; inset:0; background:rgba(20,14,13,.42); z-index:70; }
    .drawer{ position:fixed; top:0; right:0; bottom:0; width:min(460px,100%); background:var(--surface); border-left:1px solid var(--border);
      z-index:71; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); }
    @media (prefers-reduced-motion: no-preference){ .drawer{ animation:slide .2s cubic-bezier(.22,.61,.36,1); } }
    @keyframes slide{ from{transform:translateX(28px);opacity:.4} to{transform:none;opacity:1} }
    .drawer-head{ display:flex; align-items:flex-start; gap:12px; padding:16px 18px; border-bottom:1px solid var(--border); }
    .drawer-head h3{ font-size:17px; overflow-wrap:anywhere; }
    .drawer-head .sub{ font-size:12.5px; color:var(--text-muted); overflow-wrap:anywhere; }
    .drawer-body{ flex:1; overflow-y:auto; padding:16px 18px; }
    .drawer-foot{ display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--border); flex-wrap:wrap; }
    .dsec{ margin-bottom:20px; }
    .dsec h4{ font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin-bottom:9px; }
    .drow{ display:flex; gap:12px; font-size:13px; padding:5px 0; align-items:baseline; }
    .drow .k{ color:var(--text-muted); min-width:120px; max-width:45%; flex-shrink:0; font-weight:600; overflow-wrap:anywhere; }
    .drow .v{ font-weight:650; min-width:0; overflow-wrap:anywhere; white-space:pre-wrap; }
    .dact{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .dfield{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; font-size:12px; font-weight:700; color:var(--text-muted); }
    .dfield select, .dfield input, .dfield textarea{ border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); padding:7px 10px; font:inherit; font-size:13px; }
    .dfield textarea{ min-height:70px; resize:vertical; }
    .dwarn{ font-size:12.5px; color:var(--warn); background:var(--warn-soft); border-radius:8px; padding:8px 10px; margin-bottom:10px; }
    .dmsg{ font-size:12.5px; font-weight:600; color:var(--accent-strong); margin:0; }
    .dmsg:empty{ display:none; }
    .dnote{ font-size:12px; color:var(--text-muted); margin:-2px 0 12px; }
    /* A message never covers the drawer's buttons (UX-070: "Checked in" sat on its Close button for 3 s): while a
       response is open the messages sit beside the drawer, or above its foot where the drawer takes the width. */
    body:has(.drawer) .rv-toasts{ left:calc((100% - 460px) / 2); }
    @media (max-width: 900px){ body:has(.drawer) .rv-toasts{ left:50%; } body:has(.drawer){ --rv-toast-bottom:80px; } }

    .confirm{ position:fixed; inset:0; z-index:90; background:rgba(20,14,13,.45); display:grid; place-items:center; padding:16px; }
    .confirm > div{ width:min(440px,100%); background:var(--surface); border-radius:14px; padding:20px; box-shadow:var(--shadow-lg); }
    .confirm h3{ font-size:16px; margin-bottom:8px; }
    .confirm p{ font-size:13.5px; color:var(--text-muted); margin-bottom:14px; }
    .confirm .acts{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }

    @media(max-width:760px){
      .reg-main{ padding:0 14px 50px; }
    }
  </style>

    <!-- the light/dark switch and the account end the top bar on every page (UX-007) -->

<script>
  /* Preview, as in the event console: the event's site as the Design editor's Preview shows it (/preview/<id>?draft=1).
     Not shown without an event, and put away again when the event cannot be opened (the page's renderLoadError) */
  (function(){
    var b = document.getElementById('btn-preview'), id = new URLSearchParams(location.search).get('event') || '';
    if (!b || !id) return;
    b.hidden = false;
    b.onclick = function(){ window.open(RevampCore.previewUrl(id) + '?draft=1', '_blank'); };
  })();
</script>

<script>
/* ===========================================================================
   Reporting › Registrations

   Every response from the event's forms (Register now, Express interest, VIP delegates…), from the real
   registrations (GET /api/event/registrations, page by page) and the event's forms (GET /api/event/forms).
   A form's name, the status in words, the answers under their labels; filters by form, status and words;
   one response at a time opened beside the list to approve, decline, change, check in, note, tag or delete
   (PATCH / DELETE /api/event/registrations); and the CSV the server builds (…/registrations/export).
   Nothing here is stored in the browser.
   =========================================================================== */
(function(){
  'use strict';

  var C = window.RevampCore;
  var esc = C.esc, comma = C.comma;
  function $(id){ return document.getElementById(id); }
  var qs = new URLSearchParams(location.search);
  var eventId = String(qs.get('event') || '').trim();
  var page = $('page'), layer = $('layer');

  var PAGE = 2000, MAX_ROWS = 20000, SHOW_STEP = 200;
  /* the questions whose answers are a response's own columns (functions/lib/forms.js MAPPED_FIELDS) */
  var MAPPED = ['name', 'first_name', 'last_name', 'email', 'phone', 'company', 'designation', 'city', 'location', 'consent'];
  /* the consent box the visitor ticked (every response since 21 Oct 2026): "Yes · 21 Oct 2026, 2:05 pm" (IST); a response
     from before the box has none ("—") */
  function consentOf(r){ return r && r.consent && r.consent.given ? 'Yes' + (r.consent.at ? ' · ' + ist(r.consent.at) : '') : ''; }
  /* +919876543210 as people read it (the server sends phoneDisplay); a number from before the country code
     picker as it was typed */
  function phoneOf(r){ return r.phoneDisplay || r.phone || ''; }
  /* The place as the visitor gave it. Whether it was picked from the suggestions or typed is not said any more
     (UX-070): "Mumbai (typed, not from the list)" read as a fault in a perfectly good answer. */
  function placeOf(r){ return r.location || ''; }

  /* The tags typed in the box: trimmed, each once whatever its case -> { tags } or { error } when they cannot be saved. */
  function tagsOf(text){
    var seen = {};
    var tags = String(text == null ? '' : text).split(',').map(function(t){ return t.trim(); }).filter(function(t){
      var k = t.toLowerCase();
      if (!t || seen[k]) return false;
      seen[k] = 1;
      return true;
    });
    if (tags.length > 20 || tags.some(function(t){ return t.length > 40; })) return { error: 'Up to 20 tags, each up to 40 characters.' };
    return { tags: tags };
  }
  /* What the Notes and Tags boxes hold that is not stored yet: the change to send, null when there is none, or
     { error } when the tags cannot be saved as they are. */
  function textChanges(row, notes, tagsText){
    var body = null, t = tagsOf(tagsText);
    if (t.error) return { error: t.error };
    if (String(notes == null ? '' : notes) !== String(row.notes || '')) (body = body || {}).notes = String(notes == null ? '' : notes);
    if (t.tags.join('\n') !== (row.tags || []).join('\n')) (body = body || {}).tags = t.tags;
    return body;
  }
  function savedText(body){
    return body.notes != null && body.tags ? 'Notes and tags saved' : body.tags ? 'Tags saved' : 'Notes saved';
  }
  /* The notes and tags last sent for the open response ({ id, notes, tags }), so that a box left (which sends it) and
     then the drawer closed (which sends what is unsaved) never sends the same words twice. Forgotten when the drawer
     is drawn again from the stored response, or when sending failed (the next time the box is left, it is tried again). */
  var SENT_TEXT = null;
  function unsavedText(row, notes, tagsText){
    var base = SENT_TEXT && SENT_TEXT.id === row.id ? SENT_TEXT : row;
    return textChanges(base, notes, tagsText);
  }
  /* sends what the two boxes hold that is not stored or sent yet -> '', or why the tags cannot be saved as they are */
  function sendText(row, notes, tagsText){
    var ch = unsavedText(row, notes, tagsText);
    if (ch && ch.error) return ch.error;
    if (!ch) return '';
    var sent = SENT_TEXT && SENT_TEXT.id === row.id ? SENT_TEXT : { id: row.id, notes: row.notes || '', tags: (row.tags || []).slice() };
    SENT_TEXT = { id: row.id, notes: ch.notes != null ? ch.notes : sent.notes, tags: ch.tags || sent.tags };
    patch(row, ch, savedText(ch), true).then(function(ok){ if (ok === false && SENT_TEXT && SENT_TEXT.id === row.id) SENT_TEXT = null; });
    return '';
  }
  var STATUSES = [
    { v: '', label: 'All statuses' },
    { v: 'confirmed', label: 'Confirmed or Received' },
    { v: 'waitlist', label: 'Waitlist' },
    { v: 'pending', label: 'Awaiting approval' },
    { v: 'rejected', label: 'Declined' },
    { v: 'cancelled', label: 'Cancelled' }
  ];

  var S = {
    ev: null, forms: [], defaultFormId: '', formsError: '',
    items: [], total: 0, loading: false, done: false, capped: false, partial: false, error: null,
    filter: { form: String(qs.get('form') || ''), status: String(qs.get('status') || ''), q: '' },
    sort: 'new', shown: SHOW_STEP, exporting: false, openId: null
  };
  if (!STATUSES.some(function(s){ return s.v === S.filter.status; })) S.filter.status = '';

  /* ---------- words ---------- */
  function counts(r){ return r.counts !== false; }
  function formIdOf(r){ return r.formId || 'register'; }
  function statusLabel(r){
    switch (r.status){
      case 'confirmed': return counts(r) ? 'Confirmed' : (r.decidedAt ? 'Approved' : 'Received');
      case 'pending': return 'Awaiting approval';
      case 'rejected': return 'Declined';
      case 'waitlist': return 'Waitlist';
      case 'cancelled': return 'Cancelled';
      default: return r.status || '—';
    }
  }
  function statusBadge(r){
    var cls = { confirmed: 'b-ok', pending: 'b-warn', waitlist: 'b-info', rejected: 'b-mute', cancelled: 'b-mute' }[r.status] || 'b-mute';
    return '<span class="badge ' + cls + '">' + esc(statusLabel(r)) + '</span>';
  }
  /* "3 Nov 2026, 12:09 pm", India time: RevampCore's one way of writing a moment (UX-010) */
  function ist(iso){ return C.fmtDate(iso, { time: true, ist: true }); }
  function formById(id){ return S.forms.filter(function(f){ return f.id === id; })[0] || null; }
  /* a form's name: as it is now; a deleted form's from its responses, marked so */
  function formNameOf(id, r){
    var f = formById(id);
    if (f) return f.name;
    var from = r && r.formName;
    if (!from) for (var i = 0; i < S.items.length; i++) if (formIdOf(S.items[i]) === id && S.items[i].formName){ from = S.items[i].formName; break; }
    if (!from && id === 'register') return 'Register now';
    return (from || id) + ' (deleted)';
  }
  /* the form, and what was asked through it when it was a request rather than a registration (a partner enquiry,
     a nomination, a ceremony invitation: the button that opened the form said so) */
  function formLabelOf(r){ return formNameOf(formIdOf(r), r) + (r.enquiryTitle ? ' · ' + r.enquiryTitle : ''); }
  function answerValue(v){
    if (v === true) return 'Yes';
    if (v === false) return 'No';
    if (Array.isArray(v)) return v.join('; ');
    return v == null ? '' : String(v);
  }
  /* a form's answers beyond the mapped columns, in the form's own field order, then any others stored */
  function answerKeys(r){
    var f = formById(formIdOf(r)), keys = [];
    if (f) (f.fields || []).forEach(function(x){ if (MAPPED.indexOf(x.id) === -1) keys.push(x.id); });
    Object.keys(r.answers || {}).concat(Object.keys(r.answerLabels || {})).forEach(function(k){ if (keys.indexOf(k) === -1) keys.push(k); });
    return keys.filter(function(k){ return r.answers && Object.prototype.hasOwnProperty.call(r.answers, k); });
  }
  function answerLabel(formId, key, r){
    var f = formById(formId), field = f && (f.fields || []).filter(function(x){ return x.id === key; })[0];
    return (field && field.label) || (r && r.answerLabels && r.answerLabels[key]) || key;
  }
  function capacity(){
    var c = S.ev && S.ev.settings && S.ev.settings.registration && S.ev.settings.registration.capacity;
    return typeof c === 'number' && c > 0 ? c : null;
  }
  function confirmedCount(){ return S.items.filter(function(r){ return counts(r) && r.status === 'confirmed'; }).length; }

  /* ---------- filtering ---------- */
  function matches(r){
    if (S.filter.form && formIdOf(r) !== S.filter.form) return false;
    if (S.filter.status && r.status !== S.filter.status) return false;
    var q = S.filter.q.trim().toLowerCase();
    if (q && [r.name, r.email, r.company, r.phone, phoneOf(r), r.location].join(' ').toLowerCase().indexOf(q) === -1) return false;
    return true;
  }
  function filtered(){
    var rows = S.items.filter(matches);
    if (S.sort === 'name') rows.sort(function(a, b){ return String(a.name || a.email).localeCompare(String(b.name || b.email), undefined, { sensitivity: 'base' }); });
    else rows.sort(function(a, b){ return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
    return rows;
  }
  function anyFilter(){ return !!(S.filter.form || S.filter.status || S.filter.q.trim()); }

  /* ---------- drawing ---------- */
  function paintHeader(){
    var ev = S.ev;
    $('event-name').textContent = ev ? (String(ev.name || '').trim() || 'Untitled event') : (eventId ? 'Loading…' : 'Registrations');
    $('event-meta').textContent = ev ? 'Reporting › Registrations' : '';
    /* '<Page> · <Event> — EventSphere', as every event page's tab reads (UX-003) */
    document.title = 'Registrations' + (ev ? ' · ' + (String(ev.name || '').trim() || eventId) : '') + ' — EventSphere';
  }

  function render(){
    paintHeader();
    /* no event, or one that could not be opened: RevampCore's one state for it (UX-008), with the rail and Preview
       put away, and Try again only where trying again can help (not for an event that is gone) */
    if (!eventId || (S.error && !S.ev)){
      $('rail').innerHTML = '';
      C.renderLoadError(page, eventId ? S.loadErr : null, { kind: eventId ? undefined : 'none', none: 'the event whose registrations you want to see',
        title: 'event-name', hide: ['rail', 'btn-preview'], onRetry: start });
      return;
    }
    if (!S.ev){
      page.innerHTML = '<div class="rep-empty" style="padding-top:80px"><span class="spin" style="width:24px;height:24px;border-width:3px;display:inline-block"></span><p>Loading registrations…</p></div>';
      return;
    }
    page.innerHTML =
      '<div class="rep-head"><h2>Registrations</h2><p>Every response from this event’s forms. Responses to forms that count as registrations make up the registration numbers and capacity; the others (enquiries such as Join as partner) are counted as responses only.</p></div>' +
      '<div class="segs" id="rep-totals"></div>' +
      '<div class="rep-progress" id="rep-progress" role="status" aria-live="polite"></div>' +
      (S.formsError ? '<p class="rep-note">The forms could not be loaded (' + esc(S.formsError) + '), so form names come from the responses themselves.</p>' : '') +
      '<section class="panel" aria-label="Responses">' +
        '<div class="toolbar">' +
          '<label class="tf tf-form">Form<select id="f-form"></select></label>' +
          '<label class="tf">Status<select id="f-status">' + STATUSES.map(function(s){ return '<option value="' + s.v + '"' + (s.v === S.filter.status ? ' selected' : '') + '>' + esc(s.label) + '</option>'; }).join('') + '</select></label>' +
          '<label class="tf tf-q">Search<input type="search" id="f-q" placeholder="Name, email, company or phone" value="' + esc(S.filter.q) + '"></label>' +
          '<label class="tf">Sort by<select id="f-sort"><option value="new"' + (S.sort === 'new' ? ' selected' : '') + '>Submitted (newest first)</option><option value="name"' + (S.sort === 'name' ? ' selected' : '') + '>Name</option></select></label>' +
          '<span class="acts"><button class="btn btn-secondary btn-sm" type="button" id="btn-export">' + C.svg(C.IC.download || '<path d="M12 4v12M6 11l6 6 6-6"/><path d="M4 20h16"/>', 13) + ' <span>Export CSV</span></button></span>' +
        '</div>' +
        '<div id="rep-results"></div>' +
      '</section>';
    $('f-form').onchange = function(){ S.filter.form = this.value; S.shown = SHOW_STEP; syncUrl(); drawResults(); drawTotals(); };
    $('f-status').onchange = function(){ S.filter.status = this.value; S.shown = SHOW_STEP; syncUrl(); drawResults(); drawTotals(); };
    $('f-q').oninput = function(){ S.filter.q = this.value; S.shown = SHOW_STEP; drawResults(); };
    $('f-sort').onchange = function(){ S.sort = this.value; drawResults(); };
    $('btn-export').onclick = doExport;
    drawFormSelect(); drawTotals(); drawProgress(); drawResults(); drawExport();
  }

  function drawFormSelect(){
    var sel = $('f-form');
    if (!sel) return;
    var n = {};
    S.items.forEach(function(r){ var id = formIdOf(r); n[id] = (n[id] || 0) + 1; });
    var ids = S.forms.map(function(f){ return f.id; });
    Object.keys(n).forEach(function(id){ if (ids.indexOf(id) === -1) ids.push(id); });
    if (S.filter.form && ids.indexOf(S.filter.form) === -1) ids.push(S.filter.form);
    sel.innerHTML = '<option value="">All forms' + (!S.done && !S.items.length ? '' : ' (' + comma(S.items.length) + (S.done ? '' : '…') + ')') + '</option>' +
      ids.map(function(id){ return '<option value="' + esc(id) + '"' + (id === S.filter.form ? ' selected' : '') + '>' + esc(formNameOf(id)) + ' (' + comma(n[id] || 0) + ')</option>'; }).join('');
  }

  function drawTotals(){
    var box = $('rep-totals');
    if (!box) return;
    var counted = 0, pending = 0, inn = 0;
    S.items.forEach(function(r){
      if (counts(r)) { counted++; if (r.checkedInAt) inn++; }
      if (r.status === 'pending') pending++;
    });
    var more = S.done ? '' : '+';
    function tile(label, value, sub, attrs){
      var tag = attrs ? 'button' : 'div';
      /* before the first page of responses is here there is nothing to count yet: "…", never "0+" */
      var shown = !S.done && !S.items.length ? '…' : comma(value) + more;
      return '<' + tag + ' class="seg"' + (attrs || '') + '><span class="sl">' + esc(label) + '</span><span class="sv">' + shown + '</span>' + (sub ? '<span class="ss">' + esc(sub) + '</span>' : '') + '</' + tag + '>';
    }
    var cap = capacity();
    box.innerHTML =
      tile('Registrations', counted, cap ? comma(confirmedCount()) + ' confirmed of ' + comma(cap) + (cap === 1 ? ' place' : ' places') : 'Responses that count as registrations') +
      tile('Responses', S.items.length, 'From every form') +
      tile('Awaiting approval', pending, pending ? 'Show them' : 'Nothing to decide', ' type="button" id="seg-pending" aria-pressed="' + (S.filter.status === 'pending') + '"') +
      tile('Checked in', inn, 'At the event');
    var p = $('seg-pending');
    if (p) p.onclick = function(){
      S.filter.status = S.filter.status === 'pending' ? '' : 'pending';
      S.shown = SHOW_STEP;
      var st = $('f-status'); if (st) st.value = S.filter.status;
      syncUrl(); drawResults(); drawTotals();
    };
  }

  function drawProgress(){
    var box = $('rep-progress');
    if (!box) return;
    var bits = [];
    if (S.loading) bits.push(S.items.length ? 'Loaded ' + comma(S.items.length) + ' of ' + comma(Math.max(S.total, S.items.length)) + '…' : 'Loading the responses…');
    if (S.capped) bits.push('Showing the newest ' + comma(MAX_ROWS) + ' responses. Export CSV includes all of them.');
    if (S.partial) bits.push('Some older responses may be missing from this list while the database finishes an index. Export CSV includes them.');
    if (S.error && S.ev) bits.push('Not every response could be loaded: ' + S.error);
    box.textContent = bits.join(' ');
  }

  function drawExport(){
    var b = $('btn-export');
    if (!b) return;
    b.disabled = S.exporting;
    b.lastChild.textContent = S.exporting ? 'Preparing…' : 'Export CSV';
    b.setAttribute('aria-busy', S.exporting ? 'true' : 'false');
  }

  function extraColumns(){
    if (!S.filter.form) return [];
    var f = formById(S.filter.form);
    var keys = f ? (f.fields || []).filter(function(x){ return MAPPED.indexOf(x.id) === -1; }).map(function(x){ return { id: x.id, label: x.label }; }) : [];
    if (!f){
      // a deleted form: its answers as its responses stored them
      var seen = {};
      S.items.forEach(function(r){
        if (formIdOf(r) !== S.filter.form) return;
        Object.keys(r.answerLabels || {}).forEach(function(k){ if (!seen[k]){ seen[k] = 1; keys.push({ id: k, label: r.answerLabels[k] }); } });
      });
    }
    return keys.slice(0, 4);
  }

  function drawResults(){
    var box = $('rep-results');
    if (!box) return;
    if (!S.items.length){
      box.innerHTML = S.loading ? '<div class="rep-empty">Loading responses…</div>'
        : '<div class="rep-empty"><b>No responses yet</b>No responses yet. Responses from your site’s forms appear here.</div>';
      return;
    }
    var rows = filtered();
    if (!rows.length){
      box.innerHTML = '<div class="rep-empty"><b>Nothing to show</b>No responses match these filters.<div><button class="btn btn-secondary btn-sm" type="button" id="rep-clear">Clear filters</button></div></div>';
      $('rep-clear').onclick = clearFilters;
      return;
    }
    var extra = extraColumns();
    var cols = [['Name'], ['Email'], ['Phone'], ['Company'], ['Designation'], ['Location'], ['Form'], ['Status'], ['Submitted (IST)'], ['Checked in'], ['Consent']]
      .concat(extra.map(function(x){ return [x.label]; }));
    var shown = rows.slice(0, S.shown);
    box.innerHTML = '<div class="rep-wrap"><table class="rep-tbl"><thead><tr>' + cols.map(function(c){ return '<th scope="col">' + esc(c[0]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      shown.map(function(r){
        return '<tr tabindex="0" data-id="' + esc(r.id) + '" aria-label="' + esc((r.name || r.email) + ', ' + statusLabel(r)) + '">' +
          '<td class="nm" data-label="Name"><b>' + esc(r.name || '—') + '</b></td>' +
          '<td data-label="Email"><span class="clip">' + esc(r.email) + '</span></td>' +
          '<td data-label="Phone" style="white-space:nowrap">' + esc(phoneOf(r) || '—') + '</td>' +
          '<td data-label="Company"><span class="clip">' + esc(r.company || '—') + '</span></td>' +
          '<td data-label="Designation"><span class="clip">' + esc(r.designation || '—') + '</span></td>' +
          '<td data-label="Location"><span class="clip" title="' + esc(placeOf(r)) + '">' + esc(r.location || r.city || '—') + '</span></td>' +
          '<td data-label="Form"><span class="clip">' + esc(formLabelOf(r)) + '</span></td>' +
          '<td data-label="Status">' + statusBadge(r) + '</td>' +
          '<td data-label="Submitted (IST)" style="white-space:nowrap">' + esc(ist(r.createdAt)) + '</td>' +
          '<td data-label="Checked in">' + (counts(r) ? (r.checkedInAt ? 'Yes' : 'No') : '—') + '</td>' +
          '<td data-label="Consent" style="white-space:nowrap"' + (r.consent && r.consent.version ? ' title="Wording ' + esc(r.consent.version) + '"' : '') + '>' + esc(consentOf(r) || '—') + '</td>' +
          extra.map(function(x){ return '<td data-label="' + esc(x.label) + '"><span class="clip">' + esc(answerValue(r.answers && r.answers[x.id]) || '—') + '</span></td>'; }).join('') +
        '</tr>';
      }).join('') + '</tbody></table></div>' +
      (rows.length > shown.length ? '<div class="rep-more"><button class="btn btn-secondary btn-sm" type="button" id="rep-more">Show ' + comma(Math.min(SHOW_STEP, rows.length - shown.length)) + ' more of ' + comma(rows.length - shown.length) + '</button></div>' : '');
    var more = $('rep-more');
    if (more) more.onclick = function(){ S.shown += SHOW_STEP; drawResults(); };
    Array.prototype.forEach.call(box.querySelectorAll('tbody tr'), function(tr){
      tr.onclick = function(){ openDrawer(tr.getAttribute('data-id')); };
      tr.onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDrawer(tr.getAttribute('data-id')); } };
    });
  }

  function clearFilters(){
    S.filter = { form: '', status: '', q: '' };
    S.shown = SHOW_STEP;
    syncUrl();
    render();
  }
  function syncUrl(){
    var u = new URL(location.href);
    u.searchParams.set('event', eventId);
    if (S.filter.form) u.searchParams.set('form', S.filter.form); else u.searchParams.delete('form');
    if (S.filter.status) u.searchParams.set('status', S.filter.status); else u.searchParams.delete('status');
    try { history.replaceState(null, '', u.pathname + u.search); } catch (e) { /* the address stays */ }
  }

  /* ---------- one response ---------- */
  function rowById(id){ return S.items.filter(function(r){ return r.id === id; })[0] || null; }
  var drawerOpener = null;
  function closeDrawer(){
    /* Notes and tags save when their box is left; a drawer closed while one still has the cursor (Escape, Close)
       saves it first, so nothing typed is lost to closing it. A response deleted meanwhile has nothing to save. */
    var id = S.openId, notes = $('dr-notes'), tags = $('dr-tags'), row = id ? rowById(id) : null;
    if (row && notes && tags && !notes.disabled){
      var bad = sendText(row, notes.value, tags.value);
      if (bad) C.toast('The tags were not saved: ' + bad, { kind: 'error' });
    }
    S.openId = null;
    layer.innerHTML = '';
    document.removeEventListener('keydown', drawerKeys, true);
    if (drawerOpener && document.contains(drawerOpener)) drawerOpener.focus();
    else { var tr = drawerOpener && drawerOpener.getAttribute && page.querySelector('tr[data-id="' + drawerOpener.getAttribute('data-id') + '"]'); if (tr) tr.focus(); }
  }
  function drawerKeys(e){
    if (e.key === 'Escape' && !document.querySelector('.confirm')){ e.preventDefault(); closeDrawer(); return; }
    if (e.key !== 'Tab') return;
    var d = layer.querySelector('.drawer');
    if (!d || document.querySelector('.confirm')) return;
    var stops = Array.prototype.filter.call(d.querySelectorAll('button, a[href], input, select, textarea'), function(x){ return !x.disabled; });
    if (!stops.length) return;
    if (e.shiftKey && document.activeElement === stops[0]){ e.preventDefault(); stops[stops.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === stops[stops.length - 1]){ e.preventDefault(); stops[0].focus(); }
  }
  function ask(title, text, okLabel, danger){
    return new Promise(function(resolve){
      var box = document.createElement('div');
      box.className = 'confirm';
      box.innerHTML = '<div role="alertdialog" aria-modal="true" aria-labelledby="cf-t" aria-describedby="cf-p"><h3 id="cf-t">' + esc(title) + '</h3><p id="cf-p">' + esc(text) + '</p>' +
        '<div class="acts"><button class="btn btn-secondary btn-sm" type="button" data-v="0">Cancel</button><button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + ' btn-sm" type="button" data-v="1">' + esc(okLabel) + '</button></div></div>';
      document.body.appendChild(box);
      var opener = document.activeElement;
      function done(v){ document.removeEventListener('keydown', key, true); box.remove(); if (opener && opener.focus && document.contains(opener)) opener.focus(); resolve(v); }
      function key(e){ if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); done(false); } }
      document.addEventListener('keydown', key, true);
      box.onclick = function(e){ var b = e.target.closest('button[data-v]'); if (b) done(b.getAttribute('data-v') === '1'); else if (e.target === box) done(false); };
      box.querySelector('button[data-v="1"]').focus();
    });
  }

  function openDrawer(id){
    var r = rowById(id);
    if (!r) return;
    if (!S.openId) drawerOpener = document.activeElement;
    S.openId = id;
    SENT_TEXT = null;          // the boxes are drawn from the stored response
    var fid = formIdOf(r), f = formById(fid);
    function row(k, v){ return v === '' || v == null ? '' : '<div class="drow"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>'; }
    var answers = answerKeys(r).map(function(k){ return row(answerLabel(fid, k, r), answerValue(r.answers[k])); }).join('');
    var utm = r.utm || {};
    var cap = capacity(), full = counts(r) && cap && confirmedCount() >= cap;
    var statusOpts = [['confirmed', counts(r) ? 'Confirmed' : 'Received / approved'], ['waitlist', 'Waitlist'], ['pending', 'Awaiting approval'], ['rejected', 'Declined'], ['cancelled', 'Cancelled']];
    layer.innerHTML =
      '<div class="drawer-bg" id="dr-bg"></div>' +
      '<aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title">' +
        '<div class="drawer-head"><div style="flex:1;min-width:0"><h3 id="dr-title">' + esc(r.name || r.email || 'Response') + '</h3>' +
          '<div class="sub">' + esc(formLabelOf(r)) + ' · ' + esc(ist(r.createdAt)) + ' IST</div><div style="margin-top:6px">' + statusBadge(r) + '</div></div>' +
          '<button class="btn btn-ghost btn-sm" type="button" id="dr-close" aria-label="Close">' + C.svg('<path d="M18 6L6 18M6 6l12 12"/>', 15) + '</button></div>' +
        '<div class="drawer-body">' +
          (r.status === 'pending' ?
            '<div class="dsec"><h4>Awaiting your decision</h4>' +
              (full ? '<p class="dwarn">Capacity is full — approving will exceed it.</p>' : '') +
              '<div class="dact"><button class="btn btn-primary btn-sm" type="button" id="dr-approve">Approve</button><button class="btn btn-secondary btn-sm" type="button" id="dr-decline">Decline</button></div></div>' : '') +
          '<div class="dsec"><h4>Contact</h4>' +
            row('Name', r.name) + row('First name', r.firstName) + row('Last name', r.lastName) + row('Email', r.email) + row('Phone', phoneOf(r)) +
            row('Company', r.company) + row('Designation', r.designation) + row('Location', placeOf(r)) + row('City', r.city) +
          '</div>' +
          (answers ? '<div class="dsec"><h4>Answers</h4>' + answers + '</div>' : '') +
          '<div class="dsec"><h4>Where it came from</h4>' +
            row('Form', formLabelOf(r) + (counts(r) ? ' · counts as a registration' : r.enquiry ? ' · a request, not a registration' : ' · does not count as a registration')) +
            row('Source', r.source) + row('UTM source', utm.source) + row('UTM medium', utm.medium) + row('UTM campaign', utm.campaign) +
            row('Device', r.device) + row('Referrer', r.referrer) +
            row('Consent', consentOf(r) ? consentOf(r) + ' IST' : 'Not recorded (sent before the consent box)') +
            (r.decidedAt ? row('Decided', ist(r.decidedAt) + ' IST' + (r.decidedBy ? ' by ' + r.decidedBy : '')) : '') +
          '</div>' +
          '<div class="dsec"><h4>Manage</h4>' +
            '<p class="dnote">Every change here is saved as you make it; notes and tags when you leave their box.</p>' +
            '<label class="dfield">Status<select id="dr-status">' + statusOpts.map(function(o){
              var no = o[0] === 'waitlist' && !counts(r);
              return '<option value="' + o[0] + '"' + (o[0] === r.status ? ' selected' : '') + (no ? ' disabled' : '') + '>' + esc(o[1]) + (no ? ' (only for forms that count as registrations)' : '') + '</option>';
            }).join('') + '</select></label>' +
            (counts(r) ? '<label class="dfield" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="dr-checkin"' + (r.checkedInAt ? ' checked' : '') + (r.status === 'cancelled' ? ' disabled' : '') + '> Checked in<span id="dr-checkin-at">' + (r.checkedInAt ? ' (' + esc(ist(r.checkedInAt)) + ')' : '') + '</span></label>' : '') +
            '<label class="dfield">Notes<textarea id="dr-notes" maxlength="2000">' + esc(r.notes || '') + '</textarea></label>' +
            '<label class="dfield">Tags (separated by commas)<input id="dr-tags" type="text" maxlength="900" value="' + esc((r.tags || []).join(', ')) + '"></label>' +
            '<p class="dmsg" id="dr-msg" role="alert"></p>' +
          '</div>' +
        '</div>' +
        '<div class="drawer-foot"><button class="btn btn-ghost btn-sm" type="button" id="dr-delete" style="color:var(--accent-strong)">Delete this response</button><span style="flex:1"></span><button class="btn btn-secondary btn-sm" type="button" id="dr-done">Close</button></div>' +
      '</aside>';
    document.removeEventListener('keydown', drawerKeys, true);
    document.addEventListener('keydown', drawerKeys, true);
    $('dr-bg').onclick = closeDrawer;
    $('dr-close').onclick = closeDrawer;
    $('dr-done').onclick = closeDrawer;
    if ($('dr-approve')) $('dr-approve').onclick = function(){
      var go = full ? ask('Capacity is full', 'Capacity is full — approving will exceed it. Approve anyway?', 'Approve anyway', false) : Promise.resolve(true);
      go.then(function(ok){ if (ok) patch(r, { status: 'confirmed' }, 'Approved'); });
    };
    if ($('dr-decline')) $('dr-decline').onclick = function(){ patch(r, { status: 'rejected' }, 'Declined'); };
    $('dr-status').onchange = function(){
      var v = this.value;
      if (v === r.status) return;
      if (v === 'confirmed' && r.status !== 'confirmed' && full){
        var sel = this;
        ask('Capacity is full', 'Capacity is full — confirming this response will exceed it. Confirm anyway?', 'Confirm anyway', false).then(function(ok){
          if (ok) patch(r, { status: v }, 'Status changed'); else sel.value = r.status;
        });
        return;
      }
      patch(r, { status: v }, 'Status changed');
    };
    /* check-in, notes and tags save as they change, as the status does (UX-070: they used to need a Save of their own) */
    if ($('dr-checkin')) $('dr-checkin').onchange = function(){ patch(r, { checkedIn: this.checked }, this.checked ? 'Checked in' : 'Check-in undone', true); };
    function saveText(){
      var now = rowById(r.id);
      if (!now) return;
      var bad = sendText(now, $('dr-notes').value, $('dr-tags').value);
      if (bad) $('dr-msg').textContent = bad;
    }
    $('dr-notes').onchange = saveText;
    $('dr-tags').onchange = saveText;
    $('dr-delete').onclick = function(){
      ask('Delete this response?', 'The response from ' + (r.name || r.email) + ' is removed for good, and the totals go down by one. This cannot be undone.', 'Delete', true).then(function(ok){
        if (!ok) return;
        C.deleteRegistration(eventId, r.id).then(function(){
          S.items = S.items.filter(function(x){ return x.id !== r.id; });
          closeDrawer();
          C.toast('Response deleted');
          drawFormSelect(); drawTotals(); drawResults();
        }, function(err){ $('dr-msg').textContent = (err && err.message) || 'The response could not be deleted.'; });
      });
    };
    $('dr-close').focus();
  }

  /* One change of a response. Changes are sent one after another, so a later one never lands before an earlier one
     and the drawer is never drawn again from an answer already out of date. quiet (check-in, notes, tags): the drawer
     stays as it is, so nothing being typed or focused in it is lost; a change of status draws it again, since what it
     offers depends on the status. A failure is said in the drawer, or as a message once it is closed. */
  var SAVING = Promise.resolve();
  function patch(r, body, okText, quiet){
    var id = r.id, msg = $('dr-msg');
    if (msg) msg.textContent = '';
    if (!quiet) Array.prototype.forEach.call(layer.querySelectorAll('.drawer button, .drawer select, .drawer input, .drawer textarea'), function(x){ x.disabled = true; });
    SAVING = SAVING.then(function(){
      return C.updateRegistration(eventId, id, body).then(function(res){
        var now = rowById(id);
        if (!now) return true;                              // deleted meanwhile
        var fresh = Object.assign({}, now, (res && res.registration) || body);
        if (body.checkedIn !== undefined && !(res && res.registration)) fresh.checkedInAt = body.checkedIn ? new Date().toISOString() : null;
        S.items = S.items.map(function(x){ return x.id === id ? fresh : x; });
        C.toast(okText);
        drawTotals(); drawResults();
        if (S.openId !== id) return true;
        if (!quiet){ openDrawer(id); return true; }
        var at = $('dr-checkin-at');
        if (at && body.checkedIn !== undefined) at.textContent = fresh.checkedInAt ? ' (' + ist(fresh.checkedInAt) + ')' : '';
        return true;
      }, function(err){
        var text = (err && err.message) || 'That change was not saved. Please try again.';
        if (S.openId !== id){ C.toast(text, { kind: 'error' }); return false; }
        if (!quiet) openDrawer(id);
        else if (body.checkedIn !== undefined && $('dr-checkin')) $('dr-checkin').checked = !body.checkedIn;
        var m = $('dr-msg');
        if (m) m.textContent = text;
        return false;
      });
    });
    return SAVING;
  }

  /* ---------- export ---------- */
  function doExport(){
    if (S.exporting) return;
    S.exporting = true; drawExport();
    C.exportRegistrations(eventId, { formId: S.filter.form, status: S.filter.status }).then(function(out){
      var url = URL.createObjectURL(out.blob);
      var a = document.createElement('a');
      a.href = url; a.download = out.filename; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      C.toast('Downloaded ' + out.filename);
    }, function(err){
      C.toast((err && err.message) || 'The CSV could not be made. Please try again.', { kind: 'error' });
    }).then(function(){ S.exporting = false; drawExport(); });
  }

  /* ---------- loading ---------- */
  function loadPages(cursor){
    return C.fetchRegistrations(eventId, { limit: PAGE, cursor: cursor }).then(function(p){
      S.total = p.total;
      if (p.partial) S.partial = true;
      var room = MAX_ROWS - S.items.length;
      S.items = S.items.concat(p.items.slice(0, room));
      drawFormSelect(); drawTotals(); drawProgress(); drawResults();
      if (p.items.length > room || (p.nextCursor && S.items.length >= MAX_ROWS)) { S.capped = true; return; }
      if (p.nextCursor && p.items.length) return loadPages(p.nextCursor);
    });
  }
  function start(){
    S.error = null; S.loadErr = null; S.ev = null; S.items = []; S.done = false; S.capped = false; S.partial = false;
    /* a second try puts back what a failed one put away */
    $('rail').hidden = false;
    if (eventId) $('btn-preview').hidden = false;
    renderEventRail('rail', { activeSection: 'audience', eventId: eventId });
    render();
    if (!eventId) return;
    C.fetchEvent(eventId).then(function(ev){
      S.ev = ev;
      return C.fetchForms(eventId).then(function(p){
        S.forms = (p && p.forms) || []; S.defaultFormId = (p && p.defaultFormId) || '';
      }, function(err){ S.formsError = (err && err.message) || 'unknown error'; });
    }).then(function(){
      S.loading = true;
      render();
      return loadPages(null);
    }).then(function(){
      S.loading = false; S.done = true;
      drawFormSelect(); drawTotals(); drawProgress(); drawResults();
    }, function(err){
      S.loading = false; S.done = true;
      if (err && err.status === 401 && window.RevampAuth && RevampAuth.redirectToSignIn) { RevampAuth.redirectToSignIn(); return; }
      /* the reason in plain words (never the server's own), and the failure itself for the page's error state */
      S.loadErr = err || { status: 0 };
      S.error = C.errText(S.loadErr);
      render();
    });
  }

  start();
})();
</script>
<!-- ETB2B AI, bottom-right as on every page: etb2b-assistant.js mounts it here and tells it this page and its event. -->
<div id="rv-assistant" data-rv-assistant="registrations"></div>
<script src="etb2b-chat.js"></script>
<script src="dash-bot-client.js"></script>
<script src="etb2b-assistant.js"></script>
</body>
</html>
