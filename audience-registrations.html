  /* ----------------------------------------------------------------
     COMPOSER

     The real job on this screen is deciding who is in and who is out,
     then telling them. So the composer is built around the audience,
     not the message: pick who, then pick what to say. Sending a
     Confirmation or a Regret also RECORDS that decision, so the list
     and the mailbox can never disagree.
     ---------------------------------------------------------------- */
  var MSG_TYPES = [
    { id:'confirm',  label:'Confirmation', sets:'confirmed', tone:'var(--ok)',     desc:'Approve them to attend' },
    { id:'regret',   label:'Regret',       sets:'regretted', tone:'var(--accent)', desc:'Politely decline' },
    { id:'waitlist', label:'Waitlist',     sets:'waitlist',  tone:'var(--warn)',   desc:'Hold them in reserve' },
    { id:'reminder', label:'Reminder',     sets:null,        tone:'var(--info)',   desc:'Nudge before the day' },
    { id:'update',   label:'Update',       sets:null,        tone:'var(--review)', desc:'Any other announcement' }
  ];
  function msgType(id){
    for (var i=0;i<MSG_TYPES.length;i++) if (MSG_TYPES[i].id===id) return MSG_TYPES[i];
    return MSG_TYPES[0];
  }

  var TEMPLATES = {
    confirm: {
      email: { subject:'You are confirmed for {{event}}',
        body:'Hi {{first}},\n\nGood news - your place at {{event}} is confirmed.\n\n{{date}}\n{{venue}}\n\nYour pass is linked to this email address. Please carry a photo ID on the day.\n\nSee you there,\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, your place at {{event}} is confirmed. {{date}}, {{venue}}. Carry a photo ID on the day. See you there!' }
    },
    regret: {
      email: { subject:'About your {{event}} registration',
        body:'Hi {{first}},\n\nThank you for your interest in {{event}}.\n\nWe had far more registrations than seats this year, and we are not able to confirm a place for you at this edition. This is a capacity decision and nothing else.\n\nWe would genuinely like to see you at the next one - you will hear from us first.\n\nWith regards,\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, thank you for registering for {{event}}. We were oversubscribed this year and could not confirm a seat for you. We will reach out first for the next edition.' }
    },
    waitlist: {
      email: { subject:'You are on the waitlist for {{event}}',
        body:'Hi {{first}},\n\nYou are on the waitlist for {{event}} on {{date}}.\n\nSeats do open up as confirmations settle, and we release them in order. We will write the moment one is yours.\n\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, you are on the waitlist for {{event}} ({{date}}). Seats do open up - we will message you the moment one is yours.' }
    },
    reminder: {
      email: { subject:'{{event}} is almost here',
        body:'Hi {{first}},\n\n{{event}} opens on {{date}} at {{venue}}. Doors at 8:30am, first session at 9.\n\nAdd it to your calendar so it does not slip.\n\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, {{event}} is on {{date}} at {{venue}}. Doors open 8:30am. See you there!' }
    },
    update: {
      email: { subject:'An update on {{event}}',
        body:'Hi {{first}},\n\nA quick update on {{event}}.\n\n[Write your update here]\n\nThe {{event}} team' },
      whatsapp: { body:'Hi {{first}}, a quick update on {{event}}: [write your update here]' }
    }
  };

  var comp = null;
  function freshComp(){
    return {
      step: 1, type: 'confirm', channel: 'email', subject: '', body: '', touched: false,
      aud: { source: null, status: 'pending', view: 0, skipJunk: true, skipSent: true }
    };
  }

  function alreadySent(id, type){
    for (var i=0;i<D.comms.length;i++){
      var c = D.comms[i];
      if (c.type === type && c.ids && c.ids.indexOf(id) >= 0) return true;
    }
    return false;
  }

  /* the list before any skip rules */
  function audienceBase(){
    var a = comp.aud;
    if (a.source === 'selected') return selectedPeople();
    if (a.source === 'all')      return people();
    if (a.source === 'status')   return people().filter(function(p){ return p.status === a.status; });
    if (a.source === 'view'){
      var v = D.views[a.view];
      if (!v) return filtered();
      var keep = { f:T.f, seg:T.seg, q:T.q, tab:T.tab };
      T.f = JSON.parse(JSON.stringify(v.f)); T.seg = v.seg; T.q = v.q || ''; T.tab = v.tab || 'reg';
      var out = filtered();
      T.f = keep.f; T.seg = keep.seg; T.q = keep.q; T.tab = keep.tab;
      return out;
    }
    return filtered();
  }

  /* and after them, with a count of everyone dropped and why */
  function audience(){
    var base = audienceBase();
    var skip = { junk:0, dnc:0, sent:0 };
    var list = base.filter(function(p){
      if (p.buckets.indexOf('dnc') >= 0){ skip.dnc++; return false; }
      if (comp.aud.skipJunk && p.quality === 'junk'){ skip.junk++; return false; }
      if (comp.aud.skipSent && alreadySent(p.id, comp.type)){ skip.sent++; return false; }
      return true;
    });
    return { list:list, skip:skip, base:base.length };
  }

  function mergeFor(p){
    var ev = current();
    return {
      '{{name}}': p.name,
      '{{first}}': p.name.split(' ')[0],
      '{{company}}': p.comp,
      '{{designation}}': p.desig,
      '{{event}}': ev.name,
      '{{date}}': fmtDate(ev.start),
      '{{venue}}': ev.venue
    };
  }
  function applyMerge(text, p){
    var m = mergeFor(p), out = text;
    Object.keys(m).forEach(function(k){ out = out.split(k).join(m[k]); });
    return out;
  }

  function loadTemplate(){
    var t = TEMPLATES[comp.type][comp.channel];
    comp.subject = t.subject || '';
    comp.body = t.body;
    comp.touched = false;
  }

  function openComposer(){
    if (!comp) comp = freshComp();
    /* default the audience to whatever the person is looking at */
    if (comp.aud.source === null){
      comp.aud.source = selectedIds().length ? 'selected' : 'filtered';
    }
    if (!comp.body) loadTemplate();
    drawComposer();
  }

  function stepsBar(){
    function sp(n, label){
      var cls = comp.step === n ? 'sp on' : (comp.step > n ? 'sp done' : 'sp');
      return '<span class="'+cls+'"><span class="sn">'+(comp.step > n ? '&#10003;' : n)+'</span>'+label+'</span>';
    }
    return '<div class="steps">' + sp(1,'Audience') + '<span class="line"></span>' + sp(2,'Message') + '</div>';
  }

  function drawComposer(){
    var A = audience();
    var t = msgType(comp.type);

    var bodyHTML = comp.step === 1 ? stepOne(A) : stepTwo(A);

    var foot;
    if (comp.step === 1){
      foot = '<button class="btn btn-ghost" type="button" id="c-cancel">Cancel</button>' +
        '<button class="btn btn-primary" type="button" id="c-next"'+(A.list.length?'':' disabled')+'>' +
        'Continue with '+comma(A.list.length)+'</button>';
    } else {
      foot = '<button class="btn btn-ghost" type="button" id="c-back">Back</button>' +
        '<button class="btn btn-secondary" type="button" id="c-test">Send test to me</button>' +
        '<button class="btn btn-primary" type="button" id="c-send"'+(A.list.length?'':' disabled')+'>' +
        svg(I.send,14)+' Send to '+comma(A.list.length)+'</button>';
    }

    modal('Send communication', stepsBar() + bodyHTML, foot, 660);
    comp.step === 1 ? wireStepOne() : wireStepTwo(A);
  }

  function stepOne(A){
    var selN = selectedIds().length;
    var all = people();

    function opt(id, title, sub, n, extra){
      return '<button class="aud-opt" type="button" data-aud="'+id+'" aria-pressed="'+(comp.aud.source===id)+'">' +
        '<span class="ao-r"></span>' +
        '<span class="ao-t"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span>'+(extra||'')+'</span>' +
        '<span class="ao-n">'+comma(n)+'</span>' +
      '</button>';
    }

    var statusPick = comp.aud.source === 'status'
      ? '<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">' +
        STATUS_ORDER.map(function(k){
          var n = all.filter(function(p){ return p.status===k; }).length;
          return '<button class="bkt" type="button" data-audstatus="'+k+'" style="cursor:pointer;border:1px solid '+
            (comp.aud.status===k?STATUS[k].colour:'var(--border)')+';background:'+
            (comp.aud.status===k?STATUS[k].colour+'1F':'transparent')+';color:'+
            (comp.aud.status===k?STATUS[k].colour:'var(--text-muted)')+'">'+STATUS[k].label+' '+comma(n)+'</button>';
        }).join('') + '</div>'
      : '';

    var viewPick = comp.aud.source === 'view' && D.views.length
      ? '<div style="margin-top:9px"><select class="inp" id="c-view">' +
        D.views.map(function(v,i){ return '<option value="'+i+'"'+(comp.aud.view===i?' selected':'')+'>'+esc(v.name)+'</option>'; }).join('') +
        '</select></div>'
      : '';

    var opts =
      (selN ? opt('selected','The '+comma(selN)+' you selected','Ticked in the table right now', selN) : '') +
      opt('filtered','Everyone matching the current view', T.tab==='reg' && T.seg==='all' && !activeFilterCount() && !T.q
            ? 'No filters applied, so this is the whole '+ (T.tab==='reg'?'registration list':T.tab)
            : 'Current tab, segment, search and filters', filtered().length) +
      opt('status','By decision status','Pick pending, confirmed, regretted or waitlisted',
            all.filter(function(p){ return p.status===comp.aud.status; }).length, statusPick) +
      (D.views.length ? opt('view','A saved view','Reuse a filter set you saved earlier',
            (function(){ var keep=comp.aud.source; comp.aud.source='view'; var n=audienceBase().length; comp.aud.source=keep; return n; })(),
            viewPick) : '') +
      opt('all','Every registration','Everyone on this event, no filtering', all.length);

    var junkN = A.skip.junk + (comp.aud.skipJunk ? 0 : 0);
    var baseList = audienceBase();
    var junkAvail = baseList.filter(function(p){ return p.quality==='junk'; }).length;
    var sentAvail = baseList.filter(function(p){ return alreadySent(p.id, comp.type); }).length;
    var dncAvail  = baseList.filter(function(p){ return p.buckets.indexOf('dnc')>=0; }).length;

    return opts +
      '<h4 style="font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin:18px 0 6px">Leave out</h4>' +
      '<label class="skipline"><input type="checkbox" data-skip="skipJunk"'+(comp.aud.skipJunk?' checked':'')+'>' +
        'Junk and disposable addresses<span class="sc">'+comma(junkAvail)+'</span></label>' +
      '<label class="skipline"><input type="checkbox" data-skip="skipSent"'+(comp.aud.skipSent?' checked':'')+'>' +
        'Anyone already sent this message<span class="sc">'+comma(sentAvail)+'</span></label>' +
      '<div class="skipline locked"><input type="checkbox" checked disabled>' +
        'Do-not-contact bucket <span style="color:var(--text-faint)">(always)</span><span class="sc">'+comma(dncAvail)+'</span></div>' +

      '<div class="willdo" style="margin-top:16px">'+svg(I.users,17)+
        '<span><b>'+comma(A.list.length)+' will receive this</b>' +
        'From '+comma(A.base)+' in the audience' +
        (A.skip.junk||A.skip.sent||A.skip.dnc
          ? ' &mdash; leaving out ' + [
              A.skip.junk ? comma(A.skip.junk)+' junk' : '',
              A.skip.sent ? comma(A.skip.sent)+' already sent' : '',
              A.skip.dnc  ? comma(A.skip.dnc)+' do-not-contact' : ''
            ].filter(Boolean).join(', ')
          : ' &mdash; nobody is being left out') + '.</span></div>';
  }

  function stepTwo(A){
    var t = msgType(comp.type);
    var sample = A.list[0] || people()[0];

    var types = '<div class="mtype">' + MSG_TYPES.map(function(m){
      return '<button class="mt" type="button" data-mtype="'+m.id+'" aria-pressed="'+(comp.type===m.id)+'">' +
        '<b><span class="mi" style="background:'+m.tone+'"></span>'+esc(m.label)+'</b>' +
        '<span>'+esc(m.desc)+'</span></button>';
    }).join('') + '</div>';

    var chan = '<div class="chan">' +
      ['email','whatsapp'].map(function(c){
        return '<button type="button" data-chan="'+c+'" aria-pressed="'+(comp.channel===c)+'">' +
          svg(c==='email'?I.mail:I.wa,14)+' '+(c==='email'?'Email':'WhatsApp')+'</button>';
      }).join('') + '</div>';

    return types + chan +
      (comp.channel === 'email'
        ? '<div class="field" style="margin-bottom:14px"><label for="c-sub">Subject</label>' +
          '<input class="inp" id="c-sub" value="'+esc(comp.subject)+'"></div>'
        : '') +
      '<div class="field" style="margin-bottom:14px"><label for="c-body">Message</label>' +
        '<textarea class="inp" id="c-body" style="min-height:170px">'+esc(comp.body)+'</textarea>' +
        '<div class="mergebar">' +
          ['{{first}}','{{name}}','{{company}}','{{event}}','{{date}}','{{venue}}'].map(function(m){
            return '<button type="button" data-merge="'+m+'">'+m+'</button>';
          }).join('') +
        '</div>' +
        '<p class="hint" id="c-count">'+comp.body.length+' characters</p>' +
      '</div>' +
      '<div class="field" style="margin-bottom:14px"><label>Preview'+(sample?' &mdash; as '+esc(sample.name):'')+'</label>' +
        '<div class="preview" id="c-prev">'+esc(sample ? applyMerge(comp.body, sample) : comp.body)+'</div></div>' +
      '<div class="willdo">'+svg(t.sets?I.badge2:I.send,17)+
        '<span><b>'+comma(A.list.length)+' '+(comp.channel==='email'?'emails':'WhatsApp messages')+'</b>' +
        (t.sets
          ? 'Sending this also marks all '+comma(A.list.length)+' as <strong>'+STATUS[t.sets].label+'</strong>, so the list matches what they were told.'
          : 'This does not change anyone&rsquo;s decision status.') + '</span></div>';
  }

  function wireStepOne(){
    $('c-cancel').onclick = closeLayer;
    $('c-next').onclick = function(){ comp.step = 2; if (!comp.touched) loadTemplate(); drawComposer(); };

    each('[data-aud]', function(el){
      el.onclick = function(){ comp.aud.source = el.getAttribute('data-aud'); drawComposer(); };
    });
    each('[data-audstatus]', function(el){
      el.onclick = function(e){ e.stopPropagation(); comp.aud.status = el.getAttribute('data-audstatus'); drawComposer(); };
    });
    each('[data-skip]', function(el){
      el.onchange = function(){ comp.aud[el.getAttribute('data-skip')] = el.checked; drawComposer(); };
    });
    var v = $('c-view');
    if (v) v.onchange = function(){ comp.aud.view = Number(v.value); drawComposer(); };
  }

  function wireStepTwo(A){
    $('c-back').onclick = function(){ comp.step = 1; drawComposer(); };
    $('c-cancel') && ($('c-cancel').onclick = closeLayer);

    each('[data-mtype]', function(el){
      el.onclick = function(){
        comp.type = el.getAttribute('data-mtype');
        if (!comp.touched) loadTemplate();
        drawComposer();
      };
    });
    each('[data-chan]', function(el){
      el.onclick = function(){
        comp.channel = el.getAttribute('data-chan');
        if (!comp.touched) loadTemplate();
        drawComposer();
      };
    });

    var bodyEl = $('c-body'), subEl = $('c-sub');
    var sample = A.list[0] || people()[0];
    function refresh(){
      comp.body = bodyEl.value; comp.touched = true;
      if (subEl) comp.subject = subEl.value;
      $('c-prev').textContent = sample ? applyMerge(comp.body, sample) : comp.body;
      $('c-count').textContent = comp.body.length + ' characters';
    }
    bodyEl.oninput = refresh;
    if (subEl) subEl.oninput = refresh;

    each('[data-merge]', function(el){
      el.onclick = function(){
        var tag = el.getAttribute('data-merge');
        var pos = bodyEl.selectionStart || bodyEl.value.length;
        bodyEl.value = bodyEl.value.slice(0,pos) + tag + bodyEl.value.slice(pos);
        bodyEl.focus(); bodyEl.setSelectionRange(pos+tag.length, pos+tag.length);
        refresh();
      };
    });

    $('c-test').onclick = function(){ C.toast('Test ' + comp.channel + ' sent to you'); };
    $('c-send').onclick = function(){ sendNow(); };
  }

  function sendNow(){
    var A = audience(), t = msgType(comp.type);
    if (!A.list.length) return;

    D.comms.unshift({
      when: new Date().toISOString(),
      channel: comp.channel,
      type: comp.type,
      subject: comp.channel === 'email' ? comp.subject : comp.body.slice(0,48),
      count: A.list.length,
      ids: A.list.map(function(p){ return p.id; })
    });

    if (t.sets) A.list.forEach(function(p){ D.status[p.id] = t.sets; });

    saveStore();
    comp = freshComp();
    closeLayer();
    render();
    C.toast(comma(A.list.length) + ' ' + (comp.channel === 'email' ? 'emails' : 'messages') + ' queued' +
      (t.sets ? ' &middot; marked ' + STATUS[t.sets].label : ''));
  }

  /* ---------------------------------------------------------------- person drawer */
  function openPerson(id){
    var p = people().filter(function(x){ return String(x.id) === String(id); })[0];
    if (!p) return;
    var q = QUALITY[p.quality];
    var log = D.comms.filter(function(c){ return c.ids && c.ids.indexOf(p.id) >= 0; });

    layer.innerHTML =
      '<div class="drawer-bg" id="dbg"></div>' +
      '<aside class="drawer">' +
        '<div class="drawer-head">' +
          '<span class="avat" style="background:'+p.colour+';width:44px;height:44px;font-size:15px">'+esc(p.initials)+'</span>' +
          '<span style="flex:1;min-width:0">' +
            '<b style="font-size:16px;display:block">'+esc(p.name)+'</b>' +
            '<span style="font-size:12.5px;color:var(--text-muted)">'+esc(p.desig)+' · '+esc(p.comp)+'</span>' +
          '</span>' +
          '<button class="btn btn-ghost btn-icon" type="button" id="dx">'+svg(I.x,17)+'</button>' +
        '</div>' +

        '<div class="drawer-body">' +
          '<div class="dsec">' +
            '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px">' +
              '<span class="badge '+q.tone+'">'+q.label+' email</span>' +
              (p.paid ? '<span class="badge b-ok">Paid '+C.money(p.amount)+'</span>' : '<span class="badge b-mute">Unpaid</span>') +
              (p.attended ? '<span class="badge b-info">Attended</span>' : '') +
              (p.shortlist ? '<span class="badge b-review">Shortlisted</span>' : '') +
              (p.verified ? '<span class="badge b-ok">Verified</span>' : '<span class="badge b-warn">Unverified</span>') +
              (p.dupe ? '<span class="badge b-warn">Possible duplicate</span>' : '') +
              '<span class="badge '+STATUS[p.status].tone+'">'+STATUS[p.status].label+'</span>' +
            '</div>' +
          '</div>' +

          '<div class="dsec"><h4>Contact</h4>' +
            '<div class="drow"><span class="k">Email</span><span class="v">'+esc(p.email)+
              ' <button class="vx" type="button" data-dcopy="email" title="Copy">'+svg(I.copy,12)+'</button></span></div>' +
            '<div class="drow"><span class="k">Quality</span><span class="v" style="font-weight:600;color:var(--text-muted)">'+q.note+'</span></div>' +
            '<div class="drow"><span class="k">Phone</span><span class="v">'+esc(p.phone)+
              ' <button class="vx" type="button" data-dcopy="phone" title="Copy">'+svg(I.copy,12)+'</button></span></div>' +
            '<div class="drow"><span class="k">Location</span><span class="v">'+esc(p.city)+'</span></div>' +
          '</div>' +

          '<div class="dsec"><h4>Registration</h4>' +
            '<div class="drow"><span class="k">Registered</span><span class="v">'+fmtDate(p.when)+'</span></div>' +
            '<div class="drow"><span class="k">Source</span><span class="v">'+esc(p.src)+'</span></div>' +
            '<div class="drow"><span class="k">Payment</span><span class="v">'+(p.paid ? C.money(p.amount) : 'Not paid')+'</span></div>' +
          '</div>' +

          '<div class="dsec"><h4>Buckets</h4>' +
            '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
            BUCKETS.map(function(b){
              var on = p.buckets.indexOf(b.id) >= 0;
              return '<button class="bkt" type="button" data-pbk="'+b.id+'" style="cursor:pointer;border:1px solid '+
                (on ? b.colour : 'var(--border)')+';background:'+(on ? b.colour+'1F' : 'transparent')+
                ';color:'+(on ? b.colour : 'var(--text-muted)')+'">'+esc(b.label)+'</button>';
            }).join('') + '</div>' +
          '</div>' +

          '<div class="dsec"><h4>Engagement</h4>' +
            '<div class="drow"><span class="k">Mailers opened</span><span class="v num">'+p.opens+'</span></div>' +
            '<div class="drow"><span class="k">Links clicked</span><span class="v num">'+p.clicks+'</span></div>' +
          '</div>' +

          '<div class="dsec"><h4>Notes</h4>' +
            '<textarea class="inp" id="p-note" placeholder="Anything the next person picking this up should know…" ' +
            'style="min-height:70px">'+esc(p.note || '')+'</textarea>' +
          '</div>' +

          '<div class="dsec"><h4>Communication history</h4>' +
            (log.length
              ? '<div class="tline">' + log.slice(0,8).map(function(c){
                  return '<div class="ti"><b>'+esc(c.channel.charAt(0).toUpperCase()+c.channel.slice(1))+' · '+esc(c.subject)+'</b>' +
                    '<span>'+new Date(c.when).toLocaleString()+' · sent to '+comma(c.count)+'</span></div>';
                }).join('') + '</div>'
              : '<p style="font-size:12.5px;color:var(--text-muted);margin:0">Nothing sent to this person yet.</p>') +
          '</div>' +
        '</div>' +

        '<div class="drawer-foot">' +
          '<button class="btn btn-primary btn-sm" type="button" data-pact="msg">'+svg(I.send,13)+' Message</button>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-pact="short">'+svg(I.star,13)+' '+(p.shortlist?'Un-shortlist':'Shortlist')+'</button>' +
          '<button class="btn btn-secondary btn-sm" type="button" data-pact="junk">'+svg(I.ban,13)+' '+(D.junk[p.id]?'Unmark junk':'Mark junk')+'</button>' +
        '</div>' +
      '</aside>';

    $('dx').onclick = closeLayer;
    $('dbg').onclick = closeLayer;

    var note = $('p-note');
    if (note){
      note.onblur = function(){
        var v = note.value.trim();
        if (v) D.notes[p.id] = v; else delete D.notes[p.id];
        saveStore();
        if (v !== (p.note || '')) C.toast('Note saved');
      };
    }

    each('[data-dcopy]', function(el){
      el.onclick = function(){
        var w = el.getAttribute('data-dcopy');
        copyText(w === 'email' ? p.email : p.phone, w === 'email' ? 'Email' : 'Phone');
      };
    });

    each('[data-pbk]', function(el){
      el.onclick = function(){
        var id2 = el.getAttribute('data-pbk');
        var list = D.buckets[p.id] || [];
        if (list.indexOf(id2) >= 0) list = list.filter(function(x){ return x !== id2; });
        else list.push(id2);
        D.buckets[p.id] = list;
        saveStore(); render(); openPerson(p.id);
      };
    });

    each('[data-pact]', function(el){
      el.onclick = function(){
        var a = el.getAttribute('data-pact');
        if (a === 'short'){
          if (D.shortlist[p.id]) delete D.shortlist[p.id]; else D.shortlist[p.id] = true;
          saveStore(); render(); openPerson(p.id);
          C.toast(D.shortlist[p.id] ? 'Shortlisted' : 'Removed from shortlist');
        }
        if (a === 'junk'){
          if (D.junk[p.id]) delete D.junk[p.id]; else D.junk[p.id] = true;
          CACHE = {}; saveStore(); render(); openPerson(p.id);
          C.toast(D.junk[p.id] ? 'Marked as junk' : 'Unmarked');
        }
        if (a === 'msg'){
          T.sel = {}; T.sel[p.id] = true;
          comp = freshComp(); comp.aud.source = 'selected';
          closeLayer(); render(); openComposer();
        }
      };
    });
  }

  /* ======================================================================
     BOOT
     ====================================================================== */
  select.onchange = function(){
    T = freshState();
    D = loadStore();
    CACHE = {};
    history.replaceState(null, '', 'audience-registrations.html?event=' + select.value);
    render();
  };

  $('top-send').onclick = function(){ comp = freshComp(); openComposer(); };

  T = freshState();
  render();
})();
</script>
</body>
</html>
