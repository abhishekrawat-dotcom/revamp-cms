<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, minimum-scale=1">
<title>Template preview &mdash; EventSphere</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<!-- One real template on its own, as the template loader assembles it: preview.html?t=tech500 (also
     retail-leadership-summit, cx-leaders-forum, making-ai-work) — its own markup, no event's content. Any other id
     says "This template could not be found."; an AI-designed site's old address (?t=gen-<event id>) goes to that
     event's own preview, /preview/<event id>, which shows its saved site. Served to signed-in staff; needs http
     (the sections are fetched). -->
<script src="_shared/template-loader.js"></script>
<style>html,body{margin:0;height:100%}</style>
</head>
<body>
<script>
  (function () {
    var REAL = ['tech500', 'retail-leadership-summit', 'cx-leaders-forum', 'making-ai-work'];
    var id = new URLSearchParams(location.search).get('t') || 'tech500';

    function notFound() {
      document.title = 'Template not found — EventSphere';
      document.body.style.cssText = 'margin:0;padding:24px;font:15px/1.5 system-ui, sans-serif;color:#191b1f;background:#fff';
      document.body.textContent = 'This template could not be found.';
    }

    var gen = /^gen-([a-z0-9][a-z0-9-]{0,79})$/.exec(id);
    if (gen) { location.replace('/preview/' + encodeURIComponent(gen[1])); return; }
    if (REAL.indexOf(id) === -1) { notFound(); return; }
    RevampTemplates.build(id).then(function (html) {
      document.open();
      document.write(html);
      document.close();
    }).catch(function (err) {
      if (window.console) console.error('[template preview] ' + id + ' could not be built:', err);
      notFound();
    });
  })();
</script>
</body>
</html>
